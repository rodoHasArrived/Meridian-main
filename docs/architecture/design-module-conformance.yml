schema:
  id: meridian.design-module-conformance
  version: "1.0.0"
  minimum_validator_version: "1.0.0"

design_source:
  path: docs/product/meridian-design-document.md
  section: "12. Recommended Architecture Style"

conformance_mode: physical-module-projects
notes:
  - The design document names bounded-context modules.
  - Every design module now has a physical project under src/.
  - Every design module descriptor exposes its bounded context and required implementation facets.
  - Existing implementation code remains in current owner projects until behavior-preserving extraction slices move it.
  - New work should choose the design module first, then use the physical project and mapped current source owners.

modules:
  - name: Meridian.Platform
    conformance: physical
    physical_project: src/Meridian.Platform
    primary_current_owner: Runtime Host
    current_sources:
      - src/Meridian.Platform
      - src/Meridian
      - src/Meridian.Core
      - src/Meridian.Application
      - src/Meridian.Storage
    migration_next: Fund-operations persistence cutover contracts, read-mode controls, shadow-projection schemas, file shadow writer, projection-reconciliation hosted service, shared Result/ErrorCode primitives, and event trace-context carrier now live in Meridian.Platform. Continue moving remaining host, configuration, pipeline, storage policy, tracing setup, and composition runtime policy out of layer-oriented owners behind published Platform contracts.

  - name: Meridian.Identity
    conformance: physical
    physical_project: src/Meridian.Identity
    primary_current_owner: Meridian.Identity
    current_sources:
      - src/Meridian.Identity
      - src/Meridian.Application
      - src/Meridian.Ui.Shared
      - src/Meridian.Wpf
      - src/Meridian.Ui/dashboard
    migration_next: Scoped-access services, stores, auth role/permission/scoped-access contracts, login sessions, user profiles, auth-mode resolution, and role-profile persistence now live in Meridian.Identity. Keep UI-service endpoint and middleware adapters thin while browser/WPF identity presentation is characterized.

  - name: Meridian.Entities
    conformance: physical
    physical_project: src/Meridian.Entities
    primary_current_owner: Accounting and Ledger
    current_sources:
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.Storage
      - src/Meridian.Ui.Shared
    migration_next: Fund-structure ledger-group assignment type policy, assignment-reference normalization, account ledger-group resolution, ownership-link compatibility/cycle/primary/percent/replacement-window policy, single-operating-parent policy, and governance cash-flow query policy now live in Meridian.Entities. Continue moving remaining legal entity, fund, account, assignment, hierarchy, persistence policy, and storage-backed entity read/write code out of layer-oriented application/storage/UI owners into the Entities bounded-context module.

  - name: Meridian.DataIntegration
    conformance: physical
    physical_project: src/Meridian.DataIntegration
    primary_current_owner: Data Confidence and Validation
    current_sources:
      - src/Meridian.DataIntegration
      - src/Meridian.ProviderSdk
      - src/Meridian.Infrastructure
      - src/Meridian.Storage
      - src/Meridian.Application
      - src/Meridian.Ui.Shared
      - src/Meridian.Ui/dashboard
    migration_next: QuickBooks accounting-system fixture, online adapter, token exchange, connection verification, credential-backed connection store, read-only company evidence import, DTO mapping, provider credential catalog, generic credential-store contract, encrypted provider credential store, credential status records, OAuth token records, validation metadata, verification metadata, provider-environment normalization, market-event filtering, provider depth-buffer self-tests, and ETL job/export/result contracts now live in Meridian.DataIntegration behind ProviderSdk and DataIntegration credential/ETL contracts. Continue moving provider adapters, ingestion, validation, and source evidence mapping out of layer-oriented infrastructure/application owners; avoid UI-local provider state.

  - name: Meridian.ReferenceData
    conformance: physical
    physical_project: src/Meridian.ReferenceData
    primary_current_owner: Data Confidence and Validation
    current_sources:
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.Storage
      - src/Meridian.FSharp.DirectLending.Aggregates
      - src/Meridian.Ui.Shared
    migration_next: Security Master asset-class mapping, instrument-kind mapping, the profile catalog contract, and seeded approved custom/private asset profile templates now live in Meridian.ReferenceData. Continue moving identifier validation, classification/taxonomy governance, and Security Master reference-data read models out of layer-oriented application/storage/UI owners into the ReferenceData bounded-context module; asset-specific contract/reference projections belong in Meridian.Instruments.

  - name: Meridian.Instruments
    conformance: physical
    physical_project: src/Meridian.Instruments
    primary_current_owner: Accounting and Ledger
    current_sources:
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.FSharp
      - src/Meridian.FSharp.DirectLending.Aggregates
      - src/Meridian.FSharp.Ledger
      - src/Meridian.Ledger
      - src/Meridian.Storage
    migration_next: Storage-backed bond, option, equity, futures, FX spot, crypto, deposit, certificate-of-deposit, commodity, swap, money-market fund, Security Master-keyed Asset Operations query/command/projection-builder services, and money-market fund reference/liquidity/sweep/family/rebuild services now live in Meridian.Instruments. Continue moving remaining instrument terms, obligation models, lifecycle schedules, and ledger-projection support out of layer-oriented application/storage owners once behavior is characterized.

  - name: Meridian.PortfolioRecords
    conformance: physical
    physical_project: src/Meridian.PortfolioRecords
    primary_current_owner: Accounting and Ledger
    current_sources:
      - src/Meridian.FinancialOperations
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.Ledger
      - src/Meridian.Storage
      - src/Meridian.Ui.Shared
      - src/Meridian.Wpf
      - src/Meridian.Ui/dashboard
    migration_next: Account query/management ports plus in-memory and PostgreSQL-backed fund-account services now live in Meridian.PortfolioRecords, including balance snapshots, statement intake, account readiness, provider-link sync history, reconciliation runs, and margin snapshots. Continue moving remaining positions, activity, holdings, cost basis, and fund-operation read models out of layer-oriented application/UI owners behind shared contracts.

  - name: Meridian.FinancialOperations
    conformance: physical
    physical_project: src/Meridian.FinancialOperations
    primary_current_owner: Accounting and Ledger
    current_sources:
      - src/Meridian.FinancialOperations
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.Ledger
      - src/Meridian.FSharp.Ledger
      - src/Meridian.Ui.Shared
      - src/Meridian.Wpf
      - src/Meridian.Ui/dashboard
    migration_next: Operations Continuity aggregate, command workflow service, status derivation, repositories, audit hashing, Postgres workflow store, approval-policy matrix, close-calendar services, accounting-close projection services, accounting-system GL import/reconciliation service, accounting-basis policy/projection services, ledger text-journal parser/reporting services, payment approval and bank-transaction services, statement reconciliation services, statement-run workflow, validation, matching engines, break classification, decision journals, and reconciliation repositories now live in Meridian.FinancialOperations. Continue moving remaining accounting records, approval/casework support, and close/reconciliation adapters out of application/UI layers behind shared read models and ledger services.

  - name: Meridian.Workflow
    conformance: physical
    physical_project: src/Meridian.Workflow
    primary_current_owner: Workstation Shell and UX
    current_sources:
      - src/Meridian.Workflow
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.Ui.Shared
      - src/Meridian.Wpf
      - src/Meridian.Ui/dashboard
    migration_next: Runbook definitions, JSON-backed runbook storage, deterministic runbook execution, and fund workflow command-state handling now live in Meridian.Workflow. Continue moving remaining workflow definitions, operator actions, presets, and continuity flows out of application/UI layers behind shared workflow contracts.

  - name: Meridian.Audit
    conformance: physical
    physical_project: src/Meridian.Audit
    primary_current_owner: Accounting and Ledger
    current_sources:
      - src/Meridian.Audit
      - src/Meridian.Application
      - src/Meridian.Contracts
      - src/Meridian.Storage
      - src/Meridian.Ui.Shared
    migration_next: Compliance policy checks, sensitive-action contracts, immutable audit hash chains, and access-review records now live in Meridian.Audit. Continue moving remaining evidence packets, retained manifests, lineage, and export verification source-backed and fail-closed out of layer-oriented application/storage/UI owners.

  - name: Meridian.Reporting
    conformance: physical
    physical_project: src/Meridian.Reporting
    primary_current_owner: Workstation Shell and UX
    current_sources:
      - src/Meridian.Contracts
      - src/Meridian.Ledger
      - src/Meridian.Ui.Shared
      - src/Meridian.Ui.Services
      - src/Meridian.Wpf
      - src/Meridian.Ui/dashboard
    migration_next: Reporting template metadata, run contracts, deterministic section rendering, orchestration, approval transition, audit-entry, and run-store seams now live in Meridian.Reporting. Continue moving remaining report packs, governed exports, publication, restatement, and distribution evidence out of UI/application owners behind shared contracts and services consumed by both UI surfaces.

  - name: Meridian.Documents
    conformance: physical
    physical_project: src/Meridian.Documents
    primary_current_owner: Accounting and Ledger
    current_sources:
      - src/Meridian.Contracts
      - src/Meridian.Storage
      - src/Meridian.Ui.Shared
      - src/Meridian.Ui.Services
    migration_next: Keep retained document attachments and evidence manifests in the audit/reporting fabric until a dedicated document-management module is justified.
