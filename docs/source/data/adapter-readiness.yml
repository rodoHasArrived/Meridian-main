# Canonical source-owned inventory. Generate the matrix; do not hand-edit emitted output.
# Capabilities describe implemented catalog contracts, not live entitlement or release acceptance.
# Evidence references are inspectable source/tests; they are not assertions that a run passed.
schema:
  id: meridian.adapter-readiness
  version: 1.0.0
adapters:
- folder: Alpaca
  provider_id: alpaca
  aliases:
  - alpaca-api
  - alpaca-brokerage
  - alpaca-corp-actions
  - alpaca-options
  - alpaca-symbols
  state: partial
  capabilities:
    streaming: true
    historical: true
    symbol_search: true
    options: true
    corporate_actions: true
    brokerage: true
  adapter_types:
    streaming: AlpacaMarketDataClient
    historical: AlpacaHistoricalDataProvider
    symbol_search: AlpacaSymbolSearchProvider
    options: AlpacaOptionsChainProvider
    corporate_actions: AlpacaCorporateActionProvider
    brokerage: AlpacaBrokerageGateway
  other_types:
    symbol_resolver: null
    compatibility_data_source: null
  requirements:
    credentials: ALPACA_KEY_ID and ALPACA_SECRET_KEY via the credential resolver; configured account and feed entitlements
      are required for options, SIP/OPRA and brokerage surfaces.
    optional_sdk: None; implemented using the repository HTTP/WebSocket and shared .NET contracts.
  risks:
  - The historical default is 200 requests/minute; actual quotas and IEX/SIP or indicative/OPRA access depend on
    the configured plan.
  - Unit and fixture evidence does not establish live execution acceptance; brokerage use remains subject to shared
    execution governance.
  - Pacing values describe repository defaults; verify current provider terms and the configured account allowance
    before operation.
  degradation: Missing credentials prevent credential-gated backfill/search activation. Asset-stream routing fails
    closed when the requested feed has no usable entitlement; diagnostics preserve the selected feed and entitlement.
    REST and trade-update errors remain observable. Corporate-action HTTP failures and non-cancellation exceptions
    are logged and return empty action collections; empty results must not be treated as verified absence of actions.
    Cancellation propagates.
  registration:
  - path: src/Meridian.Infrastructure/Adapters/Core/ProviderCapabilityDescriptorCatalog.cs
    symbol: ProviderCapabilityDescriptorCatalog
  - path: src/Meridian.Infrastructure/Adapters/Core/ProviderFactory.Runtime.cs
    symbol: ProviderFactory
  - path: src/Meridian.Infrastructure/Adapters/Alpaca/AlpacaProviderModule.cs
    symbol: AlpacaProviderModule
  evidence:
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlpacaCredentialAndReconnectTests.cs
    symbol: AlpacaCredentialAndReconnectTests
    kind: test
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlpacaAssetStreamRoutingTests.cs
    symbol: AlpacaAssetStreamRoutingTests
    kind: test
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlpacaHistoricalDataProviderTests.cs
    symbol: AlpacaHistoricalDataProviderTests
    kind: test
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlpacaSymbolSearchProviderTests.cs
    symbol: AlpacaSymbolSearchProviderTests
    kind: test
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlpacaCorporateActionProviderTests.cs
    symbol: AlpacaCorporateActionProviderTests
    kind: test
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlpacaBrokerageGatewayTests.cs
    symbol: AlpacaBrokerageGatewayTests
    kind: test
  - path: src/Meridian.Infrastructure/Adapters/Alpaca/AlpacaOptionsChainProvider.cs
    symbol: AlpacaOptionsChainProvider
    kind: source
  owner: Data Confidence and Validation
  next_action: Retain account/feed-specific paper and live evidence and obtain operator acceptance before promoting
    operational readiness.
