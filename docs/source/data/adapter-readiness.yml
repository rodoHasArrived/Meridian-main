  - path: tests/Meridian.Tests/Infrastructure/Providers/AlphaVantageSymbolSearchProviderTests.cs
    symbol: AlphaVantageSymbolSearchProviderTests
    kind: test
  - path: tests/Meridian.Tests/Infrastructure/Providers/AlphaVantageCorporateActionProviderTests.cs
    symbol: AlphaVantageCorporateActionProviderTests
    kind: test
  owner: Data Confidence and Validation
  next_action: Retain credentialed evidence for the configured tier and adjusted-daily corporate-action access without
    consuming quota implicitly.
