schema:
  id: meridian.source-modules
  version: "1.0.0"
  minimum_renderer_version: "1.0.0"

modules:
  - id: SRC-HOST
    path: src/Meridian
    name: Meridian host
    layer: Host
    status: active
    owner_lane: Runtime Host
    purpose: Application host, CLI entrypoint, and runtime composition root.
    readme: src/Meridian/README.md
    roadmap_items:
      - W1-DATA-001
      - W2-TRD-001
      - W7-LIVE-001
    stage_gates:
      - DataConfidence
      - PaperSession
      - LiveReadiness
    validation:
      - python3 build/python/cli/buildctl.py build --project src/Meridian/Meridian.csproj --configuration Debug --isolation-key codex-host
    diagrams:
      - DIA-ASSURANCE-LOOP
    todos: []
    last_reviewed: 2026-06-06

  - id: SRC-APP
    path: src/Meridian.Application
    name: Meridian application layer
    layer: Application
    status: active
    owner_lane: Runtime Host
    purpose: Application use cases, orchestration services, commands, and workflow coordination that consumes Core configuration JSON options, config JSON Schema generation, FluentValidation-based config validation, config validation pipeline, credential placeholder detection, default config-path resolution, config file hot-reload watching, configuration/redaction/masking helpers, Core-owned monitoring alert/health contracts, Domain-owned event quarantine sink port, Contracts-owned pipeline statistics DTOs, monitoring webhook sink contract, backfill run-result and per-symbol completeness payloads, Contracts-owned coordination interfaces and records, Storage-owned storage-option mapping, backfill status/checkpoint persistence, and shared-storage coordination lease persistence, ProviderSdk plugin discovery helpers, Platform runtime/diagnostic/API-documentation/performance/circuit-breaker status/event-metrics/shutdown/coordination/monitoring/backpressure helpers, Platform runtime error ring-buffer, diagnostic bundle generation, and system-health diagnostics, Identity fund-account traversal helpers, Data Integration ETL job service/orchestrator, ETL normalization/export services, sample-data, historical-query, event canonicalization publisher decorator, market-data validation, schema compatibility checks, clock-skew/spread/data-loss monitors, provider telemetry, provider health/connection-status/degradation scoring, and provider calibration helpers, Instruments option-chain helpers, Financial Operations reconciliation-engine helpers, Strategies reconciliation-governance helpers, and Reporting report-generation/NAV helpers instead of owning shared configuration JSON options, config JSON Schema generation, config validation rules, config validation pipeline stages, credential placeholder detection, default config-path resolution, config file hot-reload watching, storage option mapping, backfill result transport payloads, backfill status persistence, coordination contracts