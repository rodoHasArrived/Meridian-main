schema:
  id: meridian.source-modules
  version: "1.0.0"
  minimum_renderer_version: "1.0.0"

modules:
  - id: SRC-HOST
    path: src/Meridian
    name: Meridian host
    layer: Host
    status: active
    owner_lane: Runtime Host
    purpose: Application host, CLI entrypoint, and runtime composition root.
    readme: src/Meridian/README.md
    roadmap_items:
      - W1-DATA-001
      - W2-TRD-001
      - W7-LIVE-001
    stage_gates:
      - DataConfidence
      - PaperSession
      - LiveReadiness
    validation:
      - python3 build/python/cli/buildctl.py build --project src/Meridian/Meridian.csproj --configuration Debug --isolation-key codex-host
    diagrams:
      - DIA-ASSURANCE-LOOP
    todos: []
    last_reviewed: 2026-05-20

  - id: SRC-APP
    path: src/Meridian.Application
    name: Meridian application layer
