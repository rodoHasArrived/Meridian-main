      - W2-PROMO-001
      - W3-CONT-001
    stage_gates:
      - PaperSession
      - PromotionReview
      - ResearchContinuity
    validation:
      - dotnet test tests/Meridian.Tests/Meridian.Tests.csproj --filter "Category!=Integration" --logger "console;verbosity=normal"
    diagrams:
      - DIA-ASSURANCE-LOOP
    todos: []
    last_reviewed: 2026-05-20

