schema:
  id: meridian.risk-register
  version: "1.0.0"
  minimum_renderer_version: "1.0.0"

risks:
  - id: RISK-DOC-DRIFT-001
    title: Generated docs drift from registry truth
    status: open
    severity: medium
    owner_lane: Docs and Automation
    mitigation: Renderers write deterministic outputs and CI checks git diff after generation.
    related_roadmap_items:
      - W5-ACCT-001
      - W7-LIVE-001
  - id: RISK-AI-DOC-SKIP-001
    title: AI agents change source without updating local README context
    status: open
    severity: high
    owner_lane: Docs and Automation
    mitigation: AI guidance requires nearest source README and registry sync for meaningful source changes.
    related_roadmap_items:
      - W2-TRD-001
  - id: RISK-SIM-REAL-001
    title: Simulated or in-memory data can present as real operational records
    status: open
    severity: high
    owner_lane: Data Confidence and Validation
    mitigation: W9-TRUTH-001 makes simulation labeling mandatory across both workstations and requires supported production profiles to fail closed when in-memory or placeholder persistence is selected for a durable role; W9-DEMO-002 keeps seeded demo data durable, labeled, and isolated from non-demo data roots; W10-MARK-001 extends the same doctrine to valuation inputs by making the stale-mark policy fail closed by default so an aged mark can no longer price a valuation silently.
    related_roadmap_items:
      - W9-TRUTH-001
      - W9-DEMO-002
      - W10-MARK-001
