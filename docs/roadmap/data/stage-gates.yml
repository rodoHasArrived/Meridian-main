schema:
  id: meridian.stage-gates
  version: "1.0.0"
  minimum_renderer_version: "1.0.0"

stage_gates:
  - id: DataConfidence
    title: Data confidence
    purpose: Provider and market-data evidence is trustworthy enough for downstream operations.
    owner_lane: Data Confidence and Validation
    exit_evidence:
      - docs/reference/provider-validation-matrix.md
  - id: PaperSession
    title: Paper session readiness
    purpose: Paper trading sessions can be replayed, audited, and accepted by operators.
    owner_lane: Execution and Fund Accounts
    exit_evidence:
      - docs/testing/WAVE2_ACCEPTANCE_TESTS.md
  - id: PromotionReview
    title: Promotion review
    purpose: Research-to-paper handoffs carry enough evidence for operator approval.
    owner_lane: Execution and Fund Accounts
    exit_evidence: []
  - id: ResearchContinuity
    title: Research continuity
    purpose: Strategy research outputs remain traceable through paper validation.
    owner_lane: Strategy Analytics
    exit_evidence: []
  - id: PortfolioLedgerReview
    title: Portfolio ledger review
    purpose: Ledger and reconciliation records can support books and operator sign-off.
    owner_lane: Accounting and Ledger
    exit_evidence:
      - docs/roadmap/generated/ROADMAP_SUMMARY.md
      - tests/Meridian.Tests/Ui/FundOpsCloseLaneScenarioTests.cs
      - tests/Meridian.Wpf.Tests/ViewModels/FundLedgerViewModelTests.cs
  - id: GovernedReportPack
    title: Governed report pack
    purpose: Report packs carry approval and export evidence.
    owner_lane: Accounting and Ledger
    exit_evidence:
      - docs/roadmap/generated/ROADMAP_SUMMARY.md
      - tests/Meridian.Tests/Integration/EndpointTests/PilotAcceptanceHarnessTests.cs
      - tests/Meridian.Tests/Ui/WorkstationEndpointsTests.Wave4.cs
  - id: AccountingRecords
    title: Accounting records
    purpose: Source data, reconciliation actions, ledger evidence, approvals, retained documents, and report outputs remain linked as audit-ready operational records.
    owner_lane: Accounting and Ledger
    exit_evidence:
      - docs/roadmap/generated/ROADMAP_SUMMARY.md
      - tests/Meridian.Tests/Application/OperationsContinuityWorkflowServiceTests.cs
      - tests/Meridian.Tests/Ui/FundOpsCloseLaneScenarioTests.cs
      - src/Meridian.Ui/dashboard/src/screens/accounting-screen.test.tsx
  - id: BacktestingEvidence
    title: Backtesting evidence
    purpose: Host-composed Covered Call runs require a scoped retained Evidence Vault manifest before queueing, preserve exact strategy-run lineage, and project four Paper checklist decisions only from durable operator/audit authority, exact keyed source evidence, and a matching same-scope Paper child.
    owner_lane: Strategy Analytics
    exit_evidence:
      - src/Meridian.Backtesting/README.md
      - src/Meridian.Ui/dashboard/src/screens/covered-call-screen.view-model.test.ts
      - src/Meridian.Ui/dashboard/src/screens/covered-call-screen.test.tsx
      - tests/Meridian.Tests/Strategies/CoveredCall/CoveredCallRunProjectionTests.cs
      - tests/Meridian.Tests/Strategies/CoveredCall/CoveredCallBacktestServiceTests.cs
      - tests/Meridian.Tests/Integration/EndpointTests/CoveredCallEndpointAuthorizationTests.cs
      - tests/Meridian.Tests/Strategies/StrategyRunReadServiceTests.cs
      - tests/Meridian.Tests/Strategies/PromotionServiceTests.cs
      - tests/Meridian.Tests/Ui/ExecutionWriteEndpointsTests.cs
      - tests/Meridian.Tests/Ui/EvidenceWorkflowFabricTests.cs
      - tests/Meridian.Tests/Strategies/StrategyRunStoreTests.cs
      - tests/Meridian.Tests/Ui/WorkstationEndpointsTests.StrategyTenantScope.cs
      - tests/Meridian.Tests/Ui/WorkstationEndpointsTests.TradingTenantScope.cs
      - src/Meridian.Ui/dashboard/src/screens/strategy-screen.view-model.test.ts
      - src/Meridian.Ui/dashboard/src/screens/strategy-screen.test.tsx
      - src/Meridian.Ui/dashboard/src/screens/trading-screen.view-model.test.ts
  - id: LiveReadiness
    title: Live readiness
    purpose: Live operation remains gated by prior evidence-backed stages.
    owner_lane: Accounting and Ledger
    exit_evidence: []
