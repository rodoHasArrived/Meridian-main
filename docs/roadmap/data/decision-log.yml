schema:
  id: meridian.decision-log
  version: "1.0.0"
  minimum_renderer_version: "1.0.0"

decisions:
  - id: DEC-DOCS-BPP-001
    title: Treat documentation as an engineering subsystem
    status: accepted
    decided_on: 2026-05-21
    owner_lane: Docs and Automation
    summary: Roadmap YAML, source YAML, source READMEs, deterministic generated docs, and AI instructions form one synchronized documentation system.
    related_roadmap_items:
      - W2-TRD-001
      - W7-LIVE-001
  - id: DEC-UI-LANE-001
    title: Browser and desktop workstations are active UI lanes
    status: superseded
    decided_on: 2026-05-21
    owner_lane: Workstation Shell and UX
    summary: Superseded by DEC-UI-LANE-002 on 2026-07-05. Browser and WPF workstation work were both active; shared contracts, API endpoints, and read models carried business behavior before either client composed it.
    related_roadmap_items:
      - W2-TRD-001
  - id: DEC-UI-LANE-002
    title: Browser workstation active and WPF product work deferred
    status: accepted
    decided_on: 2026-07-05
    owner_lane: Workstation Shell and UX
    summary: Browser workstation work remains the active operator UI lane. WPF product/UI work is deferred until explicitly reactivated; existing WPF shell code, compatibility, tests, and release workflows remain retained support surfaces, and shared contracts/API/read models must stay client-neutral where existing WPF consumers depend on them.
    related_roadmap_items:
      - W5X-FINOPS-001
      - W5X-FREX-001
      - W7-LIVE-001
  - id: DEC-UI-CONSOLIDATION-001
    title: Consolidate browser screens by deepening host screens behind charter roots
    status: accepted
    decided_on: 2026-07-19
    owner_lane: Workstation Shell and UX
    summary: Closely related browser-workstation tools fold into deeper host screens instead of holding standalone routes. Folds stay within the seven charter root workspaces, compose as tabs, master panes, or context rails rather than stacked content, retire each old route as a redirect that preserves query and hash scope, keep sidebar sub-items, the route catalog, mounted routes, and command palette commands as one taxonomy, and refresh the WPF parity matrix in the same change. Consolidation is presentation-only; shared contracts, read models, and endpoints do not change.
    related_roadmap_items:
      - W8-UX-CONSOL-001
      - W8-WPF-PARITY-001
  - id: DEC-PRIORITY-SLATE-001
    title: Adopt the 2026-07 first-order improvement slate as ranked W9 roadmap priorities
    status: accepted
    decided_on: 2026-07-21
    owner_lane: Core Team
    summary: Nine product-critical improvements enter the registry as the ranked W9 priority slate, ordered truth-and-evaluation first (fail-closed simulation posture, one-command seeded demo), then promotion-gate integrity and the live feedback loop (paper-trading realism, Alpaca fill streaming), then fund-accounting deliverables (client-grade report exports, unitized NAV and fee/waterfall/capital-call economics), then safety and governance hardening (kill-switch and pre-trade rules, route authorization/tenancy/audit chaining), then institutional statement ingestion with a sided reconciliation matcher. Rank is encoded in each W9 item's numeric ID suffix, and docs/product/product-roadmap-priorities-2026-07.md records the rationale table and production-readiness tracker mapping.
    related_roadmap_items:
      - W9-TRUTH-001
      - W9-DEMO-002
      - W9-PAPER-003
      - W9-ALPACA-004
      - W9-REPORT-005
      - W9-NAV-006
      - W9-SAFETY-007
      - W9-GOV-008
      - W9-INGEST-009
  - id: DEC-DEPTH-SLATE-001
    title: Adopt the 2026-07 depth slate as W10 roadmap rows
    status: accepted
    decided_on: 2026-07-31
    owner_lane: Core Team
    summary: Eleven deepenings of existing functionality enter the registry as the W10 depth slate. The adopted rank is W10-MARK-001, W10-RECON-001, W10-PROV-001, W10-RECON-002, W10-JRNL-001, W10-TAX-001, W10-SEAM-001, W10-RECON-003, W10-RECON-004, W10-PERF-001, then W10-CONSOL-001, and docs/product/w10-depth-slate-2026-07.md is authoritative for it. Read the groupings that follow as non-sequential themes rather than a second delivery order - truth and identity first, then the shared seam that later rows depend on, then reconciliation economics, then accounting depth, then the new surface that stands outside those arcs last. Six of the eleven wire capability that is already built and unwired rather than adding new surface. A new wave token is opened instead of extending W9 because the W9 numeric suffix encodes rank within the 2026-07 first-order slate and appending would corrupt that meaning; W10 rank is recorded in docs/product/w10-depth-slate-2026-07.md instead. The slate is post-W9 depth work and does not precede production certification, except that W10-MARK-001 and W10-SEAM-001 are pulled forward because they serve the release gate rather than competing with it.
    related_roadmap_items:
      - W10-MARK-001
      - W10-RECON-001
      - W10-PROV-001
      - W10-RECON-002
      - W10-JRNL-001
      - W10-TAX-001
      - W10-SEAM-001
      - W10-RECON-003
      - W10-RECON-004
      - W10-PERF-001
      - W10-CONSOL-001
  - id: DEC-W9-CLOSEOUT-001
    title: Close the 2026-07 first-order slate as one sequenced W9 close-out wave
    status: accepted
    decided_on: 2026-08-11
    owner_lane: Core Team
    summary: The three open rows of the 2026-07 first-order improvement slate are delivered as one sequenced wave rather than opportunistically, and docs/product/w9-close-out-delivery-plan-2026-08.md is authoritative for its sequence and source constraints. The adopted order is W9-SAFETY-007, then W9-GOV-008, then W9-INGEST-009, delivered as eleven changes with one roadmap row advanced per change and the row's registry status and evidence updated in the same change. Safety leads because it is the only in_progress row and the smallest, and its rule catalogue precedes the control sweep the rules are governed by. Within W9-GOV-008 the declarative authorization assertion lands with the first burn-down tranche rather than after it, because sharpening the instrument once the baseline is already empty would prove nothing about the routes fixed before it; the 152-route remediation baseline is then burned down in tranches scoped one owner lane each, largest first, with /api/auth pulled early because account disable, password reset, and access revocation are the most sensitive unguarded mutations in the set; fail-closed tenancy and hash-chained accounting audit land last within the row because both are behaviour-changing rather than additive. Ingestion is last because it is evidence work against code that already ships. The wave advances evidence toward PRD-006, PRD-007, PRD-009, PRD-010, and PRD-101 but does not close the P0 release gate and does not certify a release; every row moves only to ready_for_acceptance, and done still requires operator acceptance. The wave does not open W10, does not reopen deferred lanes, and does not extend the risk-engine blueprint beyond its shipped PR 1 - the decision journal, the risk decisions read surface, and their WPF parity remain a deliberate deferral recorded on W9-SAFETY-007. Migration ordinals 029-038 remain reserved by in-flight blueprints, so any migration in this wave takes 039 or higher.
    related_roadmap_items:
      - W9-SAFETY-007
      - W9-GOV-008
      - W9-INGEST-009
