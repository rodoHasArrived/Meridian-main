    status: accepted
    decided_on: 2026-05-21
    owner_lane: Docs and Automation
    summary: Roadmap YAML, source YAML, source READMEs, deterministic generated docs, and AI instructions form one synchronized documentation system.
    related_roadmap_items:
      - W2-TRD-001
      - W7-LIVE-001
  - id: DEC-UI-LANE-001
    title: Browser workstation active, WPF workstation deferred
    status: accepted
    decided_on: 2026-07-05
    owner_lane: Workstation Shell and UX
    summary: Browser workstation work remains active for new operator UI delivery. WPF implementation, parity proof, screenshots, test repair, and validation are deferred unless explicitly reactivated or requested for WPF-specific maintenance; existing WPF evidence remains historical support context.
    related_roadmap_items:
      - W2-TRD-001
