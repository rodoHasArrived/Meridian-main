  scope_gate: >-
    New product work should strengthen financial operations, strategy formulation and validation,
    governed order management and execution, data confidence, reconciliation, approvals, accounting
    records, close support, retained evidence, or governed reporting. DEC-TRADING-STRATEGY-DIRECTION-001
    adopts W13-STRAT-001 and W13-OMS-001 as unranked planned product direction; research and live
    execution productization are no longer blanket deferred goals. Implementation must declare
    supported strategy/order capabilities, account and intent authority, broker evidence, and
    paper/live operating controls. Missing or unaccepted capabilities cannot be presented as ready,
    and live activation still requires its own approvals and certified support envelope. Existing
    roadmap ranks, the separate LOT then MARK then SEAM work queue, and production-release gates
    remain intact. Browser and WPF remain active co-equal lanes over shared contracts. Unrelated
    payments, detached forecasting/risk, broad portal, general workflow-designer, mobile, and
    scale-out exclusions retain their existing decisions.
