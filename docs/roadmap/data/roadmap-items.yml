  - id: W7-LIVE-001
    title: Live-readiness governance
    wave: W7
    stage_gates:
      - LiveReadiness
    workspace:
      - Trading
      - Settings
    owner_lane: Accounting and Ledger
    status: done
    health: green
    priority: medium
    evidence_posture: complete
    current_summary: Closed 2026-06-23. Live-readiness governance is evidence-gated, not live-execution productization: Paper -> Live promotion requires the W1-W5 operational record baseline, paper-validation evidence, reconciliation evidence, accounting-record evidence, governed reporting evidence, governance sign-off, exception-handling posture, rollback or kill-switch posture, audit-retention evidence, and an active `AllowLivePromotion` override. Host and execution surfaces remain paper-first by default.
    exit_criteria:
      - Live action surfaces remain paper-first unless live-readiness acceptance gates and execution controls are green.
      - Credential and provider checks stay secret-safe and read-only by default.
      - Governance sign-off, exception handling, rollback or kill-switch posture, and audit retention are linked before any live-readiness claim.
      - This item strengthens operational evidence and approval posture without adding broker execution surface area.
    source_modules:
