    current_summary: Rank 8 of the 2026-07 first-order improvement slate. Source-verification snapshot 2026-08-10 - substantial implementation already exists and the row needs criterion-level verification rather than greenfield build. RoleAuthorizationTests and the per-workspace tenant-scope endpoint suites (for example WorkstationEndpointsTests.StrategyTenantScope) cover authorization and tenancy behavior, and Meridian.Storage AuditChainService provides the hash-chained audit seam; The 2026-08-10 change lands the criterion-one instrument - EndpointAuthorizationCoverageTests mechanically enumerates every mapped mutating route from the composed application's endpoint graph and proves a zero-permission caller is rejected, with a five-route documented permissionless allowlist and a frozen 152-route remediation baseline ratchet: the sweep found 152 mutating routes (largely the pre-workstation /api surface) that today process permissionless requests - unguarded 200/201 writes, validate-before-authorize orderings, and test-host registration gaps - so the baseline tolerates exactly those known-debt routes, fails on any newly mapped unguarded route, and fails when a remediated route is not removed. The 2026-08-10 burn-down guarded the 40 highest-risk success-status routes (diagnostics, export, lean, messaging, storage, storage-quality, analytics repair, environment designer, provider failover, quant-lab parameter extraction) with Require endpoint filters mapped to family permissions, shrinking the baseline from 152 to 112. Remaining before acceptance - burn down the residual 112-route baseline (each fix shrinks it), prove fail-closed tenancy rejection for requests without resolvable scope across all write surfaces, and prove cross-process audit-chain serialization with verification tooling and tamper-detection tests aligned with the PRD-007 evidence-chain notes. Corrected 2026-08-11 - the accounting audit half of this row cannot be discharged against the PostgreSQL store alone, because IAccountingActionAuditStore resolves to PostgresAccountingConfigurationStore only where the database composition is registered and the workstation and WPF compositions fall through to FileAccountingConfigurationStore, whose AppendAsync adds the event with no predecessor hash and no chain verification; that file-backed path is what runs when nobody has stood up PostgreSQL, so it must be chained and verified too, or those mutations disabled in that posture, with local and WPF proof. Tenancy scope corrected 2026-08-11 - the remaining proof is not write-side only, and the fund-structure store is in scope rather than deferred as defence-in-depth: PostgresFundStructureService has no tenant column and no predicate, LoadSnapshotAsync takes no scope and loads every organization, business, fund, and relationship, /api/fund-structure/graph serves that snapshot, and mutations resolve parents from the same global view - so a tenant-A administrator can read tenant-B structure and link or mutate tenant-B nodes by id while RequireFundScopedWriteTenant proves only that the caller has some tenant. The criterion is categorical about reads as well, and two read paths are deliberately fail-open today: RequireFundProfileTenantScope passes a blank fund, a caller with no tenant scope, or an unavailable guard, and the storage TenantReadPredicate emits tenant_id is null or ... so unstamped legacy rows stay visible. Both must be tightened with regression tests before the row advances, and tightening the predicate needs a data migration BEFORE it needs a test - V_ledger_020, V_ledger_021, and fund-account migration 003 backfill from the fund_profile_tenancy registry and their own headers state that rows they cannot attribute stay null and fail-open, so rejecting null tenants without attributing them first hides fund-account, journal/period, and operations-continuity records from every scoped reader on an existing deployment. Change 9 therefore carries a deterministic backfill for the remaining unstamped rows plus a quarantine or upgrade-validation path for whatever it still cannot attribute. The same applies to accounts - InitialAccountBootstrapService creates the ordinary first-run administrator with a null company and UserAccountConfig.CompanyId is optional for stored accounts and MDC_USERS alike, so enforcement 403s the normal administrator of an existing local installation, not just the legacy MDC_USERNAME fallback. And enabling FundScopedWriteTenantOptions affects only routes already decorated with RequireFundScopedWriteTenant, which FundStructureEndpoints carries nowhere, so the undecorated writes beneath the /api/fund-structure group must be enumerated and gated or explicitly allowlisted as bootstrap. The 2026-08-16 change lands the declarative instrument with the first burn-down tranche, per the adopted ordering. Three ratchets now stand where one stood. The behavioural sweep is corrected and tightened from 112 to 81: MaterializePath now honours int route-constraint policies, because rendering 'sweep-test' into a {version:int} segment 404'd at routing and made three guarded template-decision routes read as unguarded for as long as the sweep existed. A new declarative ratchet (EndpointAuthorizationDeclarationTests) asserts every mutating route carries EndpointAuthorizationMetadata or is a documented permissionless decision, frozen at 344 undeclared and burned to 332 in the same change - the declarative debt is three times the behavioural count, because most families guard inside handlers where no tooling can see the requirement; both ratchets must hold for a route to be done, since each is blind where the other sees. The fund-structure tranche clears its entire family across both: the 34 behavioural entries decompose into 13 genuinely unguarded structure creates (organizations, businesses, clients, funds, sleeves, vehicles, entities, investment-portfolios, links, links/validate, assignments - the repo had guarded the updates but left every create open) now declared ManageFundStructure with setup-drafts/validate and ledger-mapping-assignments matching their handlers' any-of sets; 3 template version decisions already handler-checked but 404-confounded, now declared and actually swept; 3 distribution routes already declared whose behavioural entries remain only because the test host cannot compose ReportingSecureDistributionApplicationService's ten-dependency graph (a fixture gap, recorded rather than laundered); and 15 legacy-reporting 410 Gone tombstones that perform no action and answer with the canonical replacement route, moved to the permissionless allowlist with the reason stated - guarding a tombstone would swap that pointer for a 403 while protecting nothing. Twelve further family routes that were handler-checked but undeclared (runs, readiness, schedules lifecycle, templates, drafts, render, starter-kit provision, transaction-lab preview, setup-drafts/create) are declared to match their handlers exactly, so the family is clear of both ratchets. The read-surface decision is taken and instrumented per the criterion's demand: remediation is RISK-BASED - reads exposing account-scoped, position, or PII-bearing data get a permission; broad workstation reads declare openness explicitly through a new DeclareOpenRead marker (EndpointOpenReadMetadata) with a stated reason, not by omission. EndpointReadDeclarationTests freezes the 542 currently undeclared GET routes as the sequence's second ratchet; a newly mapped GET carrying neither declaration fails immediately, and the remainder-to-zero change owns classifying the inventory. All three ratchets are two-sided: a fixed route must leave its baseline or the test fails, so progress is mechanically measurable in both directions. The 2026-08-16 auth/workstation tranche (change 5) burns the behavioural baseline from 81 to 62 and the declarative baseline from 332 to 307, clearing /api/auth entirely across both. The four most sensitive entries - account upsert, disable, password reset, and access-assignment revocation - were handler-guarded with ManageUsers all along and sat in the behavioural baseline as binding confounds; they now declare ManageUsers, as do access-assignment creation, role-profile upsert, and session revocation. Bootstrap joins the permissionless allowlist beside /api/setup/account as the same token-gated first-run seam. The workstation entries decompose as: collateral ingest and break-queue comment edit/delete declare the reconciliation any-of set (AdminMaintenance, ManageDirectLending, ModifySecurityMaster) mirroring their handlers; data/query declares ViewHistoricalData; run compare/diff and the strategy designer's stateless validate/preview/validate-run declare ViewStrategies; and the per-user UI-state mutations - workflow presets save/update/pin/used/delete, financial-record-explorer saved views, first-run outcome acknowledgement, and the loopback-only desktop launcher - declare a new RequireAuthenticatedSession marker (EndpointAuthorizationMetadata with an empty permission list), because demanding a business permission for a caller's own session state would be false precision while leaving the route undeclared was none at all. Tenant scope was deliberately NOT accepted as a declaration: every workstation mutation sits behind the group's tenant-scope filter, but any authenticated tenant session passes it, which is precisely the unrelated-declaration-satisfying-the-sweep failure the plan warns against. One behavioural entry remains by construction: collateral/ingest binds IReadOnlyList and the sweep's empty-object body 400s before any filter, so its entry stays with the reason inline and the declarative ratchet as the operative guarantee. Operations-continuity and reconciliation-casework declarative debt under /api/workstation is deliberately left for the operations tranche, which owns those lanes. Review-hardened 2026-08-16 on the same tranche - two findings against the auth/workstation change were verified and dispositioned: (1) the workflow-preset library is a shared global store (FileWorkflowPresetStore persists one workstation/workflows/workflow-presets.json list with no owner on the record and no actor threaded through WorkflowPresetService), so RequireAuthenticatedSession admits any operator to overwrite or delete any preset by id; the declaration truthfully states what is enforced, but preset ownership scoping is real tenancy work and is assigned to this wave's fail-closed tenancy change alongside the other scope-model corrections rather than patched with a false-precision business permission. (2) endpoint filters run only after minimal-API argument binding, so a sessionless caller's malformed body was parsed and answered with a binding 400 before the ManageUsers filter could refuse it; AccountAdministrationGuardMiddleware now refuses account-administration mutations (accounts, session revocation, role-profiles, access-assignments) before binding, mirroring the handlers' cookie-then-permissions-snapshot resolution chain, with pre-binding 401/403/400 behaviour proven by RoleAuthorizationTests; the endpoint filter stays as the declarative layer so an admin route the prefix list misses still fails closed after binding. Operations-surface tranche 2026-08-17 - the 49 remaining /api/workstation mutations under reconciliation (29) and operations/continuity (20) now declare the authorization their handlers already enforce, taking the declarative baseline 307 to 258; none of the 49 appeared in the behavioural baseline, so this tranche is purely declarative and adds no new enforcement. The declarations were derived per route from the admission guard actually executed rather than applied as one family default, which the source did not support: 45 routes resolve to the reconciliation any-of set (AdminMaintenance, ManageDirectLending, ModifySecurityMaster), reached either directly or through the shared ApplyReconciliationCaseworkEndpointAsync and CreateStatementRunAsync helpers; approval-policy-rules, close-calendar-items, and continuity reopen require AdminMaintenance alone; and the security-master override approval requires AdminMaintenance or ModifySecurityMaster. Two distinctions were load-bearing: HasGovernedWorkflowReopenPermission appears inside the casework helper only to set the Privileged flag on the command, not to admit the request, so folding it into those nine declarations would have wrongly excluded legitimate ManageDirectLending callers; and WorkstationEndpoints.Reconciliation.cs holds a retired duplicate mapper (LegacyReconciliationEndpointMapEnabled is false and the method throws), so its five shadow copies of these routes were excluded and the authoritative mappings in WorkstationEndpoints.cs were edited instead. Remaining declarative debt after this tranche is 258, of which only 10 are /api/workstation (data, strategy, security-master, settings); the bulk is now the non-workstation surface led by /api/ledger (42), /api/security-master (26), /api/providers (16), and /api/execution (13). Data and diagnostics tranche 2026-08-17 - 42 further mutations declare their existing authorization, taking the declarative baseline 258 to 216 and clearing /api/workstation, /api/diagnostics, /api/storage, /api/export, /api/environment-designer, and /api/lean of declaration debt. The tranche was scoped by intersecting the two baselines first: of the 258 undeclared mutations, 200 are declaration-only (guarded but undeclared) and 58 sit in BOTH baselines, meaning they are genuinely unenforced; only declaration-only routes were taken here so the tranche changes no behaviour, and the 58 genuine gaps are left to the remainder change that can decide enforcement per route. Two forms were remediated: 32 routes carried enforcement through the raw AddEndpointFilter(EndpointAuthorization.Require(...)) form, which gates the request but stamps no EndpointAuthorizationMetadata, and were swapped to the RequirePermission extension so they both enforce and declare; the remaining 10 guard inline in the handler and gained a chained declaration mirroring that guard. One route required judgement: storage-assurance preview and execute authorize through CanPreviewStorageAction, which always demands ManageStorage but additionally demands AdminMaintenance when the requested action is Cleanup. An endpoint declaration cannot express a payload-dependent condition, so the declaration states the admission floor (ManageStorage) and the Cleanup escalation stays in the handler - the same treatment given to the casework Privileged flag in the operations tranche. Remaining declarative debt is 216, now entirely non-workstation and led by /api/ledger (41), /api/security-master (24), /api/providers (15), and /api/execution (12). Ledger and accounting tranche 2026-08-17 - 51 mutations across /api/ledger and /api/accounting-system declare their existing authorization, taking the declarative baseline 216 to 165. Scoping note recorded because it changes how the remainder is planned: the 158 declaration-only routes left after the data and diagnostics tranche are not one mechanical batch. They authorize through roughly sixteen distinct idioms - named single-argument predicates, two-argument parameterised helpers such as HasExecutionTradingPermission(context, permission), group-level endpoint filters on the security-master and fund-account groups, and body-scope checks such as IsBodyFundScopeAccessibleAsync that are not static permission tests at all - so a single sweep would have had to guess at several of them. The remainder is therefore being taken subsystem by subsystem, each tranche declaring only what its guards actually assert. This tranche covers the ledger and accounting helpers, all of which resolve cleanly: ledger mutation, read, and close permissions are the same any-of pair (AdminMaintenance, ManageDirectLending); ledger certification is AdminMaintenance alone; accounting access is any-of (AdminMaintenance, ManageFundStructure) with accounting certification again AdminMaintenance alone. One payload-dependent case was handled as before: HasManualJournalLifecycleActionPermission takes the ledger read set for a Validate action and the certification permission otherwise, so the declaration states the admission floor and the escalation stays in the handler. Remaining declarative debt is 165, led by /api/security-master (24), /api/providers (15), /api/execution (12), and /api/fund-accounts (11), plus the 58 routes that sit in both baselines and need real enforcement decisions rather than declarations. Security-master and provider-connectivity tranche 2026-08-18 - 57 mutations across /api/security-master, /api/providers, /api/config/datasources, /api/credentials, /api/brokerage-connections, /api/plaid, and /api/provider-routing declare their existing authorization, taking the declarative baseline 165 to 108. This tranche exposed three further guard idioms beyond the ones already catalogued: filter delegates registered at group level (the security-master group carries RequireViewSecurityMasterPermission, so no route inside it shows a local guard, and twenty routes additionally carry the per-route RequireModifySecurityMasterPermission filter), guards that return IResult? into a local and are tested for null rather than being called inside an if, and permission checks written with a namespace-qualified enum or an httpContext parameter name. Payload-dependent floors recurred and were declared as floors: provider setup and data-source mutation require ManageProviders always and ManageCredentials only when the body carries credentials, so the declaration states ManageProviders and the credential escalation stays in the handler. One deliberate behaviour change is recorded rather than hidden: three provider routes (validate-credentials, test-connection, provider configure) previously answered 403 to a caller with no session at all, because the handler helper returns false without distinguishing the two cases, whereas a declared route answers 401 for an absent permissions snapshot and 403 for a snapshot lacking the permission. Adopting the declaration therefore moves those three from 403 to 401 for anonymous callers. The request is refused either way, 401 is the correct status for an unauthenticated caller, and every other declared route in the codebase already behaves this way, so the three tests asserting the old status were updated with the reason rather than the declaration being weakened. Remaining declarative debt is 108, of which 50 are declaration-only (led by /api/execution 12, /api/fund-accounts 11, /api/admin 6, /api/compliance 4) and 58 sit in both baselines and still need enforcement decisions. Declaration lane closed 2026-08-18 - the final 50 declaration-only mutations (/api/execution 12, /api/fund-accounts 11, /api/admin 6, /api/compliance 4, /api/messaging, /api/oms, /api/promotion, /api/risk, /api/analytics, /api/quant) now declare their guards, taking the declarative baseline 108 to 58 and establishing the criterion's central invariant: the set of undeclared mutations is now exactly the set of unguarded mutations, so nothing is enforced-but-invisible any more. Verified as a set comparison rather than a count - the difference undeclared-minus-unguarded is empty. The behavioural baseline stays at 62 rather than 58 because four routes are declared and enforced but unreachable by the sweep: three fund-structure reporting-distribution routes whose fixture cannot construct ReportingSecureDistributionApplicationService (503 before any filter) and workstation collateral ingest whose list-typed body cannot bind an empty object (400 before any filter). Those four are confounds in the probe, not gaps in the guard. Three further guard idioms were catalogued here: helper calls whose parameter is named ctx rather than context, guards invoked through an is-pattern (TryAuthorizePromotionMutation(...) is { } failure), and routes with no WithName anchor at all, where the declaration chains onto the closing brace of the map call. The 401-versus-403 refinement recorded in the previous tranche recurred on the six /api/admin routes and was handled the same way: a declared route answers 401 when no permissions snapshot exists and 403 when one exists without the permission, so seven tests asserting the older collapsed 403 were updated with the reason inline. What remains for this criterion is no longer declaration work: 58 mutations are genuinely unenforced and need per-route enforcement decisions, and the 542-route read baseline still needs its classification pass. Enforcement-gap triage 2026-08-18 - the 58 were examined individually before any enforcement was written, and they are not one population. Seven were guarded all along and only looked unenforced because the behavioural probe never reached the guard (execution order submit, lean results ingest, quant run, reference-data option-chain import, both security-master corporate-action routes, and the compliance action evaluation, the last carrying the raw AddEndpointFilter form); declaring them took the declarative baseline 58 to 50, and two of the seven also left the behavioural baseline because the new filter now refuses before the binding confound could occur, taking it 62 to 59. Two more are authenticated by the caller's own credential rather than by a session permission and were allowlisted with that reason: the reporting delivery-receipt hook verifies an X-Meridian-Reporting-Signature over the body, and the portal grant exchange authenticates the grant token it is handed and exists precisely to mint a session for a caller who holds no permission yet. Two are recorded as-is rather than remediated. POST /api/ledger/periods/{periodId}/close is guarded, but by role - TryGetLedgerCloseActor admits only the Admin and Accounting roles - and EndpointAuthorizationMetadata carries permissions, so declaring one would state a policy the route does not enforce; it stays listed until the guard is expressed in permissions. POST /api/plaid/webhook is a genuine security finding and is deliberately not allowlisted: unlike the reporting hook beside it, it verifies nothing at all - no Plaid signature, no shared secret, no session - so any caller who can reach the host can record forged webhook events into the ingestion pipeline, and the payload hash it stores authenticates nothing because the attacker supplies the payload. Authenticating that ingress needs a decision (verify Plaid's signature header against the configured key, or gate the route behind a shared secret) and is tracked as its own work rather than folded into a declaration tranche. That leaves 48 mutations that are genuinely unenforced and still need per-route enforcement decisions, led by /api/maintenance (12), /api/symbols (10), /api/replay (6), /api/packaging (4), and /api/quality (3), plus the 542-route read baseline classification. First enforcement tranche 2026-08-18 - the maintenance and symbol families, 22 routes, now enforce rather than merely declare, taking the declarative baseline 50 to 28 and the behavioural baseline 59 to 37. This is the first change in the criterion that deliberately refuses callers who previously succeeded. The two permission choices follow existing precedent rather than inventing one. The twelve /api/maintenance routes drive ScheduledArchiveMaintenanceService and ArchiveMaintenanceScheduleManager - schedule create, update, delete, enable, disable, run, trigger, execute, execution cancel and cleanup - and the already-guarded /api/admin/maintenance/run drives the same service behind AdminMaintenance, so the family takes AdminMaintenance. The ten /api/symbols routes load ConfigStore, mutate the configuration document's Symbols watchlist (subscribe flags and depth levels) and save it back, which is what ModifyConfig names, and the environment-designer routes already use ModifyConfig for the same kind of configuration mutation. Two members of these families mutate nothing - POST /api/symbols/validate and POST /api/maintenance/validate-cron only echo whether a caller-supplied string parses - and were given the family permission rather than an allowlist entry, on the grounds that fail-closed is the safer default and their only callers are the config and maintenance editors that already hold it. Thirteen existing tests exercised these routes with no permissions and now receive 401; each was moved onto a permitted client rather than having its expectation relaxed, so the suite still proves the endpoints work for an authorised caller. Remaining genuinely-unenforced mutations: 26, led by /api/replay (6), /api/packaging (4) and /api/quality (3). Second enforcement tranche 2026-08-18 - replay, packaging and data quality, 13 routes, now enforce, taking the declarative baseline 28 to 15 and the behavioural baseline 37 to 24. Permissions again follow the nearest existing guard rather than a fresh judgement. The three /api/quality routes - gap remediation, anomaly acknowledgement and report export - take ManageStorage because their siblings /api/storage/quality/check and /api/storage/quality/alerts/{alertId}/acknowledge already require exactly that for the same operations on the same quality service. The four /api/packaging routes create, import, validate and delete package files beneath the data root, which is storage lifecycle rather than data egress, and the separate /api/export surface already carries ExportData for actual export, so packaging takes ManageStorage. The six /api/replay routes stream stored historical market data back to the caller as a session, which is what ViewHistoricalData names and what the workstation data-query route already requires. One mechanical hazard is worth recording for the remaining tranches: three of these handlers are expression-bodied or wrap their body in a guard helper, so they have no WithName line and no closing brace matching the usual terminator pattern; an automated anchor search attached a declaration inside a handler body and to a Results.Conflict expression before the compiler caught it, and the anchors were then set from the actual map-call terminators by hand. Three quality-contract tests exercised the endpoints through a host that composes them without session middleware and now receive 401; the host stamps the permissions snapshot rather than the tests relaxing their assertions. Remaining genuinely-unenforced mutations: 13, none of them a family larger than two - /api/alignment, /api/backfill, /api/schedules and /api/subscriptions at two each, then single routes under /api/health, /api/options, /api/sampling and /api/providers, plus the two already recorded as findings rather than gaps (the role-gated ledger period close and the unauthenticated Plaid webhook). Enforcement lane closed 2026-08-18 - the last twelve unenforced mutations now enforce, taking the declarative baseline 15 to 2 and the behavioural baseline 24 to 11. Every permission was taken from the nearest existing guard: subscriptions subscribe and unsubscribe mutate the same ConfigStore Symbols array as the /api/symbols family and take ModifyConfig; the backfill checkpoint resume and cost estimate take TriggerBackfill, which is what the permission is named for; alignment create and preview, and sampling create, read stored historical market data and take ViewHistoricalData; the two provider-test routes under /api/health and /api/providers return registry diagnostics and take ViewDiagnostics, matching /api/diagnostics/providers/{providerName}/test; the cron validate and next-runs helpers take AdminMaintenance, matching /api/maintenance/validate-cron; and options refresh pulls an option-chain snapshot through to the caller without persisting it, so it takes ViewMarketData. The end state is the one the criterion asked for. The declarative baseline now contains exactly two routes, both recorded findings rather than oversights: the ledger period close is guarded by role rather than permission and cannot be stated in EndpointAuthorizationMetadata, and the Plaid webhook is the unauthenticated ingress that still needs a decision. The behavioural baseline holds those two plus nine routes that are declared and enforced but unreachable by the sweep - fund-structure reporting distribution (fixture cannot construct the service), workstation collateral ingest, execution order submit, compliance action evaluation, reference-data option-chain import and both security-master corporate-action routes (empty-object bodies that cannot bind). A bookkeeping error from the triage change was also corrected: that change added an allowlist entry for a hooks/reporting receipt path in the singular, but the mapped route is receipts in the plural and was already allowlisted, so the added entry matched nothing. The inert entry is removed and the stale baseline rows for the real route, which the allowlist check skips before any baseline comparison, are cleared. Read classification opened 2026-08-18 - the 542-route read baseline is the last untouched piece of criterion one, and it is being worked the same way the mutation lane was: separate the reads that are already enforced from the ones that are genuinely open, and declare the former first so no risk decision hides inside a mechanical change. Fifty-four reads are enforced today by a group-level filter and needed only a declaration, taking the read baseline 542 to 488. Seventeen security-master reads and five bond, four future, three crypto and three deposit reference reads sit behind groups that already require ViewSecurityMaster or ModifySecurityMaster; twenty-two fund-account reads sit behind RequireFundAccountAccess, which requires AdminMaintenance or ManageDirectLending. Each route now states the set its group already enforces, so the endpoint graph shows the policy instead of it living one line up in a group registration. No behaviour changed. The remaining 488 reads still need the risk-based pass the operator chose: reads exposing account-scoped, position or personal data take permissions, and broad workstation reads declare openness explicitly through EndpointOpenReadMetadata with a stated reason. The largest remaining families are /api/workstation (57 located in WorkstationEndpoints.cs alone), data quality (37), ledger (20), execution (19) and storage (17). Execution and ledger reads 2026-08-18 - thirty-nine reads classified, taking the read baseline 488 to 449, and the two halves of that number are the finding. All twenty ledger reads were already enforced by an inline HasLedgerReadPermission check requiring AdminMaintenance or ManageDirectLending, as was the execution session replay read behind ManageOrders; those twenty-one needed only a declaration and changed no behaviour. The other eighteen execution reads had no guard of any kind: /api/execution/positions, /portfolio, /portfolio/aggregate, /accounts, /accounts/{id}/positions, /account, /orders, /orders/{id}, /audit, /audit/search, /positions/blotter, /sessions, /sessions/{id}, /sessions/{id}/tca, /controls, /capabilities and /health were readable by any caller who could reach the host, exposing account balances, live positions, the order book and the execution audit trail. All eighteen now require ViewTrades, the permission whose stated meaning is viewing trade records and order history. Three of them are not customer data but were guarded on the same terms rather than left open: /controls returns the circuit-breaker and position-limit posture, /health names the broker and whether the gateway is live or paper, and /capabilities lists the venues and order types the gateway supports - a caller with no trade-viewing permission has no business reading the trading gateway's state either. Liveness monitoring is unaffected because the container probes use /healthz and friends, which LoginSessionMiddleware exempts before any endpoint filter runs. Nineteen tests failed on the change, the largest fallout of the wave and a fair measure of how open that surface was; each was given the permission rather than having its expectation relaxed. Storage and data-quality reads 2026-08-19 - fifty-eight reads guarded, taking the read baseline 449 to 391. Unlike the ledger family none of these had any guard: every data-quality metric (gaps, latency, completeness, anomalies, errors, comparison, health) and every storage read (stats, breakdown, catalog, tiers, capacity forecast, cleanup candidates, orphans, per-symbol file paths and search) was open to any caller who could reach the host. They now require any of ViewHistoricalData, ViewDiagnostics or ManageStorage. The choice of an any-of set rather than the obvious ViewDiagnostics was forced by evidence: ViewDiagnostics is held by the Admin role alone, not even Developer, and these reads back the browser workstation's Data screen, so a ViewDiagnostics-only gate would have locked every other role out of a first-class UI surface. None of this data is account-scoped, position or personal, so a restriction that severe would be disproportionate; the set chosen still refuses a caller holding no data-viewing permission at all, which is the actual gap. Two anchor hazards recurred and were handled rather than worked around: fourteen of the quality reads are written as compact two-line lambdas with no WithName line and no closing brace on its own line, so anchors were resolved by matching parentheses from the map call rather than by pattern, and every placement was checked afterwards. Sixteen tests failed; StorageEndpointTests took a permitted client, and QualityDropsEndpointTests -- which inherits a permissionless client from EndpointIntegrationTestBase -- was given its own rather than widening the shared base client for every suite that derives from it. Workstation reconciliation, operations and security-master reads 2026-08-19 - forty-three reads classified, taking the read baseline 391 to 348. Fourteen were already enforced and needed only a declaration: ten operations-continuity reads behind HasOperationsContinuityReadPermission, two reconciliation reads behind the mutation set, and two workstation security-master reads behind the view-or-modify set. The other twenty-nine had no guard, and they are the reconciliation casework surface - break queue and individual breaks with their audit trails and comments, cases, statement breaks, exceptions, runs and validations, margin control, mapping profiles and connectors - plus five workstation security-master securities reads. Each unguarded read took the set its own sub-surface already enforces rather than a fresh judgement: reconciliation reads take the continuity read set (ViewDirectLending, ViewSecurityMaster, ManageDirectLending, ModifySecurityMaster, AdminMaintenance), which is what the ten guarded operations reads in the same file require, and the security-master reads take ViewSecurityMaster or ModifySecurityMaster, which is what the two guarded ones beside them require. Using the read set rather than the mutation set matters: a reader should not need a Manage permission to see a break queue, and the read set admits the finance and operations roles - Accounting, FundAccountant, Controller, Compliance, ReportingAnalyst, Executive - that actually work this surface. The retired duplicate reconciliation mapper caused thirteen routes to resolve to two mapping sites each and was excluded again, as in the operations tranche. No test needed a permitted client, because the workstation harness already defaults to ModifySecurityMaster, which satisfies both sets. Both standing findings closed 2026-08-18, on operator decision, and the declarative mutation baseline is now zero - every mapped mutation route declares its authorization. The Plaid webhook now verifies the ES256 Plaid-Verification header against a key supplied in configuration (PlaidOptions gains WebhookVerificationKeyPem and an optional WebhookVerificationKeyId), rather than resolving the key by kid from Plaid's rotation endpoint, so an inbound callback does not depend on an outbound call to the same provider. Verification is two independent checks and both must hold: the token must be signed by the configured key, and the bytes actually received must hash to the value the signed token claims - checking only the hash would authenticate nothing, because the caller supplies both. The route reads the raw request bytes rather than a bound JsonElement, since re-serializing a parsed document would verify a different byte sequence than the one signed; it refuses an unverifiable callback with a uniform detail-free 401 so a forger learns nothing about which check failed; it refuses a signed but stale token as a replay; it rejects the alg-none downgrade before any hash comparison; and it fails closed when no key is configured. Eight unit tests break exactly one check each. The route is allowlisted rather than permission-declared, for the same reason as the reporting receipt hook: a provider callback carries no session and so can hold no permission. The ledger period close was converted from a role gate to a permission gate rather than allowlisted. Its four sibling close-management mutations - period lock, period reopen, task sign-offs and late adjustments - all gate on HasLedgerMutationPermission, and reopening a locked period is at least as sensitive as closing one, so the role check was an anomaly rather than a deliberate tightening; the file already defined an unused HasLedgerClosePermission with exactly that meaning. The route now requires AdminMaintenance or ManageDirectLending. This widens access from two built-in roles to four: Admin and Accounting could close a period before, and FundAccountant and Controller can now - both of which already held period lock and period reopen. It also fixes a role-profile blind spot, since a custom profile holding every accounting permission was refused purely because its role was not literally named Accounting. Reference-data and fund-structure reads 2026-08-19 - fifty reads guarded, taking the read baseline 348 to 298, and unlike every prior read tranche none of these had any guard at all. Twenty-six reference-data reads (equity, option, option-chain, commodity, swap, FX spot, money-market fund, certificate-of-deposit, and the three EDGAR filer, facts and security-data reads) now require ViewSecurityMaster or ModifySecurityMaster, the same set the bond, deposit, future and crypto reference groups already carry, so the instrument reference surface is finally uniform rather than guarded file by file. The twenty-four fund-structure reads split by what they expose. Sixteen reporting and report-pack reads - templates, schedules, starter kits, canonical runs, run audit trails, report-writer grids, the run event stream, pack snapshots, ledger provenance and the three retired delivery routes - take ViewReporting, ManageReporting, ApproveReporting, DeliverReporting or AdminMaintenance, matching the one read already carrying exactly that set in the same file. The remaining eight structure reads - organization graph, legacy graph, advisory view, fund-operating view, accounting view, ledger-mapping workbench, cash-flow view and workspace view - take ManageFundStructure, ManageDirectLending or AdminMaintenance, mirroring the fifteen structure mutations in the same file that already require ManageFundStructure. Seven tests were given a permitted client rather than having their expectation relaxed, following the two cash-flow tests in that suite which already used one. This closes a permission gap, not the tenancy gap recorded above - /api/fund-structure/graph still serves the global snapshot PostgresFundStructureService loads with no tenant predicate, so a permitted tenant-A administrator can still read tenant-B structure. That remains change 9 work and is not discharged by declaring these reads. Provider connectivity reads 2026-08-19 - thirty-one reads classified, taking the read baseline 298 to 267, and this is the first tranche to use all three outcomes the criterion allows. Twelve were already enforced inline and needed only a declaration - both brokerage connection status reads behind ViewTrades, the Robinhood OAuth return behind ManageCredentials, both credential-status reads, provider connections and all three provider-routing reads behind ManageCredentials, and the two provider-module reads plus the capability matrix behind ManageProviders. The Robinhood return is worth recording because it looks like the Plaid webhook and is not - it is a GET the provider redirects a browser to, but it already required ManageCredentials, so it is an operator-initiated return inside an authenticated session and needed a declaration rather than an allowlist. Seventeen had no guard at all and now require ViewConfig, ViewDiagnostics, ManageProviders or AdminMaintenance - provider catalog, catalog by id, comparison, status, metrics, metrics by id, provider by name, failover, failover thresholds, rate limits, rate-limit history, capabilities, health, dashboard, latency and the IB deployment status. One set rather than a configuration/telemetry split, deliberately - every candidate permission here is held only by Admin and Developer, so the choice changes nothing about who can reach the surface, and the code draws no such boundary itself since ProviderExtendedEndpoints maps failover configuration and health telemetry into the same group. Naming four permissions lets a custom role profile holding any one of them operate the provider workspace. The browser agrees with the placement - getProviderConnections and getProviderReadiness are registered on the settings and data workspaces only, so no trade-desk role loses a view it uses. Provider readiness takes a wider set that also names ManageCredentials, because the route is the readiness command center across credentials, health, degradation and evidence and its own test composes credential and Plaid evidence - an operator who owns half