  - id: W9-INGEST-009
    title: Institutional file ingestion (camt.053/BAI2) and sided reconciliation matcher
    wave: W9
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
    workspace:
      - Accounting
      - Data
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 9 of the 2026-07 first-order improvement slate. Source-verification snapshot 2026-08-10 - the core surface already exists: Camt053StatementConnector and Bai2StatementConnector normalize through the W5X-CONNECT-001 connector seam alongside the statement-import command path, and the reconciliation lane carries a dedicated match kernel with sided statement-versus-ledger populations (ReconciliationMatchKernel, StatementRunMatcher, StatementRunMatchingService, ReconciliationMatchingEngine). Corrected 2026-08-11 after source verification retracted the evidence-only premise above - the standalone kernels do exist, but the LIVE path does not use them, so this row is implementation work and not verification alone. The retained internal population provider returns an empty ledger-transaction population by design (its own remarks say it awaits an authorized period-scoped ledger source and an agreed journal-to-transaction projection), and StatementRunMatcher invokes the one-to-one StatementMatchingEngine rather than anything split-capable. camt.053 and BAI2 are transaction statements, so with an empty transaction population every bank TRANSACTION row fails closed to a break - balance records are matched today, since both connectors emit StatementRecordKind.CashBalance, the retained provider loads internal cash balances, and MatchCash pairs them, and one-to-many outcomes can never reach live casework however the standalone kernels behave - tests written against those kernels would pass while the shipping path matched nothing. In scope before acceptance, therefore - source the ledger-transaction population by propagating the authority-verified StatementAccountingScope (FundProfileId, LedgerBookId, AccountingPeriodId, AsOfDate) already carried on the run request into InternalReconciliationPopulationContext, which currently drops it, rather than inventing a parallel unscoped lookup; decide the disposition of the direct POST /api/workstation/reconciliation/statement-runs caller, whose create contract carries no accounting scope at all and so cannot supply one once ledger reads require it; give the live path deterministic split matching by extending StatementMatchingEngine with the ReconciliationMatchKernel split primitives or adapting them behind it, since ReconciliationMatchingEngine handles only positions and cash and has no transaction model to swap to; carry group membership through the result path as well, because StatementMatchResult holds one broker and one internal evidence reference, StatementRunMatcher discards each result after incrementing MatchCount, and StatementRunMatchArtifact persists only that count - so two different split assignments of the same size produce an identical durable artifact and the row's own determinism and idempotency evidence is unobtainable no matter how correct the matching is; and implement bounded schema-aware parsing for both connectors, which currently decode the whole payload before parsing and enforce no record limit. Evidence still outstanding on top of that implementation work - golden-file regression coverage for both formats was not found in the FinancialOperations test tree, and the deterministic one-to-one/one-to-many/unmatched-break semantics with stable tie-breakers and idempotent re-runs need focused evidence against the live path rather than the standalone kernels. docs/product/w9-close-out-delivery-plan-2026-08.md carries the full source audit behind this correction.
    exit_criteria:
      - camt.053 and BAI2 statement connectors normalize through the W5X-CONNECT-001 connector seam with retained raw and canonical evidence and golden-file regression coverage.
      - Bounded schema-aware parsing enforces the PRD-010 ingress limits for both formats.
      - The reconciliation matcher distinguishes statement-side and ledger-side populations with deterministic one-to-one, one-to-many, and unmatched-break outcomes, stable tie-breakers, and idempotent re-runs.
      - Sided match results feed the existing reconciliation casework queue without synthetic completeness.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-DESIGN-DATA-INTEGRATION
      - SRC-CONTRACTS
      - SRC-UI-SHARED
    last_reviewed: 2026-08-10

  - id: W9-ASSET-010
    title: Asset Accounting Event Spine and atomic lot posting
    wave: W9
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
      - GovernedReportPack
    workspace:
      - Accounting
      - Portfolio
      - Reporting
    owner_lane: Accounting and Ledger
    status: done
    health: green
    priority: critical
    evidence_posture: complete
    current_summary: Completed 2026-07-28. One evidence-backed Asset Accounting Event Spine covers acquisition, capitalization, valuation, income, corporate action, impairment, depreciation/amortization, and disposal, resolving Security Master identity, versioned book position, ledger book, period, accounting basis, promoted rule pack, projection lineage, and complete typed retained evidence before candidate drafting. Expected, Projected, Drafted, Approved, Posted, Reconciled, and Reported remain distinct lifecycle states; only a retained immutable journal establishes Posted impact. Acquisition lot creation and versioned selected-lot disposal share one idempotent serializable journal-plus-lot transaction, and readiness and UI projections fail closed when retained evidence identity, hash, source, review, effective-date, version, or scope is incomplete. Focused contract, spine, storage, endpoint, shared-read-model, and readiness suites are green ahead of the authoritative GitHub Actions quality gate.
    exit_criteria:
      - All eight canonical asset accounting event kinds resolve Security Master identity, authoritative book position and version, ledger book, period and version, accounting basis, promoted rule pack, projection lineage, and complete retained evidence before candidate drafting.
      - Lifecycle contracts and shared read models never collapse Expected or Projected into a candidate, Approved into Posted, or Reported into Published; journal impact is absent unless an immutable journal id, ledger book, period, balanced amounts, currency, and Posted status are retained.
      - Acquisition creates its lot with the journal, and disposal consumes explicitly selected lot ids and expected versions with retained selection evidence, relief policy, before/after snapshots, correction lineage, and replay-safe fingerprints in one database transaction.
      - Production-readiness flags, service or endpoint availability, navigation links, legacy full tokens, and synthesized obligations cannot substitute for complete typed retained evidence.
      - Focused contract, spine, storage, endpoint, shared-read-model, and readiness tests pass before the full repository CI and GitHub Actions authority gates.
