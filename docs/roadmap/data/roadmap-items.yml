minMaintenance, since entity, ownership-graph and balance-sheet data is fund-structure shaped. A bypass was found and closed while choosing those sets. The per-run reconciliation and reconciliation-history reads look like run drill-ins and are not - they return the same ReconciliationRunDetail as GetReconciliationRun, which sits fifteen lines above them and already required AdminMaintenance, ManageDirectLending or ModifySecurityMaster. Declaring them with the strategy set would have let a caller refused at the reconciliation route fetch the identical payload by strategy-run id instead, so both now carry the reconciliation set; the RequireStrategyRunReadAccessAsync filter they already had continues to scope them by run on top of that. Twenty-five tests failed and each was given the permission its route requires, following the suite's own convention of passing currentUserPermissions per test rather than widening the shared host default, which several Forbidden-asserting tests depend on staying narrow. The foreign-scope drill-in sweep now holds both permission families deliberately, so a 403 can never stand in for the 404 that test asserts - it proves scope isolation, not authorization, and it is the evidence that splitting the reconciliation reads out did not weaken tenancy. Strategy, trading and assurance reads 2026-08-19 - fifteen reads classified, taking the read baseline 247 to 232. Four were already enforced inline and needed only a declaration - collateral exposure behind the operations-continuity read set, both ingestion-operation reads behind ViewHistoricalData or TriggerBackfill, and the storage-assurance read behind ViewDiagnostics or ManageStorage. The other eleven were unguarded. The nine strategy reads take ViewStrategies or ManageStrategies, which three routes in WorkstationEndpoints.Strategy.cs already required, and the two trading reads take ViewTrades, matching the workstation portfolio reads guarded in the previous change. A duplicate-payload pair was the reason for pinning research and strategy to one set - /api/workstation/research and /api/workstation/strategy both call BuildStrategyPayloadAsync and return the identical WorkstationStrategyPayload, and /api/workstation/research/briefing and /api/workstation/strategy/briefing both call BuildStrategyBriefingAsync, differing only in DTO projection, so gating the pair differently would have reproduced the reconciliation bypass closed in the previous change. Twenty-four tests were given the permission their routes require, chosen by reading which routes each test actually calls rather than inferring from the test name - eight of them turned out to span two workspaces, and two already carried a permission set that was extended rather than replaced. Deferred deliberately to a following change - the workstation shell reads (session, stream, first-run, workflow library, workflow summary, workflow presets, feature capabilities, operator inbox) and the data, accounting, governance and record-explorer reads. Three of those carry decisions that should not ride along inside a mechanical tranche. The workflow library returns WorkflowRegistry.CreateDefault() and is the strongest DeclareOpenRead candidate on the surface; the workflow preset store is the shared global store already recorded as a finding on this row, so declaring it per-session would state an ownership that does not exist; and the workflow summary carries a comment that its fund-profile ownership gate always evaluates precisely because the route has no read permission to defer to, so adding one changes which filter answers an unauthorized caller. Workstation shell reads and three declaration corrections 2026-08-19 - six shell reads classified, taking the read baseline 232 to 226, and three declarations from earlier tranches corrected because they did not match the handler they claimed to describe. The corrections came out of a mechanical sweep that parses every guard helper in the endpoint files, finds each mapped route whose handler calls one, and compares that helper's permission set against the route's declared set. Three disagreed. /api/portfolio/household is mapped on the application rather than inside the fund-accounts group, so it has no group filter, and the declaration added for it required AdminMaintenance or ManageDirectLending while its handler requires ViewTrades - a caller holding only ViewTrades, whom the handler admits, was refused by the declaration filter, and the browser registers that route on the portfolio workspace, so the brokerage household panel was broken for a trade-desk operator. The fund-accounts brokerage-sync discovery route had the same declaration, though there the group filter already enforced fund-account access so nothing narrowed; the declaration merely understated the handler's additional ViewTrades requirement. Both now declare ViewTrades, which is the gate the route itself adds. The reconciliation break-queue list route declared the operations-continuity read set while its handler gates on CanViewReconciliationBreakQueue, which accepts ViewTrades and does not accept ViewDirectLending or ManageDirectLending - so the declaration both refused trade-desk callers the handler admits and promised access to direct-lending callers the handler refuses. The list and item routes now declare the handler's set. No built-in role loses access, because every role holding ViewDirectLending or ManageDirectLending also holds ViewTrades, ViewSecurityMaster or AdminMaintenance; only a custom profile holding direct-lending permissions alone would. Of the six shell reads, the session route was the surprise - despite its name it returns no per-caller state at all but strategy-run digests from StrategyRunReadService, including run names, modes, promotion states and counts, so it takes ViewStrategies or ManageStrategies rather than the authenticated-session declaration its name invites. The stream route emits live quote snapshots and takes ViewMarketData. First-run state is genuinely per-caller, keyed by the current user, and takes RequireAuthenticatedSession, matching the two sibling mutations already declared that way. Feature capabilities takes the same set as its own toggle mutation. The workflow library is the first DeclareOpenRead on a read that is open by decision rather than by omission - it returns WorkflowRegistry.CreateDefault(), a static catalog with no deployment, account or tenant state, so a permission would be false precision; the session requirement LoginSessionMiddleware imposes on every /api path still applies. Workflow presets takes RequireAuthenticatedSession, matching its three sibling mutations, and the declaration is truthful about the gate while the shared-global-preset-store finding recorded above remains open and unchanged by this change. Still deferred, and now with the reason sharpened - the operator inbox aggregates trading readiness, run review packets and reconciliation break items, and the break items carry strategy name, break reason, status and assignee, so any single permission on the inbox route would show one family's data to a caller gated out of it; the fix is to filter each contribution by the permission its own route requires, which is a behaviour change rather than a declaration. The workflow summary is deferred for the coupling already noted, now confirmed by reading the filter - RequireFundProfileTenantScope skips its ownership check for callers lacking the permissions passed to it, and the route passes none precisely so the check always runs, so adding a permission changes which filter answers an unauthorized caller. Session declaration corrected on review 2026-08-19 - gating the whole session route on the strategy set would have returned 403 to FundAccountant, Controller and Compliance, none of which hold ViewStrategies or ManageStrategies, and the browser registers getSession as a bootstrap request whose success gates hasPublishedBootstrapRef, so all three roles would have