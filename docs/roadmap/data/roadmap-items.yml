  - id: W9-ALPACA-004
    title: Alpaca fill streaming into order and ledger state
    wave: W9
    stage_gates:
      - LiveReadiness
    workspace:
      - Trading
    owner_lane: Execution and Fund Accounts
    status: ready_for_acceptance
    health: green
    priority: high
    evidence_posture: implementation_complete
    current_summary: Implementation verified complete 2026-08-10; the 2026-07-21 premise that the order feedback loop was broken no longer matches source. The authenticated trade_updates stream (AlpacaTradeUpdatesClient) normalizes every broker event into an ExecutionReport and admits it to a durable content-hashed inbox that deduplicates broker event ids, survives restart, and replays unacknowledged envelopes; AlpacaBrokerageGateway exposes that stream as the execution-gateway report stream, blocks live submission while the stream is unhealthy, and after every authenticated reconnect reconciles the REST order snapshot plus exact FILL activities from the acknowledged watermark so fills missed during a disconnect backfill without polling. The OrderManagementSystem consumes the gateway stream from construction, applies partial fills, cancels, and rejects to tracked order state with monotonic cumulative-fill handling and terminal-state latching, converts cumulative broker quantities into deduplicated increments, and routes each genuine increment through the existing durable trade-fill posting and ledger handoff path with retained-failure replay; host composition wires the trade-updates client into the gateway and the trade-fill ledger posting scope. The 2026-08-10 acceptance candidate closes the exit-criterion evidence gap by adding out-of-order delivery tests at the stream client (admission without loss, backfill watermark never regresses, duplicate and out-of-order REST fill replay admits each exact fill once) and at the OMS (a stale lower cumulative publishes no increment and never regresses portfolio or accounting), plus an end-to-end loop suite driving raw Alpaca trade_updates JSON through the client into a real OMS asserting lifecycle transitions and exactly-once accounting handoff under duplicate, out-of-order, cancel, reject, and reconnect REST-replay delivery. Acceptance caveats recorded 2026-08-10 from automated review, all pre-existing rather than introduced by this candidate - the hosted submission health gate treats trade-update recency as stream liveness, so an idle or order-free live account blocks new submissions once the 30-second stale window lapses (submission-side only); reconnect FILL-activity backfill starts exactly at the acknowledged watermark with no overlap window, so a fill the stream skipped beneath an already-acknowledged newer event is recovered only through the order-snapshot lane, which restores quantity at snapshot average-price attribution rather than exact per-fill economics; and a durably admitted fill replayed into a freshly restarted host is acknowledged without reaching the accounting handoff when the restarted OMS no longer tracks its order, leaving recovery to the brokerage activity-sync lane. These are acceptance-review inputs and follow-up candidates, not exit-criterion regressions.
    exit_criteria:
      - Alpaca trade-update and fill events stream into the execution gateway and drive order lifecycle state, including partial fills, cancels, and rejects, without polling.
      - Streamed fills flow into the existing durable trade-fill posting and ledger handoff path.
      - Reconnect recovery backfills fills missed during a disconnect, with tests covering duplicate and out-of-order delivery.
