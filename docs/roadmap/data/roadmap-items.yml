egy permission could read back, one field over, the promotion state every other field was withholding; the redacted path now returns the same neutral landing workspace a deployment with no run service returns, which discloses nothing about whether runs exist. The API reference also claimed an unscoped key can read strategy runs, which ViewStrategies nominally allows but no key can reach: every strategy-run read sits under the tenant-scoped workstation surface, and a key carries no tenant - the promotion clearing added earlier makes that explicit by removing any it inherited. The reference now names both families a key cannot reach whatever role it carries, per-session state and the tenant-scoped workstation surface, rather than listing a permission whose routes are unreachable. Four more review findings 2026-08-19. The read-only key restriction was keyed on whether MDC_API_KEY_ROLE was set rather than on the role it resolved to, so writing ReadOnly out explicitly quietly weakened it below the unset default; it now keys on the resolved role, since an operator who names the weakest role is asking for the same restriction as one who leaves it alone. Brokerage account discovery had been hoisted out of the fund-account group to admit trade-view callers, which exposed provider configuration: IBrokerageAccountCatalog is keyed by provider and carries no tenant, DiscoverAccountsAsync enumerates every catalog, and no workspace fetches the route at all, so the widening bought no operator flow and would have handed one tenant's operator every other tenant's broker account ids, names, statuses and currencies. It is back inside the group and additionally carries the tenant-and-company scope gate, which is what keeps a scopeless principal such as an Admin-roled API key out. Two principal-boundary leaks followed from giving the anonymous caller a tenant. A validated key promoted after the login middleware kept the anonymous tenant, company and marker, so an otherwise unscoped key passed the workstation scope gates on borrowed authority; the promotion now clears them, because authority must come from one posture. And the scoped-authorization guard that keeps a key out of the user assignment namespace covered only keys, so the anonymous local-operator actor could still inherit the account and fund scopes of a real user carrying that name; the guard now covers both synthetic principals, preserving the same explicit global overrides for each. Recorded and not fixed here: household scope authorization is resolved once per projection rather than in a batch, which costs two sequential storage round trips per fund account on a large book, and optional mode is only safe because it implies no accounts - a hand-configured optional deployment on a routable interface is exposed well before any single route's declaration matters, which is a deployment guard rather than a route one. Optional-mode callers can now be scoped outside the demo, and the session payload reports the caller's own authority 2026-08-19. A session takes its tenant from the account's company and an anonymous caller has no account, so naming a role left the entire tenant-scoped workstation refused; the marked demo host already supplied the seeded blueprint tenant, and any other optional-auth deployment - which is also the plain local-development posture - now names its own through MDC_ANONYMOUS_TENANT. With neither, the caller keeps a role but no scope and the workstation stays refused, so nothing reads whichever tenant happens to be on disk. The session payload's role field was derived from the latest run's mode rather than from the caller, reporting Strategy Lead or Live Operations; the browser matches that value against the role catalog to name the active authority profile, and since neither string is a role name the match failed for every operator rather than only for the ones whose run digest is withheld. It now resolves the caller's role profile name, then the role, and falls back 