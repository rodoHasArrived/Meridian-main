ons came out of a mechanical sweep that parses every guard helper in the endpoint files, finds each mapped route whose handler calls one, and compares that helper's permission set against the route's declared set. Three disagreed. /api/portfolio/household is mapped on the application rather than inside the fund-accounts group, so it has no group filter, and the declaration added for it required AdminMaintenance or ManageDirectLending while its handler requires ViewTrades - a caller holding only ViewTrades, whom the handler admits, was refused by the declaration filter, and the browser registers that route on the portfolio workspace, so the brokerage household panel was broken for a trade-desk operator. The fund-accounts brokerage-sync discovery route had the same declaration, though there the group filter already enforced fund-account access so nothing narrowed; the declaration merely understated the handler's additional ViewTrades requirement. Both now declare ViewTrades, which is the gate the route itself adds. The reconciliation break-queue list route declared the operations-continuity read set while its handler gates on CanViewReconciliationBreakQueue, which accepts ViewTrades and does not accept ViewDirectLending or ManageDirectLending - so the declaration both refused trade-desk callers the handler admits and promised access to direct-lending callers the handler refuses. The list and item routes now declare the handler's set. No built-in role loses access, because every role holding ViewDirectLending or ManageDirectLending also holds ViewTrades, ViewSecurityMaster or AdminMaintenance; only a custom profile holding direct-lending permissions alone would. Of the six shell reads, the session route was the surprise - despite its name it returns no per-caller state at all but strategy-run digests from StrategyRunReadService, including run names, modes, promotion states and counts, so it takes ViewStrategies or ManageStrategies rather than the authenticated-session 