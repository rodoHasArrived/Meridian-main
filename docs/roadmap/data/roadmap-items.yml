    current_summary: v0.15 deepens accounting, reconciliation, and record-keeping functionality by linking retained source records, normalized activity, reconciliation cases, journal and ledger evidence, approval history, document attachments, report packs, exports, and restatement lineage into audit-ready operational records.
    exit_criteria:
