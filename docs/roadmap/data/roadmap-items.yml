  - id: W5-MASSET-001
    title: Multi-asset operational coverage proof lane
    wave: W5
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
    workspace:
      - Portfolio
      - Accounting
      - Data
      - Settings
    owner_lane: Accounting and Ledger
    status: done
    health: green
    priority: high
    evidence_posture: complete
    current_summary: Completed the first shared multi-asset operations proof lane by exposing Security Master validation/profile posture, required provider evidence, ledger classification, reconciliation signals, and close-readiness blockers through `/api/workstation/portfolio/multi-asset-coverage`, with browser Portfolio/Accounting and WPF Portfolio cockpit surfaces rendering the shared read model. The next feature slice is the still-partial multi-asset reference-data workbench completion inside the existing Security Master detail/passport flow, not a new route.
    exit_criteria:
      - Equities, options, futures, FX, fixed income, loans, structured/private `CustomAsset`, and `OtherSecurity` rows declare identifiers, economics, provider evidence, ledger classification, reconciliation signals, and close blockers.
      - Missing retained provider data remains review-required or blocked evidence rather than fake completeness.
      - Browser and WPF surfaces consume the shared DTO without client-local readiness rules.
      - Follow-on multi-asset reference-data workbench work extends the existing Security Master detail/passport flow with provider evidence, identifier confidence, terms and obligations, projected cash-flow readiness, ledger classification, and operations handoff without introducing a new route.
    source_modules:
      - SRC-APP
      - SRC-CONTRACTS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
    evidence:
