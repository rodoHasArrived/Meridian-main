  - id: W9-SAFETY-007
    title: Kill-switch cancel-all and fat-finger, notional, and collar rules
    wave: W9
    stage_gates:
      - LiveReadiness
    workspace:
      - Trading
      - Settings
    owner_lane: Execution and Fund Accounts
    status: in_progress
    health: green
    priority: high
    evidence_posture: in_progress
    current_summary: Source-verified 2026-08-10 and substantially further along than the 2026-07-21 premise, with the remaining gaps now named precisely. Already implemented - the durable execution circuit breaker (versioned atomic snapshot, pending-trip file, operator endpoint) blocks order submission through the operator-controls gate the OMS consults, manual overrides are supported kinds with durable state, breaker activation and override events append to the execution audit trail, the OMS exposes a concurrent CancelAllAsync sweep behind the governed cancel-all endpoint, and the mandatory CompositeRiskValidator enforces drawdown-guardrail, order-rate, position-limit, gross-exposure, symbol-concentration, and max-order-notional rules (with escalation banding and fail-closed handling of unmeasurable orders) fed live from RiskRuleRuntimeService. The 2026-08-10 change closed the criterion-one COUPLING gap - opening the breaker now issues the kill-switch cancel-all sweep after the durable breaker flip, with sweep outcomes audited separately from the activation, proven at the endpoint seam. Criterion one itself is NOT discharged by that, and the 2026-08-11 review corrected the record: OrderManagementSystem.CancelAllAsync awaits CancelOrderCoreAsync per order but discards each OrderResult, so a broker that rejects an individual cancellation leaves that order working while the sweep completes normally and ExecutionEndpoints audits CircuitBreakerCancelAll as Completed - the Failed branch fires only on a thrown exception, and the existing endpoint test asserts only that CancelAllAsync was invoked, never that the open book emptied. Criterion one requires cancellation to succeed. The 2026-08-15 change closes the reporting half: CancelAllAsync now returns a KillSwitchSweepResult carrying per-order outcomes, so a broker that refuses one cancellation yields Partial (or Failed when nothing cancelled) naming the orders still working, and both the direct cancel-all endpoint and the breaker-coupled sweep audit that outcome instead of recording Completed for any call that returned. A cancellation that throws is caught per order and reported as still working rather than abandoning the remaining orders mid-sweep, and an order manager that reports nothing at all is treated as Failed rather than dereferenced. The same change closes the refill half: an active BypassOrderControls override no longer admits arbitrary orders while the breaker is open. It is narrowed to a close-only exception - an order opposing an existing position and no larger than it - because the override exists so a desk can flatten a halted book, and revoking it outright would trap the desk in the very positions the halt was raised over. An order larger than the position is refused rather than partly admitted, since selling 150 against a 100 long opens a 50 short; a flat symbol admits nothing; and an absent portfolio state refuses, because under an open breaker being unable to establish that an order reduces risk is not a reason to route it. PlaceOrderAsync_WithBypassOverride_AllowsOrderWhileCircuitBreakerIsOpen is rewritten to the chosen semantics rather than deleted. Successive review rounds then corrected the sweep's population and lifetime, and the close-only predicate's notion of the position backing an order. The sweep no longer takes the caller's cancellation token: threading an HTTP token through Parallel.ForEachAsync meant a disconnecting caller stopped scheduling the remaining orders and threw out of the loop, leaving the durable breaker open over a book nobody finished cancelling - a kill switch is owed to the desk, not to the request that asked for it, the same reasoning the risk validator applies to a confirmed trip. It sweeps PendingCancel orders too, because GetOpenOrders() omits them and an order whose earlier cancellation is unconfirmed can still fill. Governed escalations that cannot be withdrawn now enter StillWorking rather than only a log line, because a parked order is absent from the book and would otherwise let the sweep report an empty one while the escalation stayed releasable. The full structured failure list travels on the endpoint response and the breaker-activation response alongside the control snapshot, so a caller pulling the kill switch no longer receives an identical 200 whether the book emptied or not, and an operator told to cancel by hand gets every id rather than the first ten the rendered message names. Close-only admission now measures the position that actually backs the order: the requesting fund's attributed quantity through IPosition.OwnerQuantities rather than the netted aggregate a shared book presents - which let one fund sell against another's long and acquire a short - minus reductions already committed in working orders, since two closes that each fit the position together cross through it. Explicit opening intents, multi-leg packages whose legs are what actually route, and broker-native notional orders whose Quantity is not a share count are all refused rather than approximated. The working-reduction figure comes from an OMS-supplied probe, and an unset or faulting probe refuses, matching the rest of the exception: a gate that cannot establish a reduction must not route one under an open breaker. Criterion one nonetheless STAYS OPEN on two counts the change does not touch: the sweep still snapshots this OMS instance's in-memory GetOpenOrders() and never calls the GetOpenOrdersAsync every brokerage gateway implements, so after a restart or for an order placed out of band the local book is empty and the sweep reports Completed over a broker book that is not; and a trip still races submissions already in flight, because PlaceOrderAsync consults the breaker before its reservation work and dispatches after it, so an order that passed the gate a moment before the trip can reach the broker after the sweep observed an empty book. Both are broker-facing and need restart, out-of-band-order, and concurrent trip/submission regressions. The 2026-08-11 change lands the fat-finger half of the criterion-two rule catalogue - FatFingerRule enforces an absolute per-order quantity ceiling and a directional price-deviation band in the mandatory CompositeRiskValidator, running at negative priority so a mistyped order is attributed to the typo rather than to whichever exposure ceiling its inflated size breached. The price limb is deliberately one-sided (a buy paying above the reference or a sell hitting below it) because a symmetric band would reject the entire resting book. Successive review rounds corrected several scope errors that would each have rejected ordinary desk activity, so each price is now measured against the reference that price is actually meaningful to and each order type contributes only the prices it genuinely puts at risk - a plain Limit order's limit against the current touch, a StopMarket or StopLimit trigger against the trigger reference described below - NOT the touch, because those references disagree on wide books - and a StopLimit's limit against its own trigger rather than today's market (a sell stop at 90 with an 89 limit is 1.1% from its trigger though 11% from a 100 market, and an earlier revision rejected it). The 2026-08-14 correction closes the auction-limit gap: LimitOnOpen and LimitOnClose now contribute their broker-enforced limit price to the shipped rule. Because the runtime has no indicative-auction or prior-close reference seam, the rule refuses those orders as FAT_FINGER_UNMEASURABLE while the deviation band is configured instead of comparing an auction price with the continuous BBO or routing it unchecked. AlpacaBrokerageGateway.MapOrderType maps both types to a plain broker-enforced limit, MapTimeInForce carries the auction timing separately as opg/cls, BuildOrderPayload writes limit_price unconditionally, and BrokerageGatewayAdapter requires a positive limit price for both. A future auction-reference seam can replace the fail-closed posture when supported. Market orders contribute none because the paper gateway passes a simulated observation through LimitPrice, TrailingStop contributes none because its trigger is derived by the broker and moves with the market, and multi-leg packages contribute none because a net debit or credit is not comparable to a quote for the top-level symbol. The 2026-08-11 revision also closes a live safety hole the earlier blanket stop exclusion left open - a stop trigger's wrong side is the exact mirror of a limit's, because PaperOrderMatchingPolicy fires a buy stop once the market reaches or passes above it and a sell stop once it reaches or falls below it, so a buy stop typed beneath the market is already crossed on arrival and a stop-market order that triggers on acceptance routes as an unbounded market order. Trigger deviation is therefore measured on the wrong side only, under the same operator-configured band and a distinct FAT_FINGER_STOP_TRIGGER_WRONG_SIDE code, so a protective stop placed correctly never breaches however far away it sits. The trigger is measured through a new IPortfolioExposureProvider.TryGetTriggerReferencePrice seam that reads THE MATCHER'S OWN OBSERVATION rather than rebuilding one - the production provider captures PaperMarketObservation from the live feed and resolves through PaperMarketObservation.ResolveStopTriggerPrice, now the single definition of the LastTradePrice ?? BarClose ?? crossing-side precedence that PaperOrderMatchingPolicy itself calls. Sharing one method rather than maintaining two matching implementations is deliberate, because each reconstruction attempt diverged somewhere: consulting the quote first falsely rejects a resting stop when the print trails the quote and falsely approves an already-triggered one when it leads; omitting the bar-close leg reproduces the false approval on a bar-driven session with no print; and applying the provider's own staleness filter drops a six-minute-old print the matcher will still fire from. The age filter that protects every valuation accessor is deliberately absent on this one, because the question is not what the order is worth but whether the engine will fire it, and where guard and engine disagree the engine is the authority - but only while the paper matcher IS the engine, so the unfiltered observation is used solely in a paper composition. Against a live broker nobody in-process decides the fill and the feed cache retains prints indefinitely, so the same precedence runs over current observations instead; a stale 50 print must lose to a fresh 100 ask or a buy stop at 60 reads as resting while the broker sees it already crossed. The posture defaults to live, because that is the side on which guessing wrong routes an unbounded order. Both thresholds are read as one value per evaluation so an order cannot straddle a two-field configuration update and observe a threshold pair that never existed, which the rule would treat as entirely unconfigured. The quantity limb likewise skips broker-notional orders, whose Quantity carries dollars rather than a unit count. It also measures against a new IPortfolioExposureProvider.TryGetTouchPrice seam rather than TryGetExecutablePrice - the latter deliberately returns the larger of mark and touch so sizing never under-measures a short, which puts a sell reference at the midpoint and would have rejected an ordinary marketable sell at the bid. A definite quantity breach is reported as such even when the quote is missing, so pricing gaps never mask a mistake that is not in doubt. Both the F# band and the reported evidence saturate rather than overflow, so an extreme price against a tiny reference yields the structured breach it plainly is instead of a generic evaluation failure. A priced order whose symbol has no reference price is refused as unmeasurable rather than approved, matching OrderNotionalRule, so a pricing gap cannot trip the breaker. Thresholds persist through the RiskRuleRuntimeService snapshot, are surfaced on the rules dashboard and config endpoints, and are carried on the browser RiskRuleConfig contract so the co-equal lane can read and set them. The 2026-08-14 correction also closes the fixed-income face-value sizing gap. The active gateway now resolves face-value percentage-of-par sizing through an explicit capability, so generic asset-class labels cannot import another broker's quantity semantics; the OMS carries that server-owned fact through initial risk, amendments, and working-order reserves. Alpaca Treasury and corporate face-value orders skip the share/contract quantity ceiling, while OrderNotionalRule and the working reserve measure their economic size as absolute quantity times price divided by 100 and ignore broker-notional metadata that the gateway does not route. The risk-status read routes are also not account-scoped - RiskEndpoints checks the global ViewTrades bit with EndpointAuthorization.HasPermission and never calls HasScopedPermissionAsync, so an operator whose ViewTrades is limited to particular accounts still sees every rule's RecentViolations, and those messages carry symbols, quantities, and entered prices for every account. This predates the fat-finger rule - the position-limit, concentration, and notional messages already carried the same detail - and the fix is endpoint-level scoping or per-entry redaction rather than a property of any one rule, so it is recorded here rather than folded into the rule change. Attached bracket, OCO, and OTO legs are also unmeasured - the rule reads the top-level LimitPrice and StopPrice only, while AlpacaBrokerageGateway routes operator-entered take_profit.limit_price, stop_loss.stop_price, and stop_loss.limit_price from metadata, so a market bracket order bypasses the price limbs entirely and a sound parent can carry a severely mistyped exit that activates the moment it fills; the fix reads the same metadata aliases the gateway reads and is deferred because it is a broker-specific seam on order classes this row's limbs were not scoped to. The 2026-08-14 correction also closes the amendment bypass: OrderManagementSystem now sends every explicitly supplied NewLimitPrice or NewStopPrice through the same composite validator and reservation path before gateway mutation, regardless of numeric direction, while null still means omitted and quantity-only reductions remain ungated. Focused regressions cover the dangerous sell-limit and buy-stop reductions plus an explicitly unchanged price, so stale equality cannot bypass revalidation. BLOCKING - percentage-of-par scaling reaches pre-trade measurement but NOT fill economics, so this row must not advance while both are true at once. The 2026-08-14 face-value work scales a fixed-income order's price by 100 in OrderNotionalResolver, the amendment resolver, and the portfolio exposure provider, so 100,000 face at 101.25 is admitted and measured as $101,250. Nothing carries that classification past acceptance: TradeExecutedEvent.GrossValue is FilledQuantity * FillPrice with no scaling, LedgerPostingConsumer posts that value directly to the securities and cash accounts, and PaperTradingPortfolio.ApplyFill takes a contract multiplier but no face-value flag. The same fill therefore books $10,125,000 - a hundred times the economic value - into cash, positions, exposure, and the ledger, on an order pre-trade validation explicitly endorsed at the correct size. This asymmetry is worse than scaling neither side, because the discrepancy now carries a passed risk check in front of it. Closing it means carrying the sizing classification through the execution report into fill processing and applying the same conversion to portfolio and accounting economics, with round-trip proof that a face-value fill books the same number pre-trade measured. Until then the face-value sizing path should be treated as unshippable rather than merely incomplete. Also remaining - both fat-finger thresholds default to null, meaning the shipped rule approves every order until an operator configures it, and NEITHER threshold can be set from the browser workstation: risk-control-panel.view-model.ts binds a single hard-coded DRAWDOWN_RULE_NAME and renders only the drawdown editor, so the panel surfaces the fat-finger status row without any control that enables it. This is a pre-existing shape rather than a regression - maxOrderNotional, the sibling threshold of the OrderNotionalRule this rule is patterned on, is equally absent from the panel and appears only in the TypeScript contract - so it is owned by the two-lane safety-control sweep below rather than by the rule change, but it bounds what the shipped rule guarantees on a fresh install and the criterion must not be discharged over it; the 2026-08-15 change lands the price-collar half of the criterion-two rule catalogue - PriceCollarRule parks an order priced further through the market than the desk transacts without sign-off, at Escalate severity and priority -9 so it runs immediately behind the fat-finger band and still ahead of the portfolio-aware ceilings. The two controls are deliberately separate rules rather than two limbs of one, because IRiskRule.Severity lets RequiresApproval make an outcome only less permissive than the declared severity, so an Error rule cannot produce a releasable escalation. They share what they measure through a new OrderPriceLimbs seam - which order shapes carry a measurable price, which reference each price is meaningful against, and which direction counts as aggressive are properties of the order rather than of the band - so the collar cannot protect a shape the fat-finger band refuses, and the deviation itself is the same F# policy call under a different threshold. A collar breach is a decision rather than a mistake, so it is parked for approval; an order that is both mistyped and beyond the collar is refused as the typo because the harder rule runs first. The collar is configurable end to end - backing field, live accessor read under the same lock as the fat-finger band, config DTO, update path, snapshot persistence and restore, its own dashboard status row, and the browser RiskRuleConfig contract - and is registered in the composed CompositeRiskValidator, proven at the DI seam rather than asserted. A collar of 100 or more is refused on update and on snapshot load for the same reason the fat-finger band is: a sell's aggressive deviation is strictly under 100%, so such a band can never park a sell while the dashboard still reports it configured. A collar set at or above the fat-finger band is logged rather than refused, because either configuration order can strand it and a rule that could only catch half the paths would read as a guarantee it does not provide. The change also closes a latent gap in CompositeRiskValidator that the collar was the first rule to reach: the escalation path deliberately excludes unmeasurable results, and the severity switch below it treated every Escalate outcome as one another rule would own, so an escalate-capable rule that could not measure an order returned it blocked - the violation is blocking, and RiskValidationResult.IsApproved computes false as a safety net - but with no reject reason and the unmeasurable flag cleared. Like the fat-finger bands the collar defaults to null, meaning it approves every order until an operator configures it, and it has contract parity but no browser editor, for the same reason recorded above. Still open on criterion two - the collar inherits the fat-finger band's unmeasured surfaces unchanged, because they are properties of the shared limbs: auction limits fail closed for want of an auction reference, and multi-leg packages, trailing-stop trail distances, and attached bracket, OCO, and OTO child legs contribute no measured price. The 2026-08-15 change discharges the two-lane safety-control sweep's code work and its inventory. WPF: all five Trading command-bar controls previously resolved to a pane-layout change plus confirmation copy and reached no execution service - an operator could press Cancel All during an incident and read 'Cancel-all review opened' while nothing had been asked of any broker. Stop and Cancel All now route through a new ExecutionSafetyControlClient to the same workstation API the browser calls, confirming against returned state rather than against the call succeeding, and passing the sweep's own Partial or Failed verdict through unchanged. Pause, Flatten and AcknowledgeRisk are disabled with explicit not-wired reasons because no execution service backs them: there is no pause distinct from halting, every close route takes a single position key so a command-bar Flatten has no selection to supply, and acknowledgement has no durable home - its old copy said it was 'captured locally for this workstation session', which is an enabled safety control admitting it changes nothing, the third state the criterion forbids. The layout mapper no longer carries confirmation text for any safety command. Browser inventory, which produced no code change and is recorded because the criterion covers every control in both lanes: cancel order, cancel all, close position, stop strategy, close paper session and stop replay all route through workstationApi to real endpoints, and cancel-all additionally publishes a disabled flag, disabled reason and aria label - the shape the WPF lane now mirrors. The browser's trading-control:circuit-breaker entry is an advisory focus card that reports breaker state and routes to execution controls; it is navigation rather than a control and claims no action. NO dead buttons were found in the browser lane. One PARITY GAP is recorded rather than closed: the browser cannot open the circuit breaker at all - ExecutionControlsCircuitBreaker exists in the generated route contract but no browser code calls it - so the kill switch is now reachable from WPF and not from the browser workstation. An absent control does not violate this criterion, which forbids controls that lie rather than controls that are missing, but it is a two-lane parity item the browser lane owes. Acceptance still requires a named Windows WPF build-and-test result, because the quality gate's lanes run on Ubuntu where the WPF projects compile only under explicit IsWindows and EnableFullWpfBuild flags and the WPF test assembly cannot execute at all. Deliberately deferred out of this row - the risk-engine blueprint's pre-trade decision journal (PR 2), its /api/risk/decisions read surface over the WAL (PR 3), and their WPF parity (PR 4) remain design-only. That blueprint's PR 1 already shipped the decisional-severity model the rule catalogue needed, so this row does not depend on them; the deferral is recorded here rather than only in planning documents so the follow-on work is neither silently lost nor mistaken for a W9 acceptance requirement.
    exit_criteria:
      - Kill-switch activation cancels all open orders across gateways, blocks new order submission, and persists breaker state fail-closed across restart.
      - Pre-trade risk includes fat-finger quantity and price-deviation, max-notional, and price-collar rules enforced by the single mandatory production risk validator.
      - Every WPF and browser safety control either invokes the real shared execution-control service or is disabled with an explicit not-wired state, leaving no dead safety buttons.
      - Activation, failure, and override events append to the execution audit trail.
