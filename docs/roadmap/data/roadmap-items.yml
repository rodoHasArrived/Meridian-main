    current_summary: Rank 1 of the 2026-07 W10 depth slate. The daily portfolio pricing policy defaults its stale-price handling to Disabled, so an arbitrarily old mark can price a valuation without saying so, while the one production construction site already passes an explicit blocking policy. This row makes fail-closed the default, consolidates the overlapping mark-price quality freshness control into a single owner, and surfaces mark age wherever positions appear. It discharges part of RISK-SIM-REAL-001 under the same truth doctrine as W9-TRUTH-001, which is why it is pulled ahead of the rest of the slate.
