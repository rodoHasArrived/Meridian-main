identity source to fall back on, so the split is now by sensitivity within the run data - environment, role and active workspace stay truthful for everyone because each is coarse posture, while the run digest, the run counters, the command count and the display name are withheld, the display name being the one field that carries a strategy name. The feature-capability read moved the other way. It was declared with its own toggle mutation's permission set on the assumption that a settings-shaped payload is settings-shaped data, but FeatureCapabilitySettingsService.Get takes no caller argument and nothing in the response is caller-specific - CanToggle describes the capability, not the requester - so the read is universal shell configuration and now takes RequireAuthenticatedSession while the toggle keeps the admin set. Six built-in roles would otherwise have opened Settings to a diagnostics failure view. The pattern worth carrying into the remaining baseline is that both errors were invisible to the declaration ratchets and to the handler-versus-declaration sweep, because neither route had a handler guard to compare against; what made them visible was the browser fetching them unconditionally, so a route the workstation shell always requests needs its client contract checked before a permission is chosen for it. Quote-stream bypass closed 2026-08-19 - review found that gating the workstation SSE stream on ViewMarketData restricted the transport and not the data, because the browser answers an unhealthy stream by polling /api/data/quotes-snapshot and that route builds its response from the same QuoteCollector the broadcaster reads. LiveDataEndpoints carried no declarations at all and all eight of its reads sat in the baseline as known debt, so a refused caller kept receiving live quotes and simply moved to recurring polling, which is worse for the host as well. The whole family is now gated rather than the fallback alone, since splitting it is what opened the hole - trades, quotes, quotes snapshot, order book, L3 order book, BBO and order flow take ViewMarketData to match the stream, and the feed health read takes ViewMarketData or ViewDiagnostics because it reports the feed rather than quote content. The read baseline drops by eight and the /api/data family is empty. The client was checked first this time - only session and overview are bootstrap requests and none of the data reads is registered in the workspace refresh, so no shell path breaks. A smaller review point was fixed alongside it - the session route awaited GetRunDetailAsync and then discarded the result on the redacted path, putting a store the caller may not read in front of the shell bootstrap, so the lookup is now guarded by the same permission check. The recurring lesson across this review round is that a route the workstation fetches unconditionally, or one whose data has a second door, cannot be classified from the endpoint alone. BLOCKING finding 2026-08-19, API-key clients cannot reach any declared route. ApiKeyMiddleware validates the key and records only context.Items ApiKey - it never populates the permissions or role item - so EndpointAuthorization.TryGetPermissions returns false and every RequirePermission or RequireAnyPermission filter answers 401. This is not specific to any one tranche. It applies to every route this wave has declared, roughly two hundred across the mutation lane and the read lanes, and two documented curl examples in docs/reference/api-reference.md are already dead on main as a result - the symbols add call gated on ModifyConfig and the backfill run call gated on TriggerBackfill. Nothing caught it because the only API-key test exercises /api/status, which is still undeclared, so no test in the suite pairs a key with a declared route. The criterion cannot be discharged while this stands - driving the read baseline to zero would leave the API surface fully enforced and the documented out-of-band workflow silently broken. The fix is to give a validated key an authorization context, which requires deciding what a key represents - a fixed built-in role, an operator-configured role, or per-key scopes - and the naive choice of granting a key everything would turn MDC_API_KEY into a full-privilege bypass of the model this criterion builds. That is an operator decision rather than a mechanical one and is raised as such; a regression test pairing a key with a declared route belongs with whichever option is chosen. API-key and anonymous authorization resolved 2026-08-19 on operator decision, and the finding turned out to have a second face. Optional mode has the same shape as the API key - LoginSessionMiddleware admits an unauthenticated caller when no accounts are configured and stamps no permissions either, so the demo browser workstation was refused by every declared route exactly as out-of-band scripts were. Both now resolve a role, and the two defaults differ because the postures differ. A validated key carries the role named by MDC_API_KEY_ROLE and ReadOnly when unset - a key nobody has scoped should not do more than look - so a script that mutates configuration must be given a role holding the permission its route declares. An anonymous optional-mode caller carries a role only when MDC_ANONYMOUS_ROLE explicitly names one, with no default at all, because authentication being optional must not silently mean authorization is absent; the first attempt did default it to Admin and the behavioural ratchet failed immediately, since the endpoint test fixture itself runs optional mode and every permissionless caller became an administrator. That failure is the argument for the final shape - the demo runtime, which is a single-operator local box with no accounts, opts in by setting the variable next to the auth mode it already sets, and an ordinary optional-auth deployment stays refused until it makes the same explicit choice. Both resolvers fail closed on a value naming no known role rather than falling back