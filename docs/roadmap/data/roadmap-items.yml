econciliation break-queue set because both call BuildAccountingPayloadAsync, which reads the break-queue repository directly, and asset operations takes the same set because AssetOperationsDetailDto carries book positions; the two financial-record-explorer reads take the operations-continuity read set because they build instrument journal proofs from those positions; the replacement-cost estimate takes the storage set. Accounting and governance are another identical-payload pair, like research and strategy before them, and are gated identically for the same reason. Two behavioural fixes deferred from the preceding change also land here. The operator inbox aggregated four families whose own routes carry different permissions and applied none of them, so a caller admitted by one permission received every family - reconciliation break items carry the strategy name, break reason, status and assignee, not a count. Each contribution is now gated by the permission its source route requires, the route itself takes ViewTrades for the trading-readiness base it wraps, and a test pins the gate by showing the same fixture yields review-packet blockers for a strategy-permitted caller and none for a trading-only one. That test also corrected an assumption while being written - asserting on the PromotionReview kind failed because trading readiness emits items of that kind itself, so the run-scoped work-item id is the discriminator. The workflow summary now declares a permission and passes the same set to RequireFundProfileTenantScope, which resolves the coupling its own comment described - the ownership gate skips its check for callers lacking the permissions handed to it and the route previously handed it none, so an unauthorized caller could distinguish a foreign fund from an own one by which 403 came back. Twenty-nine tests were given the permission their routes require, five of them also needing the reconciliation mutation permission because they create a run before reading it back. Four further review corrections to the non-session principals 2026-08-19, three of which were holes in the fix rather than in the classification. Role resolution accepted numeric text, and because Admin is the zero value of UserRole a configuration of 0 - or any stray number - resolved to full administrator instead of failing closed as an unrecognised value; only role names resolve now, in both resolvers, and a theory pins the numeric cases. Setting only the actor and role was not enough either, because many handlers read the permissions item directly rather than going through the endpoint filter, so an Admin-roled key passed the route boundary and was refused inside; both principals now carry the canonical snapshot from RolePermissions.For as session authentication does. The anonymous principal also inherited the API-key middleware's session exemption, so a deployment configuring MDC_API_KEY alongside MDC_ANONYMOUS_ROLE stopped enforcing its key entirely - the anonymous principal is now marked as such and the exemption checks the authentication source rather than the mere presence of an actor. The fourth correction is a classification one. Aligning the reconciliation break-queue reads to their handler had dropped ViewDirectLending and ManageDirectLending, which left a custom profile able to act on casework through the mutation set while unable to load the queue it was acting on; the handler is now a deliberate superset of the mutation permission and the declaration mirrors it, since permission overrides are not required to match the bundled roles. The documented default was also overstated - ReadOnly holds ViewMarketData, ViewHistoricalData, ViewAnalytics and ViewStrategies, so an unscoped key can read live and historical market data, analytics and strategy runs, and the reference now says so rather than implying it reaches no governed data at all. Three aggregation-gate corrections 2026-08-19, all from the same mistake made twice more: a route whose payload aggregates several families must admit the union of their permissions and gate each contribution, not pick one family's permission for the whole route. The operator inbox required ViewTrades, which shut out every role holding ViewStrategies without it - Analysis, ReportingAnalyst and ReadOnly - so they lost the run-review notifications they are entitled to, in both workstation clients. The route now admits the union of its four families and the trading-readiness base is gated like the other three rather than treated as a floor the route guarantees; its ledger workflow status is optional in the summary, so a caller without ViewTrades simply has none. That also resolves a second finding, that the reconciliation contribution guard could never withhold anything: it was vacuous only because the route already required ViewTrades, which the widened break-queue read set contains, and with the union admitted it now withholds break items from callers holding none of the reconciliation permissions. Trading-desk callers still receive break items, which is correct rather than a leak - the break-queue route itself has admitted ViewTrades since before this wave, so withholding them from the inbox alone would make the aggregate stricter than the route serving the same data. The workflow summary had the same shape: it composes a summary for every workspace including Reporting, and its permission set omitted the reporting permissions, so ReportingAnalyst was refused the shell's workflow strip outright. Reporting and strategy permissions were added to both the declaration and the ownership gate, which take the same set deliberately - the gate skips its check for callers lacking the permissions handed to it, so widening the declaration without widening the gate would have stopped checking ownership for exactly the callers just admitted. Four further review corrections to the non-session principals 2026-08-19, three of which were holes in the fix rather than in the classification. Role 