  - id: W10-JRNL-001
    title: Durable recurring journal schedules and draft runner
    wave: W10
    sequence: 5
    stage_gates:
      - AccountingRecords
    workspace:
      - Accounting
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 5 of the 2026-07 W10 depth slate. The recurring journal primitive is complete and the service that owns it is unwired and holds its state in process memory, so planned occurrences never become journals and would not survive a restart if they did. A durable schedule store, a time-provider-driven worker, and an idempotent evidence-carrying intake path all already exist for monthly automated journals and are the pattern to follow. Occurrences become drafts for human approval and never post directly. Known source constraints, including which dependencies are currently in-memory, are recorded in docs/product/w10-depth-slate-2026-07.md.
    exit_criteria:
      - Recurring schedules, their posting history, the template versions occurrences materialize from, and the period-lock state they honor all survive a restart, and the runner fails closed when any of that durable state is unavailable rather than treating a locked period as open.
      - A due occurrence becomes a draft for human approval and never posts on its own, and a repeated run can produce neither a duplicate posting nor a second approval draft for the same occurrence - a retry claims or returns the draft that already exists.
      - A recurring draft cannot reach approval without retained source evidence, and that evidence stays attached through posting.
      - Occurrences blocked by a locked period name the lock owner and the governed reopen path rather than failing silently.
      - The accounting draft queue shows what the calendar generated, what awaits approval, and what a period lock blocked.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the durable store, the worker, the evidence gate, the draft queue on both workstation lanes, and the restart and idempotency tests.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-LEDGER
      - SRC-CONTRACTS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
