  - id: W5-ACCT-001
    title: Accounting records and operational evidence
    wave: W5
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
      - GovernedReportPack
    workspace:
      - Accounting
      - Reporting
      - Portfolio
      - Data
    owner_lane: Accounting and Ledger
    status: done
    health: green
    priority: high
    evidence_posture: complete
    current_summary: Closed 2026-06-02. Accounting record summaries with all six evidence categories (source data, normalized activity, reconciliation cases, ledger evidence, approvals, report-pack lineage) are wired end-to-end through shared contracts, the shared workspace service, and both browser and WPF surfaces. Transaction Lab endpoint request wiring is complete with dashboard test coverage for success and failure paths. Close-package and provenance fields are shared contracts accessible through the full workflow and governance lifecycle projection. This item anchors W1-W5 as the coherent near-term operational record baseline before Backtesting Studio, live-readiness, payments, forecasting, enterprise risk, portal, workflow-designer, mobile, or other expansion lanes.
    exit_criteria:
      - Accounting record summaries show retained source data, normalized transactions or positions, reconciliation case history, ledger evidence, approvals, and report-pack links.
      - Close-package status and audit/provenance timelines are operator-visible through shared read models consumed by browser and WPF surfaces where each surface participates.
      - Report-pack exports and restatements retain source evidence, approval state, and publication provenance.
      - Documentation identifies W1-W5 as the coherent operational record baseline and defers Backtesting Studio, live-readiness, payments, forecasting, enterprise risk, portal, workflow-designer, mobile, and other expansion lanes unless they directly strengthen that baseline.
    source_modules:
      - SRC-CONTRACTS
      - SRC-UI-SERVICES
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
    evidence:
      - type: status
        path: docs/roadmap/generated/ROADMAP_SUMMARY.md
      - type: test
        path: tests/Meridian.Tests/Application/OperationsContinuityWorkflowServiceTests.cs
      - type: test
        path: tests/Meridian.Tests/Ui/FundOpsCloseLaneScenarioTests.cs
      - type: test
        path: src/Meridian.Ui/dashboard/src/screens/accounting-screen.test.tsx
    last_reviewed: 2026-06-04

  - id: W5-MASSET-001
    title: Multi-asset operational coverage proof lane
    wave: W5
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
    workspace:
      - Portfolio
      - Accounting
      - Data
      - Settings
    owner_lane: Accounting and Ledger
    status: done
    health: green
    priority: high
    evidence_posture: complete
    current_summary: Completed the first shared multi-asset operations proof lane by exposing Security Master validation/profile posture, required retained provider evidence, ledger classification, reconciliation signals, and close-readiness blockers through `/api/workstation/portfolio/multi-asset-coverage`, with browser Portfolio/Accounting and WPF Portfolio cockpit surfaces rendering the shared read model; missing file/API manifests remain review-required rather than fake completeness.
    exit_criteria:
      - Equities, options, futures, FX, fixed income, loans, structured/private `CustomAsset`, and `OtherSecurity` rows declare identifiers, economics, provider evidence, ledger classification, reconciliation signals, and close blockers.
      - Missing retained provider data, file manifests, or API-payload evidence remains review-required or blocked evidence rather than fake completeness.
      - Browser and WPF surfaces consume the shared DTO without client-local readiness rules.
    source_modules:
      - SRC-APP
      - SRC-CONTRACTS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
    evidence:
      - type: test
        path: tests/Meridian.Tests/SecurityMaster/SecurityMasterOperationalReadinessServiceTests.cs
      - type: test
        path: tests/Meridian.Tests/Ui/WorkstationMultiAssetCoverageEndpointsTests.cs
      - type: test
        path: tests/Meridian.Wpf.Tests/ViewModels/WorkspaceCockpitShellViewModelTests.cs
      - type: test
        path: src/Meridian.Ui/dashboard/src/screens/portfolio-screen.view-model.test.ts
    last_reviewed: 2026-06-02

  - id: W5X-FREX-001
    title: Shared financial record explorers
    wave: W5X
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
      - GovernedReportPack
    workspace:
      - Accounting
      - Portfolio
      - Data
      - Reporting
    owner_lane: Workstation Shell and UX
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Planned productization slice that turns the W1-W5 accounting-record and multi-asset evidence baseline into shared Ledger Explorer, Portfolio Explorer, and Security & Instrument Explorer surfaces. This stays inside the operational-record scope gate and does not reopen deferred portal, payment-execution, mobile, or broad workflow-designer lanes.
    exit_criteria:
      - Shared explorer framework contracts and read models support scope bars, saved views, filters, summary strips, dense grids, record drawers, proof ribbons, proof panels, column layouts, record graphs, Used In, Impacts, evidence links, approval state, reconciliation state, report usage, and audit timelines without browser- or WPF-local business rules.
      - Ledger Explorer exposes Journal Entries and Ledger Detail views with core filters, saved views, journal drawer and detail routing, evidence links, approval posture, reversal-chain context, and report-usage drill-through.
      - Portfolio Explorer exposes Holdings and Transactions views with position drawer and detail routing, valuation status, reconciliation status, ledger-impact links, instrument links, evidence posture, and report usage.
      - Security & Instrument Explorer exposes instrument list, identifier map, terms and obligations, source conflicts, held positions, evidence links, valuation status, expected cash flows, and accounting classification.
      - Cross-explorer Proof Trail can move from Instrument to Position or Transaction, Reconciliation, Journal, Report Line, Evidence, and Audit Event, and missing retained source evidence remains review-required or blocked rather than synthetic completeness.
    source_modules:
      - SRC-CONTRACTS
      - SRC-UI-SERVICES
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
      - DIA-BROWSER-WORKSTATION
    last_reviewed: 2026-06-09

  - id: W5X-FINOPS-001
    title: Financial operations control center
    wave: W5X
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
      - GovernedReportPack
    workspace:
      - Accounting
      - Reporting
      - Portfolio
      - Data
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Planned productization slice that makes Financial Operations the operator control center for reconciliation queues, exception casework, accounting close support, workflow controls, and audit evidence packet readiness. It builds on the closed W1-W5 operational-record baseline and should consume the same shared contracts/read models as the Financial Record Explorers rather than creating browser- or WPF-local business rules.
    exit_criteria:
      - Accounting workspace exposes a financial operations command surface that groups reconciliation posture, exception aging, close checklist state, approval/workflow control, and audit evidence readiness from shared read models.
      - Reconciliation cases, breaks, assignments, escalations, approvals, close tasks, and evidence packets can be opened from a unified operator queue with deterministic status, owner, due date, and blocker signals.
      - Close support shows period state, lock or reopen posture, NAV-support or report-pack dependencies, unresolved exceptions, required approvals, and retained evidence gaps without posting synthetic completion.
      - Workflow controls expose assignment, escalation, approval, reopen, and evidence-retention actions through shared services so browser and WPF surfaces share the same policy decisions.
      - Generated roadmap and product docs state this is a planned productization target, not a claim that the complete Financial Operations control center is shipped.
    source_modules:
      - SRC-CONTRACTS
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-DESIGN-WORKFLOW
      - SRC-DESIGN-AUDIT
      - SRC-DESIGN-REPORTING
      - SRC-UI-SERVICES
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
      - DIA-BROWSER-WORKSTATION
    last_reviewed: 2026-06-10

