    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 3 of the 2026-07 W10 depth slate and the platform bet the rest of the slate depends on. Both halves of amount-level provenance are already built and neither is connected. The ledger amount provenance service is served by a single legacy report-pack route and has no client consumer in the browser workstation, the shared UI services, or the desktop workstation, while the Number Passport component infers all of its rows by keyword-scanning relationship strings instead of fetching provenance. The evidence graph service already fans out over a registered contributor collection behind a subject-addressed route family, so the work is to add a ledger-amount subject kind, express provenance as a contributor, make the passport data-driven, and promote the proof drawer from a private function inside one explorer into a shared component. This is the first concrete slice of W5X-OEG-001 and does not duplicate it.
    exit_criteria:
      - A ledger-amount evidence subject kind resolves through the existing subject-addressed evidence routes without introducing a parallel endpoint family.
      - Amount provenance is expressed as a registered evidence contributor and no longer depends on substring matching over a full break-queue scan or on scraping delimited key-value strings.
      - The Number Passport renders from retained evidence rather than inferring rows by keyword-scanning relationship labels.
      - One shared proof drawer component is reachable from report lines, ledger rows, portfolio marks, and capital-account balances instead of each surface composing its own.
      - Missing or stale provenance renders as review-required or blocked rather than an empty passport that reads as proven.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the subject kind, the contributor, the shared drawer, the browser surface, and the WPF parity slice or its explicit deferral.
