  - id: W9-GOV-008
    title: Route-level authorization, fail-closed tenancy, and hash-chained accounting audit
    wave: W9
    stage_gates:
      - AccountingRecords
    workspace:
      - Settings
      - Accounting
    owner_lane: Platform Security and Governance
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 8 of the 2026-07 first-order improvement slate. Source-verification snapshot 2026-08-10 - substantial implementation already exists and the row needs criterion-level verification rather than greenfield build. RoleAuthorizationTests and the per-workspace tenant-scope endpoint suites (for example WorkstationEndpointsTests.StrategyTenantScope) cover authorization and tenancy behavior, and Meridian.Storage AuditChainService provides the hash-chained audit seam; The 2026-08-10 change lands the criterion-one instrument - EndpointAuthorizationCoverageTests mechanically enumerates every mapped mutating route from the composed application's endpoint graph and proves a zero-permission caller is rejected, with a five-route documented permissionless allowlist and a frozen 152-route remediation baseline ratchet: the sweep found 152 mutating routes (largely the pre-workstation /api surface) that today process permissionless requests - unguarded 200/201 writes, validate-before-authorize orderings, and test-host registration gaps - so the baseline tolerates exactly those known-debt routes, fails on any newly mapped unguarded route, and fails when a remediated route is not removed. The 2026-08-10 burn-down guarded the 40 highest-risk success-status routes (diagnostics, export, lean, messaging, storage, storage-quality, analytics repair, environment designer, provider failover, quant-lab parameter extraction) with Require endpoint filters mapped to family permissions, shrinking the baseline from 152 to 112. Remaining before acceptance - burn down the residual 112-route baseline (each fix shrinks it), prove fail-closed tenancy rejection for requests without resolvable scope across all write surfaces, and prove cross-process audit-chain serialization with verification tooling and tamper-detection tests aligned with the PRD-007 evidence-chain notes. Corrected 2026-08-11 - the accounting audit half of this row cannot be discharged against the PostgreSQL store alone, because IAccountingActionAuditStore resolves to PostgresAccountingConfigurationStore only where the database composition is registered and the workstation and WPF compositions fall through to FileAccountingConfigurationStore, whose AppendAsync adds the event with no predecessor hash and no chain verification; that file-backed path is what runs when nobody has stood up PostgreSQL, so it must be chained and verified too, or those mutations disabled in that posture, with local and WPF proof. Tenancy scope corrected 2026-08-11 - the remaining proof is not write-side only, and the fund-structure store is in scope rather than deferred as defence-in-depth: PostgresFundStructureService has no tenant column and no predicate, LoadSnapshotAsync takes no scope and loads every organization, business, fund, and relationship, /api/fund-structure/graph serves that snapshot, and mutations resolve parents from the same global view - so a tenant-A administrator can read tenant-B structure and link or mutate tenant-B nodes by id while RequireFundScopedWriteTenant proves only that the caller has some tenant. The criterion is categorical about reads as well, and two read paths are deliberately fail-open today: RequireFundProfileTenantScope passes a blank fund, a caller with no tenant scope, or an unavailable guard, and the storage TenantReadPredicate emits tenant_id is null or ... so unstamped legacy rows stay visible. Both must be tightened with regression tests before the row advances, and tightening the predicate needs a data migration BEFORE it needs a test - V_ledger_020, V_ledger_021, and fund-account migration 003 backfill from the fund_profile_tenancy registry and their own headers state that rows they cannot attribute stay null and fail-open, so rejecting null tenants without attributing them first hides fund-account, journal/period, and operations-continuity records from every scoped reader on an existing deployment. Change 9 therefore carries a deterministic backfill for the remaining unstamped rows plus a quarantine or upgrade-validation path for whatever it still cannot attribute. The same applies to accounts - InitialAccountBootstrapService creates the ordinary first-run administrator with a null company and UserAccountConfig.CompanyId is optional for stored accounts and MDC_USERS alike, so enforcement 403s the normal administrator of an existing local installation, not just the legacy MDC_USERNAME fallback. And enabling FundScopedWriteTenantOptions affects only routes already decorated with RequireFundScopedWriteTenant, which FundStructureEndpoints carries nowhere, so the undecorated writes beneath the /api/fund-structure group must be enumerated and gated or explicitly allowlisted as bootstrap.
    exit_criteria:
      - An authorization coverage test enumerates every mapped endpoint and fails when a route lacks an explicit policy or permission declaration.
      - Cross-tenant reads and writes fail closed with tests, and requests without resolvable tenant scope are rejected rather than defaulted.
      - Accounting and ledger audit events append to a hash-chained tamper-evident log with cross-process serialization, verification tooling, and tamper-detection tests.
    source_modules:
      - SRC-UI-SHARED
      - SRC-DESIGN-IDENTITY
      - SRC-DESIGN-AUDIT
      - SRC-STORAGE
      - SRC-LEDGER
    last_reviewed: 2026-08-10

  - id: W9-INGEST-009
    title: Institutional file ingestion (camt.053/BAI2) and sided reconciliation matcher
    wave: W9
    stage_gates:
      - AccountingRecords
      - PortfolioLedgerReview
    workspace:
      - Accounting
      - Data
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 9 of the 2026-07 first-order improvement slate. Source-verification snapshot 2026-08-10 - the core surface already exists: Camt053StatementConnector and Bai2StatementConnector normalize through the W5X-CONNECT-001 connector seam alongside the statement-import command path, and the reconciliation lane carries a dedicated match kernel with sided statement-versus-ledger populations (ReconciliationMatchKernel, StatementRunMatcher, StatementRunMatchingService, ReconciliationMatchingEngine). Corrected 2026-08-11 after source verification retracted the evidence-only premise above - the standalone kernels do exist, but the LIVE path does not use them, so this row is implementation work and not verification alone. The retained internal population provider returns an empty ledger-transaction population by design (its own remarks say it awaits an authorized period-scoped ledger source and an agreed journal-to-transaction projection), and StatementRunMatcher invokes the one-to-one StatementMatchingEngine rather than anything split-capable. camt.053 and BAI2 are transaction statements, so with an empty transaction population every bank row fails closed to a break, and one-to-many outcomes can never reach live casework however the standalone kernels behave - tests written against those kernels would pass while the shipping path matched nothing. In scope before acceptance, therefore - source the ledger-transaction population by propagating the authority-verified StatementAccountingScope (FundProfileId, LedgerBookId, AccountingPeriodId, AsOfDate) already carried on the run request into InternalReconciliationPopulationContext, which currently drops it, rather than inventing a parallel unscoped lookup; decide the disposition of the direct POST /api/workstation/reconciliation/statement-runs caller, whose create contract carries no accounting scope at all and so cannot supply one once ledger reads require it; give the live path deterministic split matching by extending StatementMatchingEngine with the ReconciliationMatchKernel split primitives or adapting them behind it, since ReconciliationMatchingEngine handles only positions and cash and has no transaction model to swap to; carry group membership through the result path as well, because StatementMatchResult holds one broker and one internal evidence reference, StatementRunMatcher discards each result after incrementing MatchCount, and StatementRunMatchArtifact persists only that count - so two different split assignments of the same size produce an identical durable artifact and the row's own determinism and idempotency evidence is unobtainable no matter how correct the matching is; and implement bounded schema-aware parsing for both connectors, which currently decode the whole payload before parsing and enforce no record limit. Evidence still outstanding on top of that implementation work - golden-file regression coverage for both formats was not found in the FinancialOperations test tree, and the deterministic one-to-one/one-to-many/unmatched-break semantics with stable tie-breakers and idempotent re-runs need focused evidence against the live path rather than the standalone kernels. docs/product/w9-close-out-delivery-plan-2026-08.md carries the full source audit behind this correction.
    exit_criteria:
      - camt.053 and BAI2 statement connectors normalize through the W5X-CONNECT-001 connector seam with retained raw and canonical evidence and golden-file regression coverage.
      - Bounded schema-aware parsing enforces the PRD-010 ingress limits for both formats.
      - The reconciliation matcher distinguishes statement-side and ledger-side populations with deterministic one-to-one, one-to-many, and unmatched-break outcomes, stable tie-breakers, and idempotent re-runs.
      - Sided match results feed the existing reconciliation casework queue without synthetic completeness.
    source_modules:
