  - id: W5X-EVIDENCE-001
    title: Evidence Vault productization
    wave: W5X
    stage_gates:
      - AccountingRecords
      - GovernedReportPack
      - PortfolioLedgerReview
    workspace:
      - Accounting
      - Reporting
      - Data
    owner_lane: Accounting and Ledger
    status: done
    health: green
    priority: high
    evidence_posture: complete
    current_summary: Closed 2026-08-03 as the bounded browser-first Evidence Vault productization baseline. Retained document identity, intake, request/document queries, extracted-field review, source records and hashes, object links, immutable manifests, reviewer/audit state, and canonical deep links now support both local and production-authority statement intake. Broader document portal and collaboration expansion remains deferred, and WPF presentation remains a separate parity item.
    exit_criteria:
      - Evidence Vault retains imported source documents with immutable vault identity, manifest route, source hash, source record, reviewer state, and audit trail.
      - Request-list and document-list queries can filter retained documents by subject, classification, review status, and object links.
      - Document authority stays bounded to support, block, suggest, and link; documents cannot approve, post, certify, or release.
