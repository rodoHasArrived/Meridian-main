  - id: W10-SEAM-001
    title: Unified close-readiness projection behind one shared contract
    wave: W10
    sequence: 7
    stage_gates:
      - AccountingRecords
      - GovernedReportPack
    workspace:
      - Accounting
      - Reporting
    owner_lane: Workstation Shell and UX
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 7 of the 2026-07 W10 depth slate. Close readiness has several independent owners encoding it incompatible ways, and the cross-lane operator console aggregates them in the browser client, so a controller can get different answers from different screens and the desktop lane is scheduled to reimplement the same aggregation rather than consume it. This row makes one readiness projection the shared source both workstation lanes consume. Known source constraints, including which services own which encoding today, are recorded in docs/product/w10-depth-slate-2026-07.md.
    exit_criteria:
      - One close-readiness projection is the shared source both workstation lanes consume rather than each lane deriving its own, and every contribution within it answers for the same subject - fund profile, ledger book, fund account, entity, and period - with a mismatch blocking the projection rather than being merged into it.
      - Every blocker names its type, count, severity, owner, and the records causing it.
      - A contributing lane that is unregistered, failing, stale, or out of scope makes the projection incomplete and blocking rather than silently absent, so readiness is never reported because a contributor did not answer.
      - The contributing services report into that projection instead of publishing independent readiness vocabularies, and the asset-class coverage service no longer reads as close readiness.
      - The sequencing handshake with W8-WPF-PARITY-001 is recorded so the client-side aggregation is retired rather than duplicated into the desktop lane.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the shared contract, the contributing services, both workstation consumers, and the blocker-projection tests.
