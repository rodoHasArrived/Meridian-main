  - id: W10-JRNL-001
    title: Durable recurring journal schedules and draft runner
    wave: W10
    stage_gates:
      - AccountingRecords
    workspace:
      - Accounting
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 5 of the 2026-07 W10 depth slate. The recurring journal primitive is complete, covering six cadences, anchor dates, per-run parameters, dimensional scope, end dates, and period-lock awareness, but the service that owns it holds both its schedules and its posted-occurrence idempotency guard in memory and is not registered in dependency injection anywhere, so planned occurrences never become journals. A durable schedule store, a time-provider-driven hosted worker with a deterministic single-run seam, and an idempotent intake path all already exist for monthly automated journals and are the template to copy. Occurrences become drafts for human approval and never post directly.
    exit_criteria:
      - Recurring journal schedules and their posted-occurrence idempotency state persist durably and survive a restart, failing closed when the durable store is unavailable.
      - A registered hosted worker materializes due occurrences into automated journal drafts on its cadence and a repeated run is a no-op through the retained occurrence idempotency key.
      - Generated drafts enter the existing automated journal approval rail and the runner never submits, approves, or posts a journal entry.
      - Occurrences blocked by a locked period surface the lock owner and the governed reopen path rather than failing silently.
      - The accounting journal draft queue shows a recurring lane covering what the calendar generated, what awaits approval, and what a period lock blocked.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the durable store, the hosted worker, the intake request, and the restart and idempotency tests.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-LEDGER
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

  - id: W10-TAX-001
    title: Tax character, wash-sale, and lot-relief operator surface
    wave: W10
    stage_gates:
      - AccountingRecords
    workspace:
      - Accounting
      - Portfolio
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 6 of the 2026-07 W10 depth slate. The wash-sale and tax-character engine landed in 2026-07 with per-parcel character, holding period, wash-sale holding-period extension, short and long term realized totals, disallowed loss, and durable deferral records, and it terminates in a single report-pack CSV artifact that no endpoint serves and no screen reads. The tax character type has no reference anywhere in the shared contracts, the browser workstation, or the desktop workstation. This row publishes the character split through the realized gain and loss contract that already reaches the workstation, then adds a lot-level surface with replacement-lot linkage and a relief-method comparison across the five supported methods.
    exit_criteria:
      - The realized gain and loss contract carries the short-term, long-term, disallowed wash-sale, and recognized amounts rather than a single undifferentiated scalar.
      - A tax character contract type is defined in the shared contracts without those contracts taking a dependency on the ledger implementation assembly.
      - Position drill-down shows per-lot acquisition date, holding period, tax character, and, where a wash sale fired, the disallowed loss, the basis adjustment, and a link to the replacement lot that triggered it.
      - A pending disposal can be previewed across all supported cost-basis relief methods showing realized gain, character split, and wash-sale exposure side by side, with method, lot set, and as-of date retained on every projection.
      - Changing an account standing relief policy mid-period requires approval and a retained rationale, and every surface presents the comparison as decision support rather than tax advice.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the contract extension, the lot surface, the relief comparison, and the character and wash-sale projection tests.
    source_modules:
      - SRC-LEDGER
      - SRC-CONTRACTS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

  - id: W10-SEAM-001
    title: Unified close-readiness projection behind one shared contract
    wave: W10
    stage_gates:
      - AccountingRecords
      - GovernedReportPack
    workspace:
      - Accounting
      - Reporting
    owner_lane: Workstation Shell and UX
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 7 of the 2026-07 W10 depth slate. Close readiness has four independent owners plus one service that computes asset-class coverage under a readiness name, and they encode readiness five incompatible ways across a scored close-readiness record, an evidence status enum, and three different status vocabularies. The cross-lane operator readiness console then performs its aggregation client-side in the browser, which is why the desktop parity plan is scheduled to reimplement the same aggregation rather than consume it. The command-center read service already injects the calendar and cockpit services and is the natural consolidation point. This row promotes one readiness projection with typed named blockers to a top-level shared contract and makes both workstation lanes consume it instead of deriving it.
    exit_criteria:
      - One close-readiness projection is exposed as a top-level shared contract rather than only as a nested field on a workflow record.
      - The existing readiness owners contribute to that projection instead of publishing independent readiness vocabularies, and the asset-class coverage service is renamed or rescoped so it no longer reads as close readiness.
      - Every blocker carries a type, a count, a severity, an owner, and a deep link to the records causing it, covering open material breaks, unapproved journal drafts, stale marks, missing evidence packets, unresolved quality violations, and unposted recurring occurrences.
      - The browser operator readiness console consumes the shared projection rather than aggregating readiness client-side.
      - The desktop parity lane consumes the same projection, and the sequencing handshake with W8-WPF-PARITY-001 is recorded so the client-side aggregation is retired rather than duplicated.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the shared contract, the contributing services, both workstation consumers, and the blocker-projection tests.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-UI-SHARED
      - SRC-CONTRACTS
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

  - id: W10-RECON-003
    title: Unified tolerance model and what-if replay workbench
    wave: W10
    stage_gates:
      - PortfolioLedgerReview
    workspace:
      - Accounting
      - Settings
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: medium
    evidence_posture: planned_evidence
    current_summary: Rank 8 of the 2026-07 W10 depth slate and the largest row in the reconciliation arc. Editing a matching tolerance today is a blind change discovered on the next production run. Two prerequisites stand in front of the preview itself. The tolerance model exists as three incompatible shapes and the matching engine consumes only the flattest of them, so the price, basis-point cash, and settlement-date rules are structurally unreachable, scoping is by profile identifier alone, and the file-backed provider is load-once and read-only with no write path and no edit surface. Separately the statement checkpoint store is a resumption cursor holding counts for the newest run per account, so nothing retained supports replay. This row unifies the tolerance model, retains replayable run artifacts, and only then builds the governed preview.
    exit_criteria:
      - One tolerance model reaches the matching engine, so price, basis-point cash, and settlement-date rules are reachable rather than structurally discarded.
      - Tolerance scoping supports account, currency, and transaction-type dimensions rather than a single profile identifier.
      - Reconciliation runs retain the artifacts a replay requires, covering normalized rows, matched pairs, variances, and the tolerance profile version, rather than counts for the newest run per account.
      - A match-kernel determinism audit proves replay does not depend on wall-clock time or mutable reference data before any simulation result is shown to an operator.
      - A proposed tolerance change previews its effect against retained runs, naming the breaks it would newly auto-match and the previously escalated breaks it would suppress, and the committed change retains that simulation as its justification.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the unified model, the retained run artifacts, the determinism audit, and the preview surface.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

  - id: W10-RECON-004
    title: Operator-taught match rules with promotion gate
    wave: W10
    stage_gates:
      - PortfolioLedgerReview
      - AccountingRecords
    workspace:
      - Accounting
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: medium
    evidence_posture: planned_evidence
    current_summary: Rank 9 of the 2026-07 W10 depth slate. Every manual match an operator makes today is discarded, so a recurring counterparty pattern is as unmatched on its tenth appearance as on its first. The match result contract already carries a rule identifier list and a human-readable explanation, so a learned rule can name itself in retained evidence with no contract change, but the matching engine is sealed with a hard-coded stage ladder and no stage abstraction, so an ordered stage collection must be introduced. Learned patterns accumulate as drafts that shadow-match without acting and only participate after an operator promotes them, keeping the system inside governed autonomy rather than deciding on its own.
    exit_criteria:
      - A manual match captures a generalizable draft rule covering counterparty, normalized description tokens, account, sign, and tolerance band without acting on it.
      - Draft rules accumulate shadow-match hit counts across runs and are offered for promotion only after meeting a stated accuracy threshold.
      - The matching engine exposes an ordered stage collection so a promoted rule participates as an explicitly labeled stage rather than through edits scattered across the fixed ladder.
      - Every match produced by a learned rule names that rule and its promoting operator in retained evidence, and no unpromoted pattern ever produces a match.
      - The learned matching model lives in one place rather than forking a second vocabulary alongside the existing reconciliation types in the functional calculation projects.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the draft capture, the promotion gate, the engine stage seam, and the rule-attribution tests.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-STRATEGIES
      - SRC-UI-DASHBOARD
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

  - id: W10-PERF-001
    title: Portfolio and investor return measurement
    wave: W10
    stage_gates:
      - PortfolioLedgerReview
      - GovernedReportPack
    workspace:
      - Portfolio
      - Reporting
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 10 of the 2026-07 W10 depth slate and the one genuinely new capability in it. Meridian can prove a valuation but cannot state what a portfolio returned. There is no time-weighted, money-weighted, or Modified Dietz calculation anywhere outside the backtesting lane, no performance route among the shared workstation routes, and the extended internal rate of return kernel is internal to the backtesting assembly. Three inputs are missing rather than merely unwired. Daily pricing produces a single-day projection with no cross-day series, the capital-account subledger supplies dated investor cash flows but no residual ending value, and the kernel is unreachable. It is sequenced last because it depends on the mark discipline in W10-MARK-001 and the proof drawer in W10-PROV-001 to be honest.
    exit_criteria:
      - A shared deterministic return kernel covering extended internal rate of return and time-weighted return is reachable from the ledger and financial-operations lanes rather than confined to the backtesting assembly.
      - Daily pricing projections persist as a dated series sufficient to chain sub-period returns.
      - Investor-level money-weighted return resolves both the dated capital-activity series and a residual ending value, and unapproved activity is excluded.
      - Any period containing a mark gap renders as review-required rather than an interpolated return, and every returned figure names its convention, its period, and its mark completeness.
      - Golden-file tests cover the return kernels against worked examples.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the shared kernel, the persisted series, the residual value resolution, the operator surface, and the golden-file tests.
    source_modules:
      - SRC-FSHARP
      - SRC-LEDGER
      - SRC-CONTRACTS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

  - id: W10-CONSOL-001
    title: Intercompany elimination on consolidated ledger views
    wave: W10
    stage_gates:
      - AccountingRecords
    workspace:
      - Accounting
      - Reporting
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: medium
    evidence_posture: planned_evidence
    current_summary: Rank 11 of the 2026-07 W10 depth slate. The ledger book contracts already define intercompany and consolidation-elimination journal sources, and the fund ledger book already produces a consolidated trial balance by summing its sub-ledgers with no elimination pass, so consolidated views double-count intercompany balances and the enum value for the correction has no producer. This row adds the elimination pass as reviewable drafts on the existing approval rail plus an unmatched-intercompany report. Scope is deliberately limited to wholly owned fully consolidated entities so the work stops short of the deferred capital-structure modeling boundary.
    exit_criteria:
      - Intercompany pairs resolve from the counterparty entity dimension on ledger line dimensions rather than from naming conventions.
      - Proposed eliminations enter the existing journal draft and approval rail as reviewable drafts and are never auto-posted.
      - Consolidated views offer a gross and eliminated presentation and state which one is being displayed.
      - Intercompany balances that do not agree between the two sides surface as their own reported break class rather than being silently netted.
      - Scope is limited to wholly owned fully consolidated entities, and ownership percentages, partial consolidation, and minority interest are explicitly excluded from this row.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the pair resolution, the elimination drafts, the consolidated presentation, and the unmatched-intercompany tests.
