  - id: W10-MARK-001
    title: Fail-closed stale-mark policy and mark-age surfacing
    wave: W10
    sequence: 1
    stage_gates:
      - AccountingRecords
    workspace:
      - Accounting
      - Portfolio
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 1 of the 2026-07 W10 depth slate. Valuation freshness is not enforced by default, so a mark of any age can price a valuation without saying so, and freshness is governed by two overlapping controls rather than one. This row makes the fail-closed posture the default, resolves freshness to a single owner, and makes mark age visible wherever positions appear on both workstation lanes. It discharges RISK-STALE-MARK-001 and follows the same fail-closed truth doctrine as W9-TRUTH-001, which is why it is pulled ahead of the rest of the slate. An aged mark is real data presenting as current rather than simulated data presenting as real, so it is tracked as its own risk instead of counting against the simulation risk. Known source constraints, including how the current assessment treats a mark dated after the valuation, are recorded in docs/product/w10-depth-slate-2026-07.md.
    exit_criteria:
      - A valuation cannot rest on a mark whose age or observation date falls outside policy, and the default posture blocks rather than accepts.
      - Freshness is governed by one policy owner rather than two independently configured controls, and consolidation preserves every non-age gate the stricter control enforces today - minimum confidence, complete coverage, and a required observation date - rather than collapsing to age alone.
      - Valuations blocked on mark freshness render as review-required with the offending positions named, on both the browser and desktop workstations.
      - Mark age and observation date are visible wherever positions appear, and an override is bound to the position, mark observation, valuation date, and policy version it was approved for, expiring or requiring renewed review as the charter's override strategy requires, so it cannot become a standing bypass.
      - Enabling the new default is preceded by a preview of how many current valuations it would block.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the policy, both workstation surfaces, and the fail-closed tests.
    source_modules:
      - SRC-LEDGER
      - SRC-APP
      - SRC-CONTRACTS
      - SRC-UI-SHARED
      - SRC-UI-DASHBOARD
      - SRC-WPF
    diagrams:
      - DIA-ASSURANCE-LOOP
