  - id: W10-RECON-001
    title: Durable break lineage identity and run-over-run break diff
    wave: W10
    stage_gates:
      - PortfolioLedgerReview
    workspace:
      - Accounting
    owner_lane: Accounting and Ledger
    status: planned
    health: green
    priority: high
    evidence_posture: planned_evidence
    current_summary: Rank 2 of the 2026-07 W10 depth slate. Reconciliation breaks have no identity that survives a run. The statement matcher mints a random identifier per run, and the queue projection derives its break identifier from a fingerprint that includes the variance amount, the tolerance, the as-of date, and the accounting period, so a break whose amount moves by one cent becomes a different break. The repository already carries a single-hop caller-supplied re-key hook that acknowledges the instability. This row introduces a stable lineage key over identifying dimensions only, then uses it to show which breaks are new, persisting, or cleared since the prior run. It is sequenced ahead of clustering because grouping and aging are unsound without it.
    exit_criteria:
      - A break carries a lineage identity derived only from identifying dimensions, separate from the content fingerprint that legitimately changes when an amount changes.
      - Lineage identity survives a variance change, a tolerance change, and an as-of date change for the same underlying break.
      - The reconciliation queue reports new, persisting with age, and cleared counts against the prior run and defaults its filter to new items.
      - Break aging derived from lineage feeds the reconciliation SLA calculation so escalation pressure is visible before an SLA is missed.
      - Roadmap status remains planned until this item links implementation paths and concrete evidence entries for the lineage key, the diff projection, the queue surface, and the identity-stability tests.
    source_modules:
      - SRC-DESIGN-FINANCIAL-OPERATIONS
      - SRC-STRATEGIES
      - SRC-CONTRACTS
      - SRC-UI-DASHBOARD
    diagrams:
      - DIA-ASSURANCE-LOOP
    last_reviewed: 2026-07-31

