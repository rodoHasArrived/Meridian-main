title = "Meridian gitleaks configuration"

[extend]
# Extend the default ruleset so all built-in detectors remain active.
useDefault = true

# ---------------------------------------------------------------------------
# Path-bound allowlists
#
# Every exception must be scoped to the exact fixture or documentation file
# that owns the placeholder. Avoid stopword-only global suppressions because
# they can hide real credentials in unrelated source files.
# ---------------------------------------------------------------------------
[[allowlists]]
id          = "design-system-key-value-grid-source-hash"
description = "Verified SHA-256 of components/data/KeyValueGrid.jsx recorded in design-system build provenance"
condition   = "AND"
paths       = [
    '''^Meridian Design System/(release-build\.json|_ds_bundle\.js)$''',
]
regexTarget = "secret"
regexes     = [
    '''^869b90a742954586f725e346e596aab4930239f0c4411acfd2e32448460f6632$''',
    '''^94656a4ba732dfcae2adc551d11e548d0fae2c6a4d067e7578b5ec13dd0be9c7$''',
]

[[allowlists]]
id          = "generated-database-catalog-fingerprints"
description = "Deterministic generated database catalog contains schema fingerprints and key metadata, never credentials"
paths       = [
    '''^database/manifest/catalog\.json$''',
]

[[allowlists]]
id          = "provider-projection-test-correlation-placeholder"
description = "Provider projection history contains one deterministic test correlation label, not a credential"
condition   = "AND"
paths       = [
    '''^tests/Meridian\.Tests/Ui/ProviderDataProjectionEndpointsTests\.cs$''',
]
stopwords   = [
    "correlation-42",
]

[[allowlists]]
id          = "docs-api-reference-placeholder"
description = "Public documentation placeholder API key"
condition   = "AND"
paths       = [
    '''docs/reference/api-reference\.md''',
]
stopwords   = [
    "your-api-key",
    "your-key",
]

[[allowlists]]
id          = "config-validation-test-placeholders"
description = "Config validation tests use deliberately fake Alpaca credentials"
condition   = "AND"
paths       = [
    '''tests/Meridian\.Tests/(Application/|Core/)?Config/ConfigValidationPipelineTests\.cs''',
]
stopwords   = [
    "VALIDSECRET",
    "VALIDKEYID",
]

[[allowlists]]
id          = "polygon-client-test-placeholder"
description = "Polygon client tests use a deliberately fake API key"
condition   = "AND"
paths       = [
    '''tests/Meridian\.Tests/(Infrastructure/)?Providers/PolygonMarketDataClientTests\.cs''',
]
stopwords   = [
    "abcdefghijklmnopqrstuvwxyz123456",
    "valid_environment_api_key",
]

[[allowlists]]
id          = "polygon-subscription-test-placeholder"
description = "Polygon subscription tests use a deliberately fake API key"
condition   = "AND"
paths       = [
    '''tests/Meridian\.Tests/(Infrastructure/)?Providers/PolygonSubscriptionTests\.cs''',
]
stopwords   = [
    "valid_polygon_api_key",
]

[[allowlists]]
id          = "finnhub-credential-schema-labels"
description = "Finnhub provider metadata documents environment-variable names, not credential values"
condition   = "AND"
paths       = [
    '''src/Meridian\.Infrastructure/Adapters/Finnhub/Finnhub(CorporateAction|HistoricalData)Provider\.cs''',
    '''docs/docfx/api/Meridian\.Infrastructure\.Adapters\.Finnhub\.FinnhubHistoricalDataProvider\.yml''',
]
stopwords   = [
    "FINNHUB_API_KEY",
    "FINNHUB__APIKEY",
]

[[allowlists]]
id          = "provider-validation-doc-placeholders"
description = "Provider validation docs describe generic API payload evidence, not secret material"
condition   = "AND"
paths       = [
    '''docs/(reference|status)/provider-validation-matrix\.md''',
]
stopwords   = [
    "API payload",
]

[[allowlists]]
id          = "provider-setup-handler-aliases"
description = "Provider setup registry contains provider aliases rather than credential values"
condition   = "AND"
paths       = [
    '''src/Meridian\.DataIntegration/Credentials/ProviderSetupHandlers\.cs''',
]
stopwords   = [
    "plaidapi",
]

[[allowlists]]
id          = "accounting-configure-wpf-fixture-key"
description = "Accounting Configure tests assert deterministic fixture identifiers"
condition   = "AND"
paths       = [
    '''tests/Meridian\.Wpf\.Tests/ViewModels/AccountingConfigureViewModelTests\.cs''',
]
stopwords   = [
    "7e0be005-49e1-46eb-9d4f-89d75e2328bd",
]

[[allowlists]]
id          = "ib-brokerage-comment-placeholder"
description = "IB brokerage tests mention a fixed-income field name in comments"
condition   = "AND"
paths       = [
    '''tests/Meridian\.Tests/Infrastructure/Providers/IBBrokerageGatewayTests\.cs''',
]
stopwords   = [
    "AccruedInterest",
]
