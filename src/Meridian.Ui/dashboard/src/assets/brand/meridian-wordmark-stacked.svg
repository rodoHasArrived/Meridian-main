<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-labelledby="title desc">
  <title id="title">Meridian wordmark (stacked)</title>
  <desc id="desc">Meridian mark with stacked text layout for narrow spaces and vertical compositions.</desc>

  <g transform="translate(20 20) scale(0.65)">
    <circle cx="128" cy="128" r="84" fill="none" stroke="#D8DFE8" stroke-width="9" stroke-linecap="round"></circle>
    <line x1="44" y1="128" x2="212" y2="128" stroke="#D8DFE8" stroke-width="9" stroke-linecap="round"></line>
    <line x1="128" y1="44" x2="128" y2="212" stroke="#D8DFE8" stroke-width="9" stroke-linecap="round"></line>
    <line x1="94" y1="92" x2="162" y2="92" stroke="#00D9FF" stroke-width="11" stroke-linecap="round"></line>
    <circle cx="128" cy="128" r="6" fill="#00D9FF"></circle>
  </g>

  <text x="120" y="235" font-family="&#39;Space Grotesk&#39;, &#39;IBM Plex Sans&#39;, system-ui, sans-serif" font-weight="700" font-size="36" letter-spacing="2.8" text-anchor="middle" fill="#D8DFE8">MERIDIAN</text>

  <text x="120" y="268" font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="2" text-anchor="middle" fill="#8A96A8">RESEARCH</text>

  <text x="120" y="286" font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="2" text-anchor="middle" fill="#8A96A8">TRADING</text>

  <text x="120" y="304" font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="2" text-anchor="middle" fill="#8A96A8">DATA OPS</text>

  <text x="120" y="322" font-family="&#39;IBM Plex Mono&#39;, ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="2" text-anchor="middle" fill="#8A96A8">GOVERNANCE</text>
</svg>