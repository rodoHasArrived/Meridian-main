# Template: path-filtered PR check for Meridian
# Save to: .github/workflows/<name>.yml, then add a row to .github/workflows/README.md.
#
# The SHAs below are placeholders for the pattern. Copy the SHA and version comment each action
# already has elsewhere in .github/workflows: workflow hygiene rejects tags, and rejects one
# action pinned to two different commits.

name: My Check

on:
  pull_request:
    paths:
      - ".github/workflows/my-check.yml"
      - ".github/actions/setup-dotnet-nuget/**"
      - "src/Meridian.Example/**"
      - "tests/Meridian.Example.Tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/my-check.yml"
      - ".github/actions/setup-dotnet-nuget/**"
      - "src/Meridian.Example/**"
      - "tests/Meridian.Example.Tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  my-check:
    name: My Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@<40-char SHA used in the repo> # vX.Y.Z
        with:
          persist-credentials: false

      - name: Set up .NET SDK and NuGet cache
        uses: ./.github/actions/setup-dotnet-nuget

      - name: Restore
        run: dotnet restore tests/Meridian.Example.Tests/Meridian.Example.Tests.csproj /p:EnableWindowsTargeting=true

      - name: Test
        run: >-
          dotnet test tests/Meridian.Example.Tests/Meridian.Example.Tests.csproj -c Release --no-restore
          /p:EnableWindowsTargeting=true
          --logger "trx;LogFilePrefix=my-check"
          --results-directory artifacts/test-results/my-check

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@<40-char SHA used in the repo> # vX.Y.Z
        with:
          name: my-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/my-check/
          if-no-files-found: error
          retention-days: 14
