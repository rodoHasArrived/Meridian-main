<!-- @dsCard group="Theming" viewport="1100x640" name="White-Label Kit" subtitle="Swap data-brand to re-skin every accent-driven surface live — indigo · emerald · rose · slate · cyan · amber" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
 body{margin:0;padding:22px;background:var(--bg);font-family:var(--font-body);color:var(--text-primary);}
 .wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
 h1{font:600 20px var(--font-display);margin:0;}
 .sub{font-size:12px;color:var(--text-muted);margin:-10px 0 0;}
 .brands{display:flex;gap:8px;flex-wrap:wrap;}
 .brand{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border);background:var(--bg-light);
   cursor:pointer;border-radius:2px;font-size:12px;font-weight:600;color:var(--text-secondary);}
 .brand[aria-pressed="true"]{border-color:var(--accent);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--accent);}
 .dot{width:12px;height:12px;border-radius:50%;border:1px solid #0002;}
 .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;}
 .panel{border:1px solid var(--border);background:var(--bg-light);padding:16px;}
 .eyebrow{font:600 10px var(--font-body);font-variant:all-small-caps;letter-spacing:.06em;color:var(--text-muted);margin:0 0 12px;}
 .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
 .btn{padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:2px;font-size:13px;font-weight:600;cursor:pointer;}
 .btn--ghost{background:transparent;color:var(--accent);}
 .link{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px;}
 .chk{width:18px;height:18px;border:1px solid var(--accent);background:var(--accent);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
 .track{height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;flex:1;min-width:120px;}
 .fill{height:100%;width:62%;background:var(--accent);}
 .mono{font-family:var(--font-data);font-size:12px;color:var(--text-muted);}
 .swatch{display:flex;align-items:center;gap:12px;margin-top:14px;}
 .swatch b{width:52px;height:52px;border:1px solid var(--border);background:var(--accent);border-radius:2px;flex:none;}
 .nav{display:flex;flex-direction:column;gap:2px;}
 .nav a{padding:6px 10px;font-size:12px;color:var(--text-secondary);border-radius:2px;text-decoration:none;}
 .nav a.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent);}
</style>
</head>
<body>
<div class="wrap">
 <h1>White-Label Kit</h1>
 <p class="sub">One attribute — <code>&lt;html data-brand&gt;</code> — remaps <code>--accent</code>, which every component reads. Nothing else changes.</p>
 <div class="brands" id="brands"></div>
 <div class="grid">
  <div class="panel">
    <p class="eyebrow">Accent surfaces</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn">Primary</button>
      <button class="btn btn--ghost">Ghost</button>
      <a class="link" href="#">Text link</a>
      <span class="chk">✓</span>
    </div>
    <div class="row"><span class="mono">Sync</span><div class="track"><div class="fill"></div></div><span class="mono">62%</span></div>
    <div class="swatch"><b id="chip"></b><div><div class="mono" id="hex">—</div><div class="mono">resolved --accent</div></div></div>
  </div>
  <div class="panel">
    <p class="eyebrow">Navigation</p>
    <nav class="nav">
      <a class="active" href="#">Dashboard</a>
      <a href="#">Trading Desk</a>
      <a href="#">Alerting</a>
      <a href="#">Collection</a>
    </nav>
  </div>
 </div>
</div>
<script>
const MAP={indigo:"#4F46E5",emerald:"#0B7A55",rose:"#E11D48",slate:"#64748B",cyan:"#0C6A85",amber:"#A34A08","":"#3B4656"};
const BRANDS=[["Default",""],["Indigo","indigo"],["Emerald","emerald"],["Rose","rose"],["Slate","slate"],["Cyan","cyan"],["Amber","amber"]];
const el=document.getElementById("brands");
function setBrand(b){
  if(b) document.documentElement.setAttribute("data-brand",b); else document.documentElement.removeAttribute("data-brand");
  [...el.children].forEach(c=>c.setAttribute("aria-pressed", c.dataset.b===b ? "true":"false"));
  requestAnimationFrame(()=>{ document.getElementById("hex").textContent=getComputedStyle(document.getElementById("chip")).backgroundColor; });
}
for(const [label,b] of BRANDS){
  const btn=document.createElement("button"); btn.className="brand"; btn.dataset.b=b;
  const dot=document.createElement("span"); dot.className="dot"; dot.style.background=MAP[b];
  btn.append(dot,document.createTextNode(label));
  btn.onclick=()=>setBrand(b);
  el.appendChild(btn);
}
setBrand("indigo");
</script>
</body>
</html>
