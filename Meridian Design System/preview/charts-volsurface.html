<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Charts: Volatility surface</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--text-primary); }
  .card { background: var(--bg-light); border: 1px solid var(--border-strong); border-radius: var(--radius-card); padding: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-strong); }
  .title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-secondary); }
  .title b { color: var(--text-primary); margin-right: 10px; }
  .scale { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .scale .bar { display: inline-block; width: 140px; height: 6px; /* @design-role quantitative-scale */ background: linear-gradient(90deg, color-mix(in srgb, var(--border) 20%, var(--bg-light)) 0%, color-mix(in srgb, var(--accent) 20%, var(--bg-light)) 40%, color-mix(in srgb, var(--orange) 20%, var(--bg-light)) 75%, color-mix(in srgb, var(--red) 20%, var(--bg-light)) 100%); border-radius: 1px; }
  .wrap { display: grid; grid-template-columns: 60px 1fr; gap: 8px; }
  .ylabels { display: grid; grid-template-rows: repeat(7, 1fr); font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); text-align: right; padding-right: 4px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(7, 32px); gap: 2px; }
  .cell { border-radius: var(--radius-card); font-family: var(--font-mono); font-size: 10px; color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .xlabels { display: grid; grid-template-columns: 60px 1fr; margin-top: 6px; }
  .xl { display: grid; grid-template-columns: repeat(9, 1fr); font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); text-align: center; }
  .axistitle { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.12em; text-align: center; margin-top: 4px; }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Charts: Volatility surface">
<h1 class="preview-sr-only">Charts: Volatility surface</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
<div class="card">
  <div class="head">
    <div class="title"><b>VOLATILITY SURFACE</b>SPX · ATM skew · today</div>
    <div class="scale"><span>12</span><span class="bar"></span><span>48</span></div>
  </div>
  <div class="wrap">
    <div class="ylabels">
      <div>2Y</div><div>1Y</div><div>6M</div><div>3M</div><div>1M</div><div>2W</div><div>1W</div>
    </div>
    <div class="grid" id="surf"></div>
  </div>
  <div class="xlabels">
    <div></div>
    <div class="xl">
      <div>80</div><div>85</div><div>90</div><div>95</div><div>100</div><div>105</div><div>110</div><div>115</div><div>120</div>
    </div>
  </div>
  <div class="axistitle">Strike (% of spot)   ·   y: tenor</div>
</div>
<script>
  // rows top→bot: tenors 2Y..1W (7). cols: strikes 80..120 (9)
  // surface: put wing high, skew, term structure rising slightly at short end
  const surface = [
    [22,20,18,17,16,16,17,18,19],   // 2Y
    [24,22,19,17,16,16,17,19,21],   // 1Y
    [26,24,20,17,15,15,17,20,23],   // 6M
    [29,26,22,18,15,14,16,21,25],   // 3M
    [33,29,24,19,15,13,16,22,28],   // 1M
    [37,32,26,20,15,13,17,24,32],   // 2W
    [42,36,28,21,15,13,18,27,36],   // 1W
  ];
  const g = document.getElementById('surf');
  function color(v){
    const t = Math.max(0, Math.min(1, (v - 12) / (48 - 12)));
    // Quantitative color scale: interpolate semantic stops, then use a restrained
    // wash so the numeric labels retain AA contrast in either appearance.
    const stops = ["--border", "--accent", "--orange", "--red"];
    const thresholds = [0, 0.4, 0.75, 1];
    const segment = t < 0.4 ? 0 : t < 0.75 ? 1 : 2;
    const k = (t - thresholds[segment]) / (thresholds[segment + 1] - thresholds[segment]);
    const signal = `color-mix(in srgb, var(${stops[segment]}) ${(1 - k) * 100}%, var(${stops[segment + 1]}))`;
    return `color-mix(in srgb, ${signal} 20%, var(--bg-light))`;
  }
  surface.forEach(row => {
    row.forEach(v => {
      const d = document.createElement('div');
      d.className = 'cell';
      d.style.background = color(v);
      d.textContent = v;
      g.appendChild(d);
    });
  });
</script>
</main>
</body>
</html>
