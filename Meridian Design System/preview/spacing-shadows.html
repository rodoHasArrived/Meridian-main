<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 22px 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px 16px; min-height: 90px; display: flex; flex-direction: column; gap: 6px; }
  .label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--fg); }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Shadows">
<h1 class="preview-sr-only">Shadows</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <div class="grid">
    <div class="card" style="box-shadow:var(--shadow-card);">
      <div class="label">panel</div><div class="val">none · borders carry structure</div>
    </div>
    <div class="card" style="box-shadow:var(--shadow-card);">
      <div class="label">workstation</div><div class="val">none · flat workstation plane</div>
    </div>
    <div class="card" style="box-shadow:var(--shadow-menu);">
      <div class="label">floating</div><div class="val">tight 0 2px 6px shadow · detached overlays only</div>
    </div>
  </div>
</main>
</body>
</html>
