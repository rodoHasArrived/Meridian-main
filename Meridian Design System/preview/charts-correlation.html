<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Charts: Correlation matrix</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--text-primary); }
  .card { background: var(--bg-light); border: 1px solid var(--border-strong); border-radius: var(--radius-card); padding: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-strong); }
  .title { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-secondary); }
  .title b { color: var(--text-primary); margin-right: 10px; }
  table { border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
  th, td { padding: 8px 10px; text-align: center; width: 56px; border: 1px solid var(--bg-medium); font-variant-numeric: tabular-nums; }
  th { color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; background: transparent; border: 0; padding-bottom: 4px; }
  td.label { text-align: left; color: var(--text-primary); border: 0; padding-right: 12px; font-weight: 500; }
  .legend { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .legend .bar { display: inline-block; width: 160px; height: 6px; /* @design-role quantitative-scale */ background: linear-gradient(90deg, color-mix(in srgb, var(--red) 20%, var(--bg-light)) 0%, var(--bg-light) 50%, color-mix(in srgb, var(--accent) 20%, var(--bg-light)) 100%); border-radius: 1px; }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Charts: Correlation matrix">
<h1 class="preview-sr-only">Charts: Correlation matrix</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
<div class="card">
  <div class="head">
    <div class="title"><b>CORRELATION MATRIX</b>daily returns · 60D</div>
    <div class="legend"><span>−1.0</span><span class="bar"></span><span>+1.0</span></div>
  </div>
  <table id="mx"></table>
</div>
<script>
  const syms = ["SPY","QQQ","IWM","AAPL","MSFT","NVDA","TSLA","TLT"];
  const m = [
    [1.00, 0.94, 0.82, 0.76, 0.78, 0.68, 0.52,-0.22],
    [0.94, 1.00, 0.74, 0.82, 0.85, 0.80, 0.58,-0.28],
    [0.82, 0.74, 1.00, 0.58, 0.60, 0.48, 0.44,-0.18],
    [0.76, 0.82, 0.58, 1.00, 0.72, 0.62, 0.42,-0.20],
    [0.78, 0.85, 0.60, 0.72, 1.00, 0.70, 0.48,-0.24],
    [0.68, 0.80, 0.48, 0.62, 0.70, 1.00, 0.54,-0.18],
    [0.52, 0.58, 0.44, 0.42, 0.48, 0.54, 1.00,-0.32],
    [-0.22,-0.28,-0.18,-0.20,-0.24,-0.18,-0.32, 1.00]
  ];
  const t = document.getElementById('mx');
  let h = '<tr><th></th>' + syms.map(s=>`<th>${s}</th>`).join('') + '</tr>';
  for (let i=0;i<syms.length;i++){
    h += `<tr><td class="label">${syms[i]}</td>`;
    for (let j=0;j<syms.length;j++){
      const v = m[i][j];
      let bg;
      if (i===j) bg = 'var(--bg-hover)';
      else if (v >= 0) bg = `color-mix(in srgb, var(--accent) ${5 + v * 15}%, var(--bg-light))`;
      else bg = `color-mix(in srgb, var(--red) ${5 + (-v) * 15}%, var(--bg-light))`;
      h += `<td style="background:${bg};color:var(--text-primary);">${v.toFixed(2)}</td>`;
    }
    h += '</tr>';
  }
  t.innerHTML = h;
</script>
</main>
</body>
</html>
