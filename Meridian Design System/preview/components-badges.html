<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--fg); }
  .group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .eyebrow { margin-bottom: 6px; display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-muted); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid transparent; font-family: var(--font-mono); }
  .b-outline { background: transparent; color: var(--fg-muted); border-color: #4A443C; }
  .b-live    { background: rgba(217,138,100,.10); color:#D98A64; border-color: rgba(217,138,100,.35); }
  .b-paper   { background: rgba(227,154,119,.10); color:#E39A77; border-color: rgba(227,154,119,.35); }
  .b-research{ background: rgba(167,158,146,.10); color:#B5AEA4; border-color: rgba(167,158,146,.35); }
  .b-success { background: rgba(95,163,124,.08); color:#5FA37C; border-color: rgba(95,163,124,.30); }
  .b-warning { background: rgba(194,154,74,.08); color:#C29A4A; border-color: rgba(194,154,74,.30); }
  .b-danger  { background: rgba(206,112,104,.08); color:#CE7068; border-color: rgba(206,112,104,.30); }
  .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Badges">
<h1 class="preview-sr-only">Badges</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <span class="eyebrow">Environment</span>
  <div class="group">
    <span class="badge b-live"><span class="dot"></span>LIVE</span>
    <span class="badge b-paper"><span class="dot"></span>PAPER</span>
    <span class="badge b-research"><span class="dot"></span>RESEARCH</span>
  </div>
  <span class="eyebrow">Status</span>
  <div class="group">
    <span class="badge b-success">Healthy</span>
    <span class="badge b-warning">Observe</span>
    <span class="badge b-danger">Constrained</span>
    <span class="badge b-outline">Trading</span>
  </div>
</main>
</body>
</html>
