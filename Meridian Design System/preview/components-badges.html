<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--fg); }
  .group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .eyebrow { margin-bottom: 6px; display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--fg-muted); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--radius-card); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid transparent; font-family: var(--font-mono); }
  .b-outline { background: transparent; color: var(--fg-muted); border-color: var(--border); }
  .b-live    { background: color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent-dim); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .b-paper   { background: color-mix(in srgb, var(--accent) 10%, transparent); color:var(--accent-dim); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .b-research{ background: color-mix(in srgb, var(--text-secondary) 10%, transparent); color:var(--text-secondary); border-color: color-mix(in srgb, var(--text-secondary) 35%, transparent); }
  .b-success { background: color-mix(in srgb, var(--green) 8%, transparent); color:var(--green-dim); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
  .b-warning { background: color-mix(in srgb, var(--orange) 8%, transparent); color:var(--orange-dim); border-color: color-mix(in srgb, var(--orange) 30%, transparent); }
  .b-danger  { background: color-mix(in srgb, var(--red) 8%, transparent); color:var(--red-dim); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
  .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Badges">
<h1 class="preview-sr-only">Badges</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <span class="eyebrow">Environment</span>
  <div class="group">
    <span class="badge b-live"><span class="dot"></span>LIVE</span>
    <span class="badge b-paper"><span class="dot"></span>PAPER</span>
    <span class="badge b-research"><span class="dot"></span>RESEARCH</span>
  </div>
  <span class="eyebrow">Status</span>
  <div class="group">
    <span class="badge b-success">Healthy</span>
    <span class="badge b-warning">Observe</span>
    <span class="badge b-danger">Constrained</span>
    <span class="badge b-outline">Trading</span>
  </div>
</main>
</body>
</html>
