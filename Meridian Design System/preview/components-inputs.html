<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--fg); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  label.l { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 4px; }
  input, select { width: 100%; border-radius: var(--radius-card); border: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 6px 10px; font-size: 12px; font-family: var(--font-mono); box-sizing: border-box; font-variant-numeric: tabular-nums; }
  .focus-demo { border-color: var(--accent) !important; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Form inputs">
<h1 class="preview-sr-only">Form inputs</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <div class="row">
    <div><label class="l" for="symbol">Symbol</label><input id="symbol" value="AAPL"></div>
    <div><label class="l" for="side">Side</label><select id="side"><option>Buy</option><option>Sell</option></select></div>
    <div><label class="l" for="order-type">Type</label><select id="order-type"><option>Market</option><option>Limit</option><option>Stop</option></select></div>
  </div>
  <div class="row">
    <div><label class="l" for="quantity">Quantity</label><input id="quantity" value="100"></div>
    <div><label class="l" for="limit-price">Limit · focus</label><input id="limit-price" class="focus-demo" value="187.42"></div>
    <div><label class="l" for="session-id">Session ID</label><input id="session-id" placeholder="sess-…"></div>
  </div>
</main>
</body>
</html>
