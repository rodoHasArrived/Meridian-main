<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .card { background: var(--bg-light); border: 1px solid var(--border); padding: 12px 12px 10px; min-height: 94px; display: flex; flex-direction: column; justify-content: space-between; }
  .label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Radii">
<h1 class="preview-sr-only">Radii</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <div class="grid">
    <div class="card" style="border-radius:var(--radius-chip);"><div class="label">chip / control / panel</div><div class="val">2px · unified</div></div>
    <div class="card" style="border-radius:var(--radius-sm);"><div class="label">sm</div><div class="val">2px</div></div>
    <div class="card" style="border-radius:var(--radius-md);"><div class="label">md</div><div class="val">3px</div></div>
    <div class="card" style="border-radius:var(--radius-lg);"><div class="label">lg</div><div class="val">4px</div></div>
    <div class="card" style="border-radius:var(--radius-xl);"><div class="label">xl · large sheet only</div><div class="val">6px ceiling</div></div>
  </div>
</main>
</body>
</html>
