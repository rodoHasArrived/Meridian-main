<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { padding: 14px 14px 12px; border-radius: var(--radius-card); border: 1px solid; min-height: 102px; display: flex; flex-direction: column; justify-content: space-between; }
  .sw .label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; }
  .sw .dot { height: 10px; width: 10px; border-radius: 999px; }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Semantic colors">
<h1 class="preview-sr-only">Semantic colors</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <div class="grid">
    <div class="sw" style="background: color-mix(in srgb, var(--green) 10%, transparent); border-color: color-mix(in srgb, var(--green) 30%, transparent); color:var(--green-dim);">
      <span class="dot" style="background:var(--green);"></span>
      <div><div class="label">Success</div><div class="hex">var(--green)</div></div>
    </div>
    <div class="sw" style="background: color-mix(in srgb, var(--orange) 10%, transparent); border-color: color-mix(in srgb, var(--orange) 30%, transparent); color:var(--orange-dim);">
      <span class="dot" style="background:var(--orange);"></span>
      <div><div class="label">Warning</div><div class="hex">var(--orange)</div></div>
    </div>
    <div class="sw" style="background: color-mix(in srgb, var(--red) 10%, transparent); border-color: color-mix(in srgb, var(--red) 30%, transparent); color:var(--red-dim);">
      <span class="dot" style="background:var(--red);"></span>
      <div><div class="label">Danger</div><div class="hex">var(--red)</div></div>
    </div>
    <div class="sw" style="background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color:var(--accent-dim);">
      <span class="dot" style="background:var(--accent-dim);"></span>
      <div><div class="label">Paper</div><div class="hex">var(--mode-paper)</div></div>
    </div>
    <div class="sw" style="background:var(--state-live-bg);border-color:var(--state-live-bd);color:var(--state-live-fg);">
      <span class="dot" style="background:var(--mode-live);"></span>
      <div><div class="label">Live · real money</div><div class="hex">var(--mode-live)</div></div>
    </div>
  </div>
</main>
</body>
</html>
