<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="preview-common.css">
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-sans); color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { padding: 14px 14px 12px; border-radius: 10px; border: 1px solid; min-height: 102px; display: flex; flex-direction: column; justify-content: space-between; }
  .sw .label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; }
  .sw .dot { height: 10px; width: 10px; border-radius: 999px; }
</style>
</head>
<body class="bg-app">
<main class="preview-sheet" aria-label="Semantic colors">
<h1 class="preview-sr-only">Semantic colors</h1>
<a class="preview-home-link" href="index.html">Catalogue</a>
  <div class="grid">
    <div class="sw" style="background: rgba(95, 163, 124, 0.10); border-color: rgba(95, 163, 124, 0.30); color:#5FA37C;">
      <span class="dot" style="background:#5FA37C;"></span>
      <div><div class="label">Success</div><div class="hex">#5FA37C</div></div>
    </div>
    <div class="sw" style="background: rgba(194, 154, 74, 0.10); border-color: rgba(194, 154, 74, 0.30); color:#C29A4A;">
      <span class="dot" style="background:#C29A4A;"></span>
      <div><div class="label">Warning</div><div class="hex">#C29A4A</div></div>
    </div>
    <div class="sw" style="background: rgba(206, 112, 104, 0.10); border-color: rgba(206, 112, 104, 0.30); color:#CE7068;">
      <span class="dot" style="background:#CE7068;"></span>
      <div><div class="label">Danger</div><div class="hex">#CE7068</div></div>
    </div>
    <div class="sw" style="background: rgba(227, 154, 119, 0.10); border-color: rgba(227, 154, 119, 0.30); color:#E39A77;">
      <span class="dot" style="background:#E39A77;"></span>
      <div><div class="label">Paper</div><div class="hex">#E39A77</div></div>
    </div>
    <div class="sw" style="background: rgba(217, 138, 100, 0.10); border-color: rgba(217, 138, 100, 0.30); color:#D98A64;">
      <span class="dot" style="background:#D98A64;"></span>
      <div><div class="label">Live</div><div class="hex">#D98A64</div></div>
    </div>
  </div>
</main>
</body>
</html>
