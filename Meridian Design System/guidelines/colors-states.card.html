<!-- @dsCard group="Colors" viewport="700x180" name="Semantic states" subtitle="Desaturated state samples — alpha-10 fill, solid border, readable captions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<title>Meridian — Semantic states</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../docs/specimen-layout.css">
<style>
  body { margin: 0; padding: 14px; background: var(--bg); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .chip { border-radius: 4px; padding: 10px; height: 60px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid; }
  .n { font-size: 10px; font-weight: 600; font-variant: all-small-caps; letter-spacing: .03em; }
  .v { font-family: var(--font-data); font-size: 8.5px; color: var(--text-secondary); }
  .caption { display: flex; flex-wrap: wrap; gap: 4px; justify-content: space-between; margin-top: 5px; color: var(--text-primary); }
  .cap { margin-top: 11px; font-size: 10px; font-weight: 600; font-variant: all-small-caps; color: var(--text-muted); letter-spacing: .03em; }
</style>
</head>
<body class="mds-specimen">
  <div class="row">
    <div class="sample"><div class="chip" style="color: var(--green-dim); border-color: var(--green); background: var(--green-a10);" aria-hidden="true"></div><div class="caption"><span class="n">Success</span><span class="v">#2E7655</span></div></div>
    <div class="sample"><div class="chip" style="color: var(--orange-dim); border-color: var(--orange); background: var(--orange-a10);" aria-hidden="true"></div><div class="caption"><span class="n">Warning</span><span class="v">#986717</span></div></div>
    <div class="sample"><div class="chip" style="color: var(--red-dim); border-color: var(--red); background: var(--red-a10);" aria-hidden="true"></div><div class="caption"><span class="n">Danger</span><span class="v">#B54B42</span></div></div>
    <div class="sample"><div class="chip" style="color: var(--brand-signal,#C56343); border-color: var(--brand-signal,#C56343); background: var(--blue-a10);" aria-hidden="true"></div><div class="caption"><span class="n">Info</span><span class="v">#C56343</span></div></div>
    <div class="sample"><div class="chip" style="color: var(--purple-dim); border-color: var(--purple); background: var(--purple-a10);" aria-hidden="true"></div><div class="caption"><span class="n">Pending</span><span class="v">#2F648A</span></div></div>
  </div>
  <div class="cap">Each sample retains its semantic border and alpha-10 wash; captions use readable ink. Never solid fills.</div>
</body>
</html>
