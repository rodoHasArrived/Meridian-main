<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--bg); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-surface); color: var(--accent); }
  img { width: 20px; height: 20px; }
  .n { font-family: var(--font-data); font-size: 7px; color: var(--text-muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
</style>
</head>
<body>
  <div class="grid" id="g"></div>
  <script>
    const names = ["dashboard","security-master","data-browser","data-quality","backtest","charting","trading","order-book","watchlist","live-data","research","strategy-runs","run-ledger","run-detail","run-portfolio","backfill","data-sources","data-calendar","data-export","data-operations","symbols","symbol-storage","storage","system-health","provider-health","diagnostics","governance","settings","schedule-manager","service-manager","trading-hours","event-replay","portfolio-import","account-portfolio","aggregate-portfolio","archive-health"];
    document.getElementById("g").innerHTML = names.map(n =>
      `<div class="ic"><img src="../assets/icons/${n}.svg" alt=""><span class="n">${n}</span></div>`
    ).join("");
  </script>
</body>
</html>
