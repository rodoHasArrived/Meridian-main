<!-- @dsCard group="Brand" viewport="700x180" name="Brand marks" subtitle="Mark, wordmark, monochrome — meridian glyph + latitude tick" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg); font-family: var(--font-body); display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 10px; }
  .cell { border: 1px solid var(--border); border-radius: 8px; background: var(--card-surface); display: flex; align-items: center; justify-content: center; padding: 14px; box-shadow: var(--shadow-card); }
  .cell.dark { background: var(--topbar-bg); border-color: var(--topbar-border); }
  img { max-width: 100%; max-height: 90px; }
</style>
</head>
<body>
  <div class="cell"><img src="../assets/brand/meridian-mark-light.svg" alt="Meridian mark on light"></div>
  <div class="cell"><img src="../assets/brand/meridian-wordmark.svg" alt="Meridian wordmark"></div>
  <div class="cell"><img src="../assets/brand/meridian-mark-monochrome.svg" alt="Monochrome mark"></div>
  <div class="cell dark"><img src="../assets/brand/meridian-mark.svg" alt="Mark on dark chrome bar"></div>
</body>
</html>
