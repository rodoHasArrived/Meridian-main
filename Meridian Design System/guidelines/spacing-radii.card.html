<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & accent bars" subtitle="2px chip · 2px control · 2px panel · 3/4px left accents · 1px hairlines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Radii &amp; accent bars</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text-primary); font-family: var(--font-body); display: flex; gap: 10px; align-items: stretch; }
  .box { flex: 1; border: 1px solid var(--border); background: var(--card-surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 108px; box-shadow: var(--shadow-card); }
  .n { font-size: 9.5px; font-weight: 600; font-variant: all-small-caps; letter-spacing: .03em; color: var(--text-muted); }
  .u { font-family: var(--font-data); font-size: 11px; color: var(--text-primary); }
  .accent { border-left-width: 3px; border-left-color: var(--accent); }
  .accent4 { border-left-width: 4px; border-left-color: var(--green); }
</style>
</head>
<body>
  <div class="box" style="border-radius: var(--radius-chip);"><span class="u">2px</span><span class="n">chip · badge</span></div>
  <div class="box" style="border-radius: var(--radius-button);"><span class="u">2px</span><span class="n">button · input</span></div>
  <div class="box" style="border-radius: var(--radius-card);"><span class="u">2px</span><span class="n">card · panel</span></div>
  <div class="box accent" style="border-radius: var(--radius-card);"><span class="u">3px left bar</span><span class="n">metric accent</span></div>
  <div class="box accent4" style="border-radius: var(--radius-card);"><span class="u">4px left bar</span><span class="n">tone inspector</span></div>
</body>
</html>
