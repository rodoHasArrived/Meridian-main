<!-- @dsCard group="Documentation" viewport="1200x900" name="Cookbook" subtitle="Five step-by-step recipes that bridge the patterns and the finished templates" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-body);color:var(--text-primary);}
  .wrap{max-width:1140px;margin:0 auto;}
  h1{font:600 22px var(--font-display);margin:0 0 4px;}
  .lede{font-size:13px;color:var(--text-secondary);margin:0 0 22px;max-width:760px;}
  .recipe{border:1px solid var(--border);background:var(--bg-light);margin-bottom:16px;}
  .rhead{display:flex;align-items:baseline;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg-panel,var(--bg-medium));}
  .num{font-family:var(--font-data);font-size:12px;font-weight:700;color:var(--accent);}
  .rtitle{font:600 15px var(--font-display);margin:0;}
  .count{margin-left:auto;font-family:var(--font-data);font-size:11px;color:var(--text-muted);}
  .rbody{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .goal{font-size:13px;color:var(--text-secondary);margin:0 0 12px;}
  .eyebrow{font:600 10px var(--font-body);font-variant:all-small-caps;letter-spacing:.06em;color:var(--text-muted);margin:0 0 8px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .chip{font-family:var(--font-data);font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:2px;color:var(--text-secondary);background:var(--bg);white-space:nowrap;}
  .rule{font-size:12px;color:var(--text-secondary);border-left:2px solid var(--accent);padding:2px 0 2px 10px;margin:0;}
  .rule b{color:var(--text-primary);}
  pre{margin:0;background:var(--bg);border:1px solid var(--border);padding:12px;overflow:auto;
    font-family:var(--font-data);font-size:11.5px;line-height:1.55;color:var(--text-primary);border-radius:2px;}
  .tok-k{color:var(--accent);} .tok-c{color:var(--text-muted);}
  @media(max-width:820px){.rbody{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cookbook</h1>
  <p class="lede">Each recipe names the exact components in play and the order to assemble them — bridging the principles in PATTERNS.md and the finished screens under <code>templates/</code>. Import everything from <code>window.MeridianDesignSystem_4f61be</code>.</p>
  <div id="out"></div>
</div>
<script>
const RECIPES = [
  { n: "01", title: "Triage screen", count: "8 components", template: "alerting-workstation",
    goal: "A list-driven monitoring surface: scan a severity-ranked table, select a row, inspect it — the shape behind Alerting, Trading, and Data Ops.",
    chips: ["WorkstationTopbar","NavRail","Toolbar","SplitPane","DenseDataTable","SeverityBadge","KeyValueGrid","StatusBar"],
    rule: "Always render the full data-state ladder — SkeletonTable, EmptyState, StatusBanner danger. Never show stale rows on error.",
    code: `<WorkstationTopbar moduleLabel="Alerting" environment="PAPER" />
<NavRail activeId="alerting" sections={SECTIONS} />
<Toolbar>{/* Input + data-state SegmentedControl */}</Toolbar>
<SplitPane primary="end" initial={340} persistKey="triage">
  <DenseDataTable columns={COLS} rows={rows}
    selectedIndex={i} onRowClick={(_, i) => setI(i)} />
  <KeyValueGrid columns={2} items={detail(rows[i])} />
</SplitPane>
<StatusBar items={STATUS} />` },
  { n: "02", title: "Validated form", count: "6 components", template: "report-scheduler",
    goal: "An operator form that blocks submit until valid and states errors inline — new report pack, rule editor, connection setup.",
    chips: ["Form","FormField","Input","NumberInput","FormValidation","Button","StatusBanner"],
    rule: "Validate on blur and on submit, never on first keystroke. The submit button is the source of truth — disable it, don't just warn.",
    code: `const form = useFormValidation(values, {
  name: (v) => !v && "Name is required",
  threshold: (v) => v <= 0 && "Must be positive",
});
<Form onSubmit={form.handleSubmit(save)}>
  <FormField label="Pack name" error={form.errors.name}>
    <Input value={values.name} onChange={form.set("name")} />
  </FormField>
  <Button variant="primary" type="submit"
    disabled={!form.isValid}>Create pack</Button>
</Form>` },
  { n: "03", title: "Monitoring wall", count: "5 components", template: "ingestion-operations",
    goal: "An at-a-glance ops wall — headline metrics, feed health, coverage — for a shared monitor. Terminal density fits more per screen.",
    chips: ["MetricCard","Delta","FreshnessIndicator","Sparkline","CoverageMatrix","LogTail"],
    rule: "The wall is glanceable — no interaction to read state. Color carries status (green live / amber partial / red gap); never text alone.",
    code: `<div style={{ display: "grid",
  gridTemplateColumns: "repeat(4, 1fr)", gap: "var(--gap-panel)" }}>
  <MetricCard label="Open P&L" value="$38,402" delta="+0.4%" trend="up" />
</div>
{providers.map((p) =>
  <FreshnessIndicator key={p.source} {...p} timeFormat="relative" />)}
<CoverageMatrix rows={SYMS} cols={DAYS} data={COV} onCellClick={openScan} />
<LogTail title="backfill-7743" height={230} entries={LOG} />` },
  { n: "04", title: "Books surface", count: "4 components", template: "journaling-workstation",
    goal: "An accounting view — a ledger, its reconciliation state, and the resulting statement.",
    chips: ["LedgerTable","AmountCell","ReconciliationPanel","StatementTable"],
    rule: "Money is always mono, right-aligned, tabular-nums, fixed decimals per column. Negatives use the red wash — never a bare minus in text.",
    code: `<LedgerTable entries={journal} />
<ReconciliationPanel bankRows={bank} bookRows={book} onMatch={match} />
<StatementTable sections={[
  { label: "Assets", rows: assets },
  { label: "Liabilities", rows: liabilities },
]} />` },
  { n: "05", title: "Order flow", count: "5 components", template: "trading-desk",
    goal: "The live trading path — pick an instrument, read the book, stage an order behind the real-capital gate, watch it fill.",
    chips: ["InstrumentChip","DepthLadder","OrderTicket","Blotter","FillsFeed"],
    rule: "In environment=\"live\" the submit stays disabled until the real-capital acknowledgement is checked. Side is a washed green/red — never a solid fill.",
    code: `<InstrumentChip symbol="AAPL" venue="XNAS" assetClass="eq" selected />
<DepthLadder bids={bids} asks={asks} lastPrice={201.11}
  onPriceClick={(p) => ticket.setLimit(p)} />
<OrderTicket symbol="AAPL" lastPrice={201.11}
  environment="live" onSubmit={placeOrder} />
<Blotter orders={orders} onRowClick={inspect} />
<FillsFeed fills={fills} />` },
];

function hl(code){
  return code
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/(\/\/[^\n]*)/g,'<span class="tok-c">$1</span>')
    .replace(/(\{\/\*[^]*?\*\/\})/g,'<span class="tok-c">$1</span>');
}
document.getElementById("out").innerHTML = RECIPES.map(r => `
  <div class="recipe">
    <div class="rhead"><span class="num">${r.n}</span><h2 class="rtitle">${r.title}</h2><span class="count">${r.count} · templates/${r.template}</span></div>
    <div class="rbody">
      <div>
        <p class="goal">${r.goal}</p>
        <p class="eyebrow">Assemble</p>
        <div class="chips">${r.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
        <p class="rule"><b>Rule.</b> ${r.rule}</p>
      </div>
      <div><pre>${hl(r.code)}</pre></div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
