</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;PAPER&quot;,&quot;options&quot;:[&quot;PAPER&quot;,&quot;LIVE&quot;,&quot;FIXTURE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  applyChrome() {
    const html = document.documentElement;
    html.setAttribute("data-theme", (window.MeridianPrefs?window.MeridianPrefs.theme(this.props.theme ?? "light"):(this.props.theme ?? "light")));
    html.setAttribute("data-environment", (window.MeridianPrefs?window.MeridianPrefs.environment(this.env()):(this.env())));
    if (document.body) document.body.setAttribute("data-theme-density", (window.MeridianPrefs?window.MeridianPrefs.density(this.props.density ?? "default"):(this.props.density ?? "default")));
  }
  componentDidMount() { this.applyChrome(); this._untick = window.MeridianWorld && window.MeridianWorld.tick(this); }
  componentWillUnmount() { this._untick && this._untick(); }
  componentDidUpdate() { this.applyChrome(); }
  ds() { return window.MeridianDesignSystem_205d17 || {}; }
  env() { return String(this.props.environment ?? "PAPER").toUpperCase(); }
  toast(kind, title, detail) { const t = window.MeridianToast; if (t && t[kind]) t[kind](title, detail); }

  // Real clock base, so alert ages and SLA countdowns stay honest whenever the screen is
  // opened — a frozen date makes every open alert look days old.
  NOW = Date.now();
  now() { return Date.now(); }
  clockLabel() { return window.MeridianWorld ? window.MeridianWorld.clock() : new Date(this.NOW).toISOString().slice(11, 19) + " UTC"; }
  STATE_BADGE = { Open: "NeedsAttention", Acked: "InReview", Silenced: "Pending", Closed: "Complete" };

  seedAlerts = [
    { id: "ALR-2214", rule: "Drawdown breach", scope: "momentum.v4", severity: "Critical", state: "Open", fired: this.NOW - 372000, value: "-8.4%", threshold: "-8.0%", owner: "r.alvarez", channel: "pager · email", fires24h: 3, silenceUntil: null,
      runbook: ["Confirm the drawdown against the run ledger's equity curve.", "Check whether the breach is a mark artefact — stale price on any leg.", "If genuine, halt new entries on momentum.v4 and page the PM."],
      events: [{ ts: this.NOW - 372000, action: "Alert fired", actor: "alerts-svc", severity: "danger", detail: "momentum.v4 drawdown -8.4% against -8.0% threshold · 15m window" }] },
    { id: "ALR-2213", rule: "Feed gap", scope: "Polygon · XNAS", severity: "Warning", state: "Open", fired: this.NOW - 1260000, value: "42s", threshold: "30s", owner: "ops-oncall", channel: "email", fires24h: 11, silenceUntil: null,
      runbook: ["Open Ingestion Operations and check the provider freshness strip.", "If the feed is stale, queue a gap backfill for the affected sessions.", "Silence for one hour only while a backfill is actually running."],
      events: [{ ts: this.NOW - 1260000, action: "Alert fired", actor: "alerts-svc", severity: "warning", detail: "Polygon XNAS quote gap 42s against 30s threshold" }] },
    { id: "ALR-2212", rule: "Order reject rate", scope: "IBKR paper", severity: "Warning", state: "Acked", fired: this.NOW - 4380000, value: "3.1%", threshold: "2.0%", owner: "k.ito", channel: "email", fires24h: 2, silenceUntil: null,
      runbook: ["Pull the rejects from the blotter and group by reason code.", "Most paper rejects are entitlement or tick-size — confirm which.", "Raise with the adapter owner if the reason is venue-side."],
      events: [
        { ts: this.NOW - 4100000, action: "Acknowledged", actor: "k.ito", severity: "accent", detail: "Investigating tick-size rejects on the paper adapter" },
        { ts: this.NOW - 4380000, action: "Alert fired", actor: "alerts-svc", severity: "warning", detail: "Reject rate 3.1% over a 30m window" }] },
    { id: "ALR-2211", rule: "Position limit", scope: "SPY short", severity: "Critical", state: "Acked", fired: this.NOW - 8100000, value: "-200", threshold: "-150", owner: "m.brandt", channel: "pager", fires24h: 1, silenceUntil: null,
      runbook: ["Confirm the position against the desk blotter.", "Reduce to within limit or obtain a written uplift from the Head of Desk.", "Record the uplift reference on this alert before resolving."],
      events: [
        { ts: this.NOW - 7900000, action: "Acknowledged", actor: "m.brandt", severity: "accent", detail: "Uplift requested from Head of Desk" },
        { ts: this.NOW - 8100000, action: "Alert fired", actor: "alerts-svc", severity: "danger", detail: "SPY short -200 against -150 limit" }] },
    { id: "ALR-2210", rule: "Stale mark", scope: "TLT", severity: "Info", state: "Closed", fired: this.NOW - 21600000, value: "6m", threshold: "5m", owner: "ops-oncall", channel: "email", fires24h: 4, silenceUntil: null,
      runbook: ["Check the mark source clock against the venue clock."],
      events: [
        { ts: this.NOW - 20000000, action: "Resolved", actor: "ops-oncall", severity: "success", detail: "Mark refreshed at 09:14Z · no valuation impact" },
        { ts: this.NOW - 21600000, action: "Alert fired", actor: "alerts-svc", severity: null, detail: "TLT mark 6m old against 5m threshold" }] },
    { id: "ALR-2209", rule: "Backfill overrun", scope: "Databento · daily", severity: "Info", state: "Closed", fired: this.NOW - 43200000, value: "18m", threshold: "15m", owner: "ops-oncall", channel: "email", fires24h: 1, silenceUntil: null,
      runbook: ["Compare the job's row count against the expected session count."],
      events: [
        { ts: this.NOW - 42000000, action: "Resolved", actor: "scheduler", severity: "success", detail: "Job completed 18m over budget · no data loss" },
        { ts: this.NOW - 43200000, action: "Alert fired", actor: "alerts-svc", severity: null, detail: "backfill-7701 ran 18m against a 15m budget" }] },
  ];

  ruleDiff = [
    { field: "Threshold", before: "-5.0%", after: "-8.0%" },
    { field: "Window", before: "5m", after: "15m" },
    { field: "Channels", before: "email", after: "email · pager" },
    { field: "Owner", before: "r.alvarez", after: "r.alvarez" },
  ];

  state = {
    alerts: this.seedAlerts, selected: "ALR-2214", query: "", localState: null,
    stateFilter: "open", sev: { Critical: true, Warning: true, Info: true },
    checked: [], tab: 0, note: "", revision: "pending",
  };

  patch(id, fn, event) {
    this.setState((s) => ({
      alerts: s.alerts.map((a) => {
        if (a.id !== id) return a;
        const next = { ...a, ...fn(a) };
        if (event) next.events = [event, ...(a.events || [])];
        return next;
      }),
    }));
  }

  ack(id, actor) {
    const a = this.state.alerts.find((x) => x.id === id);
    if (!a || a.state !== "Open") return;
    this.patch(id, () => ({ state: "Acked", owner: actor }), { ts: this.now(), action: "Acknowledged", actor, severity: "accent", detail: "Ownership taken · " + a.rule + " on " + a.scope });
  }

  silence(id, actor) {
    const a = this.state.alerts.find((x) => x.id === id);
    if (!a || a.state === "Closed") return;
    const until = this.now() + 3600000;
    this.patch(id, () => ({ state: "Silenced", silenceUntil: until }), { ts: this.now(), action: "Silenced 1h", actor, severity: "warning", detail: "Suppressed until " + new Date(until).toISOString().slice(11, 19) + "Z · re-fires after expiry" });
  }

  close(id, actor) {
    const a = this.state.alerts.find((x) => x.id === id);
    if (!a || a.state === "Closed") return;
    this.patch(id, () => ({ state: "Closed", silenceUntil: null }), { ts: this.now(), action: "Resolved", actor, severity: "success", detail: "Closed from triage · condition no longer observed" });
  }

  renderVals() {
    this.applyChrome();
    const s = this.state;
    const el = React.createElement;
    const { SeverityBadge, Timestamp, Delta } = this.ds();
    const effState = s.localState ?? this.props.dataState ?? "ready";
    const q = s.query.trim().toLowerCase();
    const inState = (a) => s.stateFilter === "all" ? true
      : s.stateFilter === "open" ? a.state === "Open" || a.state === "Acked"
      : s.stateFilter === "silenced" ? a.state === "Silenced"
      : a.state === "Closed";
    const rows = effState === "ready"
      ? s.alerts.filter((a) => s.sev[a.severity] && inState(a) && (!q || (a.rule + a.scope + a.id).toLowerCase().includes(q)))
      : [];
    // Selection holds the alert itself, not its row in the current filter. Resolving one drops it
    // out of "Needs action"; falling through to rows[0] would leave the same buttons in the same
    // place now pointed at a different alert — the operator's next click or `r` would land there.
    const held = s.alerts.find((a) => a.id === s.selected) || null;
    const row = held || rows[0] || null;
    const outOfFilter = !!(row && !rows.some((a) => a.id === row.id));
    const open = s.alerts.filter((a) => a.state === "Open").length;
    const silenced = s.alerts.filter((a) => a.state === "Silenced").length;
    const acked = s.alerts.filter((a) => a.state === "Acked").length;
    const mins = (ms) => Math.round(ms / 60000);
    return {
      envLabel: this.env(),
      clockLabel: this.clockLabel(),
      effState,
      openCount: String(open),
      hasSilenced: silenced > 0,
      silencedLabel: silenced + " silenced",
      freshStatus: effState === "error" ? "offline" : "live",
      freshLastSeen: this.NOW - 4000,
      mttaLabel: "MTTA 4m 12s · " + acked + " acked · " + s.alerts.length + " in window",
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      stateFilter: s.stateFilter,
      onStateFilter: (v) => this.setState({ stateFilter: v }),
      stateFilterOptions: [{ value: "open", label: "Needs action" }, { value: "silenced", label: "Silenced" }, { value: "closed", label: "Closed" }, { value: "all", label: "All" }],
      sevChips: ["Critical", "Warning", "Info"].map((k) => ({
        key: k, label: k, on: s.sev[k],
        toggle: () => this.setState({ sev: { ...s.sev, [k]: !s.sev[k] } }),
      })),
      stateOptions: [{ value: "ready", label: "Live" }, { value: "loading", label: "Loading" }, { value: "empty", label: "Empty" }, { value: "error", label: "Error" }],
      onStateDemo: (v) => this.setState({ localState: v }),
      onRetry: () => this.setState({ localState: "ready" }),
      hasRows: effState === "ready" && rows.length > 0,
      noMatch: effState === "ready" && rows.length === 0,
      noMatchDetail: q ? 'Nothing matches "' + s.query + '" in this filter.' : "No alerts in this state and severity filter.",
      onClearSearch: () => this.setState({ query: "", stateFilter: "all", sev: { Critical: true, Warning: true, Info: true } }),
      selectedId: row ? row.id : null,
      outOfFilter,
      outOfFilterNote: outOfFilter ? row.id + " is now " + row.state.toLowerCase() + ", so it has left the " + (s.stateFilter === "open" ? "needs-action" : s.stateFilter) + " queue. It stays open here until you pick another alert." : "",
      onFollowSel: () => this.setState({ stateFilter: row && row.state === "Closed" ? "closed" : row && row.state === "Silenced" ? "silenced" : "all" }),
      onRowClick: (r) => this.setState({ selected: r.id, tab: 0 }),
      alertRows: rows,
      checked: s.checked,
      checkedCount: s.checked.length,
      onChecked: (keys) => this.setState({ checked: keys }),
      bulkActions: [
        { id: "ack", label: "Acknowledge" },
        { id: "silence", label: "Silence 1h" },
        { id: "close", label: "Resolve" },
        { id: "clear", label: "Clear selection" },
      ],
      onBulk: (id) => {
        const ids = s.checked;
        if (id === "clear") return this.setState({ checked: [] });
        ids.forEach((k) => { if (id === "ack") this.ack(k, "k.ito"); else if (id === "silence") this.silence(k, "k.ito"); else this.close(k, "k.ito"); });
        this.setState({ checked: [] });
        this.toast("success", ids.length + " alert" + (ids.length === 1 ? "" : "s") + " updated", id === "ack" ? "Acknowledged by k.ito" : id === "silence" ? "Suppressed until 15:32:08Z" : "Resolved from triage");
      },
      alertColumns: [
        { key: "id", label: "Alert" },
        { key: "severity", label: "Severity", cell: (r) => SeverityBadge && el(SeverityBadge, { status: r.severity }) },
        { key: "rule", label: "Rule" },
        { key: "scope", label: "Scope" },
        { key: "value", label: "Observed", align: "right", cell: (r) => el("span", { style: { fontVariantNumeric: "tabular-nums", color: r.severity === "Critical" ? "var(--red-dim)" : "var(--text-primary)" } }, r.value + " / " + r.threshold) },
        { key: "fires24h", label: "24h", align: "right", tier: "full" },
        { key: "owner", label: "Owner", tier: "full" },
        { key: "state", label: "State", cell: (r) => SeverityBadge && el(SeverityBadge, { status: this.STATE_BADGE[r.state], label: r.state }) },
        { key: "fired", label: "Fired", align: "right", cell: (r) => Timestamp && el(Timestamp, { value: r.fired, format: "relative" }) },
      ],
      hasRow: !!row,
      noRow: !row,
      selId: row ? row.id : "",
      selSeverity: row ? row.severity : "Info",
      selState: row ? row.state : "",
      selStateBadge: row ? this.STATE_BADGE[row.state] : "Pending",
      selAgeLabel: row ? "fired " + mins(this.NOW - row.fired) + "m ago · " + row.fires24h + "× in 24h" : "",
      ackOff: !row || row.state !== "Open",
      silenceOff: !row || row.state === "Closed",
      silenceLabel: row && row.state === "Silenced" ? "Silenced" : "Silence 1h",
      closeOff: !row || row.state === "Closed",
      reopenOff: !row || row.state === "Open",
      onAck: () => { if (!row) return; this.ack(row.id, "k.ito"); this.toast("success", "Alert acknowledged", row.id + " · " + row.rule); },
      onSilence: () => { if (!row) return; this.silence(row.id, "k.ito"); this.toast("info", "Silenced 1h", row.id + " suppressed until 15:32:08Z"); },
      onClose: () => { if (!row) return; this.close(row.id, "k.ito"); this.toast("success", "Alert resolved", row.id + " closed"); },
      onReopen: () => {
        if (!row) return;
        this.patch(row.id, () => ({ state: "Open", silenceUntil: null }), { ts: this.now(), action: "Reopened", actor: "k.ito", severity: "warning", detail: "Condition observed again after resolution" });
        this.toast("warning", "Alert reopened", row.id + " back in the queue");
      },
      tabs: [{ label: "Detail" }, { label: "History", count: row ? (row.events || []).length : 0 }, { label: "Rule" }],
      tab: s.tab,
      onTab: (i) => this.setState({ tab: i }),
      tabDetail: s.tab === 0, tabHistory: s.tab === 1, tabRule: s.tab === 2,
      inspectorItems: row ? [
        { label: "Rule", value: row.rule },
        { label: "Scope", value: row.scope },
        { label: "Observed", value: Delta ? el(Delta, { value: parseFloat(row.value), suffix: row.value.replace(/^[-+0-9.]+/, ""), tone: row.severity === "Critical" ? "down" : "flat" }) : row.value },
        { label: "Threshold", value: row.threshold },
        { label: "Fired", value: Timestamp ? el(Timestamp, { value: row.fired, format: "time" }) : "" },
        { label: "State", value: row.state },
        { label: "Owner", value: row.owner },
        { label: "Channels", value: row.channel },
      ] : [],
      runbook: row ? (row.runbook || []).map((text, i) => ({ text, i })) : [],
      selEvents: row ? (row.events || []) : [],
      note: s.note,
      onNoteChange: (e) => this.setState({ note: e.target.value }),
      noteOff: !row || !s.note.trim(),
      onAddNote: () => {
        if (!row || !s.note.trim()) return;
        this.patch(row.id, () => ({}), { ts: this.now(), action: "Operator note", actor: "k.ito", severity: null, detail: s.note.trim() });
        this.setState({ note: "" });
      },
      ruleDiff: this.ruleDiff,
      revState: s.revision === "pending" ? "Pending approval" : s.revision === "approved" ? "Approved" : "Rejected",
      revBadge: s.revision === "pending" ? "InReview" : s.revision === "approved" ? "Complete" : "NotStarted",
      revPending: s.revision === "pending",
      revNote: s.revision === "pending"
        ? "Raising the drawdown threshold suppresses roughly 4 fires per month on momentum.v4. Approval is recorded against the alert's audit trail."
        : s.revision === "approved"
          ? "Approved by k.ito at 14:32Z — live from the next evaluation window."
          : "Rejected by k.ito at 14:32Z — the rule keeps its -5.0% threshold.",
      onApproveRev: () => {
        this.setState({ revision: "approved" });
        if (row) this.patch(row.id, () => ({ threshold: "-8.0%" }), { ts: this.now(), action: "Rule revision approved", actor: "k.ito", severity: "success", detail: "Threshold -5.0% → -8.0% · window 5m → 15m · pager added" });
        this.toast("success", "Revision approved", "momentum.v4 drawdown rule updated");
      },
      onRejectRev: () => {
        this.setState({ revision: "rejected" });
        if (row) this.patch(row.id, () => ({}), { ts: this.now(), action: "Rule revision rejected", actor: "k.ito", severity: "warning", detail: "Kept -5.0% threshold pending a second opinion from risk" });
        this.toast("info", "Revision rejected", "Rule left unchanged");
      },
      hotkeys: [
        { keys: "a", label: "Acknowledge selected alert", group: "Alerts", action: () => row && this.ack(row.id, "k.ito") },
        { keys: "s", label: "Silence selected alert 1h", group: "Alerts", action: () => row && this.silence(row.id, "k.ito") },
        { keys: "r", label: "Resolve selected alert", group: "Alerts", action: () => row && this.close(row.id, "k.ito") },
        { keys: "j", label: "Next alert", group: "Navigate", action: () => { const i = rows.findIndex((a) => row && a.id === row.id); this.setState({ selected: rows[Math.min(rows.length - 1, i + 1)].id }); } },
        { keys: "k", label: "Previous alert", group: "Navigate", action: () => { const i = rows.findIndex((a) => row && a.id === row.id); this.setState({ selected: rows[Math.max(0, i - 1)].id }); } },
      ],
      navSections: (window.MeridianAppMap ? window.MeridianAppMap.sections("alerting") : []),
      onNav: (id) => window.MeridianAppMap && window.MeridianAppMap.go(id),
      statusItems: [
        { status: effState === "error" ? "err" : "ok", label: "alerts-svc", value: effState === "error" ? "disconnected" : "streaming" },
        { label: "Rules", value: "24 active" },
        { label: "Open", value: String(open) },
        { label: "Acked", value: String(acked) },
        { status: silenced ? "warn" : "ok", label: "Silenced", value: String(silenced) },
        { status: "ok", label: "Latency", value: "9ms", push: true },
      ],
    };
  }
}
</script>
</body>
</html>
