<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../_scaffold/vendor/react-18.3.1.production.min.js"></script>
<script src="../_scaffold/vendor/react-dom-18.3.1.production.min.js"></script>
<script src="../../_preview_jsx.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Compose · Strategy Formation" description="One versioned Strategy from mandate to worksheet — six guarded formation stages and the cell-based builder as views over the same shared draft; every edit is visible to both." -->
<helmet>
<script src="./ds-base.js"></script>
<meta name="dc-template" content="strategy-formation">
<style>html,body{margin:0;padding:0;height:100%}[data-sf-view="off"]{display:none}</style>
</helmet>
<div data-sf-view="{{ formationShow }}" style="min-height:100vh"><dc-import name="StrategyOnboarding" theme="{{ themeProp }}" density="{{ densityProp }}" environment="{{ envProp }}" data-state="{{ dataStateProp }}" hint-size="100%,100vh"></dc-import></div>
<div data-sf-view="{{ builderShow }}" style="min-height:100vh"><dc-import name="StrategyBuilder" theme="{{ themeProp }}" density="{{ densityProp }}" environment="{{ envProp }}" data-state="{{ dataStateProp }}" hint-size="100%,100vh"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;formation&quot;,&quot;options&quot;:[&quot;formation&quot;,&quot;builder&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;View&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;FIXTURE&quot;,&quot;options&quot;:[&quot;PAPER&quot;,&quot;LIVE&quot;,&quot;FIXTURE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  state = { view: null };
  componentDidMount() {
    try { const v = new URL(window.location.href).searchParams.get("view"); if (v === "formation" || v === "builder") this.setState({ view: v }); } catch (e) {}
  }
  renderVals() {
    const view = this.state.view ?? this.props.view ?? "formation";
    return {
      formationShow: view === "builder" ? "off" : "on",
      builderShow: view === "builder" ? "on" : "off",
      themeProp: this.props.theme ?? "light",
      densityProp: this.props.density ?? "default",
      envProp: String(this.props.environment ?? "FIXTURE").toUpperCase(),
      dataStateProp: this.props.dataState ?? "ready",
    };
  }
}
</script>
</body>
</html>
