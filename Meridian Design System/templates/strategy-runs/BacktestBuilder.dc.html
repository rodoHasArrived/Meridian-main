<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<title>BacktestBuilder — Meridian</title>
</head>
<body>
<x-dc>
<!-- @template name="Companion · BacktestBuilder" description="Declared companion view of the strategy-runs template; retains the same shared object and workflow state." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="../_strategy-executor/executor-store.js"></script>
<script src="../_strategy-executor/screen-kit.js"></script>
<meta name="dc-template" content="backtest-builder">
<style>html,body{margin:0;padding:0;height:100%}</style>
</helmet>
<div data-screen-label="Backtest builder" style="height:100vh;display:flex;flex-direction:column;background:var(--bg);font-family:var(--font-body);color:var(--text-secondary);font-size:13px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.WorkstationTopbar" module-label="Backtest" environment="{{ envLabel }}" brand-src="../../assets/brand/meridian-mark-light.svg" hint-size="100%,48px"></x-import>
<div style="display:flex;flex:1;min-height:0">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.NavRail" active-id="backtest" sections="{{ navSections }}" on-select="{{ onNav }}" hint-size="224px,100%"></x-import>
<main style="flex:1;min-width:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<h1 style="font:600 22px var(--font-display);margin:0;color:var(--text-primary);white-space:nowrap">Backtest — {{ stratName }}</h1>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Badge" variant="{{ envVariant }}" dot="{{ true }}" hint-size="66px,18px">{{ envLabel }}</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Badge" variant="{{ freshVariant }}" dot="{{ true }}" hint-size="90px,18px">{{ freshLabel }}</x-import>
<div style="flex:1"></div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Tooltip" content="{{ exportReason }}" hint-size="86px,28px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Button" variant="ghost" size="sm" disabled="{{ exportDisabled }}" on-click="{{ onExport }}" hint-size="86px,28px">Export run</x-import>
</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Tooltip" content="{{ stageReason }}" hint-size="110px,28px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Button" variant="ghost" size="sm" disabled="{{ stageDisabled }}" on-click="{{ onStage }}" hint-size="110px,28px">Stage candidate</x-import>
</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Button" variant="primary" size="sm" on-click="{{ onRun }}" hint-size="98px,28px">{{ runLabel }}</x-import>
</div>
<sc-if value="{{ showStorageNotice }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.StatusBanner" tone="warning" title="{{ storageTitle }}" detail="{{ storageDetail }}" hint-size="100%,48px"></x-import>
</sc-if>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.PanelSurface" flat="{{ true }}" style="padding:12px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:12px;align-items:end" hint-size="100%,76px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Select" label="Dataset — material input" value="{{ ds }}" on-change="{{ onDs }}" options="{{ dsOptions }}" hint-size="100%,52px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Input" label="From" value="{{ from }}" on-change="{{ onFrom }}" hint-size="100%,52px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Input" label="To" value="{{ to }}" on-change="{{ onTo }}" hint-size="100%,52px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Input" label="Start capital" value="$1,000,000" hint-size="100%,52px"></x-import>
<sc-if value="{{ showRevert }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Button" variant="ghost" size="sm" on-click="{{ onRevert }}" hint-size="150px,28px">Revert to run inputs</x-import>
</sc-if>
</x-import>
<sc-if value="{{ staleBanner }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.StatusBanner" tone="warning" title="Proof is stale — export, promotion and approval are gated" detail="{{ staleDetail }}" hint-size="100%,48px"></x-import>
</sc-if>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.DataStateSwitch" state="{{ dataState }}" label="Backtest results" action-label="Re-run" on-action="{{ onRun }}" hint-size="100%,900px">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.MetricCard" label="Total return" value="{{ mTotal }}" delta="{{ mTotalDelta }}" tone="{{ mTotalTone }}" hint-size="100%,86px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.MetricCard" label="CAGR" value="{{ mCagr }}" delta="ACT/365.2425" tone="neutral" hint-size="100%,86px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.MetricCard" label="Max drawdown" value="{{ mMaxDd }}" delta="{{ mMaxDdDelta }}" tone="{{ mMaxDdTone }}" hint-size="100%,86px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.MetricCard" label="Sharpe" value="{{ mSharpe }}" delta="daily · rf 0 · √252" tone="info" hint-size="100%,86px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.MetricCard" label="Win rate" value="{{ mWin }}" delta="{{ mWinDelta }}" tone="neutral" hint-size="100%,86px"></x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.MetricCard" label="Turnover" value="{{ mTurn }}" delta="{{ mTurnDelta }}" tone="neutral" hint-size="100%,86px"></x-import>
</div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.ChartCard" title="Equity curve" subtitle="{{ eqSubtitle }}" readout="{{ eqReadout }}" height="{{ 300 }}" hint-size="100%,360px">
<div style="height:300px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.EquityCurve" series="{{ eqSeries }}" labels="{{ monthLabels }}" value-fmt="{{ fmtIdx }}" baseline="{{ 100 }}" baseline-label="Start = 100" height="{{ 300 }}" hint-size="100%,300px"></x-import>
</div>
</x-import>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.ChartCard" title="Drawdown" subtitle="Rolling-peak decline" readout="{{ ddReadout }}" height="{{ 240 }}" hint-size="100%,300px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.DrawdownChart" series="{{ ddSeries }}" labels="{{ monthLabels }}" threshold="{{ ddThreshold }}" value-fmt="{{ fmtPct }}" hint-size="100%,240px"></x-import>
</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.ChartCard" title="Daily returns" subtitle="{{ retSubtitle }}" readout="{{ retReadout }}" height="{{ 240 }}" hint-size="100%,300px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Histogram" values="{{ returns }}" bin-count="{{ 22 }}" value-fmt="{{ fmtPct1 }}" hint-size="100%,240px"></x-import>
</x-import>
</div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.PanelSurface" style="padding:0" hint-size="100%,260px">
<div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Eyebrow" hint-size="90px,14px">Trade blotter</x-import>
<div style="flex:1"></div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.Badge" variant="neutral" hint-size="80px,18px">{{ tradeChip }}</x-import>
</div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.DataGrid" row-key="index" columns="{{ tradeColumns }}" rows="{{ trades }}" hint-size="100%,210px"></x-import>
</x-import>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.StatusBanner" tone="{{ doneTone }}" title="{{ doneTitle }}" detail="{{ doneDetail }}" hint-size="100%,48px"></x-import>
</div>
</x-import>
</main>
</div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.StatusBar" items="{{ statusItems }}" hint-size="100%,28px"></x-import>
</div>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.ToastProvider" hint-size="0px,0px"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;FIXTURE&quot;,&quot;options&quot;:[&quot;PAPER&quot;,&quot;LIVE&quot;,&quot;FIXTURE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  state = { booted: false, bootError: null, draft: null, runId: null, from: "2024-07-01", to: "2026-06-30", running: false };
  K() { return window.MeridianExecutorKit; }
  componentDidMount() { const wait = setInterval(() => { if (this.K()) { clearInterval(wait); this.K().applyChrome(this.props, "FIXTURE"); this.K().boot(this, (X, idn) => { const run = idn.runId ? X.getRun(idn.runId) : null; return { draft: X.getStrategy(idn.strategyId), runId: idn.runId, from: run && run.request.window ? this.K().isoD(run.request.window.start) : "2024-07-01", to: run && run.request.window ? this.K().isoD(run.request.window.end) : "2026-06-30" }; }); } }, 30); this._wait = wait; }
  componentWillUnmount() { clearInterval(this._wait); this.K() && this.K().unboot(this); }
  componentDidUpdate() { this.K() && this.K().applyChrome(this.props, "FIXTURE"); }
  renderVals() {
    const K = this.K(), env = String(this.props.environment ?? "FIXTURE").toUpperCase();
    if (!K) return { dataState: "loading" };
    const base = { dataState: this.state.bootError ? "error" : (!this.state.booted ? "loading" : (this.props.dataState ?? "ready")), envLabel: env, envVariant: env.toLowerCase(), navSections: K.NAV_SECTIONS, onNav: (id) => K.nav(id), fmtIdx: (v) => v.toFixed(1), fmtPct: (v) => v.toFixed(1) + "%", fmtPct1: (v) => v.toFixed(2) + "%" };
    if (!this.state.booted) return { ...base, statusItems: [{ label: "Backtest", value: "Loading" }].concat(K.statusTail(env)), eqSeries: [], monthLabels: [], ddSeries: [], returns: [], trades: [], tradeColumns: this.tradeCols(), dsOptions: [], doneTone: "info", doneTitle: "Loading", stratName: "…" };
    const X = K.X(), SM = K.ds().StrategyModel, RM = K.ds().StrategyRunModel, d = this.state.draft;
    const runs = X.listRuns(d.id).filter((r) => r.lifecycle === "complete");
    const art = (this.state.runId && X.getRun(this.state.runId)) || runs.find((r) => !r.legacy) || null;
    const fresh = art ? X.freshnessFor(art.id) : { state: "unknown", changed: [] };
    const fb = K.freshBadge(art ? fresh.state : "unknown");
    const m = (art && art.metrics) || {};
    const eq = art && art.series ? art.series.equity : null;
    const bm = art && art.series ? art.series.benchmark : null;
    const sEq = K.sample(eq, 64), sBm = K.sample(bm, 64);
    const gated = !art || fresh.state !== "current";
    const storage = X.storageNotice();
    const issues = art ? art.validation.issues : [];
    const dl = () => { const blob = new Blob([JSON.stringify(art, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = art.id + ".artifact.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
    return {
      ...base,
      statusItems: [
        { label: "Run", value: art ? art.id : "none" },
        { label: "Proof", value: art && art.proof ? K.hash8(art.proof.inputHash) : "—" },
        { status: fresh.state === "current" ? "ok" : "warn", label: "Freshness", value: art ? fresh.state : "—" },
        { status: art && art.validation.disposition === "pass" ? "ok" : "warn", label: "Validation", value: art ? (art.validation.disposition || "—") : "—" },
      ].concat(K.statusTail(env)),
      stratName: d.name,
      freshVariant: fb.variant, freshLabel: fb.label,
      showStorageNotice: !!storage, storageTitle: storage ? storage.title : "", storageDetail: storage ? storage.message : "",
      exportDisabled: gated, exportReason: gated ? (art ? "Proof is stale — rerun or revert the draft before exporting." : "No completed run yet.") : "Download the immutable artifact JSON.",
      onExport: () => { if (!gated) dl(); },
      stageDisabled: gated, stageReason: gated ? (art ? "Stale proofs cannot be staged for review." : "No completed run yet.") : "Hand this run to Compare as candidate B.",
      onStage: () => { if (!gated) K.nav("compare", { runB: art.id, runA: runs.filter((r) => r.id !== art.id)[0] ? runs.filter((r) => r.id !== art.id)[0].id : null }); },
      runLabel: this.state.running ? "Running…" : "Run backtest",
      onRun: () => {
        const t = window.MeridianToast;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(this.state.from) || !/^\d{4}-\d{2}-\d{2}$/.test(this.state.to)) { t && t.error && t.error("Window invalid", "Dates are YYYY-MM-DD."); return; }
        this.setState({ running: true });
        setTimeout(() => {
          const res = X.runBacktest(d.id, { env: env.toLowerCase(), window: { start: this.state.from, end: this.state.to }, seedTag: "backtest" });
          if (res && res.ok) { X.setUrlState({ run: res.artifact.id }); this.setState({ running: false, runId: res.artifact.id, draft: X.getStrategy(d.id) }); const t2 = window.MeridianToast; t2 && t2.success && t2.success("Run complete · " + res.artifact.id, "Proof " + K.hash8(res.artifact.proof.inputHash) + " · " + res.artifact.validation.disposition); }
          else { this.setState({ running: false }); if (res) { t && t.error && t.error("Run blocked", res.issues[0].message); } }
        }, 400);
      },
      ds: d.universe.datasetId,
      onDs: (v) => { const next = X.updateStrategy(d.id, (x) => ({ ...x, universe: { ...x.universe, datasetId: v } })); this.setState({ draft: next }); },
      dsOptions: [{ value: "ig-corp", label: "IG Corp Bonds — 1,284 sessions" }, { value: "hy-corp", label: "HY Corp Bonds — 1,284 sessions" }, { value: "util", label: "Utility Sector — 988 sessions" }],
      from: this.state.from, onFrom: (e) => this.setState({ from: e.target.value }),
      to: this.state.to, onTo: (e) => this.setState({ to: e.target.value }),
      showRevert: art && fresh.state === "stale",
      onRevert: () => {
        const f = art.inputs.snapshot.fields;
        const next = X.updateStrategy(d.id, (x) => ({ ...x, mandate: { ...x.mandate, benchmark: f.mandate.benchmark }, universe: JSON.parse(JSON.stringify(f.universe)), portfolioRules: JSON.parse(JSON.stringify(f.portfolioRules)), riskGovernance: { ...x.riskGovernance, maxDrawdownPct: f.riskGovernance.maxDrawdownPct, grossExposureMax: f.riskGovernance.grossExposureMax, perNameMax: f.riskGovernance.perNameMax } }));
        this.setState({ draft: next });
        const t = window.MeridianToast; t && t.success && t.success("Draft reverted to run inputs", "Proof " + K.hash8(art.proof.materialHash) + " is current again.");
      },
      staleBanner: art && fresh.state === "stale",
      staleDetail: "Changed since " + (art ? art.id : "") + ": " + (fresh.changed.join(", ") || "material inputs") + ". Re-run to produce a new artifact, or revert the draft — historical artifacts never change.",
      // Every metric on this screen is the artifact's arithmetic, so all six tiles state the
      // same envelope: derived authority, the artifact and its input proof as evidence, and the
      // run's clock. A stale proof or a failed validation shows on the figures themselves —
      // not only in the banner above them.
      metricEnvelope: {
        condition: !art ? "missing"
          : fresh.state === "stale" ? "stale"
          : art.validation.disposition === "pass" ? "confirmed" : "provisional",
        detail: !art ? "no completed run"
          : fresh.state === "stale" ? "inputs changed since this run"
          : art.validation.disposition === "pass" ? undefined : "validation " + art.validation.disposition,
        authority: "derived",
        evidence: art ? [
          { label: "Run artifact", ref: art.id },
          { label: "Input proof", ref: art.proof ? K.hash8(art.proof.inputHash) : "—" },
        ] : [],
        clocks: art && art.completedAt
          ? { calculatedAt: new Date(art.completedAt).toISOString().replace("T", " ").slice(0, 19) + "Z" }
          : {},
      },
      mTotal: K.pct(m.totalReturn), mTotalTone: m.totalReturn == null ? "neutral" : m.totalReturn >= 0 ? "success" : "danger",
      mTotalDelta: m.excessReturn != null ? K.pct(m.excessReturn) + " vs benchmark" : "benchmark not recorded",
      mCagr: K.pct(m.cagr),
      mMaxDd: K.pct(m.maxDrawdown), mMaxDdTone: m.maxDrawdown == null ? "neutral" : "danger",
      mMaxDdDelta: "policy " + (d.riskGovernance.maxDrawdownPct != null ? "\u2212" + d.riskGovernance.maxDrawdownPct + "%" : "—"),
      mSharpe: m.sharpe == null ? "—" : m.sharpe.toFixed(2),
      mWin: m.winRate == null ? "—" : K.pctu(m.winRate),
      mWinDelta: art && art.trades ? art.trades.length + " trades" : "no trade record",
      mTurn: m.turnover == null ? "—" : m.turnover.toFixed(2) + "×",
      mTurnDelta: (m.avgHoldingDays != null ? "avg hold " + Math.round(m.avgHoldingDays) + "d" : "—") + (m.fees != null ? " · fees " + K.usd0(m.fees) : " · fees null"),
      eqSubtitle: art ? "Strategy vs " + (d.mandate.benchmark || "benchmark") + " · indexed to 100" : "No run selected",
      eqReadout: art ? [{ label: "run", value: art.id }, { label: "window", value: K.isoD(art.request.window.start) + " → " + K.isoD(art.request.window.end) }] : [],
      eqSeries: sEq.values.length ? [{ label: "Strategy", color: "var(--series-actual, #29323A)", points: sEq.values }].concat(sBm.values.length ? [{ label: "Benchmark", color: "var(--series-benchmark, #6D757D)", points: sBm.values, dashed: true, area: false }] : []) : [],
      monthLabels: sEq.labels,
      ddSeries: sEq.values.length ? K.ddPct(sEq.values) : [],
      ddThreshold: d.riskGovernance.maxDrawdownPct != null ? -d.riskGovernance.maxDrawdownPct : -10,
      ddReadout: m.maxDrawdown != null ? [{ label: "trough", value: K.pct(m.maxDrawdown) }] : [],
      retSubtitle: eq ? "Distribution · " + (eq.length - 1) + " sessions" : "—",
      retReadout: m.sharpe != null ? [{ label: "Sharpe", value: m.sharpe.toFixed(2) }] : [],
      returns: eq ? K.retPct(eq.map((p) => p.v)) : [],
      tradeChip: art && art.trades ? "8 of " + art.trades.length : "0",
      tradeColumns: this.tradeCols(),
      trades: art && art.trades ? art.trades.slice(0, 8).map((t) => { const closed = t.exitPx != null; const dir = /^(sell|short)$/i.test(t.side) ? -1 : 1; const pnl = closed ? ((t.exitPx - t.entryPx) * t.qty * dir - (t.fees || 0)) : null; return { id: t.id, symbol: t.symbol, side: t.side, qty: K.int(t.qty), entry: K.isoD(t.entryAt) + " @ " + t.entryPx.toFixed(2), exit: closed ? K.isoD(t.exitAt) + " @ " + t.exitPx.toFixed(2) : "open", fees: t.fees != null ? "$" + t.fees.toFixed(2) : "—", pnl: pnl == null ? "—" : (pnl >= 0 ? "+" : "\u2212") + "$" + K.int(Math.abs(Math.round(pnl))) }; }) : [],
      doneTone: !art ? "info" : art.validation.disposition === "pass" ? "success" : "warning",
      doneTitle: !art ? "No completed run for this strategy — run a backtest" : art.validation.disposition === "pass" ? "Backtest complete · " + art.id : "Backtest complete with issues · " + art.id,
      doneDetail: art ? (eq ? eq.length + " sessions" : "no series") + " · " + (art.trades ? art.trades.length + " trades" : "no trades") + " · " + K.durS(art.startedAt, art.completedAt) + " · snapshot v" + art.strategyVersion + " · " + (issues.length ? issues.length + " issue" + (issues.length === 1 ? "" : "s") + ": " + issues[0].message : "0 issues") : "Runs snapshot the draft — later edits never change a completed artifact.",
    };
  }
  tradeCols() { return [{ key: "id", label: "Trade", align: "left" }, { key: "symbol", label: "Symbol", align: "left" }, { key: "side", label: "Side", align: "left" }, { key: "qty", label: "Qty", align: "right" }, { key: "entry", label: "Entry", align: "right" }, { key: "exit", label: "Exit", align: "right" }, { key: "fees", label: "Fees", align: "right" }, { key: "pnl", label: "P&L", align: "right" }]; }
}
</script>
</body>
</html>
