<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../_scaffold/vendor/react-18.3.1.production.min.js"></script>
<script src="../_scaffold/vendor/react-dom-18.3.1.production.min.js"></script>
<script src="../../_preview_jsx.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./support.js"></script>
<title>Monitor · Strategy Runs — Meridian</title>
</head>
<body>
<x-dc>
<!-- @template name="Monitor · Strategy Runs" description="The immutable run-artifact ledger with its whole research loop as views — compose a backtest into a new artifact, compare two runs side by side, study a covered-call overwrite — freshness always derived against the current draft." -->
<helmet>
<script src="./ds-base.js"></script>
<meta name="dc-template" content="strategy-runs">
<style>html,body{margin:0;padding:0;height:100%}[data-sr-view="off"]{display:none!important}</style>
</helmet>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.DataStateSwitch" state="{{ dataStateProp }}" label="Workstation preview" action-label="Retry preview" on-action="{{ onPreviewRetry }}" hint-size="100%,100vh">
<div data-sr-view="{{ runsShow }}" style="min-height:100vh"><dc-import name="RunLedger" theme="{{ themeProp }}" density="{{ densityProp }}" environment="{{ envProp }}" data-state="{{ dataStateProp }}" hint-size="100%,100vh"></dc-import></div>
<div data-sr-view="{{ backtestShow }}" style="min-height:100vh"><dc-import name="BacktestBuilder" theme="{{ themeProp }}" density="{{ densityProp }}" environment="{{ envProp }}" data-state="{{ dataStateProp }}" hint-size="100%,100vh"></dc-import></div>
<div data-sr-view="{{ compareShow }}" style="min-height:100vh"><dc-import name="BacktestCompare" theme="{{ themeProp }}" density="{{ densityProp }}" environment="{{ envProp }}" data-state="{{ dataStateProp }}" hint-size="100%,100vh"></dc-import></div>
<div data-sr-view="{{ labShow }}" style="min-height:100vh"><dc-import name="CoveredCallLab" theme="{{ themeProp }}" density="{{ densityProp }}" environment="{{ envProp }}" data-state="{{ dataStateProp }}" hint-size="100%,100vh"></dc-import></div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;runs&quot;,&quot;options&quot;:[&quot;runs&quot;,&quot;backtest&quot;,&quot;compare&quot;,&quot;lab&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;View&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;FIXTURE&quot;,&quot;options&quot;:[&quot;PAPER&quot;,&quot;LIVE&quot;,&quot;FIXTURE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  state = { view: null, previewReady: false };
  VIEWS = ["runs", "backtest", "compare", "lab"];
  componentDidMount() {
    try { const v = new URL(window.location.href).searchParams.get("view"); if (this.VIEWS.includes(v)) this.setState({ view: v }); } catch (e) {}
  }
  componentDidUpdate(previous) {
    if (previous.dataState !== this.props.dataState && this.state.previewReady) this.setState({ previewReady: false });
  }
  renderVals() {
    const view = this.state.view ?? this.props.view ?? "runs";
    const show = (v) => (view === v ? "on" : "off");
    return {
      runsShow: this.VIEWS.includes(view) ? show("runs") : "on",
      backtestShow: show("backtest"),
      compareShow: show("compare"),
      labShow: show("lab"),
      themeProp: this.props.theme ?? "light",
      densityProp: this.props.density ?? "default",
      envProp: String(this.props.environment ?? "FIXTURE").toUpperCase(),
      dataStateProp: this.state.previewReady ? "ready" : (this.props.dataState ?? "ready"),
      onPreviewRetry: () => this.setState({ previewReady: true }),
    };
  }
}
</script>
</body>
</html>
