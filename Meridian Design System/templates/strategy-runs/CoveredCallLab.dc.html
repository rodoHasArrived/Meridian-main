<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;FIXTURE&quot;,&quot;options&quot;:[&quot;FIXTURE&quot;,&quot;PAPER&quot;,&quot;LIVE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  state = { booted: false, bootError: null, tab: 0, runs: [], selId: null, params: { underlying: "MSFT", shares: 800, from: "2026-01-02", to: "2026-06-30", ratio: 0.75, maxDelta: 0.35, minIv: 50, maxSpread: 5, takeProfit: 80, rollDelta: 0.55 } };
  K() { return window.MeridianExecutorKit; }
  componentDidMount() { const wait = setInterval(() => { if (this.K()) { clearInterval(wait); this.K().applyChrome(this.props, "FIXTURE"); this.K().boot(this, (X) => { const runs = this.buildFixtureRuns(); return { runs, selId: "CC-0118", params: runs[0].labParams }; }); } }, 30); this._wait = wait; }
  componentWillUnmount() { clearInterval(this._wait); this.K() && this.K().unboot(this); }
  componentDidUpdate() { this.K() && this.K().applyChrome(this.props, "FIXTURE"); }
  // ---- lab engine: deterministic covered-call study → shared StrategyRunArtifact v1 ----
  engine(params, id, at) {
    const K = this.K(), X = K.X(), SM = K.ds().StrategyModel, RM = K.ds().StrategyRunModel, I = X._internals;
    const contracts = Math.floor(params.shares / 100), written = Math.max(0, Math.round(contracts * params.ratio));
    const seed = I.seedOf(SM.canonicalize(params));
    const r = I.rng(seed);
    const days = I.businessDays(params.from, params.to);
    const drift = params.underlying === "AAPL" ? 0.0007 : 0.0009;
    let u = 100; const under = [{ t: days[0], v: 100 }];
    for (let i = 1; i < days.length; i++) { u *= 1 + drift + (r() - 0.5) * 0.016; under.push({ t: days[i], v: Math.round(u * 10000) / 10000 }); }
    const capBase = 0.003 + (0.6 - params.maxDelta) * 0.004, prem = (0.00018 + params.maxDelta * 0.00042) * (0.8 + params.minIv / 250);
    let s = 100; const strat = [{ t: days[0], v: 100 }];
    for (let i = 1; i < days.length; i++) { const ur = under[i].v / under[i - 1].v - 1; s *= 1 + ur * (1 - params.ratio) + Math.min(ur, capBase) * params.ratio + prem * params.ratio; strat.push({ t: days[i], v: Math.round(s * 10000) / 10000 }); }
    const trades = []; const cycle = 21;
    for (let c = 0; c * cycle + 5 < days.length && written > 0; c++) {
      const ei = c * cycle, xi = Math.min(days.length - 1, ei + cycle - 2);
      const spot = under[ei].v * 4.682; // price scale ≈ $468 per 100 index
      const strike = Math.round((spot * (1 + (0.55 - params.maxDelta) * 0.12)) / 5) * 5;
      const credit = Math.round(spot * (0.008 + params.maxDelta * 0.012) * 100) / 100;
      const spotExit = under[xi].v * 4.682;
      const assigned = spotExit > strike;
      const decayed = Math.round(Math.max(0, credit * (0.15 + (r() - 0.5) * 0.1)) * 100) / 100;
      const debit = assigned ? Math.round((spotExit - strike + credit * 0.15) * 100) / 100 : (r() < params.takeProfit / 130 ? Math.round(credit * (1 - params.takeProfit / 100) * 100) / 100 : decayed);
      const reason = assigned ? "Assigned" : debit <= credit * (1 - params.takeProfit / 100) + 0.011 ? "TakeProfit" : (r() < 0.18 ? "Rolled" : "Expired");
      trades.push({ id: "CCT-" + (100 + c), symbol: params.underlying + " " + strike + "C", side: "Sell", qty: written * 100, entryAt: days[ei], entryPx: credit, exitAt: days[xi], exitPx: reason === "Rolled" ? Math.round(credit * 1.32 * 100) / 100 : debit, fees: Math.round(0.65 * written * 100) / 100, reason, strike, assigned });
    }
    const labDraft = SM.createDraft({ id: "STR-CCLAB-" + params.underlying, version: 1, name: "Covered-call overlay · " + params.underlying, universe: { datasetId: params.underlying.toLowerCase() + "-options", assetClass: "equity-options", filters: [{ field: "DELTA", op: "<=", value: params.maxDelta }], minAdv: null }, portfolioRules: { entry: "Sell " + written + " calls at ≤ " + params.maxDelta + "Δ", exit: "Take profit at " + params.takeProfit + "% capture; roll at " + params.rollDelta + "Δ", sizing: params.ratio * 100 + "% overwrite", maxPositions: written, rebalance: "Monthly cycle", worksheet: [] } });
    let run = RM.createRun(labDraft, { id, env: "fixture", window: { start: params.from, end: params.to }, dataset: { id: params.underlying + " options", label: params.underlying + " chain · fixture" }, engine: { name: "cc-lab", version: "1.3" }, at });
    run = RM.completeRun(RM.startRun(run, at + 20000), { series: { equity: strat, benchmark: under }, trades, at: at + 141000 });
    return { artifact: run, labParams: JSON.parse(JSON.stringify(params)), id, contracts, written };
  }
  buildFixtureRuns() {
    const base = { underlying: "MSFT", shares: 800, from: "2026-01-02", to: "2026-06-30", ratio: 0.75, maxDelta: 0.35, minIv: 50, maxSpread: 5, takeProfit: 80, rollDelta: 0.55 };
    return [
      this.engine(base, "CC-0118", Date.parse("2026-07-02T14:10:00Z")),
      this.engine({ ...base, maxDelta: 0.25, ratio: 0.5 }, "CC-0117", Date.parse("2026-07-01T09:20:00Z")),
      this.engine({ ...base, from: "2025-01-02", to: "2025-12-31" }, "CC-0112", Date.parse("2026-01-05T10:00:00Z")),
    ];
  }
  setParam(k) { return (v) => this.setState({ params: { ...this.state.params, [k]: v && v.target ? v.target.value : v } }); }
  renderVals() {
    const K = this.K(), env = String(this.props.environment ?? "FIXTURE").toUpperCase();
    if (!K) return { dataState: "loading" };
    const base = { dataState: this.state.bootError ? "error" : (!this.state.booted ? "loading" : (this.props.dataState ?? "ready")), onRetry: () => window.location.reload(), envLabel: env, envVariant: env.toLowerCase(),
      navSections: [
        { label: "Strategy", items: [{ id: "builder", label: "Strategy Builder", icon: "../../assets/icons/strategy-builder.svg" }, { id: "backtest", label: "Backtest", icon: "../../assets/icons/backtest.svg" }, { id: "cclab", label: "Covered-Call Lab", icon: "../../assets/icons/order-book.svg", shortcut: "G C" }] },
        { label: "Review", items: [{ id: "runs", label: "Strategy Runs", icon: "../../assets/icons/strategy-runs.svg" }, { id: "compare", label: "Run Compare", icon: "../../assets/icons/run-mat.svg" }] },
      ],
      onNav: (id) => { if (id !== "cclab") K.nav(id); },
      fmtRatioPct: (v) => (v * 100).toFixed(0) + "%", fmtDelta2: (v) => v.toFixed(2) + "Δ", fmtInt0: (v) => v.toFixed(0), fmtPct1: (v) => v.toFixed(1) + "%", fmtPct0: (v) => v.toFixed(0) + "%", fmtIdx: (v) => v.toFixed(1),
      tabDefs: ["Result", "Chain preview", "Run library"], tab: this.state.tab, onTab: (i) => this.setState({ tab: i }),
      showResult: this.state.tab === 0, showChain: this.state.tab === 1, showLibrary: this.state.tab === 2,
    };
    if (!this.state.booted) return { ...base, statusItems: [{ label: "Study", value: "Loading" }].concat(K.statusTail(env)), equitySeries: [], equityLabels: [], tradeCols: [], tradeRows: [], fullMetrics: [], chainCols: [], chainRows: [], libraryCols: [], libraryRows: [], requestFacts: [], underlyingOptions: [], studyChip: "…" };
    const X = K.X(), SM = K.ds().StrategyModel, p = this.state.params;
    const sel = this.state.runs.find((r) => r.id === this.state.selId) || this.state.runs[0];
    const art = sel.artifact, m = art.metrics || {};
    const edited = SM.canonicalize(p) !== SM.canonicalize(sel.labParams);
    const storage = X.storageNotice();
    const contracts = Math.floor(p.shares / 100), written = Math.max(0, Math.round(contracts * p.ratio));
    const sEq = K.sample(art.series.equity, 60), sUn = K.sample(art.series.benchmark, 60);
    const days = (Date.parse(sel.labParams.to) - Date.parse(sel.labParams.from)) / 86400000;
    const closed = (art.trades || []).filter((t) => t.exitPx != null);
    const assigned = closed.filter((t) => t.assigned).length;
    const premium = (art.trades || []).reduce((a, t) => a + t.entryPx * t.qty, 0);
    const optionPnl = closed.reduce((a, t) => a + (t.entryPx - t.exitPx) * t.qty - (t.fees || 0), 0);
    const uRet = art.series.benchmark[art.series.benchmark.length - 1].v / 100 - 1;
    const spot = 468.2;
    const chain = this.chainRows(p, spot);
    const pass = chain.filter((c) => c.meets).length;
    const el = React.createElement, { Badge, SeverityBadge } = K.ds();
    return {
      ...base,
      statusItems: [
        { status: "ok", label: "Run", value: sel.id + " · " + art.lifecycle },
        { label: "Artifact", value: art.schema.split("/")[0].split(".").pop() + " v1 · " + K.hash8(art.proof.inputHash) },
        { label: "Chain", value: chain.length + " scanned · " + pass + " pass" },
      ].concat(K.statusTail(env)),
      studyChip: p.underlying + " · " + p.from.slice(0, 4) + (p.from.slice(5, 7) <= "06" ? " H1" : " H2"),
      edited,
      onOpenLibrary: () => this.setState({ tab: 2 }),
      showStorageNotice: !!storage, storageTitle: storage ? storage.title : "", storageDetail: storage ? storage.message : "",
      runStatus: art.lifecycle === "complete" ? "Completed" : "Failed", runLabel: "Run " + sel.id,
      underlying: p.underlying, onUnderlying: this.setParam("underlying"),
      underlyingOptions: [{ value: "MSFT", label: "MSFT — Microsoft" }, { value: "AAPL", label: "AAPL — Apple" }],
      shares: p.shares, onShares: (v) => this.setState({ params: { ...p, shares: v } }),
      from: p.from, onFrom: this.setParam("from"), to: p.to, onTo: this.setParam("to"),
      reconcileNote: K.int(p.shares) + " shares → " + contracts + " contracts coverable · writing " + written + " at " + (p.ratio * 100).toFixed(0) + "% overwrite" + (p.shares % 100 ? " · " + (p.shares % 100) + " odd-lot shares stay unhedged" : ""),
      ratio: p.ratio, onRatio: (v) => this.setState({ params: { ...p, ratio: v } }),
      maxDelta: p.maxDelta, onMaxDelta: (v) => this.setState({ params: { ...p, maxDelta: v } }),
      minIv: p.minIv, onMinIv: (v) => this.setState({ params: { ...p, minIv: v } }),
      maxSpread: p.maxSpread, onMaxSpread: (v) => this.setState({ params: { ...p, maxSpread: v } }),
      takeProfit: p.takeProfit, onTakeProfit: (v) => this.setState({ params: { ...p, takeProfit: v } }),
      rollDelta: p.rollDelta, onRollDelta: (v) => this.setState({ params: { ...p, rollDelta: v } }),
      requestFacts: [
        { label: "DTE window", value: "7 – 60" },
        { label: "Min OI / vol", value: "1,000 / 100" },
        { label: "Contracts", value: written + " of " + contracts },
        { label: "Initial", value: "$100k + " + K.int(p.shares) + " sh" },
      ],
      onPreviewChain: () => this.setState({ tab: 1 }),
      queueLabel: edited ? "Queue run — recompute" : "Queue run",
      onQueueRun: () => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(p.from) || !/^\d{4}-\d{2}-\d{2}$/.test(p.to)) { const t = window.MeridianToast; t && t.error && t.error("Window invalid", "Dates are YYYY-MM-DD."); return; }
        const id = "CC-" + String(119 + this.state.runs.filter((r) => r.id.startsWith("CC-01") && parseInt(r.id.slice(3), 10) >= 119).length).padStart(4, "0");
        const run = this.engine(p, id, Date.now());
        this.setState({ runs: [run, ...this.state.runs], selId: id, tab: 0 });
        const t = window.MeridianToast; t && t.success && t.success("Run complete · " + id, "Artifact " + K.hash8(run.artifact.proof.inputHash) + " · metrics derived from raw series and trades");
      },
      periodLabel: "Period return · " + Math.round(days / 30.44) + "mo",
      mPeriod: K.pct(m.totalReturn), mPeriodDelta: "CAGR (ann.) " + K.pct(m.cagr) + " · underlying " + K.pct(uRet),
      mSharpe: m.sharpe == null ? "—" : m.sharpe.toFixed(2),
      mMaxDd: K.pct(m.maxDrawdown),
      mWin: m.winRate == null ? "—" : K.pctu(m.winRate, 0),
      mWinDelta: closed.length + " closed · " + (closed.length ? Math.round((assigned / closed.length) * 100) : 0) + "% assigned",
      equitySeries: [{ label: "Covered-call overlay", color: "var(--scenario-signal, #C56343)", points: sEq.values, dashed: true }, { label: p.underlying + " buy & hold", color: "var(--series-actual, #29323A)", points: sUn.values, area: false }],
      equityLabels: sUn.labels,
      tradeCols: [
        { key: "strike", label: "Strike", align: "right", cell: (r) => "$" + r.strike },
        { key: "expiration", label: "Expiry" }, { key: "qtyC", label: "Qty", align: "right" },
        { key: "credit", label: "Credit", align: "right" }, { key: "debit", label: "Debit", align: "right" },
        { key: "reason", label: "Exit", cell: (r) => Badge ? el(Badge, { variant: r.assigned ? "warning" : r.win ? "success" : "neutral" }, r.reason) : r.reason },
        { key: "pnl", label: "Net P&L", align: "right", cell: (r) => el("span", { style: { color: r.pnlNeg ? "var(--red-dim, #873832)" : "var(--green-dim, #23583F)", fontFamily: "var(--font-data)" } }, r.pnl) },
        { key: "days", label: "Days", align: "right" },
      ],
      tradeRows: closed.slice(0, 6).map((t) => { const pnl = (t.entryPx - t.exitPx) * t.qty - (t.fees || 0); return { strike: t.strike, expiration: K.isoD(t.exitAt), qtyC: t.qty / 100, credit: "$" + t.entryPx.toFixed(2), debit: "$" + t.exitPx.toFixed(2), reason: t.reason, assigned: t.assigned, win: pnl > 0, pnl: (pnl >= 0 ? "+$" : "\u2212$") + K.int(Math.abs(Math.round(pnl))), pnlNeg: pnl < 0, days: Math.round((t.exitAt - t.entryAt) / 86400000) }; }),
      fullMetrics: [
        { label: "Premium collected", value: K.usd0(premium) },
        { label: "Option P&L", value: K.usd0s(optionPnl) },
        { label: "Excess vs underlying", value: K.pct(m.excessReturn) },
        { label: "Avg holding", value: m.avgHoldingDays == null ? "—" : m.avgHoldingDays.toFixed(1) + " days" },
        { label: "Turnover (ann.)", value: m.turnover == null ? "—" : m.turnover.toFixed(2) + "×" },
        { label: "Fees", value: m.fees == null ? "null · unrecorded" : K.usd0(m.fees) },
        { label: "Validation", value: (art.validation.disposition || "—") + " · " + art.validation.issues.length + " issues" },
        { label: "Proof", value: K.hash8(art.proof.inputHash) },
      ],
      chainHead: "Chain preview · " + p.underlying + " as-of 2026-07-02 · underlying $" + spot.toFixed(2),
      chainChip: chain.length + " contracts scanned · " + pass + " pass",
      chainCols: [
        { key: "strike", label: "Strike", align: "right" }, { key: "expiration", label: "Expiration" }, { key: "dte", label: "DTE", align: "right" },
        { key: "bid", label: "Bid", align: "right" }, { key: "ask", label: "Ask", align: "right" }, { key: "delta", label: "Delta", align: "right" },
        { key: "iv", label: "IV", align: "right" }, { key: "oi", label: "OI", align: "right", cell: (r) => K.int(r.oi) },
        { key: "meets", label: "Filters", cell: (r) => SeverityBadge ? el(SeverityBadge, r.meets ? { status: "Passed", label: "Pass" } : { status: "Blocked", label: r.reject }) : (r.meets ? "Pass" : r.reject) },
      ],
      chainRows: chain,
      libraryCols: [
        { key: "runId", label: "Run" }, { key: "underlying", label: "Underlying" }, { key: "period", label: "Period" }, { key: "label", label: "Label" },
        { key: "status", label: "Status", cell: (r) => SeverityBadge ? el(SeverityBadge, { status: r.status }) : r.status },
        { key: "period_return", label: "Period return", align: "right" }, { key: "sharpe", label: "Sharpe", align: "right" }, { key: "winRate", label: "Win rate", align: "right" },
      ],
      libraryRows: this.state.runs.map((r) => ({ runId: r.id, underlying: r.labParams.underlying, period: r.labParams.from + " → " + r.labParams.to, label: r.id === "CC-0118" ? "Baseline 0.35Δ" : r.id === "CC-0117" ? "Tight 0.25Δ · 50%" : r.id === "CC-0112" ? "FY25 replay" : "Scenario", status: "Completed", period_return: K.pct(r.artifact.metrics.totalReturn), sharpe: r.artifact.metrics.sharpe == null ? "—" : r.artifact.metrics.sharpe.toFixed(2), winRate: r.artifact.metrics.winRate == null ? "—" : K.pctu(r.artifact.metrics.winRate, 0) })),
      librarySel: this.state.runs.findIndex((r) => r.id === this.state.selId),
      onLibraryPick: (row) => { const r = this.state.runs.find((x) => x.id === row.runId); if (r) this.setState({ selId: r.id, params: JSON.parse(JSON.stringify(r.labParams)), tab: 0 }); },
    };
  }
  chainRows(p, spot) {
    const raw = [
      { strike: 475, expiration: "2026-07-24", dte: 19, bid: 3.85, ask: 3.95, delta: 0.31, iv: 24.2, oi: 14210 },
      { strike: 480, expiration: "2026-07-24", dte: 19, bid: 2.9, ask: 3.0, delta: 0.26, iv: 23.8, oi: 18440 },
      { strike: 485, expiration: "2026-08-21", dte: 47, bid: 4.1, ask: 4.25, delta: 0.29, iv: 24.9, oi: 9210 },
      { strike: 470, expiration: "2026-07-24", dte: 19, bid: 4.95, ask: 5.1, delta: 0.38, iv: 24.6, oi: 11020 },
      { strike: 500, expiration: "2026-08-21", dte: 47, bid: 1.55, ask: 1.8, delta: 0.14, iv: 23.1, oi: 820 },
      { strike: 490, expiration: "2026-07-10", dte: 5, bid: 0.85, ask: 0.92, delta: 0.18, iv: 22.4, oi: 6110 },
    ];
    return raw.map((c) => {
      const spreadPct = ((c.ask - c.bid) / ((c.ask + c.bid) / 2)) * 100;
      let reject = null;
      if (c.dte < 7) reject = "DTE " + c.dte + " < min 7";
      else if (c.oi < 1000) reject = "OI " + this.K().int(c.oi) + " < min " + this.K().int(1000);
      else if (c.delta > p.maxDelta) reject = "Delta " + c.delta.toFixed(2) + " > max " + p.maxDelta.toFixed(2);
      else if (spreadPct > p.maxSpread) reject = "Spread " + spreadPct.toFixed(1) + "% > max " + p.maxSpread.toFixed(1) + "%";
      return { strike: "$" + c.strike, expiration: c.expiration, dte: c.dte, bid: "$" + c.bid.toFixed(2), ask: "$" + c.ask.toFixed(2), delta: c.delta.toFixed(2), iv: c.iv.toFixed(1) + "%", oi: c.oi, meets: !reject, reject };
    });
  }
}
