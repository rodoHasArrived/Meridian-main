<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Family Office — Meridian retained example</title><script src="../_scaffold/vendor/react-18.3.1.production.min.js"></script>
<script src="../_scaffold/vendor/react-dom-18.3.1.production.min.js"></script>
<script src="../../_preview_jsx.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./support.js"></script></head>
<body>
<x-dc>
<!-- @template name="Retained · Family Office" description="Synthetic Family Office example with working current-runtime controls and explicit preview states." -->
<helmet><script src="./ds-base.js"></script><meta name="dc-template" content="family-office"></helmet>
<x-import component-from-global-scope="MeridianDesignSystem_205d17.DataStateSwitch" state="{{ dataState }}" label="Family Office" action-label="Retry preview" on-action="{{ retry }}" hint-size="100%,100vh">
<x-import component-from-global-scope="FamilyOfficeScreen" from="./screen.jsx" environment="{{ environment }}" state="{{ dataState }}" hint-size="100%,100vh"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;FIXTURE&quot;,&quot;options&quot;:[&quot;FIXTURE&quot;,&quot;PAPER&quot;,&quot;LIVE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  state = { previewReady: false };
  componentDidUpdate(previous) {
    if (previous.dataState !== this.props.dataState && this.state.previewReady) this.setState({ previewReady: false });
  }
  renderVals() {
    const prefs = window.MeridianPrefs;
    const theme = prefs ? prefs.theme(this.props.theme ?? "light") : (this.props.theme ?? "light");
    const density = prefs ? prefs.density(this.props.density ?? "default") : (this.props.density ?? "default");
    const environment = prefs ? prefs.environment(this.props.environment ?? "FIXTURE") : (this.props.environment ?? "FIXTURE");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-environment", environment);
    if (document.body) document.body.setAttribute("data-theme-density", density);
    return { theme, density, environment,
      dataState: this.state.previewReady ? "ready" : (this.props.dataState ?? "ready"),
      retry: () => this.setState({ previewReady: true }) };
  }
}
</script>
</body>
