<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Covered-Call Lab" description="Options overwrite research — backtest request params, strategy-vs-underlying equity, 21-metric result block, trades, chain preview with filter pass/reject, run library" -->
<helmet>
<script src="./ds-base.js"></script>
<meta name="dc-template" content="covered-call-lab">
</helmet>
<!-- Wait for the compiled namespace before mounting the source screen. -->
<x-import component-from-global-scope="MeridianDesignSystem_205d17.DataStateSwitch" state="ready">
<x-import component-from-global-scope="CoveredCallLabScreen" from="./screen.jsx" environment="{{ environment }}" state="{{ dataState }}" hint-size="100%,920px"></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;,&quot;terminal&quot;,&quot;spacious&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;environment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;FIXTURE&quot;,&quot;options&quot;:[&quot;PAPER&quot;,&quot;LIVE&quot;,&quot;FIXTURE&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;ready&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data state&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // Preview tweaks seed the shared preferences; an operator choice wins.
    const prefs = window.MeridianPrefs;
    const theme = prefs ? prefs.theme(this.props.theme ?? "light") : (this.props.theme ?? "light");
    const density = prefs ? prefs.density(this.props.density ?? "default") : (this.props.density ?? "default");
    const environment = prefs ? prefs.environment(this.props.environment ?? "FIXTURE") : (this.props.environment ?? "FIXTURE");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-environment", environment);
    document.body.setAttribute("data-theme-density", density);
    return { environment, dataState: this.props.dataState ?? "ready" };
  }
}
</script>
</body>
</html>
