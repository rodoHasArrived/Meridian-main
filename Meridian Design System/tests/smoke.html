<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian — component smoke test</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #DEE3EA; font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; }
  header { padding: 10px 16px; background: #171A1F; color: #F4F6F8; position: sticky; top: 0; z-index: 10; }
  #summary { font-size: 12px; }
  #summary b { font-weight: 600; }
  .ok { color: #7fd6a8; }
  .bad { color: #ef9aa8; }
  main { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  figure { margin: 0; background: #fff; border: 1px solid #CBD3DC; display: flex; flex-direction: column; min-height: 120px; }
  figure.err { border-color: #BA3F55; }
  figcaption { padding: 5px 8px; font-size: 11px; color: #4D5967; border-bottom: 1px solid #D2D9E2; display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  figcaption .status { font-weight: 400; }
  .err figcaption { background: rgba(186,63,85,.10); color: #8C2F40; }
  .body { padding: 8px; overflow: auto; max-height: 260px; }
  .errmsg { font-family: "Cascadia Mono", monospace; font-size: 10px; color: #8C2F40; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header><span id="summary">Loading…</span></header>
<main id="grid"></main>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script>
const NS = window.MeridianDesignSystem_4f61be || {};
const grid = document.getElementById("grid");
const results = { ok: [], bad: [], skipped: [] };

// A generous grab-bag of props. Components ignore what they don't use; this lets
// data-driven components render something instead of throwing on undefined.
const sampleRows = [
  { id: 1, symbol: "AAPL", venue: "XNAS", qty: 100, price: 187.4412, value: 18744.12, side: "buy", status: "filled", pnl: 421.55, date: "2026-06-09", account: "4000", debit: 18744.12, credit: 0, name: "Cash" },
  { id: 2, symbol: "MSFT", venue: "XNAS", qty: -50, price: 412.8800, value: -20644.00, side: "sell", status: "working", pnl: -128.10, date: "2026-06-08", account: "4010", debit: 0, credit: 20644.00, name: "Revenue" },
  { id: 3, symbol: "NVDA", venue: "XNAS", qty: 25, price: 1204.1200, value: 30103.00, side: "buy", status: "filled", pnl: 1893.22, date: "2026-06-07", account: "5000", debit: 30103.00, credit: 0, name: "Expense" },
];
const cols = [
  { key: "symbol", label: "Symbol", header: "Symbol" },
  { key: "qty", label: "Qty", header: "Qty", align: "right", numeric: true },
  { key: "price", label: "Price", header: "Price", align: "right", numeric: true },
  { key: "value", label: "Value", header: "Value", align: "right", numeric: true },
];
const opts = [
  { value: "a", label: "Option A" }, { value: "b", label: "Option B" }, { value: "c", label: "Option C" },
];
const series = Array.from({ length: 40 }, (_, i) => ({ x: i, y: 100 + Math.sin(i / 4) * 12 + i * 0.6, t: i, value: 100 + i, date: "2026-06-" + String((i % 28) + 1).padStart(2, "0"), open: 100 + i, high: 105 + i, low: 98 + i, close: 102 + i }));

const P = {
  children: "Sample", label: "Label", title: "Title", value: sampleRows,
  data: series, rows: sampleRows, columns: cols, options: opts, items: opts,
  series: [{ name: "Equity", data: series, points: series }], points: series,
  amount: 18744.12, symbol: "AAPL", venue: "XNAS", assetClass: "equity",
  min: 0, max: 100, id: "smoke", name: "smoke", placeholder: "Type…",
  status: "ready", severity: "info", variant: undefined,
  onChange: () => {}, onClick: () => {}, onSelect: () => {}, onClose: () => {}, onSubmit: () => {},
  open: true, defaultOpen: true, checked: false, timestamp: "2026-06-09T20:00:00Z",
  ts: "2026-06-09T20:00:00Z", delta: 4.21, current: 62, total: 100, count: 3,
  width: 280, height: 160, account: { code: "4000", name: "Cash", balance: 18744.12 },
};

// Components that need a provider / portal / heavy context, or that are pure hooks
// carried on capitalized objects — skip in the auto-mount pass (documented, not failures).
const SKIP = new Set([
  "TableHooks", "FormHooks", "ChartCursor", "Validators", // hook carriers, not components
  "ToastProvider", "HotkeysProvider", // providers wrapping app root
]);

function tryRender(name, Comp) {
  const fig = document.createElement("figure");
  const cap = document.createElement("figcaption");
  const body = document.createElement("div");
  body.className = "body";
  cap.innerHTML = `<span>${name}</span><span class="status"></span>`;
  fig.appendChild(cap); fig.appendChild(body); grid.appendChild(fig);
  const statusEl = cap.querySelector(".status");

  if (SKIP.has(name)) {
    statusEl.textContent = "skip"; results.skipped.push(name);
    body.innerHTML = '<span style="color:#889099">provider/hook carrier — mounted in context tests</span>';
    return;
  }
  try {
    const root = ReactDOM.createRoot(body);
    // Suppress act warnings noise; capture render errors via error boundary.
    root.render(React.createElement(ErrorTrap, { name }, React.createElement(Comp, P)));
    statusEl.textContent = "ok"; statusEl.className = "status ok";
    results.ok.push(name);
  } catch (e) {
    fig.classList.add("err");
    statusEl.textContent = "THROW"; statusEl.className = "status bad";
    body.innerHTML = `<div class="errmsg">${String(e && e.stack || e)}</div>`;
    results.bad.push({ name, err: String(e && e.message || e) });
  }
}

class ErrorTrap extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) {
    const rec = { name: this.props.name, err: String(err && err.message || err) };
    results.bad.push(rec);
    // reflect into DOM
    const figs = [...document.querySelectorAll("figure")];
    const fig = figs.find(f => f.querySelector("figcaption span")?.textContent === this.props.name);
    if (fig) {
      fig.classList.add("err");
      const s = fig.querySelector(".status"); if (s) { s.textContent = "CATCH"; s.className = "status bad"; }
      const b = fig.querySelector(".body"); if (b) b.innerHTML = `<div class="errmsg">${String(err && err.stack || err)}</div>`;
    }
    // remove from ok if present
    const i = results.ok.indexOf(this.props.name); if (i >= 0) results.ok.splice(i, 1);
  }
  render() { return this.state.err ? null : this.props.children; }
}

const names = Object.keys(NS).filter(k => /^[A-Z]/.test(k)).sort();
for (const name of names) {
  const Comp = NS[name];
  if (typeof Comp === "function" || (Comp && typeof Comp === "object" && Comp.$$typeof)) {
    tryRender(name, Comp);
  } else {
    // Non-render export (object of hooks, etc.)
    tryRender(name, () => React.createElement("span", { style: { color: "#889099" } }, "non-component export"));
  }
}

setTimeout(() => {
  const total = names.length;
  document.getElementById("summary").innerHTML =
    `<b>Meridian smoke test</b> · ${total} exports · ` +
    `<span class="ok">${results.ok.length} ok</span> · ` +
    `<span class="bad">${results.bad.length} failing</span> · ` +
    `${results.skipped.length} skipped` +
    (results.bad.length ? ` · FAIL: ${results.bad.map(b => b.name).join(", ")}` : "");
  window.__smoke = results;
}, 1200);
</script>
</body>
</html>
