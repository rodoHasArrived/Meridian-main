<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-labelledby="title desc">
  <title id="title">Meridian wordmark (stacked)</title>
  <desc id="desc">Meridian mark with stacked text layout for narrow spaces and vertical compositions.</desc>

  <g transform="translate(20 20) scale(0.65)">
    <circle cx="128" cy="128" r="84" fill="none" stroke="#E4E3DE" stroke-width="9" stroke-linecap="round"></circle>
    <line x1="44" y1="128" x2="212" y2="128" stroke="#E4E3DE" stroke-width="9" stroke-linecap="round"></line>
    <line x1="128" y1="44" x2="128" y2="212" stroke="#E4E3DE" stroke-width="9" stroke-linecap="round"></line>
    <line x1="94" y1="92" x2="162" y2="92" stroke="#D98A64" stroke-width="11" stroke-linecap="round"></line>
    <circle cx="128" cy="128" r="6" fill="#D98A64"></circle>
  </g>

