  <text x="120" y="304" font-family="&#39;Cascadia Mono&#39;, ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="2" text-anchor="middle" fill="#9A9289">DATA OPS</text>

  <text x="120" y="322" font-family="&#39;Cascadia Mono&#39;, ui-monospace, monospace" font-weight="400" font-size="11" letter-spacing="2" text-anchor="middle" fill="#9A9289">GOVERNANCE</text>
</svg>