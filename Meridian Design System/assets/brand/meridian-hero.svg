<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Meridian hero visual background</title>
  <desc id="desc">An abstract data visualization with orbital grids, signal paths, and electromagnetic field representation for the Meridian trading platform.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="40" x2="1380" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060D16"></stop>
      <stop offset="0.45" stop-color="#0D1620"></stop>
      <stop offset="1" stop-color="#0F1723"></stop>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1180 220) rotate(90) scale(280 380)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369A1" stop-opacity="0.48"></stop>
      <stop offset="1" stop-color="#0369A1" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="signal" x1="360" y1="620" x2="1210" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369A1"></stop>
      <stop offset="0.52" stop-color="#00D9FF"></stop>
      <stop offset="1" stop-color="#34D399"></stop>
    </linearGradient>
    <linearGradient id="beam" x1="812" y1="120" x2="812" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"></stop>
      <stop offset="0.5" stop-color="#06B6D4"></stop>
      <stop offset="1" stop-color="#10B981"></stop>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"></rect>
  <rect width="1600" height="900" fill="url(#glow)"></rect>

  <g stroke="#1E3A4C" stroke-opacity="0.6" fill="none" stroke-linecap="round">
    <path d="M0 140H1600"></path>
    <path d="M0 280H1600"></path>
    <path d="M0 420H1600"></path>
    <path d="M0 560H1600"></path>
    <path d="M0 700H1600"></path>
    <path d="M220 0V900"></path>
    <path d="M520 0V900"></path>
    <path d="M820 0V900"></path>
    <path d="M1120 0V900"></path>
    <path d="M1420 0V900"></path>
  </g>

  <circle cx="812" cy="456" r="292" fill="none" stroke="#1A3244" stroke-width="2.4"></circle>
  <circle cx="812" cy="456" r="370" fill="none" stroke="#142838" stroke-width="2.4"></circle>
  <circle cx="812" cy="456" r="446" fill="none" stroke="#0F2030" stroke-width="2.4"></circle>

  <path d="M812 136V772" fill="none" stroke="url(#beam)" stroke-width="10" stroke-linecap="round"></path>
  <path d="M366 620L540 566L702 450L822 496L1036 368L1210 282" fill="none" stroke="url(#signal)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"></path>
  <path d="M356 702C514 598 684 598 846 702C1002 800 1160 800 1320 702" fill="none" stroke="#2563EB" stroke-opacity="0.26" stroke-width="9" stroke-linecap="round"></path>

  <g>
    <circle cx="812" cy="122" r="20" fill="#10B981"></circle>
    <circle cx="812" cy="122" r="40" fill="none" stroke="#10B981" stroke-opacity="0.24" stroke-width="11"></circle>
    <circle cx="366" cy="620" r="11" fill="#0369A1"></circle>
    <circle cx="702" cy="450" r="11" fill="#00D9FF"></circle>
    <circle cx="1036" cy="368" r="11" fill="#34D399"></circle>
    <circle cx="1210" cy="282" r="13" fill="#10B981"></circle>
  </g>
</svg>