<!-- @dsCard group="Operations" viewport="1180x760" name="Evidence and source coverage" subtitle="EvidencePreview · SourceCoverageSummary — visible excerpts, dates, completeness, and population coverage" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence and source coverage</title><link rel="stylesheet" href="../../styles.css"><script src="../../_preview_runtime.js"></script><script src="../../_preview_jsx.js"></script><script src="../../_ds_bundle.js"></script><style>
body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;max-width:1140px}.rail{display:grid;gap:14px;align-content:start}.panel{border:1px solid var(--border);background:var(--bg-light);padding:14px}.panel h2{margin:0 0 3px;font-size:14px;color:var(--text-primary)}.panel p{margin:0 0 12px;font-size:10px;color:var(--text-muted)}.selected{padding:9px;border-left:2px solid var(--selected);background:var(--selected-surface);font-size:10px;color:var(--text-secondary)}.selected strong{display:block;color:var(--text-primary)}@media(max-width:820px){body{padding:12px}.layout{grid-template-columns:1fr}.rail{order:-1}}
</style></head><body><div id="root"></div><script type="text/babel">
const {EvidencePreview,SourceCoverageSummary}=window.MeridianDesignSystem_205d17;
const sources=[{id:"cust",label:"Custodian position file",condition:"confirmed"},{id:"ledger",label:"Investment ledger extract",condition:"confirmed"},{id:"price",label:"Validated price composite",condition:"confirmed"},{id:"trustee",label:"Trustee statement",condition:"stale",age:"18m"},{id:"terms",label:"Legal terms schedule",condition:"confirmed"},{id:"fx",label:"FX close rates",condition:"confirmed"},{id:"memo",label:"Approval memorandum",condition:"provisional"},{id:"tax",label:"Tax basis support",condition:"missing"}];
function Demo(){const[selected,setSelected]=React.useState(sources[3]),[page,setPage]=React.useState(12),[message,setMessage]=React.useState("");return <div className="layout"><EvidencePreview title="July custodian statement" source="Northstar Trust · Statement ID 07-2026-GA" page={page} section="Cash and short-term investments" before={'Account 5520 — General Account\n\nOpening balance                 $12,086,902.44\nReceipts                           884,999.12\nDisbursements                     (532,000.00)\n\n'} highlight={'Closing cash balance            $12,439,901.56'} after={'\n\nStatement period: July 1–31, 2026\nPrepared by Northstar Trust Operations'} asOf="2026-07-31 23:59 UTC" receivedAt="2026-08-01 06:42 UTC" completeness="Page 12 of 42 · Complete" confidence={99.2} onPrevious={()=>setPage(p=>Math.max(1,p-1))} onNext={()=>setPage(p=>Math.min(42,p+1))} onOpenOriginal={()=>setMessage("Original document opened in the evidence viewer.")}/><aside className="rail"><SourceCoverageSummary compact={false} title="Tie-out source coverage" sources={sources} onSelect={setSelected}/><div className="selected"><strong>{selected.label}</strong>{selected.condition}{selected.age?` · ${selected.age}`:""}. Selected source can synchronize with the excerpt, calculation trace, or exception record.</div><section className="panel"><h2>Evidence contract</h2><p>Important values remain reviewable without leaving the working context.</p><SourceCoverageSummary sources={sources}/><div role="status" style={{marginTop:8,font:"10px var(--font-data)",color:"var(--text-muted)"}}>{message}</div></section></aside></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
