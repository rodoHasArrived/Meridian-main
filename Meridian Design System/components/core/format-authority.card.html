<!-- @dsCard group="Core" viewport="1280x900" name="Numeric authority" subtitle="format.js · FormatProvider · useFormat — one surface declaration moves every number on the screen" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numeric authority</title><link rel="stylesheet" href="../../styles.css"><script src="../../_preview_runtime.js"></script><script src="../../_preview_jsx.js"></script><script src="../../_ds_bundle.js"></script><style>
body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;max-width:1240px;align-items:start}
.rail{display:grid;gap:12px}
.rail h1{margin:0;font-size:14px;color:var(--text-primary)}
.rail p{margin:0;font:11px/17px var(--font-body);color:var(--text-muted);text-wrap:pretty}
.grp{display:grid;gap:4px}
.grp h2{margin:0;font:600 9px var(--font-data);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}
.grp .row{display:flex;gap:4px;flex-wrap:wrap}
.grp button{padding:5px 9px;border:1px solid var(--border);background:var(--bg-light);cursor:pointer;font:11px var(--font-body);color:var(--text-primary)}
.grp button:hover{background:var(--bg-hover)}
.grp button[aria-pressed="true"]{border-color:var(--selected,#496C8F);background:var(--bg-active,#E7EDF2);font-weight:600}
.main{display:grid;gap:14px;min-width:0}
table{width:100%;border-collapse:collapse;border:1px solid var(--border);background:var(--surface-well,#FCFBF8)}
th{text-align:left;font:600 10px var(--font-body);font-variant:all-small-caps;letter-spacing:.05em;color:var(--text-muted);background:var(--bg-medium);padding:6px 10px;border-bottom:1px solid var(--border-strong)}
td{padding:5px 10px;border-top:1px solid var(--border-divider);font:12px var(--font-data);color:var(--text-primary);font-variant-numeric:tabular-nums}
td.k{font-family:var(--font-body);color:var(--text-secondary);width:34%}
td.c{font-size:10.5px;color:var(--text-muted);width:30%}
.live{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.panel{border:1px solid var(--border);background:var(--bg-light);padding:11px 12px;display:grid;gap:8px}
.panel h3{margin:0;font:600 11px var(--font-body);color:var(--text-primary)}
.note{margin:0;font:10px/15px var(--font-body);color:var(--text-muted)}
@media(max-width:1040px){.wrap,.live{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script type="text/babel">
const NS=window.MeridianDesignSystem_205d17;
const {FormatProvider,FormatHooks,NEGATIVE_STYLES,VarianceCell,CommitmentBar,MaturityLadder}=NS;
const {useFormat}=FormatHooks;

const LOCALES=[["en-US","1,234.56"],["de-DE","1.234,56"],["fr-FR","1 234,56"],["ja-JP","¥ 0dp"]];
const CURRENCIES=["USD","EUR","GBP","JPY"];
// Deterministic sample allocations; the benchmark is synthetic, not provider data.
const MATURITY_ITEMS=[
  {id:"0-1",label:"0–1y",primary:12400000,comparison:12000000},
  {id:"1-3",label:"1–3y",primary:31200000,comparison:30000000},
  {id:"3-5",label:"3–5y",primary:18600000,comparison:20000000},
  {id:"5+",label:"5y+",primary:7300000,comparison:8000000},
  {id:"unknown",label:"Unknown maturity",primary:900000,comparison:400000,unknown:true},
];

function Readout(){
  const fx=useFormat();
  const rows=[
    ["money(1284120.5)",fx.money(1284120.5),"ledger amount · surface currency"],
    ["money(−48210.25)",fx.money(-48210.25),"negative style from the surface"],
    ["accounting(−48210.25)",fx.accounting(-48210.25),"statement convention"],
    ["moneyCompact(4120000)",fx.moneyCompact(4120000),"metric card only — never a ledger column"],
    ["price(101.257,{tick:0.0001})",fx.price(101.257,{tick:0.0001}),"precision from the instrument"],
    ["price(6231.25,{tick:0.25})",fx.price(6231.25,{tick:0.25}),"futures tick → 2dp"],
    ["quantity(412008)",fx.quantity(412008),"thin separators"],
    ["percent(0.0421,{signed:true})",fx.percent(0.0421,{signed:true}),"fraction in, percent out"],
    ["bps(0.00124)",fx.bps(0.00124),"basis points, explicit sign"],
    ["compact(4120000)",fx.compact(4120000),"axis and ladder labels"],
    ["delta(−1234.5, money)",fx.delta(-1234.5,(v)=>fx.money(v)),"U+2212, never a hyphen"],
  ];
  return <table><thead><tr><th>Call</th><th>Renders</th><th>Rule</th></tr></thead><tbody>
    {rows.map(([k,v,c])=><tr key={k}><td className="k">{k}</td><td>{v}</td><td className="c">{c}</td></tr>)}
  </tbody></table>;
}

function Card(){
  const [locale,setLocale]=React.useState("en-US");
  const [currency,setCurrency]=React.useState("USD");
  const [negative,setNegative]=React.useState("minus");
  return <div className="wrap">
    <div className="rail">
      <div>
        <h1>One authority, one declaration</h1>
        <p><code>core/format.js</code> is the only module in the system that constructs an <code>Intl</code> number formatter. <code>FormatProvider</code> tells it what surface it is formatting for; every number below follows, including the ones inside components that never heard of this card.</p>
      </div>
      <div className="grp"><h2>Locale</h2><div className="row">{LOCALES.map(([l,ex])=><button key={l} type="button" aria-pressed={locale===l} onClick={()=>setLocale(l)} title={ex}>{l}</button>)}</div></div>
      <div className="grp"><h2>Currency</h2><div className="row">{CURRENCIES.map((c)=><button key={c} type="button" aria-pressed={currency===c} onClick={()=>setCurrency(c)}>{c}</button>)}</div></div>
      <div className="grp"><h2>Negative figures</h2><div className="row">{NEGATIVE_STYLES.map((n)=><button key={n.id} type="button" aria-pressed={negative===n.id} onClick={()=>setNegative(n.id)}>{n.example}</button>)}</div></div>
      <p className="note">Nest a second provider for the one region that must differ — a source-currency column, a custodian statement in its own locale. Law: <code>guidelines/NUMERIC_AUTHORITY.md</code>; gate rule C-01.</p>
    </div>
    <FormatProvider locale={locale} currency={currency} negative={negative}>
      <div className="main">
        <Readout />
        <div className="live">
          <div className="panel">
            <h3>VarianceCell — swept in 4.2</h3>
            <VarianceCell actual={1284120.5} reference={1332330.75} notation="accounting" currency={currency} tolerance={25000} comparisonLabel="Custodian statement" />
            <VarianceCell actual={412} reference={388} notation="bp" digits={0} comparisonLabel="Yield benchmark" explanation="Yield expressed in basis points: 4.12% versus 3.88%." />
            <p className="note">The component was one of the ten that hardcoded <code>en-US</code>. It now reads the surface.</p>
          </div>
          <div className="panel">
            <h3>CommitmentBar · MaturityLadder</h3>
            <CommitmentBar label="Meridian Credit Opportunities III" vintage="2024" commitment={45000000} called={28350000} distributed={9200000} nav={26800000} currency={currency} />
            <MaturityLadder defaultMode="amount" items={MATURITY_ITEMS} buckets={MATURITY_ITEMS.map(item=>item.label)} currency={currency} comparisonLabel="Synthetic benchmark" source="Deterministic sample allocations" />
            <p className="note">Compact notation follows the locale's digits. Amount and percent views retain the unknown-maturity allocation; the benchmark is synthetic. Prefix-symbol currency metrics follow house style N-6.</p>
          </div>
        </div>
      </div>
    </FormatProvider>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script></body></html>
