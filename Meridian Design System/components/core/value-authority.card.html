<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Value authority and materiality</title><link rel="stylesheet" href="../../styles.css"><script src="../../_preview_runtime.js"></script><script src="../../_preview_jsx.js"></script><script src="../../_ds_bundle.js"></script><style>
body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.wrap{display:grid;gap:14px;max-width:1160px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.panel{border:1px solid var(--border);background:var(--bg-light);padding:14px;min-width:0}.panel h2{margin:0 0 3px;font-size:14px;color:var(--text-primary)}.panel p{margin:0 0 12px;font-size:10px;color:var(--text-muted);max-width:60ch;line-height:1.5}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border-divider);font-size:11px}.row:last-child{border-bottom:0}.row b{font-weight:600}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.note{font:10px/1.6 var(--font-data);color:var(--text-muted);border-top:1px solid var(--border-divider);padding-top:8px;max-width:70ch}@media(max-width:900px){body{padding:12px}.two{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script type="text/babel">
const NS=window.MeridianDesignSystem_205d17||{};
const MISSING=["AuthorityStack","AuthorityPanel","AuthorityChip","MaterialityBadge","MaterialityAssessment","VarianceCell"].filter(n=>!NS[n]);
const {AuthorityStack,AuthorityPanel,AuthorityChip,MaterialityBadge,MaterialityAssessment,VarianceCell}=NS;
const authority={authoritativeStage:"approved",policyRef:"AC-14 §4.2",rationale:"The approved July amount remains authoritative for statutory reporting until the reopened period closes. The later custodian source is valid evidence, not a replacement value.",candidates:[{stage:"source",value:10248100,sourceRef:"custodian:2026-07-31",condition:"confirmed",effectiveAt:"2026-07-31"},{stage:"calculated",value:10249840,version:"EIR-4.2",condition:"confirmed"},{stage:"override",value:10251000,actorId:"a.patel",condition:"overridden",effectiveAt:"2026-08-01"},{stage:"approved",value:10251000,version:18,actorId:"m.chen",effectiveAt:"2026-08-01",condition:"confirmed"},{stage:"posted",value:10251000,version:18,effectiveAt:"2026-08-01"},{stage:"reported",value:null,condition:"pending"}]};
const assessment={classification:"operational",amount:331.68,percentage:0.07,quantitative:{benchmark:"Segment pre-tax income",threshold:500,ratio:0.0007},qualitativeFactors:[{id:"regulatory",label:"Regulatory or covenant sensitivity",present:false},{id:"trend",label:"Reverses a reported trend",present:false},{id:"control",label:"Indicates a control weakness",present:true,rationale:"Third recurrence of the same settlement-timing break this quarter."},{id:"intent",label:"Arises from a manual intervention",present:true,rationale:"Resolved by override rather than by source correction."}],policyId:"MAT-2026",policyVersion:"2026.2",evaluatedAt:"2026-08-01 06:20 UTC",evaluatedBy:"a.rivera"};
const reporting={classification:"reporting",amount:1840220,percentage:2.4,quantitative:{benchmark:"Segment pre-tax income",threshold:500000,ratio:0.024},policyId:"MAT-2026",policyVersion:"2026.2",evaluatedAt:"2026-08-01 06:20 UTC"};
function Demo(){return <div className="wrap">
  <div className="two">
    <section className="panel"><h2>Six stages, one authoritative value</h2><p>A financial workstation holds several legitimate versions of the same amount. The stack names each candidate with its version, actor, condition and effective date, marks which stage is authoritative here, and says why. The word is authoritative — never true.</p>
      <AuthorityStack authority={authority} unit="USD" label="Amortized cost · POS-10842"/>
      <div className="chips"><AuthorityChip stage="source"/><AuthorityChip stage="calculated" version="EIR-4.2"/><AuthorityChip stage="approved" version={18} authoritative/><AuthorityChip stage="reported"/></div>
      <p className="note">Inline chips carry the stage next to a value in a dense table; the dashed border means the candidate exists but is not authoritative in this context.</p></section>
    <section className="panel"><h2>Materiality is not tolerance</h2><p>A within-tolerance variance can still be material, and a large timing item can be operationally explainable. The assessment carries its own policy, benchmark and qualitative checklist.</p>
      <MaterialityAssessment assessment={assessment}/>
      <div className="chips" style={{marginTop:14}}><MaterialityBadge assessment={assessment} showAmount/><MaterialityBadge assessment={reporting} showAmount/><MaterialityBadge classification="immaterial"/><MaterialityBadge classification="financial"/></div></section>
  </div>
  <section className="panel"><h2>Four conclusions that may legitimately disagree</h2><p>Tolerance, materiality, evidence completeness and control state answer different questions. Meridian renders them as separate statements, never as variants of one colored pill.</p>
    <div className="row"><span>Ledger versus custodian cash</span><VarianceCell actual={12441284.12} expected={12439902.44} tolerance={500} notation="accounting" currency="USD" condition="confirmed" comparisonLabel="custodian" layout="inline"/></div>
    <div className="row"><span>Tolerance conclusion</span><b>Within $500 policy REC-CASH-01</b></div>
    <div className="row"><span>Materiality conclusion</span><MaterialityBadge assessment={assessment} showAmount/></div>
    <div className="row"><span>Evidence conclusion</span><b>Complete · 3 of 3 primary sources confirmed</b></div>
    <div className="row"><span>Control conclusion</span><b>Review required · C-104 open</b></div>
    <p className="note">Read as a sentence: the difference passes its tolerance policy, is immaterial to reporting but operationally consequential, is fully evidenced, and still leaves a control open.</p></section>
  <section className="panel"><h2>Candidate table</h2><p>The full authority record — used in evidence and audit surfaces where the actor and version of every candidate must be legible, not summarized.</p>
    <AuthorityPanel authority={authority} unit="USD" caption="Amortized cost · POS-10842 · all authority candidates"/></section>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(MISSING.length?<section className="panel"><h2>Bundle out of date</h2><p style={{fontSize:11}}>These exports are not on the design-system namespace yet: {MISSING.join(", ")}. Reload once the bundle has recompiled.</p></section>:<Demo/>);
</script></body></html>
