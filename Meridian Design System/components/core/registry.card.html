<!-- @dsCard group="Core" viewport="1180x820" name="Vocabulary registry" subtitle="One carrier for every closed vocabulary — density, severity, time roles, series roles, conditions, authorities, object types — with alias resolution" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vocabulary registry</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;padding:20px;background:var(--bg-canvas);font-family:var(--font-body);">
<div id="root"></div>
<script type="text/babel">
const { Registry, RegistryTable, Eyebrow } = window.MeridianDesignSystem_205d17;
const resolve = Registry.resolve;

function Panel({ eyebrow, title, note, children, style }) {
  return (
    <section style={{ background:"var(--bg-light)", border:"1px solid var(--border)", borderRadius:2, padding:14, ...style }}>
      <Eyebrow>{eyebrow}</Eyebrow>
      <h2 style={{ font:"600 15px var(--font-display)", color:"var(--text-primary)", margin:"6px 0 4px" }}>{title}</h2>
      {note ? <p style={{ fontSize:12, lineHeight:"17px", color:"var(--text-muted)", margin:"0 0 12px", maxWidth:"74ch" }}>{note}</p> : null}
      {children}
    </section>
  );
}

const TESTS = [
  ["density","compact"], ["density","spacious"], ["density","wall"], ["density","dense"],
  ["severity","warning"], ["severity","critical"], ["severity","ok"],
  ["condition","override"], ["condition","n/a"], ["condition","tied"], ["condition","verified"],
  ["seriesRole","current"], ["seriesRole","budget"], ["seriesRole","forecast"],
  ["density","luxurious"],
];

function Demo() {
  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, alignItems:"start", maxWidth:1140 }}>
      <Panel eyebrow="One carrier" title="Every closed vocabulary, one place"
        note="Density, severity, time roles, series roles, conditions, environments, authorities and object types were four separate constant files. They are one registry now, so a vocabulary cannot exist in two spellings with two label sets.">
        <RegistryTable />
      </Panel>
      <div style={{ display:"grid", gap:16 }}>
        <Panel eyebrow="Alias resolution" title="Old spellings land on canonical keys"
          note="resolve(vocabulary, value) accepts what call sites actually say and returns the canonical key — or null, which is a reviewable failure rather than a silent fallback.">
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12, fontFamily:"var(--font-data)" }}>
            <thead><tr>
              {["Vocabulary","Input","Resolves to"].map((h,i) => (
                <th key={h} style={{ textAlign:i===2?"right":"left", fontFamily:"var(--font-body)", fontSize:10, fontVariant:"all-small-caps", letterSpacing:".05em", color:"var(--text-muted)", padding:"0 0 6px", borderBottom:"1px solid var(--border-strong)" }}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {TESTS.map(([v,input]) => {
                const out = resolve(v, input);
                return (
                  <tr key={v+input}>
                    <td style={{ padding:"5px 0", borderBottom:"1px solid var(--border-divider)", color:"var(--text-muted)" }}>{v}</td>
                    <td style={{ padding:"5px 0", borderBottom:"1px solid var(--border-divider)", color:"var(--text-secondary)" }}>{input}</td>
                    <td style={{ padding:"5px 0", borderBottom:"1px solid var(--border-divider)", textAlign:"right", color: out ? "var(--text-primary)" : "var(--red)" }}>
                      {out || "unresolved"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Panel>
        <Panel eyebrow="Density" title="Four row heights, aliased not forked"
          note="compact and spacious are spellings of dense and review — they resolve to the same row height rather than adding two more.">
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12, fontFamily:"var(--font-data)" }}>
            <tbody>
              {Object.keys(Registry.density).map((k) => (
                <tr key={k}>
                  <td style={{ padding:"5px 0", borderBottom:"1px solid var(--border-divider)", color:"var(--text-primary)" }}>{k}</td>
                  <td style={{ padding:"5px 0", borderBottom:"1px solid var(--border-divider)", color:"var(--text-muted)" }}>{(Registry.density[k].aliases || []).join(", ") || "—"}</td>
                  <td style={{ padding:"5px 0", borderBottom:"1px solid var(--border-divider)", textAlign:"right", color:"var(--text-secondary)" }}>{Registry.density[k].row}px row · {Registry.density[k].body}px body</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Panel>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
