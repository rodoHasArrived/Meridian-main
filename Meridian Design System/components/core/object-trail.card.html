<!-- @dsCard group="Core" viewport="1280x740" name="Object trail" subtitle="Recents, pinned, back/forward across the object types — with the version viewed, and a notice when it moved" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Object trail</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text-primary)}.top{height:44px;background:var(--topbar-bg);color:var(--topbar-text);display:flex;align-items:center;padding:0 16px;font-weight:600;letter-spacing:.08em;font-size:11.5px}.page{display:grid;grid-template-columns:1.4fr .85fr;gap:14px;padding:16px}.plane,.rail{border:1px solid var(--border);background:var(--bg-light);padding:14px}.plane h1{margin:0 0 4px;font-size:17px;font-weight:650}.plane .sub{font-family:var(--font-data);font-size:10.5px;color:var(--text-muted);margin-bottom:12px}.open{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.open button{text-align:left;padding:8px 10px;border:1px solid var(--border);background:var(--card-surface-raised);font:inherit;font-size:11.5px;cursor:pointer;display:grid;gap:2px}.open button:hover{background:var(--bg-hover)}.open button em{font-style:normal;font:600 9px var(--font-data);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}.open button b{font-weight:600}.rail h2{margin:0 0 10px;font-size:12px;font-weight:650}.note{grid-column:1/-1;font-size:11.5px;line-height:1.5;color:var(--text-secondary);border-top:1px solid var(--border-divider);padding-top:10px}.note b{color:var(--text-primary);font-weight:650}.note code{font-family:var(--font-data);font-size:10.5px}</style></head><body><div id="root"></div><script type="text/babel">
const {ObjectTrailProvider,ObjectTrail,ObjectTrailList,TrailHooks,ObjectHeader}=window.MeridianDesignSystem_205d17;
const {useObjectTrail}=TrailHooks;
const CATALOG=[
 {type:"reconciliation",id:"REC-2026-07-CASH",label:"July cash — General Account",version:12,currentVersion:12,meta:"3 breaks open",at:"09:41"},
 {type:"position",id:"91282CKQ3",label:"US Treasury 4.375% 05/15/34",version:4,currentVersion:4,meta:"MV $46.9M",at:"09:58"},
 {type:"journal",id:"JE-88213",label:"Amortization — July STAT",version:18,currentVersion:21,meta:"Posted · reopened period",at:"10:12"},
 {type:"accountingPeriod",id:"2026-07",label:"July 2026 — STAT",version:3,currentVersion:3,meta:"Hard closed",at:"10:30"}];
function Screen(){const trail=useObjectTrail();const [note,setNote]=React.useState(null);
 const current=trail.current;
 return <>
  <ObjectTrail/>
  <div className="page">
   <main className="plane">
    <div className="sub">The screen records its own arrivals — the trail never infers navigation.</div>
    <div className="open">{CATALOG.map(o=><button key={o.id} onClick={()=>{trail.visit(o);setNote(null)}}><em>{o.type}</em><b>{o.label}</b></button>)}</div>
    {current?<ObjectHeader type={current.type} id={current.id} name={current.label} version={current.version} condition={trail.moved(current)?"superseded":"confirmed"} asOf="2026-07-31" context={{portfolio:"General Account",book:"STAT"}}/>:<p style={{fontSize:12,color:"var(--text-muted)"}}>Open an object above, then press ‹ to go back. JE-88213 was viewed at v18 and is now v21 — going back to it produces a notice rather than a silent load.</p>}
   </main>
   <aside className="rail">
    <h2>Arrival rail</h2>
    <ObjectTrailList heading="Where you were"/>
   </aside>
   <p className="note"><b>A reference, not a snapshot.</b> An entry is <code>{"{type, id, version, label}"}</code> — never the object's data. When the version viewed is no longer in force the trail states it before the object opens; loading newer data under an older heading is how an operator comes to quote a number that no longer exists. <b>Pinning is intent, recency is behaviour</b> — separate sections, and <code>Clear</code> keeps the pins.</p>
  </div>
 </>}
function Demo(){return <><div className="top">MERIDIAN · RECONCILIATION</div>
 <ObjectTrailProvider screenId="card-demo" persist={false} defaultEntries={[CATALOG[2],CATALOG[0]]} defaultPinned={[CATALOG[0]]} onNavigate={()=>{}}><Screen/></ObjectTrailProvider></>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
