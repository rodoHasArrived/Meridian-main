<!-- @dsCard group="Core" viewport="1180x820" name="Reference and continuity — hardened" subtitle="SVG-native datums, range bands, lane-stacked labels, ticking age, retained-content lock and retry" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference and continuity</title><link rel="stylesheet" href="../../styles.css"><script src="../../_preview_runtime.js"></script><script src="../../_preview_jsx.js"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.wrap{display:grid;gap:16px;max-width:1140px}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;align-items:start}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{font-size:11px;color:var(--text-muted)}.eyebrow{font:600 10px var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.lane{position:relative;height:104px;background:var(--chart-plot);border:1px solid var(--border);overflow:hidden}.lanebase{position:absolute;left:0;right:0;bottom:22px;border-bottom:1px solid var(--border-strong)}.panel{border:1px solid var(--border);background:var(--bg-light);padding:12px;display:grid;gap:8px}.rows{display:grid;gap:1px;background:var(--border-divider)}.rows div{background:var(--card-surface-raised);padding:6px 9px;font:11px var(--font-data);color:var(--text-secondary);display:flex;justify-content:space-between}.rows b{color:var(--text-primary)}@media(max-width:820px){body{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="text/babel">
const {Datum,DatumGroup,ContinuityFrame,SegmentedControl}=window.MeridianDesignSystem_205d17;
const series=[38,44,41,52,49,58,55,66,62,71,68,78],W=660,H=230,PAD=30,PW=W-PAD*2,PH=H-PAD*2;
const pts=series.map((v,i)=>`${PAD+i*PW/(series.length-1)},${PAD+PH-(v/90)*PH}`).join(" ");
function Figure({sel,onSel}){return <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} role="group" aria-label="Book yield trace with embargo band, target datum, and committed selection">
  <rect x={PAD} y={PAD} width={PW} height={PH} fill="var(--chart-plot)" stroke="var(--border)"/>
  <polyline points={pts} fill="none" stroke="var(--chart-primary)" strokeWidth="2"/>
  <svg x={PAD} y={PAD} width={PW} height={PH} overflow="visible">
    <Datum svg role="warning" position={.11} to={.23} label="Embargo" labelPlacement="after"/>
    <Datum svg role="target" orientation="horizontal" position={.28} label="Target" value="65 bp"/>
    <Datum svg role="current-time" position={.74} label="11:42 UTC"/>
    <Datum svg role="selection" position={sel} label="Selected" value="62 bp" marker interactive onActivate={()=>onSel(sel>=.9?.2:sel+.09)}/>
  </svg>
</svg>}
const crowded=[{p:.06,l:"Cutover",v:"09:30"},{p:.12,l:"Repricing",v:"09:44"},{p:.17,l:"Feed gap",v:"09:51"},{p:.44,l:"Close",v:"16:00"},{p:.5,l:"Revaluation",v:"16:12"},{p:.83,l:"Attest",v:"18:05"}];
function Demo(){
  const [state,setState]=React.useState("live"),[sel,setSel]=React.useState(.56),[retrying,setRetrying]=React.useState(false);
  const since=React.useMemo(()=>Date.now()-42000,[]);
  const retry=()=>{setRetrying(true);setTimeout(()=>{setRetrying(false);setState("live")},1400)};
  return <div className="wrap">
    <div className="controls"><SegmentedControl size="sm" value={state} onChange={setState} options={[{value:"live",label:"Live"},{value:"delayed",label:"Delayed"},{value:"stale",label:"Stale"},{value:"partial",label:"Partial"},{value:"offline",label:"Offline"}]}/><span className="muted">Retained evidence stays legible, marked, and locked — never blanked, never mistaken for live.</span></div>
    <div className="grid">
      <ContinuityFrame state={state} subject="Book yield" since={since} snapshotAt="11:42 UTC" coverage={state==="partial"?"82 of 96 positions":"96 of 96 positions"} onRetry={state==="live"?undefined:retry} retrying={retrying}><Figure sel={sel} onSel={setSel}/></ContinuityFrame>
      <div className="panel"><span className="eyebrow">Datum roles</span><div className="rows"><div><span>Range band</span><b>Embargo window</b></div><div><span>Target</span><b>Dotted, 65 bp</b></div><div><span>Current time</span><b>Dashed graphite</b></div><div><span>Selection</span><b>Blue, committed</b></div></div><span className="muted">Datums render inside the plot's own <b>svg</b>, so they share its coordinate space and print with it. Click the selection rail to advance it.</span></div>
    </div>
    <div><span className="eyebrow">Lane-stacked labels · DatumGroup</span><div className="lane"><div className="lanebase"/><DatumGroup>{crowded.map(d=><Datum key={d.l} role="baseline" position={d.p} label={d.l} value={d.v}/>)}</DatumGroup></div><p className="muted" style={{margin:"6px 0 0"}}>Six datums, three collisions. DatumGroup measures the container, estimates each label, and assigns lanes — labels stack instead of overprinting.</p></div>
  </div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
