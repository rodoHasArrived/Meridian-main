<!-- @dsCard group="Theming" viewport="1000x600" name="Theming Layer" subtitle="Token-driven accents and Terminal, Compact, Default, and Spacious density" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theming Layer</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script src="../../scripts/demo-runtime.js"></script>
<script src="../../_ds_bundle.js"></script>
  <style>
    body { margin:0;padding:24px;background:var(--bg-canvas);font-family:var(--font-body);color:var(--text-primary); }
    main { max-width:1000px;margin:auto; }
    h1 { font-size:var(--type-page-title,22px);margin:0 0 24px; }
    h2 { font-size:13px;margin:0 0 12px; }
    .themes { display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px; }
    .theme-choice { min-height:28px;padding:5px 12px;background:var(--bg-light);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-button);cursor:pointer; }
    .theme-choice[aria-pressed="true"] { background:var(--bg-active);border-color:var(--accent); }
    .theme-choice:focus-visible { outline:var(--focus-ring);outline-offset:var(--focus-ring-offset); }
    .previews { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-panel);margin-top:24px; }
    .panel { background:var(--bg-light);border:1px solid var(--border);border-radius:var(--radius-card);padding:var(--pad-panel); }
    .row { display:flex;flex-wrap:wrap;gap:8px;align-items:center; }
  </style>
</head>
<body>
<main>
  <h1>Theming Layer</h1>
  <h2>Brand accent</h2>
  <div class="themes" role="group" aria-label="Brand accent">
    <button class="theme-choice" data-brand-choice="" aria-pressed="true">Copper (default)</button>
    <button class="theme-choice" data-brand-choice="indigo" aria-pressed="false">Indigo</button>
    <button class="theme-choice" data-brand-choice="emerald" aria-pressed="false">Emerald</button>
    <button class="theme-choice" data-brand-choice="rose" aria-pressed="false">Rose</button>
    <button class="theme-choice" data-brand-choice="slate" aria-pressed="false">Slate</button>
  </div>
  <div id="preview"></div>
</main>
<script>
  document.querySelectorAll('[data-brand-choice]').forEach((button) => {
    button.addEventListener('click', () => {
      const brand = button.dataset.brandChoice;
      if (brand) document.documentElement.setAttribute('data-brand', brand);
      else document.documentElement.removeAttribute('data-brand');
      document.querySelectorAll('[data-brand-choice]').forEach((choice) => choice.setAttribute('aria-pressed', String(choice === button)));
    });
  });
</script>
<script type="text/babel">
  const { Button, Badge, Input, DensityToggle } = window.MeridianDesignSystem_4f61be;
  function Preview() {
    const [action, setAction] = React.useState('Choose a sample action to preview its response.');
    const [text, setText] = React.useState('');
    return <>
      <h2>Density</h2>
      <DensityToggle />
      <div className="previews">
        <section className="panel"><h2>Button variants</h2><div className="row">
          <Button onClick={() => setAction('Ghost sample selected.')}>Ghost</Button>
          <Button variant="primary" onClick={() => setAction('Primary sample selected.')}>Primary</Button>
          <Button variant="link" onClick={() => setAction('Link sample selected.')}>Link</Button>
        </div><p role="status">{action}</p></section>
        <section className="panel"><h2>Semantic badges</h2><div className="row">
          <Badge>Default</Badge><Badge variant="success">Success</Badge><Badge variant="warning">Warning</Badge><Badge variant="error">Error</Badge>
        </div></section>
        <section className="panel"><h2>Labelled input</h2><label htmlFor="theme-sample-input">Sample value</label>
          <Input id="theme-sample-input" value={text} onChange={(event) => setText(event.target.value)} placeholder="Type a sample value" />
        </section>
        <section className="panel"><h2>Theme behavior</h2><p>Accents, surfaces, semantic colors and label ink follow the selected theme. Density changes the sample panels without changing their values.</p></section>
      </div>
    </>;
  }
  ReactDOM.createRoot(document.getElementById('preview')).render(<Preview />);
</script>
</body>
</html>
