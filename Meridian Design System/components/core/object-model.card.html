<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object model</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.wrap{display:grid;gap:16px;max-width:1140px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.plane{border:1px solid var(--border);background:var(--bg-light);padding:0 14px 12px}.stub{margin-top:12px;border:1px dashed var(--border);background:var(--card-surface-raised);padding:14px;font:11px var(--font-data);color:var(--text-muted);text-align:center;letter-spacing:.04em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.panel{border:1px solid var(--border);background:var(--bg-light);padding:12px;display:grid;gap:8px}.eyebrow{font:600 10px var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.muted{font:12px/18px var(--font-body);color:var(--text-muted);margin:0;text-wrap:pretty}table{border-collapse:collapse;width:100%;font:11px var(--font-data);color:var(--text-secondary)}th{text-align:left;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);padding:4px 8px 4px 0}td{border-bottom:1px solid var(--border-subtle,var(--border));padding:3px 8px 3px 0;vertical-align:top}td b{color:var(--text-primary);font-weight:600}@media(max-width:820px){body{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="text/babel">
