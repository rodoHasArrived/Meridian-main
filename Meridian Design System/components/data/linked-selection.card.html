<!-- @dsCard group="Data" viewport="1180x700" name="Linked selection" subtitle="One committed entity synchronizes table, contribution view, and evidence rail" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linked selection</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.layout{display:grid;grid-template-columns:1.05fr 1fr 300px;gap:14px;max-width:1140px}.panel,.rail{border:1px solid var(--border);background:var(--bg-light);padding:12px}.panel h2,.rail h2{margin:0 0 10px;font-size:14px;color:var(--text-primary)}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;width:100%;border:0;border-bottom:1px solid var(--border-divider);background:transparent;padding:8px 9px;text-align:left;color:var(--text-secondary);font:12px var(--font-body);cursor:pointer}.row.is-selected{background:var(--selected-surface);box-shadow:inset 2px 0 0 var(--selected)}.row:focus-visible{outline:var(--focus-ring);outline-offset:-2px}.mono{font-family:var(--font-data);color:var(--text-primary)}.rail dl{margin:0}.rail div{padding:7px 0;border-bottom:1px solid var(--border-divider)}.rail dt{font-size:9px;color:var(--text-muted);text-transform:uppercase}.rail dd{margin:3px 0 0;font:11px var(--font-data);color:var(--text-primary)}@media(max-width:850px){body{padding:12px}.layout{grid-template-columns:1fr}.rail{order:2}}</style></head><body><div id="root"></div><script type="text/babel">
const {LinkedSelectionProvider,LinkedSelectionTarget,SelectionHooks,DurationContribution}=window.MeridianDesignSystem_205d17,{useLinkedSelection}=SelectionHooks;
const rows=[{id:"ust",label:"US Treasuries",value:2.18,mv:"$9.42B",condition:"confirmed",source:"Custodian + market composite"},{id:"corp",label:"Investment grade credit",value:1.46,mv:"$7.84B",condition:"confirmed",source:"Custodian + evaluated prices"},{id:"mbs",label:"Agency MBS",value:.82,mv:"$5.11B",condition:"provisional",source:"Custodian + prepay model"},{id:"priv",label:"Private placements",value:.51,mv:"$3.76B",condition:"stale",source:"Admin statement"},{id:"cash",label:"Cash and short-term",value:.14,mv:"$2.27B",condition:"confirmed",source:"Custodian cash ledger"}];
function Surface(){const sel=useLinkedSelection();const selected=rows.find(r=>r.id===sel.selectedId)||rows[0];return <div className="layout"><section className="panel"><h2>Portfolio population</h2>{rows.map(r=><LinkedSelectionTarget key={r.id} selection={r} className="row" as="button"><span>{r.label}</span><span className="mono">{r.mv}</span><span className="mono">{r.value.toFixed(2)}</span></LinkedSelectionTarget>)}</section><section className="panel"><h2>Duration contribution</h2><DurationContribution items={rows} selectedId={sel.selectedId} onSelect={(r)=>sel.select(r,{source:"chart"})}/></section><aside className="rail"><h2>Evidence rail</h2><dl><div><dt>Selected entity</dt><dd>{selected.label}</dd></div><div><dt>Market value</dt><dd>{selected.mv}</dd></div><div><dt>Condition</dt><dd>{selected.condition}</dd></div><div><dt>Source</dt><dd>{selected.source}</dd></div><div><dt>Selection origin</dt><dd>{sel.selection?.source||"default"}</dd></div></dl></aside></div>}
function Demo(){return <LinkedSelectionProvider defaultValue={rows[0]} urlParam="selection"><Surface/></LinkedSelectionProvider>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
