<!-- @dsCard group="Data" viewport="1180x760" name="Linked selection — scopes, multi, history" subtitle="Two named selection groups on one screen, additive multi-select with shift range, and a walkable history" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linked selection coordination</title><link rel="stylesheet" href="../../styles.css"><script src="../../_preview_runtime.js"></script><script src="../../_preview_jsx.js"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.wrap{display:grid;gap:14px;max-width:1140px}.layout{display:grid;grid-template-columns:1.1fr .9fr .8fr;gap:14px;align-items:start}.panel{border:1px solid var(--border);background:var(--bg-light);display:grid;gap:0;align-content:start}.panel h2{margin:0;padding:8px 10px;font:600 12px var(--font-display);color:var(--text-primary);background:var(--bg-medium);border-bottom:1px solid var(--border-strong)}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:7px 10px;border-bottom:1px solid var(--border-divider);font-size:12px;color:var(--text-secondary);cursor:pointer;background:var(--card-surface-raised)}.row:hover{background:var(--bg-hover)}.row.is-selected{background:var(--selected-surface);box-shadow:inset 2px 0 0 var(--selected)}.row:focus-visible{outline:var(--focus-ring);outline-offset:-2px}.row b{font:600 12px var(--font-data);color:var(--text-primary)}.row span{font:11px var(--font-data);color:var(--text-muted)}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--border-divider);background:var(--bg-medium)}.muted{font-size:11px;color:var(--text-muted)}.kv{display:grid;gap:1px;background:var(--border-divider)}.kv div{display:flex;justify-content:space-between;gap:10px;background:var(--card-surface-raised);padding:6px 10px;font:11px var(--font-data);color:var(--text-muted)}.kv b{color:var(--text-primary)}.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1px solid var(--border);background:var(--card-surface-raised);font:600 10px var(--font-data);color:var(--text-secondary)}@media(max-width:900px){body{padding:12px}.layout{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="text/babel">
const {LinkedSelectionProvider,LinkedSelectionTarget,SelectionHooks,Button}=window.MeridianDesignSystem_205d17,{useLinkedSelection}=SelectionHooks;
const positions=[{id:"ust",label:"US Treasuries",mv:"$9.42B",dur:"2.18"},{id:"corp",label:"IG credit",mv:"$7.84B",dur:"1.46"},{id:"muni",label:"Municipals",mv:"$4.10B",dur:"0.92"},{id:"mbs",label:"Agency MBS",mv:"$3.66B",dur:"0.71"},{id:"cash",label:"Cash & equivalents",mv:"$1.28B",dur:"0.02"}];
const lots={ust:[{id:"L-4411",label:"Lot 4411",mv:"$3.10B",dur:"2.44"},{id:"L-4412",label:"Lot 4412",mv:"$4.02B",dur:"2.05"},{id:"L-4419",label:"Lot 4419",mv:"$2.30B",dur:"1.98"}],corp:[{id:"L-8801",label:"Lot 8801",mv:"$5.11B",dur:"1.62"},{id:"L-8807",label:"Lot 8807",mv:"$2.73B",dur:"1.15"}]};
function Positions(){const api=useLinkedSelection("position");return <div className="panel"><h2>Population · scope "position"</h2><div className="bar"><span className="chip">{api.count} selected</span><Button size="sm" variant="ghost" onClick={()=>api.selectAll()}>Select all</Button><Button size="sm" variant="ghost" disabled={!api.canGoBack} onClick={()=>api.back()}>Back</Button><span className="muted">⌘/Ctrl click adds · Shift click extends</span></div>{positions.map((p,i)=><LinkedSelectionTarget key={p.id} scope="position" selection={p} index={i} className="row"><span>{p.label}</span><b>{p.mv}</b><span>{p.dur}y</span></LinkedSelectionTarget>)}</div>}
function Lots(){const pos=useLinkedSelection("position"),api=useLinkedSelection("lot");const rows=lots[pos.selection?.id]||[];return <div className="panel"><h2>Tax lots · scope "lot"</h2><div className="bar"><span className="muted">Independent selection, filtered by the position group</span></div>{rows.length?rows.map(l=><LinkedSelectionTarget key={l.id} scope="lot" selection={l} className="row"><span>{l.label}</span><b>{l.mv}</b><span>{l.dur}y</span></LinkedSelectionTarget>):<div className="row" style={{cursor:"default",color:"var(--text-muted)"}}>No lots — select a position with lot detail</div>}</div>}
function Inspector(){const pos=useLinkedSelection("position"),lot=useLinkedSelection("lot");return <div className="panel"><h2>Evidence</h2><div className="kv"><div><span>Position scope</span><b>{pos.count?pos.selections.map(s=>s.label).join(", "):"—"}</b></div><div><span>Committed via</span><b>{pos.selection?.source||"—"}</b></div><div><span>Lot scope</span><b>{lot.selection?.label||"—"}</b></div><div><span>History depth</span><b>{pos.history.length}</b></div></div><p className="muted" style={{padding:"8px 10px",margin:0}}>Two providers, two names, one screen. Every consumer asks for the group it belongs to by name — no prop drilling, no accidental coupling. Escape clears.</p></div>}
function Demo(){return <div className="wrap"><LinkedSelectionProvider scope="position" multiple items={positions} defaultValue={positions[0]} historyLimit={12}><LinkedSelectionProvider scope="lot" clearOnEscape={false}><div className="layout"><Positions/><Lots/><Inspector/></div></LinkedSelectionProvider></LinkedSelectionProvider></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
