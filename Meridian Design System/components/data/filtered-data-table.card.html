<!-- @dsCard group="Data" viewport="1200x600" name="Filtered transactions" subtitle="DataGrid + TableHooks — search, sort, filter and CSV export" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtered transactions</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script src="../../_preview_runtime.js"></script>
  <script src="../../_preview_jsx.js"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body style="margin: 0; padding: 24px; background: var(--bg-canvas, #F2F0EC); font-family: var(--font-body);">
  <div style="max-width: 1200px; margin: 0 auto;">
    <h2 style="margin: 0 0 24px 0; font-size: 22px; color: var(--text-primary, #20252B);">Filtered transactions</h2>

    <div id="demo"></div>
  </div>

  <script type="text/babel">
    const { DataGrid, Input, Select, Button, TableHooks } = window.MeridianDesignSystem_205d17;

    // Sample transaction data
    const sampleTransactions = [
      { id: "TXN001", date: "2026-06-15", ref: "ACH-042", memo: "Payroll deposit", category: "Income", amount: "18,500.00" },
      { id: "TXN002", date: "2026-06-14", ref: "CHK-1847", memo: "Office supplies", category: "Expense", amount: "(234.50)" },
      { id: "TXN003", date: "2026-06-14", ref: "WIRE-18", memo: "Client refund", category: "Liability", amount: "(1,250.00)" },
      { id: "TXN004", date: "2026-06-13", ref: "DEP-003", memo: "Client receivable", category: "Income", amount: "3,875.25" },
      { id: "TXN005", date: "2026-06-13", ref: "ACH-041", memo: "Vendor payment", category: "Expense", amount: "(892.00)" },
      { id: "TXN006", date: "2026-06-12", ref: "CHK-1846", memo: "Utilities", category: "Expense", amount: "(156.73)" },
      { id: "TXN007", date: "2026-06-12", ref: "DEP-002", memo: "Interest income", category: "Income", amount: "45.12" },
      { id: "TXN008", date: "2026-06-11", ref: "WIRE-17", memo: "Equipment lease", category: "Expense", amount: "(2,500.00)" },
    ];

    const columns = [
      { key: "date", label: "Date", sortable: true },
      { key: "ref", label: "Reference", sortable: true },
      { key: "memo", label: "Memo", sortable: true },
      { key: "category", label: "Category", sortable: true, filterable: true },
      { key: "amount", label: "Amount", align: "right", sortable: true },
    ];

    function FilteredTransactions() {
      const table = TableHooks.useTableState(sampleTransactions, "gl-transactions");
      const category = table.filters.category?.[0] || "";
      return <div style={{ display: "grid", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "end", gap: 12 }}>
          <Input label="Search transactions" value={table.query} onChange={(event) => table.setQuery(event.target.value)} />
          <Select label="Category" value={category} options={[
            { value: "", label: "All categories" },
            ...["Income", "Expense", "Liability"].map(value => ({ value, label: value })),
          ]} onChange={value => table.setFilters(value ? { category: [value] } : {})} />
          <Button variant="ghost" onClick={table.clearAllFilters}>Clear filters</Button>
          <Button onClick={() => table.exportCSV("general-ledger-transactions.csv")}>Export CSV</Button>
        </div>
        <DataGrid rowKey="id" columns={columns} rows={table.data} label="General ledger transactions"
          sortKey={table.sortBy?.column ?? null} sortDir={table.sortBy?.direction ?? "asc"} onSort={table.toggleSort}
          emptyText="No transactions match the search and category" />
        <span>{table.resultCount} of {sampleTransactions.length} transactions</span>
      </div>;
    }
    ReactDOM.createRoot(document.getElementById("demo")).render(<FilteredTransactions />);

  </script>
</body>
</html>
