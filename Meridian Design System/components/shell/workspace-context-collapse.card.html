<!-- @dsCard group="Shell" viewport="1180x680" name="Workspace context — responsive collapse" subtitle="Priority-ordered facets fold into a More disclosure as the bar narrows; entity, data condition, and a locked period never drop" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace context collapse</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0;width:100%;max-width:1140px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls button{white-space:nowrap}.muted{font-size:11px;color:var(--text-muted)}.eyebrow{font:600 10px var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.stage{box-sizing:border-box;max-width:100%;border:1px solid var(--border-strong);background:var(--bg-light);overflow:visible;transition:width 180ms cubic-bezier(.2,0,0,1)}.body{padding:14px;font-size:12px;color:var(--text-secondary);line-height:18px}.rail{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}.case{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0}@media(max-width:900px){body{padding:12px}}</style></head><body><div id="root"></div><script type="text/babel">
const {WorkspaceContextProvider,WorkspaceContextBar,SegmentedControl,Button}=window.MeridianDesignSystem_205d17;
const WIDTHS={"Wide 1080":1080,"Split 860":860,"Narrow 640":640,"Rail 460":460};
function Demo(){
  const [w,setW]=React.useState("Wide 1080"),[locked,setLocked]=React.useState(false),[notice,setNotice]=React.useState("");
  return <div className="wrap">
    <div className="controls"><span className="eyebrow">Preview width (bounded by viewport)</span><SegmentedControl size="sm" value={w} onChange={setW} options={Object.keys(WIDTHS).map(k=>({value:k,label:k}))}/><Button size="sm" variant="ghost" onClick={()=>setLocked(l=>!l)}>{locked?"Reopen period":"Lock period"}</Button></div>
    <div className="rail">
      <div className="case"><span className="eyebrow">collapse="auto" · the default</span><div className="stage" style={{width:`min(${WIDTHS[w]}px, 100%)`}}><WorkspaceContextProvider value={{entity:{type:"Portfolio",label:"General Account"},book:"STAT",basis:"Statutory",period:"2026-07",asOf:"2026-07-31 23:59 UTC",currency:"USD",scenario:"Actual",condition:"confirmed",locked}}><WorkspaceContextBar actions={<Button size="sm" variant="ghost" onClick={()=>setNotice("Synthetic context change requested")}>Change</Button>}/><div className="body">Scenario drops first, then currency, book, as-of, period. Entity and data condition are load-bearing — an operator who cannot see which entity and how trustworthy its data is has no context at all. A locked period is never hidden either: it changes what actions are legal.</div></WorkspaceContextProvider></div></div>
      <div className="case"><span className="eyebrow">collapse="always" · minVisible=3, for a docked rail</span><div className="stage" style={{width:`min(${WIDTHS[w]}px, 100%)`}}><WorkspaceContextProvider defaultValue={{entity:{type:"Fund",label:"Meridian Credit Opportunities II"},book:"GAAP",basis:"US GAAP",period:"2026-Q2",asOf:"2026-06-30 23:59 UTC",currency:"EUR",scenario:"Downside",condition:"stale",locked:true}}><WorkspaceContextBar collapse="always" minVisible={3} overflowLabel="Context"/><div className="body">Forced collapse keeps a fixed, predictable header height regardless of how long the entity name runs. Open the disclosure to read the rest.</div></WorkspaceContextProvider></div></div>
    </div>
    <p role="status" className="muted" style={{margin:0}}>{notice}</p><p className="muted" style={{margin:0}}>The bar measures itself — no breakpoints, no host wiring. Print restores every facet and drops the disclosure.</p>
  </div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
