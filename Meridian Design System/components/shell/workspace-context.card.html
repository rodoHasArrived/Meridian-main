<!-- @dsCard group="Shell" viewport="1280x620" name="Workspace context" subtitle="Persistent entity, book, basis, period, as-of, currency, scenario, freshness, and lock state" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace context</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;background:var(--bg);font-family:var(--font-body)}.top{height:48px;background:var(--topbar-bg);color:var(--topbar-text);display:flex;align-items:center;padding:0 18px;font-weight:600;letter-spacing:.08em;font-size:12px}.page{padding:20px}.work{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.plane{min-height:340px;border:1px solid var(--border);background:var(--bg-light);padding:16px}.plane h1{margin:0 0 6px;font-size:22px;color:var(--text-primary)}.plane p{margin:0;color:var(--text-muted);font-size:12px}.list{margin-top:18px;display:grid;gap:8px}.item{padding:9px 10px;border-bottom:1px solid var(--border-divider);display:flex;justify-content:space-between;font-size:12px}.item span:last-child{font-family:var(--font-data);color:var(--text-primary)}@media(max-width:760px){.work{grid-template-columns:1fr}.page{padding:12px}}</style></head><body><div id="root"></div><script type="text/babel">
const {WorkspaceContextProvider,WorkspaceContextBar,WorkspaceHooks,Button,SourceCoverageSummary}=window.MeridianDesignSystem_205d17,{useWorkspaceContext}=WorkspaceHooks;
const sources=[{label:"Custodian holdings",condition:"confirmed"},{label:"Investment ledger",condition:"confirmed"},{label:"Market prices",condition:"confirmed"},{label:"Security master",condition:"stale",age:"18m"},{label:"Accounting rules",condition:"confirmed"}];
function Work(){const api=useWorkspaceContext();const c=api.context;return <><WorkspaceContextBar value={c} condition={c.condition} onPeriodClick={()=>api.update({period:c.period==="2026-07"?"2026-06":"2026-07",locked:c.period!=="2026-07"})} actions={<Button size="sm" variant="ghost">Save view</Button>}/><div className="page"><div className="work"><main className="plane"><h1>Investment accounting analysis</h1><p>Every module below inherits the same analytical context.</p><div className="list"><div className="item"><span>Current entity</span><span>{c.entity.label}</span></div><div className="item"><span>Accounting basis</span><span>{c.book} · {c.basis}</span></div><div className="item"><span>Reporting period</span><span>{c.period}</span></div><div className="item"><span>Scenario</span><span>{c.scenario}</span></div></div></main><aside className="plane"><h1 style={{fontSize:16}}>Evidence coverage</h1><p>Context and source condition stay adjacent to the work.</p><div style={{marginTop:16}}><SourceCoverageSummary sources={sources} compact={false}/></div></aside></div></div></>}
function Demo(){return <><div className="top">MERIDIAN · ACCOUNTING WORKSTATION</div><WorkspaceContextProvider defaultValue={{entity:{type:"Portfolio",label:"General Account"},book:"STAT",basis:"Statutory",period:"2026-07",asOf:"2026-07-31 23:59 UTC",currency:"USD",scenario:"Actual",condition:"confirmed"}}><Work/></WorkspaceContextProvider></>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
