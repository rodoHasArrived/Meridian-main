<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Yield curve</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;padding:20px;background:var(--bg);font-family:var(--font-body);">
<div id="root"></div>
<script type="text/babel">
const { YieldCurve } = window.MeridianDesignSystem_205d17;
const TENORS = [["1M",1/12],["3M",0.25],["6M",0.5],["1Y",1],["2Y",2],["3Y",3],["5Y",5],["7Y",7],["10Y",10],["20Y",20],["30Y",30]];
const mk = (vals) => TENORS.map(([tenor, years], i) => ({ tenor, years, value: vals[i] }));
const TODAY = mk([3.42,3.95,4.15,4.31,4.40,4.61,4.81,5.07,5.27,5.41,5.50]);
const M1    = mk([2.82,3.10,3.48,3.68,3.78,3.95,4.12,4.40,4.62,4.78,4.88]);
const M3    = mk([2.20,2.48,2.85,3.15,3.32,3.47,3.68,3.98,4.24,4.48,4.75]);
const SCEN  = mk([1.62,1.88,2.18,2.44,2.57,2.76,3.00,3.28,3.58,3.95,4.22]);
function Demo() {
  return (
    <div style={{ background:"var(--bg-light)", border:"1px solid var(--border)", borderRadius:2,
      padding:14, maxWidth:1120, display:"flex", flexDirection:"column" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10 }}>
        <span style={{ fontSize:10, fontWeight:600, fontVariant:"all-small-caps", letterSpacing:".04em", color:"var(--text-muted)" }}>
          YieldCurve · United States Treasury (spot rates)
        </span>
        <span style={{ fontFamily:"var(--font-data)", fontSize:11, color:"var(--text-secondary)" }}>
          data as of 2026-08-05 · 11:30Z
        </span>
      </div>
      <div style={{ height:400 }}>
        <YieldCurve points={TODAY} label="Today" spread={{ a: "2Y", b: "10Y" }}
          overlays={[
            { points: M1, label: "1M ago" },
            { points: M3, label: "3M ago" },
            { points: SCEN, label: "Scenario: +25bp bull steepen", scenario: true },
          ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
