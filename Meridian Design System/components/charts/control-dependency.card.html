<!-- @dsCard group="Charts" viewport="1100x720" name="Control dependency graph" subtitle="Stable layered close-control topology with blockers, selection, orthogonal routes, and a text outline" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control dependencies</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.layout{display:grid;grid-template-columns:1fr 270px;gap:14px;max-width:1060px}.panel,.rail{border:1px solid var(--border);background:var(--bg-light);padding:14px}.panel h2,.rail h2{margin:0 0 4px;font-size:14px;color:var(--text-primary)}.panel p,.rail p{margin:0 0 12px;font-size:10px;color:var(--text-muted)}.rail dl{margin:0}.rail div{padding:7px 0;border-bottom:1px solid var(--border-divider)}.rail dt{font:9px var(--font-data);text-transform:uppercase;color:var(--text-muted)}.rail dd{margin:3px 0 0;font:11px var(--font-data);color:var(--text-primary)}@media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="text/babel">
const {ControlDependencyGraph}=window.MeridianDesignSystem_205d17;
const nodes=[{id:"files",label:"Source file completeness",layer:0,status:"complete",owner:"Data Ops"},{id:"price",label:"Price validation",layer:0,status:"complete",owner:"Valuation"},{id:"ledger",label:"Ledger balance",layer:1,status:"complete",owner:"Investment Acct"},{id:"recon",label:"Custodian reconciliation",layer:1,status:"review",owner:"Investment Acct"},{id:"stat",label:"STAT close control",layer:2,status:"blocked",owner:"Controller"},{id:"disclosure",label:"Disclosure review",layer:2,status:"pending",owner:"Reporting"},{id:"attest",label:"Controller attestation",layer:3,status:"pending",owner:"Controller"}];
const edges=[{from:"files",to:"ledger"},{from:"price",to:"recon"},{from:"ledger",to:"stat"},{from:"recon",to:"stat",blocked:true},{from:"stat",to:"attest",blocked:true},{from:"disclosure",to:"attest"}];
function Demo(){const[sel,setSel]=React.useState("stat"),node=nodes.find(n=>n.id===sel);return <div className="layout"><section className="panel"><h2>July statutory close dependencies</h2><p>Operational controls use stable layers; blockers remain on the relationships that prevent progress.</p><ControlDependencyGraph nodes={nodes} edges={edges} selectedId={sel} onSelect={n=>setSel(n.id)} description="July statutory close control dependencies"/></section><aside className="rail"><h2>Selected control</h2><p>Selection can link to a resolution or attestation rail.</p><dl><div><dt>Control</dt><dd>{node.label}</dd></div><div><dt>Status</dt><dd>{node.status}</dd></div><div><dt>Owner</dt><dd>{node.owner}</dd></div><div><dt>Downstream</dt><dd>{edges.filter(e=>e.from===node.id).map(e=>nodes.find(n=>n.id===e.to)?.label).join(", ")||"None"}</dd></div></dl></aside></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
