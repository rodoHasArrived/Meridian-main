<!-- @dsCard group="Charts" viewport="640x640" name="P&L Calendar" subtitle="Month-grid daily P&L — signed values, intraday micro-bars, statement total" -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>P&L Calendar</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_preview_runtime.js"></script>
<script src="../../_preview_jsx.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;padding:20px;background:var(--bg);font-family:var(--font-body);">
<div id="root"></div>
<script type="text/babel">
const { PnLCalendar, Eyebrow } = window.MeridianDesignSystem_205d17;
// Deterministic demo month — weekdays only.
const VALUES = {};
const seed = [1240, -3180, 890, 2210, -450, 1875, -925, 3320, 140, -1610,
              2480, 760, -2090, 1130, 0, 4210, -680, 950, 1540, -1275, 2960, 405];
let i = 0;
for (let d = 1; d <= 30; d++) {
  const wd = new Date(Date.UTC(2026, 5, d)).getUTCDay();
  if (wd === 0 || wd === 6) continue;
  VALUES[`2026-06-${String(d).padStart(2, "0")}`] = seed[i++ % seed.length];
}
const BARS = {};
Object.entries(VALUES).forEach(([k, v], di) => {
  BARS[k] = Array.from({ length: 8 }, (_, j) =>
    Math.round(v / 8 + Math.sin((di + 1) * (j + 3) * 2.17) * Math.abs(v) / 4));
});
function App() {
  return (
    <div style={{ maxWidth: 600, display: "flex", flexDirection: "column", gap: 8 }}>
      <Eyebrow>Daily P&L · June 2026 · strategy momentum.v4</Eyebrow>
      <PnLCalendar month="2026-06" values={VALUES} bars={BARS} heat={false} cellHeight={58} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
