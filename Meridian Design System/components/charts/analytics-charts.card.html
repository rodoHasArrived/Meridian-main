<!-- @dsCard group="Charts" viewport="1180x1120" name="Analytics charts" subtitle="Underwater curve · returns distribution · order-book depth · correlation matrix · X/Y scatter" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Analytics charts</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;padding:20px;background:var(--bg-canvas,#ECEFF3);font-family:var(--font-body);">
<div id="root"></div>
<script type="text/babel">
const { DrawdownChart, Histogram, DepthChart, CorrelationHeatmap, ScatterChart, ChartCard } = window.MeridianDesignSystem_4f61be;

function Section({ title, sub, children, span, h = 250 }) {
  return (
    <div style={{ background:"var(--bg-light)", border:"1px solid var(--border)", borderRadius:2,
      padding:14, gridColumn: span ? `span ${span}` : undefined, display:"flex", flexDirection:"column" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10 }}>
        <span style={{ fontSize:10, fontWeight:600, fontVariant:"all-small-caps", letterSpacing:".04em", color:"var(--text-muted)" }}>{title}</span>
        {sub && <span style={{ fontFamily:"var(--font-data)", fontSize:11, color:"var(--text-secondary)" }}>{sub}</span>}
      </div>
      <div style={{ height:h }}>{children}</div>
    </div>
  );
}

// ── sample data ────────────────────────────────────────────────
// drawdown: simulated underwater curve
const ddN = 130;
let eq = 0, peak = 0;
const dd = [], ddLabels = [];
for (let i = 0; i < ddN; i++) {
  eq += (Math.sin(i / 9) * 1.4) + (Math.random() - 0.46) * 2.2;
  peak = Math.max(peak, eq);
  dd.push(+(((eq - peak) / (100 + peak)) * 100).toFixed(2));
  ddLabels.push(i % 22 === 0 ? `M${Math.floor(i / 22) + 1}` : "");
}

// returns: ~normal sample
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const returns = Array.from({ length: 600 }, () => +(gauss() * 1.1 + 0.08).toFixed(2));

// order book around 214.00
const bids = [], asks = [];
let bs = 0, as = 0;
for (let i = 0; i < 22; i++) {
  bids.push({ price: +(214.00 - i * 0.05 - 0.01).toFixed(2), size: Math.round(40 + Math.random() * 120 + i * 14) });
  asks.push({ price: +(214.00 + i * 0.05 + 0.01).toFixed(2), size: Math.round(40 + Math.random() * 120 + i * 14) });
}

// scatter: credit spread (bps) vs 3M implied vol (%) — a cloud of daily observations
// plus today's reading highlighted
const scatterPoints = Array.from({ length: 420 }, (_, i) => {
  const vol = 18 + Math.random() * 40 + (i / 420) * 10;
  const spread = 40 + vol * 0.85 + (Math.random() - 0.5) * 26;
  return { x: +vol.toFixed(2), y: +spread.toFixed(1) };
});
const scatterCurrent = { x: 34.2, y: 78.5 };

// correlation matrix
const corrLabels = ["SPY", "QQQ", "AAPL", "NVDA", "TLT", "GLD"];
const corr = [
  [1.00, 0.94, 0.71, 0.66, -0.42, -0.11],
  [0.94, 1.00, 0.78, 0.82, -0.51, -0.18],
  [0.71, 0.78, 1.00, 0.69, -0.33, -0.06],
  [0.66, 0.82, 0.69, 1.00, -0.39, 0.04],
  [-0.42, -0.51, -0.33, -0.39, 1.00, 0.46],
  [-0.11, -0.18, -0.06, 0.04, 0.46, 1.00],
];

function Demo() {
  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, maxWidth:1120 }}>
      <Section title="DrawdownChart · underwater" sub="momentum.v4 · 6mo">
        <DrawdownChart series={dd} labels={ddLabels} threshold={-8} markMax />
      </Section>
      <Section title="Histogram · daily returns" sub="600 sessions">
        <Histogram values={returns} binCount={28} signed showMean />
      </Section>
      <Section title="DepthChart · order book" sub="AAPL · mid 214.00">
        <DepthChart bids={bids} asks={asks} />
      </Section>
      <Section title="CorrelationHeatmap · 6×6" sub="90d daily returns" h={290}>
        <CorrelationHeatmap labels={corrLabels} matrix={corr} cellSize={42} headerSize={48} />
      </Section>
      <Section title="ScatterChart · spread vs implied vol" sub="420 sessions · current highlighted" span={2}>
        <ScatterChart points={scatterPoints} current={scatterCurrent}
          xFmt={(v) => v.toFixed(0) + "%"} yFmt={(v) => v.toFixed(0) + "bps"} />
      </Section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
