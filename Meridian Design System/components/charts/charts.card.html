<!-- @dsCard group="Charts" viewport="1200x700" name="Charts" subtitle="Refined CandleChart & EquityCurve: improved gridlines, axis presentation, crosshair readouts, volume visualization" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Charts</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--bg-canvas, #ECEFF3); font-family: var(--font-body); }
  .container { max-width: 1200px; margin: 0 auto; }
  h3 { margin: 0 0 16px 0; font-size: 15px; color: var(--text-primary, #14181E); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-card { background: var(--bg-light); border: 1px solid var(--border, #B2BAC3); border-radius: 2px; padding: 14px; }
  .chart-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .chart-title { font-size: 14px; font-weight: 600; color: var(--text-primary, #14181E); }
  .chart-subtitle { font-size: 12px; color: var(--text-muted, #5E6873); font-family: var(--font-data); }
  .chart-wrap { width: 100%; height: 340px; }
</style>
</head>
<body class="meridian">
<div id="root"></div>
<script type="text/babel">
const { CandleChart, EquityCurve } = window.MeridianDesignSystem_4f61be;

const BARS = (() => {
  let p = 182; const out = [];
  for (let i = 0; i < 60; i++) {
    const drift = Math.sin(i / 5) * 6 + (i / 60) * 20;
    const o = p; const c = 178 + drift + (i % 3 - 1) * 2.2;
    const hi = Math.max(o, c) + 1.6 + (i % 4) * 0.3; const lo = Math.min(o, c) - 1.6 - (i % 3) * 0.3;
    const hh = String(9 + Math.floor(i / 6)).padStart(2, "0");
    out.push({ t: `${hh}:30`, o, h: hi, l: lo, c, v: 1.2e6 + Math.abs(Math.sin(i)) * 2.4e6 }); p = c;
  }
  return out;
})();

const EQ = []; const BM = []; const DD = [];
let e = 1000, b = 1000, peak = 1000;
for (let i = 0; i < 64; i++) {
  e *= 1 + (Math.sin(i / 4) * 0.012 + 0.006 + (i % 7 === 0 ? -0.03 : 0));
  b *= 1 + (Math.sin(i / 5) * 0.008 + 0.004);
  peak = Math.max(peak, e); DD.push(-((peak - e) / peak) * 100);
  EQ.push(e); BM.push(b);
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"];
const labels = EQ.map((_, i) => i % 8 === 0 ? MON[i / 8] : "");

ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="container">
    <h3>Refined Charts with Institutional Presentation</h3>
    <div className="grid">
      <div className="chart-card">
        <div className="chart-header">
          <span className="chart-title">AAPL · 1D</span>
          <span className="chart-subtitle">Apple Inc. · XNAS</span>
        </div>
        <div className="chart-wrap">
          <CandleChart
            bars={BARS}
            crosshairIndex={44}
            overlays={[
              { label: "MA20", color: "var(--accent)", win: 20 },
              { label: "MA50", color: "var(--orange)", win: 50 }
            ]}
          />
        </div>
      </div>

      <div className="chart-card">
        <div className="chart-header">
          <span className="chart-title">Strategy equity · YTD</span>
          <span className="chart-subtitle">vs SPX benchmark</span>
        </div>
        <div className="chart-wrap">
          <EquityCurve
            series={[
              { label: "Strategy", color: "var(--chart-equity)", points: EQ },
              { label: "SPX", color: "var(--chart-secondary)", points: BM, dashed: true },
            ]}
            labels={labels}
            drawdown={DD}
            valueFmt={(v) => "$" + (v / 1000).toFixed(2) + "k"}
            crosshairIndex={49}
            showLegend={true}
          />
        </div>
      </div>
    </div>
  </div>
);
</script>
</body>
</html>
