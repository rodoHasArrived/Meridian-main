<!-- @dsCard group="Charts" viewport="1180x760" name="Analytical figure and field" subtitle="Complete figure contract with retained evidence, selected readout, source path, and nonvisual fallback" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytical figure</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.layout{display:grid;grid-template-columns:1.55fr .65fr;gap:14px;max-width:1140px}.curve{height:310px;position:relative}.curve svg{width:100%;height:100%}.side{display:grid;gap:14px;align-content:start}.panel{border:1px solid var(--border);background:var(--bg-light);padding:12px}.panel h3{margin:0 0 10px;font-size:13px;color:var(--text-primary)}table{border-collapse:collapse;width:100%;font:10px var(--font-data)}th,td{padding:5px;border-bottom:1px solid var(--border-divider);text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}.curve{height:240px}}</style></head><body><div id="root"></div><script type="text/babel">
const {AnalyticalFigure,AnalyticalField,SegmentedControl}=window.MeridianDesignSystem_205d17;
const tenors=["1M","3M","6M","1Y","2Y","3Y","5Y","7Y","10Y","20Y","30Y"],current=[5.31,5.28,5.18,4.92,4.20,4.15,4.24,4.34,4.45,4.68,4.81],prior=[5.30,5.25,5.12,4.84,4.09,4.03,4.11,4.22,4.34,4.58,4.74],scenario=[5.25,5.17,5.02,4.65,3.98,3.93,4.08,4.25,4.41,4.70,4.89];
const field=Array.from({length:48},(_,i)=>({id:i,label:`Position ${i+1}`,condition:i===44?"missing":i>40?"provisional":i===18?"stale":"confirmed"}));
function Curve({selected,onSelect}){const x=i=>45+i/(tenors.length-1)*620,y=v=>270-(v-3.7)/1.8*220,path=a=>a.map((v,i)=>`${i?"L":"M"}${x(i)} ${y(v)}`).join(" ");return <div className="curve"><svg viewBox="0 0 720 300" role="img" aria-label="Current, prior, and scenario Treasury yield curves"><line x1="45" y1="270" x2="680" y2="270" stroke="var(--border-strong)"/>{[current,prior,scenario].map((a,j)=><path key={j} d={path(a)} fill="none" stroke={j===0?"var(--series-actual)":j===1?"var(--series-prior)":"var(--series-scenario)"} strokeWidth={j===0?2.25:1.5} strokeDasharray={j===2?"7 5":""}/>)}{current.map((v,i)=><g key={i} tabIndex="0" role="button" aria-label={`${tenors[i]} ${v.toFixed(2)} percent`} onClick={()=>onSelect(i)} onKeyDown={e=>{if(e.key==="Enter"||e.key===" ")onSelect(i)}}><circle cx={x(i)} cy={y(v)} r={selected===i?6:3.5} fill="var(--surface-well)" stroke={selected===i?"var(--selected)":"var(--series-actual)"} strokeWidth={selected===i?2:1.5}/><text x={x(i)} y="290" textAnchor="middle" fontSize="9" fill="var(--text-muted)">{tenors[i]}</text></g>)}</svg></div>}
function Demo(){const[state,setState]=React.useState("confirmed"),[sel,setSel]=React.useState(8),[mark,setMark]=React.useState(44);const fallback=<table><caption>Exact curve values</caption><thead><tr><th>Tenor</th><th>Current</th><th>Prior</th><th>Scenario</th></tr></thead><tbody>{tenors.map((t,i)=><tr key={t}><td>{t}</td><td>{current[i].toFixed(2)}%</td><td>{prior[i].toFixed(2)}%</td><td>{scenario[i].toFixed(2)}%</td></tr>)}</tbody></table>;return <div className="layout"><AnalyticalFigure question="How has the statutory curve changed?" title="US Treasury term structure" subtitle="Current, one-month prior, and bull-steepener scenario" unit="Yield, %" asOf="2026-07-31 11:42 UTC" source="Validated market-data composite" condition={state} coverage={state==="partial"?"9 of 11 tenors":"11 of 11 tenors"} selectedLabel={`Current · ${tenors[sel]}`} selectedValue={`${current[sel].toFixed(2)}%`} annotation={`${Math.round((current[sel]-prior[sel])*100)} bp vs prior`} note="Scenario is modeled, not forecast." fallback={fallback}><Curve selected={sel} onSelect={setSel}/></AnalyticalFigure><div className="side"><section className="panel"><h3>Figure state</h3><SegmentedControl size="sm" fullWidth value={state} onChange={setState} options={["confirmed","stale","partial","offline"]}/></section><section className="panel"><h3>Position coverage</h3><AnalyticalField items={field} columns={8} selectedId={mark} onSelect={x=>setMark(x.id)} showLegend/></section></div></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
