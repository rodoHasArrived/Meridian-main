<!-- @dsCard group="Charts" viewport="1180x820" name="Figure grid — small multiples and print" subtitle="Tiled small-multiple figures under one declared shared scale, and the print variant that expands its own exact values" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytical figure grid</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-body)}.wrap{display:grid;gap:16px;max-width:1140px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{font-size:11px;color:var(--text-muted)}.eyebrow{font:600 10px var(--font-data);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}table{border-collapse:collapse;width:100%;font:11px var(--font-data)}th,td{border-bottom:1px solid var(--border-divider);padding:3px 6px;text-align:right;color:var(--text-secondary)}th:first-child,td:first-child{text-align:left}@media(max-width:900px){body{padding:12px}}</style></head><body><div id="root"></div><script type="text/babel">
const {AnalyticalFigure,AnalyticalFigureGrid,SegmentedControl}=window.MeridianDesignSystem_205d17;
const sectors=[{k:"Treasuries",v:[4.31,4.28,4.35,4.42,4.38,4.51,4.62],c:"confirmed"},{k:"IG credit",v:[5.12,5.18,5.09,5.24,5.31,5.28,5.44],c:"confirmed"},{k:"High yield",v:[7.84,7.71,7.92,8.04,7.96,8.18,8.31],c:"provisional"},{k:"Municipals",v:[3.62,3.58,3.66,3.71,3.69,3.74,3.81],c:"confirmed"},{k:"Agency MBS",v:[4.88,4.92,4.85,4.97,5.02,4.99,5.11],c:"stale"},{k:"Bank loans",v:[8.42,8.31,8.55,8.61,8.49,8.72,8.84],c:"confirmed"}];
const LO=3,HI=9,W=240,H=64;
function Spark({v,dashed}){const pts=v.map((n,i)=>`${i*W/(v.length-1)},${H-((n-LO)/(HI-LO))*H}`).join(" ");return <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2={W} y1={H-((5-LO)/(HI-LO))*H} y2={H-((5-LO)/(HI-LO))*H} stroke="var(--border)" strokeDasharray="2 3"/><polyline points={pts} fill="none" stroke="var(--chart-primary)" strokeWidth="1.5" strokeDasharray={dashed?"4 3":undefined} vectorEffect="non-scaling-stroke"/></svg>}
const Exact=({v})=><table><thead><tr><th>Week</th><th>Yield</th></tr></thead><tbody>{v.map((n,i)=><tr key={i}><td>W{i+1}</td><td>{n.toFixed(2)}%</td></tr>)}</tbody></table>;
function Demo(){const [variant,setVariant]=React.useState("standard");return <div className="wrap">
  <AnalyticalFigureGrid title="Yield by sector · trailing seven weeks" sharedScale="3.00–9.00% on every panel, common y-axis" columns={3} source="Composite pricing · validated holdings" note="Dashed trace marks a provisional or stale source. Zero line omitted — the scale never reaches it.">
    {sectors.map(s=><AnalyticalFigure key={s.k} variant="small-multiple" title={s.k} subtitle={`${s.v[s.v.length-1].toFixed(2)}% current`} unit="%" condition={s.c} selectedLabel="Δ 7w" selectedValue={`${(s.v[s.v.length-1]-s.v[0]>=0?"+":"−")}${Math.abs(s.v[s.v.length-1]-s.v[0]).toFixed(2)} pp`}><Spark v={s.v} dashed={s.c!=="confirmed"}/></AnalyticalFigure>)}
  </AnalyticalFigureGrid>
  <div className="controls"><span className="eyebrow">Figure variant</span><SegmentedControl size="sm" value={variant} onChange={setVariant} options={[{value:"standard",label:"Standard"},{value:"small-multiple",label:"Small multiple"},{value:"print",label:"Print"}]}/><span className="muted">Print flattens the plot to paper white and expands the exact-value table that Standard keeps folded.</span></div>
  <AnalyticalFigure variant={variant} question="Is high yield widening against the book?" title="High yield · trailing seven weeks" subtitle="Composite, weekly close" unit="Percent" asOf="2026-08-07 21:00 UTC" condition="provisional" source="Composite pricing · validated holdings" method="Weekly close, no interpolation across the 24 July feed gap." selectedLabel="Current" selectedValue="8.31%" annotation="+0.47 pp over seven weeks" fallback={<Exact v={sectors[2].v}/>}><Spark v={sectors[2].v} dashed/></AnalyticalFigure>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
