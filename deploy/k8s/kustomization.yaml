# EXPERIMENTAL - NOT part of the supported production envelope (ADR-019).
# The v1 supported production deployment is the single-operator local workstation;
# container/systemd topologies are unsupported pending PRD-013 disposition, and
# production postures fail closed. See docs/adr/019-production-support-matrix-and-deployment-posture.md.

# =============================================================================
# Meridian - Kustomize Configuration
# =============================================================================
#
# Deploy with:
#   kubectl apply -k deploy/k8s/
#
# Preview rendered manifests:
#   kubectl kustomize deploy/k8s/
#
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meridian

commonLabels:
  app.kubernetes.io/part-of: meridian
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
