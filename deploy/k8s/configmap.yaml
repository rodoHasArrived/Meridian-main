# EXPERIMENTAL - NOT part of the supported production envelope (ADR-019).
# The v1 supported production deployment is the single-operator local workstation;
# container/systemd topologies are unsupported pending PRD-013 disposition, and
# production postures fail closed. See docs/adr/019-production-support-matrix-and-deployment-posture.md.

apiVersion: v1
kind: ConfigMap
metadata:
  name: meridian-config
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian
    app.kubernetes.io/component: config
data:
  # Timezone for the application
  TZ: "UTC"

  # Application settings (non-sensitive)
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  MDC_DATA_ROOT: "/app/data"

  # Logging configuration
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
