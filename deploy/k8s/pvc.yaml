# EXPERIMENTAL - NOT part of the supported production envelope (ADR-019).
# The v1 supported production deployment is the single-operator local workstation;
# container/systemd topologies are unsupported pending PRD-013 disposition, and
# production postures fail closed. See docs/adr/019-production-support-matrix-and-deployment-posture.md.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meridian-data
  namespace: meridian
  labels:
    app.kubernetes.io/name: meridian
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Adjust based on expected data volume.
      # 1 day of tick data for ~20 symbols is roughly 1-5 GB.
      storage: 50Gi
  # Uncomment and set to use a specific StorageClass:
  # storageClassName: gp3
