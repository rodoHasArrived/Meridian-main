# =============================================================================
# Prometheus Alert Rules for Meridian
# =============================================================================
# Add to prometheus.yml under rule_files:
#   rule_files:
#     - /etc/prometheus/alert-rules.yml
#
# Every alert includes:
#   - Symptom summary and probable causes
#   - Link to exact runbook section
#   - Immediate mitigations and rollback criteria
#
# Every `expr` below must reference a series the exporter actually emits
# (src/Meridian.Application/Monitoring/PrometheusMetrics.cs and the storage
# counters in src/Meridian.Storage/Archival/WriteAheadLog.cs and
# src/Meridian.Storage/Sinks/JsonlStorageSink.cs), and every
# `runbook_url` must resolve to a heading in the active operator runbook.
# `build/scripts/ci/validate-observability-contract.py` fails the build when
# either stops being true: an alert on an unexported series is a permanently
# absent alert, and a broken runbook link strands the responder.
# =============================================================================

groups:
  - name: mdc_health
    rules:
      # Application is down or unreachable.
      # Measured by Prometheus' own `up` series: a dead process cannot export
      # its own unavailability.
      - alert: MeridianDown
        expr: up{job="meridian"} == 0
        for: 1m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Meridian is down"
          description: "The Meridian instance has been unreachable for more than 1 minute."
          runbook_url: "docs/operators/operator-runbook.md#application-down"
          probable_causes: "Process crashed, host unreachable, port blocked, OOM killed"
          immediate_mitigation: "1. Check process status (systemctl status meridian). 2. Check system logs (journalctl -u meridian). 3. Restart service if crashed. 4. Check disk space and memory."
          rollback_criteria: "Health endpoint returns 200 within 30 seconds of restart"

      # Sustained proportional loss while the process is still scraping.
      # Freshness has separate symbol-level SLA alerts; process health tracks pipeline drops.
      - alert: MeridianUnhealthy
        expr: mdc_drop_rate_percent > 5
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Meridian reports unhealthy"
          description: "More than 5% of events have been dropped for 2 minutes."
          runbook_url: "docs/operators/operator-runbook.md#unhealthy-status"
          probable_causes: "Provider disconnected, storage write failures, pipeline backpressure, dependency timeout"
          immediate_mitigation: "1. Check /health/detailed for specific failing checks. 2. Review recent error logs. 3. Verify provider connectivity."

  - name: mdc_pipeline
    rules:
      # Proportional drop rate (gauge, 0-100) exceeds the SLO-ING-002 critical threshold.
      - alert: MeridianHighDropRate
        expr: mdc_drop_rate_percent > 1
        for: 5m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "High pipeline event drop rate ({{ $value }}%)"
          description: "More than 1% of events have been dropped over the last 5 minutes."
          runbook_url: "docs/operators/operator-runbook.md#high-drop-rate"
          probable_causes: "Storage sink blocking (slow disk I/O), pipeline queue at capacity, too many subscriptions for processing capacity"
          immediate_mitigation: "1. Check /api/backpressure for queue utilization. 2. Monitor disk I/O latency. 3. Consider reducing symbol subscriptions. 4. Check EventPipeline channel capacity."

      # Sustained absolute drops. A low percentage of a very high inbound rate
      # still loses a large number of events, so this fires on the count.
      - alert: MeridianPipelineBackpressure
        expr: rate(mdc_events_dropped_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Pipeline shedding load ({{ $value }} events/sec dropped)"
          description: "More than 10 events/sec have been dropped for 2 minutes."
          runbook_url: "docs/operators/operator-runbook.md#pipeline-backpressure"
          probable_causes: "Consumer slower than producer, storage write latency, burst of market data events"
          immediate_mitigation: "1. Check storage write latency metrics. 2. Verify disk health. 3. Consider pausing non-critical subscriptions."

      # Channel filling before anything is dropped. MeridianPipelineBackpressure and
      # MeridianHighDropRate only fire once events are already being lost; this fires on the
      # backlog that precedes the loss, while there is still time to act. The ratio is read
      # from EventPipeline.GetStatistics() on the scrape, one series per {pipeline}.
      - alert: MeridianPipelineBacklogHigh
        expr: max by (pipeline) (mdc_pipeline_queue_utilization_ratio) > 0.7
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} channel {{ $value | humanizePercentage }} full"
          description: "The {{ $labels.pipeline }} pipeline channel has been more than 70% full for 2 minutes; drops follow if it reaches capacity."
          runbook_url: "docs/operators/operator-runbook.md#pipeline-backlog"
          probable_causes: "Storage sink slow or failing, consumer faulted, burst of market data events, channel capacity too small for the inbound rate"
          immediate_mitigation: "1. Check mdc_sink_write_failures_total and disk latency on the data root. 2. Check mdc_pipeline_consumers_faulted. 3. Read /api/backpressure. 4. Shed non-critical subscriptions if the sink is healthy but outpaced."

      # A consumer task has terminated with a fault, so the channel is no longer being drained
      # by it. With a single consumer the pipeline stops persisting entirely; backlog and then
      # drops follow. The gauge counts faulted tasks, so it stays raised until restart.
      - alert: MeridianPipelineConsumerFaulted
        expr: max by (pipeline) (mdc_pipeline_consumers_faulted) > 0
        for: 1m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} has {{ $value }} faulted consumer(s)"
          description: "A consumer task of the {{ $labels.pipeline }} pipeline has terminated with a fault and is no longer draining the channel."
          runbook_url: "docs/operators/operator-runbook.md#pipeline-consumer-faulted"
          probable_causes: "Unhandled exception in the consume loop, storage sink throwing on every write, validator or dedup ledger failure"
          immediate_mitigation: "1. Read the 'Pipeline consumer iteration failed' lines in <data-root>/_logs (EventPipeline category). 2. Check mdc_sink_write_failures_total and disk health. 3. Restart the host once the cause is addressed; WAL recovery replays uncommitted events."
          rollback_criteria: "After restart mdc_pipeline_consumers_faulted is 0 and mdc_pipeline_queue_depth drains"

      # No events published during the alert window.
      # `increase(...[10m]) == 0` measures the ten minutes SLO-DC-002 declares. Pairing a 5m
      # rate with `for: 10m` did not: the rate stays non-zero until the last increment leaves
      # its range, so the pending timer only started five minutes after the stall and the alert
      # fired at roughly fifteen.
      #
      # A freshly started process must not page immediately: with only two post-start samples
      # and no publications, a ten-minute increase is already zero one minute in. The guard is
      # on the series' own age, not on a prior publication. `mdc_events_published_total offset
      # 10m` resolves only once the series has existed for ten minutes, so this fires once the
      # window is real and empty.
      #
      # Guarding on `mdc_events_published_total > 0` instead — requiring a prior publication —
      # was wrong in the opposite direction: a process that starts with a broken provider and
      # never publishes its first event would have been suppressed permanently, which is
      # precisely the outage this rule exists to report.
      #
      # KNOWN GAP: no market-session signal is exported, so this still pages during closed
      # sessions once the window is real. SLO-DC-002 scopes the objective to market hours and
      # the annotation tells the responder to check session state first, but the rule cannot
      # enforce it until a session gauge exists. Tracked with PRD-111.
      - alert: MeridianNoEventsPublished
        expr: increase(mdc_events_published_total[10m]) == 0 and (mdc_events_published_total offset 10m) >= 0
        for: 1m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "No events published in 10 minutes"
          description: "The event pipeline has not published any events for 10 minutes."
          runbook_url: "docs/operators/operator-runbook.md#no-events"
          probable_causes: "All providers disconnected, market closed (check TradingCalendar), subscription failure, network outage"
          immediate_mitigation: "1. Check market hours first — outside session hours this is expected. 2. Check /api/providers/status for connection state. 3. Test provider connectivity."

  - name: mdc_providers
    rules:
      # Global provider circuit breaker not closed (0=Closed, 1=Open, 2=HalfOpen).
      # `>= 1` rather than `== 1`: half-open still means the provider is unusable and
      # resubscription is only probing, and SLO-PC-001 treats every value at or above its
      # critical threshold of 1 as a violation. Equality would silence the alert during
      # recovery and leave a flapping provider unmonitored.
      #
      # AWAITING INSTRUMENTATION: every mutation of ResubscriptionMetrics.CurrentCircuitState is
      # inside AutoResubscribePolicy, and no production code constructs or registers that class,
      # so the snapshot this gauge is fed from is permanently Closed. The rule is correct and
      # cannot fire until the active resubscription path is wired. Unlike the SLA rules it needs
      # no `> 0` guard — a permanently-zero gauge is silent, not falsely firing — but it is not
      # yet coverage. Tracked with PRD-111.
      - alert: MeridianProviderDisconnected
        expr: mdc_circuit_breaker_state >= 1
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Provider circuit breaker open"
          description: "The streaming provider circuit breaker has been open for 2 minutes; resubscription is backing off."
          runbook_url: "docs/operators/operator-runbook.md#provider-disconnected"
          probable_causes: "API key expired/invalid, provider service outage, network connectivity issue, rate limit exceeded"
          immediate_mitigation: "1. Check provider status page. 2. Verify API credentials. 3. Check rate limit counters. 4. Trigger manual reconnect or failover."
          rollback_criteria: "mdc_circuit_breaker_state returns to 0 and mdc_symbols_circuit_open reaches 0"

      # Mean event processing latency above the SLO-ING-001 critical threshold, in microseconds.
      # NOT the mdc_processing_latency_microseconds histogram: PrometheusMetrics.RecordProcessingLatency
      # has no caller on the event path, so its buckets never fill and a quantile expression could
      # never cross the threshold. mdc_average_latency_microseconds is written every tick by
      # UpdateFromSnapshot. See "Objectives awaiting instrumentation" in the SLO document.
      - alert: MeridianHighProviderLatency
        expr: mdc_average_latency_microseconds > 5000
        for: 5m
        labels:
          severity: warning
          incident_priority: P3
        annotations:
          summary: "High event processing latency"
          description: "Mean event processing latency exceeds 5000 microseconds."
          runbook_url: "docs/operators/operator-runbook.md#high-latency"
          probable_causes: "Provider under load, network congestion, DNS resolution delays, WebSocket reconnection overhead"
          immediate_mitigation: "1. Check provider latency trends at /api/providers/latency. 2. Consider switching to backup provider. 3. Verify network path quality."

      # Slow API responses, per route template. The 2 s threshold matches the default
      # ApiHost:SlowRequestThresholdMs slow-request log line, so the alert and the log agree; it is
      # a starting value to tune against observed p95s. The rate guard keeps a rarely called route
      # (a few hits an hour) from paging on a quantile computed from a handful of samples.
      - alert: MeridianSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (route, le) (rate(mdc_http_request_duration_seconds_bucket[10m]))) > 2
          and on (route) sum by (route) (rate(mdc_http_request_duration_seconds_count[10m])) >= 0.1
        for: 10m
        labels:
          severity: warning
          incident_priority: P3
        annotations:
          summary: "Slow responses on {{ $labels.route }} (p95 {{ $value | humanizeDuration }})"
          description: "The 95th-percentile response time for {{ $labels.route }} has been above 2 s for 10 minutes."
          runbook_url: "docs/operators/operator-runbook.md#slow-requests"
          probable_causes: "Expensive report or read-model query, storage latency, lock contention, a slow downstream dependency, host CPU or memory pressure"
          immediate_mitigation: "1. Find the route's Slow request lines in <data-root>/_logs for status and trace ids. 2. Check host CPU and memory and mdc_pipeline_queue_utilization_ratio. 3. Check storage latency and mdc_disk_free_bytes. 4. Correlate trace ids when tracing is enabled."

  - name: mdc_storage
    rules:
      # Write-ahead log integrity failures. Committed data was not durably retained.
      # This counter is only advanced by WriteAheadLog.RecoverAsync at startup, so a
      # `rate()` window would go quiet minutes after recovery and clear a P1 integrity
      # alert while the corruption was still unreconciled. The total is the persistent
      # condition: it stays above zero for the life of the process that found the damage,
      # and returns to zero only after a restart whose recovery pass is clean.
      - alert: MeridianStorageWriteErrors
        expr: mdc_wal_recovery_corrupted_records_total > 0
        for: 1m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Storage write integrity errors detected"
          description: "Recovery encountered {{ $value }} corrupted write-ahead log record(s); committed data was not durably retained."
          runbook_url: "docs/operators/operator-runbook.md#storage-write-errors"
          probable_causes: "Disk full, filesystem permissions, I/O errors, WAL corruption, storage path misconfigured"
          immediate_mitigation: "1. Check disk space immediately. 2. Verify storage path permissions. 3. Capture the corrupted records before any repair. 4. Review storage error logs for root cause."
          rollback_criteria: "The affected window is reconciled and a subsequent restart recovers with zero corrupted records"

      # Writes to the storage sink are failing repeatedly. Failed batches are restored and
      # retried, so a single failure followed by a successful retry is not an incident; three or
      # more failures in five minutes, sustained for five minutes, means the data root is not
      # accepting writes and events are accumulating in memory and the WAL only.
      # Distinct from MeridianStorageWriteErrors, which reports WAL corruption found at recovery.
      - alert: MeridianSinkWriteFailing
        expr: sum by (sink) (increase(mdc_sink_write_failures_total[5m])) >= 3
        for: 5m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Storage sink {{ $labels.sink }} writes failing"
          description: "The {{ $labels.sink }} sink has failed {{ $value }} write attempts in the last 5 minutes; affected batches are buffered for retry but not yet on disk."
          runbook_url: "docs/operators/operator-runbook.md#sink-write-failures"
          probable_causes: "Disk full, filesystem permissions, I/O errors, storage path unmounted or misconfigured"
          immediate_mitigation: "1. Check free space on the data root. 2. Read the 'Failed to flush' lines in <data-root>/_logs for the path and exception. 3. Verify path ownership and mount state. 4. Prefer fixing the cause before restarting; failed batches stay buffered and are retried in place."
          rollback_criteria: "mdc_sink_write_failures_total stops increasing and mdc_pipeline_seconds_since_last_flush returns to the flush interval"

      # Free space on the data-root volume (which also holds the WAL). Thresholds match
      # SystemHealthConfig (warning 10 GiB, critical 2 GiB), so /health/detailed and these alerts
      # agree. The low-space warning gives time to act before writes start failing.
      - alert: MeridianDiskSpaceLow
        expr: min by (path) (mdc_disk_free_bytes) < 10737418240
        for: 15m
        labels:
          severity: warning
          incident_priority: P3
        annotations:
          summary: "Low disk space for {{ $labels.path }} ({{ $value | humanize1024 }}B free)"
          description: "The volume holding {{ $labels.path }} has had less than 10 GiB free for 15 minutes."
          runbook_url: "docs/operators/operator-runbook.md#disk-space-low"
          probable_causes: "Data growth without retention, large backfill, log or archive accumulation, another process filling the volume"
          immediate_mitigation: "1. Check retention settings (Storage RetentionDays / MaxTotalBytes). 2. Archive or move cold data. 3. Check _logs and archive sizes under the data root."

      - alert: MeridianDiskSpaceCritical
        expr: min by (path) (mdc_disk_free_bytes) < 2147483648
        for: 5m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Disk nearly full for {{ $labels.path }} ({{ $value | humanize1024 }}B free)"
          description: "The volume holding {{ $labels.path }} has had less than 2 GiB free for 5 minutes; WAL and sink writes will start failing."
          runbook_url: "docs/operators/operator-runbook.md#disk-space-low"
          probable_causes: "Data growth without retention, large backfill, log or archive accumulation, another process filling the volume"
          immediate_mitigation: "1. Free space immediately (move cold data or archives off the volume). 2. Pause backfills. 3. Watch mdc_sink_write_failures_total. 4. Tighten retention once stable."
          rollback_criteria: "mdc_disk_free_bytes is above 10 GiB and mdc_sink_write_failures_total is not increasing"

      # Validation pass rate below the SLO-DC-001 critical threshold (gauge, 0-100).
      - alert: MeridianLowDataQuality
        expr: mdc_validation_pass_rate_percent < 80
        for: 15m
        labels:
          severity: warning
          incident_priority: P3
        annotations:
          summary: "Low data quality score ({{ $value }}%)"
          description: "The validation pass rate is {{ $value }}%, below the 80% threshold."
          runbook_url: "docs/operators/operator-runbook.md#low-data-quality"
          probable_causes: "Data gaps from provider outage, stale quotes, sequence errors, bad tick data from provider"
          immediate_mitigation: "1. Read mdc_validation_rejected_total by error_type. 2. Check /api/quality/gaps for gap analysis. 3. Compare across providers at /api/quality/comparison/{symbol} for an affected symbol. 4. Consider triggering gap-fill backfill."

  - name: mdc_sla
    rules:
      # One or more symbols outside their freshness threshold.
      # Periodic SLA snapshots continue advancing while a feed is silent. A zero
      # freshness score is a severe stall, so it must not suppress this alert.
      - alert: MeridianDataFreshnessViolation
        expr: mdc_sla_violation_symbols > 0
        for: 5m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Data freshness SLA violation ({{ $value }} symbols)"
          description: "{{ $value }} symbol(s) have exceeded their data freshness threshold for 5 minutes."
          runbook_url: "docs/operators/operator-runbook.md#freshness-sla-violation"
          probable_causes: "Provider stream stalled, subscription dropped, processing pipeline blocked"
          immediate_mitigation: "1. Check /api/sla/violations for affected symbols. 2. Check provider connection status. 3. Verify subscription is active. 4. Re-subscribe if needed."
          rollback_criteria: "mdc_sla_violation_symbols returns to 0"

      # Composite freshness score below the 95 compliance target.
      # Uninitialized or unmonitored instances have no applicable symbols. Closed
      # market sessions export score 100 and zero violations from the monitor.
      - alert: MeridianSlaComplianceLow
        expr: mdc_sla_freshness_score < 95 and mdc_sla_monitored_symbols > 0
        for: 30m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "SLA compliance below 95%"
          description: "The composite data freshness score has dropped to {{ $value }}."
          runbook_url: "docs/operators/operator-runbook.md#sla-compliance"
          probable_causes: "Multiple provider degradations, systematic processing delays, infrastructure issues"
          immediate_mitigation: "1. Review /api/sla/violations for affected symbols. 2. Check /api/sla/metrics for trends. 3. Evaluate provider health across all active providers."
