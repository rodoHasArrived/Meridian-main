# =============================================================================
# Prometheus Alert Rules for Meridian
# =============================================================================
# Add to prometheus.yml under rule_files:
#   rule_files:
#     - /etc/prometheus/alert-rules.yml
#
# Every alert includes:
#   - Symptom summary and probable causes
#   - Link to exact runbook section
#   - Immediate mitigations and rollback criteria
#
# Every `expr` below must reference a series the exporter actually emits
# (src/Meridian.Application/Monitoring/PrometheusMetrics.cs and the storage
# counters in src/Meridian.Storage/Archival/WriteAheadLog.cs), and every
# `runbook_url` must resolve to a heading in the active operator runbook.
# `build/scripts/ci/validate-observability-contract.py` fails the build when
# either stops being true: an alert on an unexported series is a permanently
# absent alert, and a broken runbook link strands the responder.
# =============================================================================

groups:
  - name: mdc_health
    rules:
      # Application is down or unreachable.
      # Measured by Prometheus' own `up` series: a dead process cannot export
      # its own unavailability.
      - alert: MeridianDown
        expr: up{job="meridian"} == 0
        for: 1m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Meridian is down"
          description: "The Meridian instance has been unreachable for more than 1 minute."
          runbook_url: "docs/operators/operator-runbook.md#application-down"
          probable_causes: "Process crashed, host unreachable, port blocked, OOM killed"
          immediate_mitigation: "1. Check process status (systemctl status meridian). 2. Check system logs (journalctl -u meridian). 3. Restart service if crashed. 4. Check disk space and memory."
          rollback_criteria: "Health endpoint returns 200 within 30 seconds of restart"

      # Sustained proportional loss while the process is still scraping.
      # NOT mdc_sla_freshness_score: nothing calls PrometheusMetrics.UpdateSlaMetrics, so that
      # gauge sits at its default 0 and a `< 50` threshold would fire permanently on a healthy
      # instance. See "Objectives awaiting instrumentation" in the SLO document.
      - alert: MeridianUnhealthy
        expr: mdc_drop_rate_percent > 5
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Meridian reports unhealthy"
          description: "More than 5% of events have been dropped for 2 minutes."
          runbook_url: "docs/operators/operator-runbook.md#unhealthy-status"
          probable_causes: "Provider disconnected, storage write failures, pipeline backpressure, dependency timeout"
          immediate_mitigation: "1. Check /health/detailed for specific failing checks. 2. Review recent error logs. 3. Verify provider connectivity."

  - name: mdc_pipeline
    rules:
      # Proportional drop rate (gauge, 0-100) exceeds the SLO-ING-002 critical threshold.
      - alert: MeridianHighDropRate
        expr: mdc_drop_rate_percent > 1
        for: 5m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "High pipeline event drop rate ({{ $value }}%)"
          description: "More than 1% of events have been dropped over the last 5 minutes."
          runbook_url: "docs/operators/operator-runbook.md#high-drop-rate"
          probable_causes: "Storage sink blocking (slow disk I/O), pipeline queue at capacity, too many subscriptions for processing capacity"
          immediate_mitigation: "1. Check /api/backpressure for queue utilization. 2. Monitor disk I/O latency. 3. Consider reducing symbol subscriptions. 4. Check EventPipeline channel capacity."

      # Sustained absolute drops. A low percentage of a very high inbound rate
      # still loses a large number of events, so this fires on the count.
      - alert: MeridianPipelineBackpressure
        expr: rate(mdc_events_dropped_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Pipeline shedding load ({{ $value }} events/sec dropped)"
          description: "More than 10 events/sec have been dropped for 2 minutes."
          runbook_url: "docs/operators/operator-runbook.md#pipeline-backpressure"
          probable_causes: "Consumer slower than producer, storage write latency, burst of market data events"
          immediate_mitigation: "1. Check storage write latency metrics. 2. Verify disk health. 3. Consider pausing non-critical subscriptions."

      # No events published during the alert window.
      # `increase(...[10m]) == 0` with a short `for` measures the ten minutes SLO-DC-002
      # declares. Pairing a 5m rate with `for: 10m` did not: the rate stays non-zero until the
      # last increment leaves its range, so the pending timer only started five minutes after
      # the stall and the alert fired at roughly fifteen.
      - alert: MeridianNoEventsPublished
        expr: increase(mdc_events_published_total[10m]) == 0
        for: 1m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "No events published in 10 minutes"
          description: "The event pipeline has not published any events for 10 minutes."
          runbook_url: "docs/operators/operator-runbook.md#no-events"
          probable_causes: "All providers disconnected, market closed (check TradingCalendar), subscription failure, network outage"
          immediate_mitigation: "1. Check market hours first — outside session hours this is expected. 2. Check /api/providers/status for connection state. 3. Test provider connectivity."

  - name: mdc_providers
    rules:
      # Global provider circuit breaker not closed (0=Closed, 1=Open, 2=HalfOpen).
      # `>= 1` rather than `== 1`: half-open still means the provider is unusable and
      # resubscription is only probing, and SLO-PC-001 treats every value at or above its
      # critical threshold of 1 as a violation. Equality would silence the alert during
      # recovery and leave a flapping provider unmonitored.
      - alert: MeridianProviderDisconnected
        expr: mdc_circuit_breaker_state >= 1
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Provider circuit breaker open"
          description: "The streaming provider circuit breaker has been open for 2 minutes; resubscription is backing off."
          runbook_url: "docs/operators/operator-runbook.md#provider-disconnected"
          probable_causes: "API key expired/invalid, provider service outage, network connectivity issue, rate limit exceeded"
          immediate_mitigation: "1. Check provider status page. 2. Verify API credentials. 3. Check rate limit counters. 4. Trigger manual reconnect or failover."
          rollback_criteria: "mdc_circuit_breaker_state returns to 0 and mdc_symbols_circuit_open reaches 0"

      # Mean event processing latency above the SLO-ING-001 critical threshold, in microseconds.
      # NOT the mdc_processing_latency_microseconds histogram: PrometheusMetrics.RecordProcessingLatency
      # has no caller on the event path, so its buckets never fill and a quantile expression could
      # never cross the threshold. mdc_average_latency_microseconds is written every tick by
      # UpdateFromSnapshot. See "Objectives awaiting instrumentation" in the SLO document.
      - alert: MeridianHighProviderLatency
        expr: mdc_average_latency_microseconds > 5000
        for: 5m
        labels:
          severity: warning
          incident_priority: P3
        annotations:
          summary: "High event processing latency"
          description: "Mean event processing latency exceeds 5000 microseconds."
          runbook_url: "docs/operators/operator-runbook.md#high-latency"
          probable_causes: "Provider under load, network congestion, DNS resolution delays, WebSocket reconnection overhead"
          immediate_mitigation: "1. Check provider latency trends at /api/providers/latency. 2. Consider switching to backup provider. 3. Verify network path quality."

  - name: mdc_storage
    rules:
      # Write-ahead log integrity failures. Committed data was not durably retained.
      # This counter is only advanced by WriteAheadLog.RecoverAsync at startup, so a
      # `rate()` window would go quiet minutes after recovery and clear a P1 integrity
      # alert while the corruption was still unreconciled. The total is the persistent
      # condition: it stays above zero for the life of the process that found the damage,
      # and returns to zero only after a restart whose recovery pass is clean.
      - alert: MeridianStorageWriteErrors
        expr: mdc_wal_recovery_corrupted_records_total > 0
        for: 1m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Storage write integrity errors detected"
          description: "Recovery encountered {{ $value }} corrupted write-ahead log record(s); committed data was not durably retained."
          runbook_url: "docs/operators/operator-runbook.md#storage-write-errors"
          probable_causes: "Disk full, filesystem permissions, I/O errors, WAL corruption, storage path misconfigured"
          immediate_mitigation: "1. Check disk space immediately. 2. Verify storage path permissions. 3. Capture the corrupted records before any repair. 4. Review storage error logs for root cause."
          rollback_criteria: "The affected window is reconciled and a subsequent restart recovers with zero corrupted records"

      # Validation pass rate below the SLO-DC-001 critical threshold (gauge, 0-100).
      - alert: MeridianLowDataQuality
        expr: mdc_validation_pass_rate_percent < 80
        for: 15m
        labels:
          severity: warning
          incident_priority: P3
        annotations:
          summary: "Low data quality score ({{ $value }}%)"
          description: "The validation pass rate is {{ $value }}%, below the 80% threshold."
          runbook_url: "docs/operators/operator-runbook.md#low-data-quality"
          probable_causes: "Data gaps from provider outage, stale quotes, sequence errors, bad tick data from provider"
          immediate_mitigation: "1. Read mdc_validation_rejected_total by error_type. 2. Check /api/quality/gaps for gap analysis. 3. Compare across providers at /api/quality/comparison. 4. Consider triggering gap-fill backfill."

  - name: mdc_sla
    rules:
      # One or more symbols outside their freshness threshold.
      # DISABLED PENDING INSTRUMENTATION: nothing calls PrometheusMetrics.UpdateSlaMetrics or
      # RecordSlaFreshness, so mdc_sla_violation_symbols is always 0 and this rule can never
      # fire. Kept here, evaluated against a condition that is honestly always false, so the
      # runbook and SLO linkage survive until DataFreshnessSlaMonitor is wired into the
      # periodic exporter. Re-point at mdc_sla_violation_symbols > 0 at that time.
      - alert: MeridianDataFreshnessViolation
        expr: mdc_sla_violation_symbols > 0 and mdc_sla_freshness_score > 0
        for: 5m
        labels:
          severity: critical
          incident_priority: P1
        annotations:
          summary: "Data freshness SLA violation ({{ $value }} symbols)"
          description: "{{ $value }} symbol(s) have exceeded their data freshness threshold for 5 minutes."
          runbook_url: "docs/operators/operator-runbook.md#freshness-sla-violation"
          probable_causes: "Provider stream stalled, subscription dropped, processing pipeline blocked"
          immediate_mitigation: "1. Check /api/sla/violations for affected symbols. 2. Check provider connection status. 3. Verify subscription is active. 4. Re-subscribe if needed."
          rollback_criteria: "mdc_sla_violation_symbols returns to 0"

      # Composite freshness score below the 95 compliance target.
      # DISABLED PENDING INSTRUMENTATION: mdc_sla_freshness_score has no writer, so a bare
      # `< 95` fires permanently on a healthy instance. The `> 0` guard suppresses the rule
      # until the SLA monitor is wired; remove the guard at that time.
      - alert: MeridianSlaComplianceLow
        expr: mdc_sla_freshness_score < 95 and mdc_sla_freshness_score > 0
        for: 30m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "SLA compliance below 95%"
          description: "The composite data freshness score has dropped to {{ $value }}."
          runbook_url: "docs/operators/operator-runbook.md#sla-compliance"
          probable_causes: "Multiple provider degradations, systematic processing delays, infrastructure issues"
          immediate_mitigation: "1. Review /api/sla/violations for affected symbols. 2. Check /api/sla/metrics for trends. 3. Evaluate provider health across all active providers."
