# EXPERIMENTAL - NOT part of the supported production envelope (ADR-019).
# The v1 supported production deployment is the single-operator local workstation;
# container/systemd topologies are unsupported pending PRD-013 disposition, and
# production postures fail closed. See docs/adr/019-production-support-matrix-and-deployment-posture.md.

# =============================================================================
# Meridian - Docker Compose Configuration
# =============================================================================
#
# Quick Start:
#   1. Copy config/appsettings.sample.json to config/appsettings.json and configure
#   2. Run: docker compose -f deploy/docker/docker-compose.yml up -d
#   3. Access dashboard at http://localhost:8080
#
# Or use: make docker (from repo root)
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Meridian - Main Application
  # ---------------------------------------------------------------------------
  meridian:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: meridian:latest
    container_name: meridian
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Persist market data
      - ../../data:/app/data
      # Configuration (read-only for security)
      - ../../config/appsettings.json:/app/appsettings.json:ro
      # Logs directory
      - ../../logs:/app/logs
    environment:
      - TZ=UTC
      - DOTNET_RUNNING_IN_CONTAINER=true
      # Alpaca credentials (set these or use appsettings.json)
      # - ALPACA__KEYID=your-key-id
      # - ALPACA__SECRETKEY=your-secret-key
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - meridian-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meridian-network:
    driver: bridge

# =============================================================================
# Usage:
# =============================================================================
#
# Start main application only:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   # Or: make docker (from repo root)
#
# Start with monitoring stack (Prometheus + Grafana):
#   export GF_SECURITY_ADMIN_USER=... GF_SECURITY_ADMIN_PASSWORD=...
#   docker compose -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.monitoring.yml up -d
#   # Or: make docker-monitoring
#   The monitoring services live in their own file because Compose interpolates every
#   variable before filtering by profile, so required credentials in this file would
#   abort the application-only start above.
#
# View logs:
#   docker compose -f deploy/docker/docker-compose.yml logs -f meridian
#
# Stop all services:
#   docker compose -f deploy/docker/docker-compose.yml down
#
# Stop and remove volumes:
#   docker compose -f deploy/docker/docker-compose.yml down -v
#
# Rebuild after code changes:
#   docker compose -f deploy/docker/docker-compose.yml build --no-cache
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# =============================================================================
