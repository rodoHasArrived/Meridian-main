# =============================================================================
# Meridian monitoring stack (Prometheus + Grafana)
# =============================================================================
# Kept out of docker-compose.yml because Compose interpolates the whole file
# before it filters services by profile: the required Grafana credentials below
# would abort an ordinary `docker compose up -d` of the application alone, even
# though the monitoring services were never selected.
#
# Start with:
#   export GF_SECURITY_ADMIN_USER=... GF_SECURITY_ADMIN_PASSWORD=...
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection (Optional)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: meridian-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - meridian-network
    depends_on:
      - meridian

  # ---------------------------------------------------------------------------
  # Grafana - Metrics Visualization (Optional)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: meridian-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # Administrator credentials are required from the deploying environment and have no
      # default. Compose fails to start the stack when either is unset, which is the
      # intended behaviour: a monitoring console that ships a known password is a
      # credentialled entry point into operational data.
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER before starting the monitoring profile}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD before starting the monitoring profile}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - meridian-network
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
