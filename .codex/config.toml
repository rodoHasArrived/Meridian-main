# Repository-local Codex defaults must fail closed. Individual operators can
# override these settings in their user profile when a task genuinely needs
# broader filesystem access, unattended execution, external services, or
# personal model choices.

################################################################################
# Permission Baseline
################################################################################

# Keep filesystem and approval posture conservative for shared project config.
# Documented Codex values include: read-only, workspace-write, danger-full-access.
sandbox_mode = "workspace-write"

# Keep command escalation interactive by default. Operators who need automation
# should override this in their own Codex home, not in repository-local config.
approval_policy = "on-request"

# Avoid loading user shell startup state from shared project defaults. User
# profiles can opt back into login-shell behavior when a machine requires it.
allow_login_shell = false

# Meridian work often depends on current external API/tooling behavior. Keep the
# web-search surface live by default; operator-specific domain limits belong in
# user-level profiles.
web_search = "live"

################################################################################
# Project Guidance Discovery
################################################################################

# Allow the root AGENTS.md plus the narrower .codex/AGENTS.md guidance to fit
# comfortably while still limiting accidental instruction bloat.
project_doc_max_bytes = 65536

# Allow legacy agent shims to remain discoverable when a directory lacks
# AGENTS.md / AGENTS.override.md. Prefer AGENTS.md for new directory-scoped rules.
project_doc_fallback_filenames = ["CLAUDE.md"]

# Anchor project discovery on the Meridian solution first, then fall back to the
# Git checkout marker when Codex searches parent directories for .codex folders.
project_root_markers = ["Meridian.sln", ".git"]

################################################################################
# Shared Config Boundary
################################################################################

# Project-local config should stay free of secrets and machine-specific values.
# Do not add API keys, tokens, provider auth, endpoint overrides, user-only
# paths, telemetry exporters, notification commands, or personal model
# preferences here. Put those in ~/.codex/config.toml or a user profile.
#
# Keep model, model_reasoning_effort, model_provider, model_providers,
# openai_base_url, chatgpt_base_url, mcp_servers, notify, profile, profiles, and
# otel out of this shared file unless the current Codex documentation explicitly
# permits the specific project-scoped use case and the value is secret-free.

################################################################################
# Shared Tooling Features
################################################################################

[features]
# Keep Codex lifecycle hooks available for trusted project, user, managed, or
# plugin layers. Actual command hook handlers must live in hooks.json or inline
# [hooks] tables and still require the normal Codex trust review before running.
hooks = true

# Meridian keeps many reusable specialist profiles in .codex/agents. Enable the
# stable multi-agent surface while keeping concurrency bounded below.
multi_agent = true
child_agents_md = true

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 6
min_wait_timeout_ms = 10000
default_wait_timeout_ms = 30000
max_wait_timeout_ms = 3600000
usage_hint_enabled = true
usage_hint_text = "Use Meridian specialist agents only for explicit delegation or parallel work; keep ownership disjoint and preserve user-owned changes."

[skills]
include_instructions = true

[skills.bundled]
enabled = true

[tools.web_search]
context_size = "medium"

################################################################################
# Subagent Limits
################################################################################

# Keep project-local subagent orchestration bounded. Specialist profiles live
# in .codex/agents/. The multi-agent v2 concurrency cap is configured above
# under [features.multi_agent_v2]; do not set legacy agents.max_threads here.
[agents]
max_depth = 1
job_max_runtime_seconds = 3600

[agents."dense-data-grid-inspector-panel"]
config_file = "agents/dense-data-grid-inspector-panel.toml"

