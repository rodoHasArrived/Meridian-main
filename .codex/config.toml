################################################################################
# Workspace Sandbox
################################################################################

# Workspace-write mode should not imply broad network or machine writes. Keep
# extra writable roots empty in shared config; add local paths in user config
# when a specific workflow needs them.
[sandbox_workspace_write]
writable_roots = []
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

################################################################################
# Shell Environment
################################################################################

# Inherit the normal process environment for Windows/.NET/npm command discovery,
# but keep Codex's default secret filters and add explicit cloud/provider guards.
[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
exclude = [
  "AWS_*",
  "AZURE_*",
  "GCP_*",
  "GOOGLE_*",
  "GITHUB_TOKEN",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "MERIDIAN_*_KEY",
  "MERIDIAN_*_TOKEN",
  "*PASSWORD*",
]
set = {}
include_only = []
experimental_use_profile = false
