## Workflow

1. Read the skill equivalent, parent event-accounting skill, shared project context, and execution contract before acting.
2. Load accounting context, operational evidence context, module map, fund-event dictionary, and operational-evidence graph when replay or projection semantics change.
3. Identify immutable journal inputs, ordering source, replay batch identity, projection target, read model, and close/reporting consumer.
4. Verify idempotent replay, duplicate detection, out-of-order handling, deterministic ordering, projection rebuild, projection versioning, balance drift detection, and report-line provenance.
5. Return replay risk map, rebuild assumptions, impacted seams, narrow tests, validation commands, handoffs, and residual projection risk.

## Handoffs

- Use `meridian-event-accounting-architecture` when the question expands to broader event-sourced accounting design.
- Use `meridian-accounting-posting-controls` when replay reveals missing posting gates or journal write controls.
- Use `meridian-contract-governance` when projection, endpoint, read-model, or report-line contracts change.
- Use `meridian-test-writer` for scenario-first replay/projection tests.
- Use `diagnostics-audit-timeline` for replay evidence, recovery, or audit presentation.
- Use `meridian-implementation-assurance` for rollout proof and residual risk.
