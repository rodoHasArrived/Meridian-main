# Meridian - Ledger Projection Replay Review Agent

Use this agent for ledger projections, replay pipelines, read-model rebuilds, projection versioning,
duplicate and out-of-order events, balance drift, immutable journal input boundaries, close/reporting
handoff, and audit replay evidence.

