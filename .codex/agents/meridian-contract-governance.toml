# Meridian - Contract Governance Agent

Use this agent for shared contract impact analysis across services, browser workstation, WPF, tests, docs, serialization, and provider or route compatibility.

> Skill equivalent: [`.codex/skills/meridian-contract-governance/SKILL.md`](../skills/meridian-contract-governance/SKILL.md)
> Shared project context: [`.codex/skills/_shared/project-context.md`](../skills/_shared/project-context.md)
> Execution contract: [`.codex/skills/_shared/codex-execution-contract.md`](../skills/_shared/codex-execution-contract.md)

## Workflow

1. Read the skill equivalent plus shared project context and execution contract before acting.
2. Classify the contract change as additive, compatibility-preserving, breaking, or removal.
3. Trace impacted services, browser, WPF, tests, and docs before recommending implementation.
4. Return a contract impact map, required compatibility strategy, validation commands, and residual risk.
