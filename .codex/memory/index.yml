version: 1
memory_root: .codex/memory
schema:
  id: meridian.codex-memory-index
  version: 1
  required_fields:
    - id
    - tier
    - scope
    - file
    - tags
    - load_when
    - confidence
    - freshness
    - source_refs
    - review_after
    - invalidates_when
  archive_required_fields:
    - retired_because
    - replaced_by
  active_tiers:
    - session
    - branch
    - task
    - repo
    - archive
  disabled_tiers:
    - user
    - global
  allowed_confidence:
    - low
    - medium
    - high
  allowed_freshness:
    - fresh
    - review-soon
    - stale
    - unknown
  load_when_fields:
    - skills
    - paths
    - intents
    - branches
    - tags
    - task
  load_when_task_fields:
    - ids
    - work_modes
    - intents
    - paths
  exclude_when_fields:
    - skills
    - paths
    - intents
    - branches
    - tags
    - task_ids
  task_descriptor_fields:
    - task_id
    - selected_skill
    - intent
    - work_mode
    - branch
    - planned_paths
    - memory_tags
  routing_selectors:
    skills:
      source_fields:
        - load_when.skills
        - exclude_when.skills
      descriptor_fields:
        - selected_skill
      match: exact skill name match.
    paths:
      source_fields:
        - load_when.paths
        - load_when.task.paths
        - exclude_when.paths
      descriptor_fields:
        - planned_paths
      match: fnmatch-style repo-relative glob.
    intents:
      source_fields:
        - load_when.intents
        - load_when.task.intents
        - exclude_when.intents
      descriptor_fields:
        - intent
      match: exact intent label match.
    branches:
      source_fields:
        - load_when.branches
        - exclude_when.branches
      descriptor_fields:
        - branch
      match: exact branch name match; branch-tier entries must include their branch scope.
    tags:
      source_fields:
        - tags
        - load_when.tags
        - exclude_when.tags
      descriptor_fields:
        - memory_tags
      match: exact tag match across entry tags and explicit routing tags.
    task_descriptor:
      source_fields:
        - load_when.task.ids
        - load_when.task.work_modes
        - load_when.task.intents
        - load_when.task.paths
        - exclude_when.task_ids
      descriptor_fields:
        - task_id
        - work_mode
        - intent
        - planned_paths
      match: exact task id, exact work mode, exact intent, or planned-path glob.
areas:
  repo:
    path: .codex/memory/repo
    purpose: Stable repository-level facts sourced from canonical Meridian and Codex guidance.
  tasks:
    path: .codex/memory/tasks
    purpose: Task-scoped memory that is not yet durable repository guidance.
  goals:
    path: .codex/memory/goals
    purpose: Long-running Codex goal inventories that track progress and point to the active task descriptor.
  branches:
    path: .codex/memory/branches
    purpose: Branch-specific context, assumptions, and handoff notes.
  sessions:
    path: .codex/memory/sessions
    purpose: Session-local observations and continuation breadcrumbs.
  archive:
    path: .codex/memory/archive
    purpose: Retired memory retained for auditability.
entries:
  - id: repo:validation
    tier: repo
    scope: repo
    file: .codex/memory/repo/validation.md
    tags:
      - validation
      - commands
      - ai-tooling
      - codex
    load_when:
      skills:
        - meridian-docs
        - meridian-implementation-assurance
      paths:
        - build/scripts/docs/**
        - docs/**
        - .codex/**
        - make/**
      intents:
        - validation
        - documentation
        - ai-tooling
      branches: []
      tags:
        - validation
        - ai-tooling
      task:
        ids: []
        work_modes:
          - implementation
          - validation
        intents:
          - validation
          - ai-tooling
        paths:
          - .codex/memory/**
          - build/scripts/docs/**
    confidence: high
    freshness: fresh
    source_refs:
      - AGENTS.md
      - .codex/AGENTS.md
      - .codex/skills/_shared/project-context.md
      - .codex/skills/_shared/codex-execution-contract.md
      - docs/ai/codex/quickstart.md
      - docs/ai/tooling/README.md
    review_after: 2026-09-19
    invalidates_when:
      - AI tooling validation commands change.
      - Codex execution contract validation gates change.
      - GitHub-hosted targeted-test workflow input contract changes.
