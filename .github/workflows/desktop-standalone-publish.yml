name: Desktop Standalone Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-standalone-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  publish-desktop-standalone:
    name: publish-desktop-standalone-exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK and NuGet cache
        uses: ./.github/actions/setup-dotnet-nuget

      - name: Publish desktop standalone executable
        shell: pwsh
        run: >
          pwsh ./build/scripts/publish/publish.ps1
          -Platform win-x64
          -Project desktop
          -OutputDir artifacts/publish/local-desktop

      - name: Upload desktop standalone publish artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-standalone-win-x64-${{ github.run_number }}
          path: artifacts/publish/local-desktop/
          if-no-files-found: error
          retention-days: 14
