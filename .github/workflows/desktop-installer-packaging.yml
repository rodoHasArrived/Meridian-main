name: Desktop Installer Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prior_release_tag:
        description: Optional N-1 release tag used by installed lifecycle certification.
        required: false
        type: string
      rehearsal_version:
        description: Version for a complete signed rehearsal. Manual runs never publish.
        required: true
        default: 1.0.0-rehearsal
        type: string

permissions:
  contents: read

concurrency:
  # Serialize eligibility through publication so concurrent RC/stable tags cannot both
  # validate the same increasing MSIX version before either release is published.
  group: desktop-installer-release
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  eligibility:
    name: validate-release-eligibility
    runs-on: windows-latest
    timeout-minutes: 30
    environment: desktop-release-signing
    outputs:
      package_version: ${{ steps.identity.outputs.package_version }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate signing prerequisites before builds
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MDC_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw 'Signed releases and rehearsals require both signing secrets in desktop-release-signing.'
          }
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:SIGNING_PFX), $env:SIGNING_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          try {
            [xml]$manifest = Get-Content src/Meridian.Wpf/Package.appxmanifest
            if (-not $certificate.HasPrivateKey -or $certificate.NotAfter -le [DateTime]::Now -or $certificate.NotBefore -gt [DateTime]::Now) {
              throw 'Signing certificate has no private key or is outside its validity window.'
            }
            if ($certificate.Subject -ne $manifest.Package.Identity.Publisher) { throw 'Signing publisher does not match the MSIX identity.' }
          } finally { $certificate.Dispose() }
      - name: Validate exact commit and increasing package identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_VERSION: ${{ inputs.rehearsal_version || '1.0.0-rehearsal' }}
        run: python build/scripts/ci/release-preflight.py --rehearsal-version "$env:REHEARSAL_VERSION"

  ci:
    needs: eligibility
    uses: ./.github/workflows/meridian-ci.yml

  secrets:
    needs: eligibility
    uses: ./.github/workflows/ci.yml

  codeql:
    needs: eligibility
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  production:
    needs: eligibility
    uses: ./.github/workflows/production-certification.yml

  smoke:
    needs: eligibility
    uses: ./.github/workflows/publish-smoke.yml
    with:
      project: web-workstation
      runtime: win-x64
      version: ${{ needs.eligibility.outputs.version }}

  release-preflight:
    name: verify-desktop-release-preflight
    needs: eligibility
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Run WPF and installer setup preflight
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.nuget.outputs.cache-hit || 'false' }}
        run: python build/scripts/ci/run-windows-ci-tests.py --slice full --slice setup --results-dir artifacts/test-results/desktop-release-preflight

      - name: Upload release preflight test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-preflight-test-results-${{ github.run_number }}
          path: artifacts/test-results/desktop-release-preflight/
          if-no-files-found: ignore
          retention-days: 14

  build-msix:
    name: package-desktop-msix (${{ matrix.runtime }})
    needs: [eligibility, ci, secrets, codeql, production, smoke, release-preflight]
    runs-on: windows-latest
    timeout-minutes: 75
    environment:
      name: desktop-release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # `Generate release evidence manifest` below shells out to `python`; pin it rather than
      # depending on whatever the runner image happens to expose on PATH.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Prepare protected signing certificate
        id: signing
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX_BASE64: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MDC_SIGNING_CERT_PFX_BASE64)) {
            $certPath = Join-Path $env:RUNNER_TEMP "meridian-release-signing.pfx"
            [System.IO.File]::WriteAllBytes(
              $certPath,
              [System.Convert]::FromBase64String($env:MDC_SIGNING_CERT_PFX_BASE64)
            )
            "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Release signing certificate configured."
          } else {
            throw "Release builds and rehearsals require MDC_SIGNING_CERT_PFX_BASE64 in the protected desktop-release-signing environment."
          }

      - name: Build desktop installer package
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX: ${{ steps.signing.outputs.cert_path }}
          MDC_SIGNING_CERT_PASSWORD: ${{ secrets.MDC_SIGNING_CERT_PASSWORD }}
        run: |
          $architecture = if ('${{ matrix.runtime }}' -eq 'win-arm64') { 'ARM64' } else { 'x64' }

          $env:MDC_PACKAGE_VERSION = '${{ needs.eligibility.outputs.package_version }}'

          # No -EnableReadyToRun: crossgen2 cannot compile Sharpino.Lib and aborts the publish
          # with NETSDK1096 (see the PublishReadyToRun comment in Meridian.Wpf.csproj). ReadyToRun
          # is a startup optimization, so the package ships without it rather than not at all.
          pwsh ./build/scripts/install/install.ps1 `
            -Mode Desktop `
            -Architecture $architecture `
            -SkipInstall `
            -NoNotify `
            -NoTrustCert

      # install.ps1 writes its build/publish transcripts under diagnostic-logs/. Without this the
      # only pointer a failed packaging run leaves is a path inside a discarded runner.
      - name: Upload desktop packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-packaging-diagnostics-${{ matrix.runtime }}-${{ github.run_id }}
          path: diagnostic-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect packaged installer artifacts
        shell: pwsh
        run: |
          $runtime = '${{ matrix.runtime }}'
          $sourceRoot = "dist/$runtime/msix"
          if (-not (Test-Path $sourceRoot)) {
            throw "Expected package output root not found: $sourceRoot"
          }

          $releaseRoot = "artifacts/release/$runtime"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null

          $packageFiles = Get-ChildItem -Path $sourceRoot -File | Where-Object {
            $_.Extension.ToLowerInvariant() -in @('.msix', '.msixbundle', '.appinstaller')
          }
          if (-not $packageFiles) {
            throw "No packaged installer files found under $sourceRoot"
          }

          try {
            Copy-Item -Path $packageFiles.FullName -Destination $releaseRoot -Force -ErrorAction Stop
          } catch {
            throw "Failed to copy packaged installer files from $sourceRoot to ${releaseRoot}: $($_.Exception.Message)"
          }

      - name: Generate installer SBOM
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          pwsh ./build/scripts/publish/generate-sbom.ps1 `
            -BuildDropPath artifacts/release/${{ matrix.runtime }} `
            -BuildComponentPath . `
            -PackageName Meridian-Desktop `
            -PackageVersion '${{ github.ref_name }}-${{ matrix.runtime }}'
          $generated = Get-ChildItem artifacts/release/${{ matrix.runtime }}/_manifest -Filter manifest.spdx.json -File -Recurse | Select-Object -First 1
          if ($null -eq $generated) { throw "Microsoft SBOM Tool did not emit manifest.spdx.json." }
          Copy-Item -LiteralPath $generated.FullName -Destination artifacts/release/${{ matrix.runtime }}/desktop-installer-${{ matrix.runtime }}-sbom.spdx.json -Force

      - name: Generate release evidence manifest
        shell: pwsh
        run: |
          python build/scripts/ci/generate-release-evidence-manifest.py `
            --project desktop-installer `
            --runtime '${{ matrix.runtime }}' `
            --artifact-root artifacts/release/${{ matrix.runtime }} `
            --output artifacts/release/${{ matrix.runtime }}/desktop-installer-${{ matrix.runtime }}-release-evidence.json `
            --version '${{ needs.eligibility.outputs.version }}' `
            --workflow-run-id '${{ github.run_id }}' `
            --validation-lane verify-desktop-release-preflight `
            --validation-lane desktop-installer-packaging

      - name: Generate artifact checksums
        shell: pwsh
        run: |
          $root = 'artifacts/release/${{ matrix.runtime }}'
          Get-ChildItem -LiteralPath $root -File | Where-Object Name -notlike '*SHA256SUMS' |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath (Join-Path $root 'desktop-installer-${{ matrix.runtime }}-SHA256SUMS') -Encoding ascii

      - name: Attest signed installer and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/release/${{ matrix.runtime }}/*.msix
            artifacts/release/${{ matrix.runtime }}/*.msixbundle
          sbom-path: artifacts/release/${{ matrix.runtime }}/desktop-installer-${{ matrix.runtime }}-sbom.spdx.json

      - name: Upload packaged installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-desktop-installer-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 14

  build-consumer-setup:
    name: package-consumer-setup
    needs: [eligibility, ci, secrets, codeql, production, smoke, release-preflight]
    runs-on: windows-latest
    timeout-minutes: 120
    environment:
      name: desktop-release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      # `Generate consumer release evidence` below shells out to `python`.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare protected signing certificate
        id: signing
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX_BASE64: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MDC_SIGNING_CERT_PFX_BASE64)) {
            throw "Release builds and rehearsals require MDC_SIGNING_CERT_PFX_BASE64 in the protected desktop-release-signing environment."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "meridian-release-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MDC_SIGNING_CERT_PFX_BASE64))
          "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Meridian-Setup.exe embeds a PostgreSQL server per bundled runtime. The hosted image ships
      # one under C:\Program Files\PostgreSQL (x64 only) — the same source publish-smoke uses.
      # PostgreSQL publishes no Windows ARM64 server build, so the one-click consumer setup is
      # x64-only until an ARM64 payload is supplied out of band. The ARM64 *desktop MSIX* is
      # unaffected and is still built and certified: it does not embed a database.
      - name: Materialize the PostgreSQL payload
        id: pgpayload
        shell: pwsh
        run: |
          # Runner PostgreSQL directories are major-only names like '17', which [version] refuses
          # to parse; sort on the leading integer instead.
          $postgres = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+' } |
            Sort-Object { [int]($_.Name -replace '^(\d+).*$', '$1') } -Descending | Select-Object -First 1
          if ($null -eq $postgres) { throw 'The hosted Windows runner has no PostgreSQL runtime to bundle.' }

          $payload = 'artifacts/postgresql-payload/win-x64'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item -Path (Join-Path $postgres.FullName '*') -Destination $payload -Recurse -Force

          $bundled = @('win-x64')
          $armPayload = 'artifacts/postgresql-payload/win-arm64/bin/postgres.exe'
          if (Test-Path -LiteralPath $armPayload) { $bundled += 'win-arm64' }

          $excluded = @('win-x64', 'win-arm64') | Where-Object { $_ -notin $bundled }
          if ($excluded.Count -gt 0) {
            Write-Host "::warning::Consumer setup excludes $($excluded -join ', '): no PostgreSQL server payload is available for that runtime on this runner."
          }
          "runtimes=$($bundled -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the consumer package
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PASSWORD: ${{ secrets.MDC_SIGNING_CERT_PASSWORD }}
        run: |
          pwsh ./build/scripts/install/build-consumer-setup.ps1 `
            -PostgreSqlPayloadRoot artifacts/postgresql-payload `
            -Runtimes ('${{ steps.pgpayload.outputs.runtimes }}'.Split(',')) `
            -SigningCertificate '${{ steps.signing.outputs.cert_path }}' `
            -SigningCertificatePassword $env:MDC_SIGNING_CERT_PASSWORD

      - name: Generate consumer setup SBOM
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          pwsh ./build/scripts/publish/generate-sbom.ps1 `
            -BuildDropPath artifacts/consumer-setup `
            -BuildComponentPath . `
            -PackageName Meridian-Consumer-Setup `
            -PackageVersion '${{ github.ref_name }}'
          $generated = Get-ChildItem artifacts/consumer-setup/_manifest -Filter manifest.spdx.json -File -Recurse | Select-Object -First 1
          if ($null -eq $generated) { throw "Microsoft SBOM Tool did not emit manifest.spdx.json." }
          Copy-Item -LiteralPath $generated.FullName -Destination artifacts/consumer-setup/consumer-setup-win-x64-sbom.spdx.json -Force

      - name: Generate consumer release evidence
        shell: pwsh
        run: |
          python build/scripts/ci/generate-release-evidence-manifest.py `
            --project consumer-setup `
            --runtime win-x64 `
            --artifact-root artifacts/consumer-setup `
            --output artifacts/consumer-setup/consumer-setup-win-x64-release-evidence.json `
            --version '${{ needs.eligibility.outputs.version }}' `
            --workflow-run-id '${{ github.run_id }}' `
            --validation-lane verify-desktop-release-preflight `
            --validation-lane package-consumer-setup

      - name: Generate consumer checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/consumer-setup -File | Where-Object { $_.Name -eq 'Meridian-Setup.exe' -or $_.Name -like 'consumer-setup-win-x64-*.json' } |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath artifacts/consumer-setup/consumer-setup-win-x64-SHA256SUMS -Encoding ascii

      - name: Attest signed consumer setup and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/consumer-setup/Meridian-Setup.exe
          sbom-path: artifacts/consumer-setup/consumer-setup-win-x64-sbom.spdx.json

      - name: Upload consumer setup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-consumer-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/consumer-setup/Meridian-Setup.exe
            artifacts/consumer-setup/consumer-setup-win-x64-release-evidence.json
            artifacts/consumer-setup/consumer-setup-win-x64-sbom.spdx.json
            artifacts/consumer-setup/consumer-setup-win-x64-SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  certify-installed-desktop:
    name: clean install lifecycle (${{ matrix.runtime }})
    needs: [eligibility, build-msix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            architecture: x64
            runner: windows-latest
          # GitHub-hosted Windows 11 ARM64. This repository is public, so the label is available
          # at no cost and needs no self-hosted machine.
          - runtime: win-arm64
            architecture: ARM64
            runner: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download current installer artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: meridian-desktop-installer-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/current

      - name: Prepare signing certificate
        id: signing
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX_BASE64: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "meridian-release-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MDC_SIGNING_CERT_PFX_BASE64))
          "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # First-release mode is derived from repository state, never from an input. A dispatch-only
      # input cannot help the tag push that needs it (workflow_dispatch inputs are absent on
      # push), and a manually forced flag could skip real N-1 evidence when a predecessor does
      # exist. An empty release list is the fact that there is nothing to update from; a failed
      # query is not, and stays fatal.
      - name: Resolve the N-1 installer
        id: prior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_PRIOR_TAG: ${{ inputs.prior_release_tag }}
        run: |
          $current = Get-ChildItem artifacts/current -Filter '*.msix' -File -Recurse | Select-Object -First 1
          if ($null -eq $current) { throw "Could not resolve the current ${{ matrix.runtime }} MSIX package." }
          "current_path=$($current.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $priorTag = $env:CONFIGURED_PRIOR_TAG
          if ([string]::IsNullOrWhiteSpace($priorTag)) {
            # Prereleases are excluded deliberately: the evaluation lane publishes self-signed
            # prereleases, and certifying a production update against one would prove an upgrade
            # path from an artifact that carries no publisher identity.
            $priorTag = gh api 'repos/${{ github.repository }}/releases?per_page=100' --paginate --slurp `
              --jq '[.[][] | select(.draft == false and .prerelease == false and (.tag_name | startswith("v")))] | sort_by(.published_at) | reverse | .[0].tag_name'
            if ($LASTEXITCODE -ne 0) {
              throw "Could not query published releases, so whether an N-1 package exists is unknown. Refusing to assume this is a first release."
            }
          }

          if ([string]::IsNullOrWhiteSpace($priorTag) -or $priorTag -eq 'null') {
            Write-Host "::notice::No published predecessor exists, so this is a first release. The update and rollback legs will be recorded as not-applicable rather than skipped."
            "first_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          New-Item -ItemType Directory -Path artifacts/prior -Force | Out-Null
          gh release download $priorTag --repo '${{ github.repository }}' --pattern '*.msix' --dir artifacts/prior
          $architecturePattern = if ('${{ matrix.runtime }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }
          $prior = Get-ChildItem artifacts/prior -Filter '*.msix' -File -Recurse |
            Where-Object Name -Match $architecturePattern | Select-Object -First 1
          if ($null -eq $prior) {
            throw "Release $priorTag published no ${{ matrix.runtime }} MSIX to certify the update and rollback legs against."
          }
          "prior_path=$($prior.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prior_tag=$priorTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "first_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Certify install, launch, update, repair, rollback, and uninstall
        shell: pwsh
        env:
          MDC_CERT_PASSWORD: ${{ secrets.MDC_SIGNING_CERT_PASSWORD }}
        run: |
          $arguments = @(
            '-CurrentPackage', '${{ steps.prior.outputs.current_path }}'
            '-SigningCertificatePfx', '${{ steps.signing.outputs.cert_path }}'
            '-SigningCertificatePassword', $env:MDC_CERT_PASSWORD
            '-Architecture', '${{ matrix.architecture }}'
            '-ReceiptPath', 'artifacts/install-certification/${{ matrix.runtime }}/desktop-installer-${{ matrix.runtime }}-lifecycle.json'
          )
          if ('${{ steps.prior.outputs.first_release }}' -eq 'true') {
            $arguments += '-FirstRelease'
          }
          else {
            $arguments += @('-PriorPackage', '${{ steps.prior.outputs.prior_path }}')
          }
          pwsh ./build/scripts/install/certify-desktop-install-lifecycle.ps1 @arguments

      - name: Upload clean-machine lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-install-certification-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/install-certification/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 90

  release:
    name: verify-and-publish-release-evidence
    needs: [eligibility, ci, secrets, codeql, production, smoke, release-preflight, build-msix, build-consumer-setup, certify-installed-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download packaged installer artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: meridian-desktop-installer-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release
      - name: Download consumer setup artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: meridian-consumer-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/consumer
      - name: Download native lifecycle evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: desktop-install-certification-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/certification
          merge-multiple: true
      - name: Download installed startup evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: meridian-web-workstation-win-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/startup
      - name: Verify dependency results, commit identities and certified package digests
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python build/scripts/ci/verify-release-promotion.py --root artifacts/release --receipts artifacts/certification --smoke artifacts/startup/release-evidence.json --output artifacts/publish-release
      - name: Retain validated release or rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact certified GitHub release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/publish-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
