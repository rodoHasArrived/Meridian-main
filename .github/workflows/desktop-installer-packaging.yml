name: Desktop Installer Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prior_release_tag:
        description: Optional N-1 release tag used by installed lifecycle certification.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-installer-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  release-preflight:
    name: verify-desktop-release-preflight
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-desktop-release-preflight-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-desktop-release-preflight-
            ${{ runner.os }}-nuget-

      - name: Restore WPF tests
        shell: pwsh
        run: >
          dotnet restore tests/Meridian.Wpf.Tests/Meridian.Wpf.Tests.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Build WPF app
        shell: pwsh
        run: >
          dotnet build src/Meridian.Wpf/Meridian.Wpf.csproj
          -c Release
          --no-restore
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true
          /p:WindowsPackageType=None

      - name: Run WPF tests
        shell: pwsh
        run: >
          dotnet test tests/Meridian.Wpf.Tests/Meridian.Wpf.Tests.csproj
          -c Release
          --no-restore
          --filter "Category!=Integration&FullyQualifiedName!~Integration"
          --logger "trx;LogFilePrefix=desktop-release-preflight"
          --results-directory artifacts/test-results/desktop-release-preflight
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Upload release preflight test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-release-preflight-test-results-${{ github.run_number }}
          path: artifacts/test-results/desktop-release-preflight/
          if-no-files-found: ignore
          retention-days: 14

  build-msix:
    name: package-desktop-msix (${{ matrix.runtime }})
    needs: release-preflight
    runs-on: windows-latest
    timeout-minutes: 75
    environment:
      name: desktop-release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-desktop-installer-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-desktop-installer-
            ${{ runner.os }}-nuget-

      - name: Prepare optional signing certificate (tag releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX_BASE64: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MDC_SIGNING_CERT_PFX_BASE64)) {
            $certPath = Join-Path $env:RUNNER_TEMP "meridian-release-signing.pfx"
            [System.IO.File]::WriteAllBytes(
              $certPath,
              [System.Convert]::FromBase64String($env:MDC_SIGNING_CERT_PFX_BASE64)
            )
            "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Release signing certificate configured."
          } else {
            throw "Tag release builds require MDC_SIGNING_CERT_PFX_BASE64 in the protected desktop-release-signing environment."
          }

      - name: Build desktop installer package
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX: ${{ steps.signing.outputs.cert_path }}
          MDC_SIGNING_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MDC_SIGNING_CERT_PASSWORD || '' }}
        run: |
          $architecture = if ('${{ matrix.runtime }}' -eq 'win-arm64') { 'ARM64' } else { 'x64' }
          pwsh ./build/scripts/install/install.ps1 `
            -Mode Desktop `
            -Architecture $architecture `
            -SkipInstall `
            -NoNotify `
            -NoTrustCert `
            -EnableReadyToRun

      - name: Collect packaged installer artifacts
        shell: pwsh
        run: |
          $runtime = '${{ matrix.runtime }}'
          $sourceRoot = "dist/$runtime/msix"
          if (-not (Test-Path $sourceRoot)) {
            throw "Expected package output root not found: $sourceRoot"
          }

          $releaseRoot = "artifacts/release/$runtime"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null

          $packageFiles = Get-ChildItem -Path $sourceRoot -File | Where-Object {
            $_.Extension.ToLowerInvariant() -in @('.msix', '.msixbundle', '.appinstaller')
          }
          if (-not $packageFiles) {
            throw "No packaged installer files found under $sourceRoot"
          }

          try {
            Copy-Item -Path $packageFiles.FullName -Destination $releaseRoot -Force -ErrorAction Stop
          } catch {
            throw "Failed to copy packaged installer files from $sourceRoot to $releaseRoot: $($_.Exception.Message)"
          }

      - name: Generate installer SBOM
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          pwsh ./build/scripts/publish/generate-sbom.ps1 `
            -BuildDropPath artifacts/release/${{ matrix.runtime }} `
            -BuildComponentPath . `
            -PackageName Meridian-Desktop `
            -PackageVersion '${{ github.ref_name }}-${{ matrix.runtime }}'
          $generated = Get-ChildItem artifacts/release/${{ matrix.runtime }}/_manifest -Filter manifest.spdx.json -File -Recurse | Select-Object -First 1
          if ($null -eq $generated) { throw "Microsoft SBOM Tool did not emit manifest.spdx.json." }
          Copy-Item -LiteralPath $generated.FullName -Destination artifacts/release/${{ matrix.runtime }}/sbom.spdx.json -Force

      - name: Generate release evidence manifest
        shell: pwsh
        run: |
          python build/scripts/ci/generate-release-evidence-manifest.py `
            --project desktop-installer `
            --runtime '${{ matrix.runtime }}' `
            --artifact-root artifacts/release/${{ matrix.runtime }} `
            --output artifacts/release/${{ matrix.runtime }}/release-evidence.json `
            --workflow-run-id '${{ github.run_id }}' `
            --validation-lane verify-desktop-release-preflight `
            --validation-lane desktop-installer-packaging

      - name: Generate artifact checksums
        shell: pwsh
        run: |
          $root = 'artifacts/release/${{ matrix.runtime }}'
          Get-ChildItem -LiteralPath $root -File | Where-Object Name -ne 'SHA256SUMS' |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath (Join-Path $root 'SHA256SUMS') -Encoding ascii

      - name: Attest signed installer and SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/release/${{ matrix.runtime }}/*.msix
            artifacts/release/${{ matrix.runtime }}/*.msixbundle
          sbom-path: artifacts/release/${{ matrix.runtime }}/sbom.spdx.json

      - name: Upload packaged installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-desktop-installer-${{ matrix.runtime }}-${{ github.run_id }}
          path: artifacts/release/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 14

  build-consumer-setup:
    name: package-consumer-setup
    needs: release-preflight
    runs-on: windows-latest
    timeout-minutes: 120
    environment:
      name: desktop-release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Prepare signing certificate for a tag release
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX_BASE64: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MDC_SIGNING_CERT_PFX_BASE64)) {
            throw "Tag release builds require MDC_SIGNING_CERT_PFX_BASE64 in the protected desktop-release-signing environment."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "meridian-release-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MDC_SIGNING_CERT_PFX_BASE64))
          "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build the x64 and ARM64 consumer package
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MDC_SIGNING_CERT_PASSWORD || '' }}
        run: |
          pwsh ./build/scripts/install/build-consumer-setup.ps1 `
            -SigningCertificate '${{ steps.signing.outputs.cert_path }}' `
            -SigningCertificatePassword $env:MDC_SIGNING_CERT_PASSWORD

      - name: Generate consumer release evidence
        shell: pwsh
        run: |
          python build/scripts/ci/generate-release-evidence-manifest.py `
            --project consumer-setup `
            --runtime windows `
            --artifact-root artifacts/consumer-setup `
            --output artifacts/consumer-setup/release-evidence.json `
            --workflow-run-id '${{ github.run_id }}' `
            --validation-lane verify-desktop-release-preflight `
            --validation-lane package-consumer-setup

      - name: Generate consumer setup SBOM and checksums
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          pwsh ./build/scripts/publish/generate-sbom.ps1 `
            -BuildDropPath artifacts/consumer-setup `
            -BuildComponentPath . `
            -PackageName Meridian-Consumer-Setup `
            -PackageVersion '${{ github.ref_name }}'
          $generated = Get-ChildItem artifacts/consumer-setup/_manifest -Filter manifest.spdx.json -File -Recurse | Select-Object -First 1
          if ($null -eq $generated) { throw "Microsoft SBOM Tool did not emit manifest.spdx.json." }
          Copy-Item -LiteralPath $generated.FullName -Destination artifacts/consumer-setup/sbom.spdx.json -Force
          Get-ChildItem artifacts/consumer-setup -File | Where-Object Name -ne 'SHA256SUMS' |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath artifacts/consumer-setup/SHA256SUMS -Encoding ascii

      - name: Attest signed consumer setup and SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: artifacts/consumer-setup/Meridian-Setup.exe
          sbom-path: artifacts/consumer-setup/sbom.spdx.json

      - name: Upload consumer setup artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-consumer-setup-${{ github.run_id }}
          path: |
            artifacts/consumer-setup/Meridian-Setup.exe
            artifacts/consumer-setup/release-evidence.json
            artifacts/consumer-setup/sbom.spdx.json
            artifacts/consumer-setup/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  certify-installed-desktop:
    name: clean install lifecycle (${{ matrix.runtime }})
    needs: build-msix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            architecture: x64
            runner: windows-latest
          - runtime: win-arm64
            architecture: ARM64
            runner: [self-hosted, Windows, ARM64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download current installer artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: meridian-desktop-installer-${{ matrix.runtime }}-${{ github.run_id }}
          path: artifacts/current

      - name: Prepare signing certificate
        id: signing
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PFX_BASE64: ${{ secrets.MDC_SIGNING_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MDC_SIGNING_CERT_PFX_BASE64)) {
            throw "Installed lifecycle certification requires MDC_SIGNING_CERT_PFX_BASE64."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "meridian-release-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MDC_SIGNING_CERT_PFX_BASE64))
          "cert_path=$certPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download N-1 installer
        id: prior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_PRIOR_TAG: ${{ inputs.prior_release_tag }}
        run: |
          $priorTag = $env:CONFIGURED_PRIOR_TAG
          if ([string]::IsNullOrWhiteSpace($priorTag)) {
            $priorTag = gh api 'repos/${{ github.repository }}/releases?per_page=20' `
              --jq '[.[] | select(.draft == false and .tag_name != "${{ github.ref_name }}")][0].tag_name'
          }
          if ([string]::IsNullOrWhiteSpace($priorTag) -or $priorTag -eq 'null') {
            throw "No N-1 release is available for update and rollback certification."
          }
          New-Item -ItemType Directory -Path artifacts/prior -Force | Out-Null
          gh release download $priorTag --repo '${{ github.repository }}' --pattern '*.msix' --dir artifacts/prior
          $architecturePattern = if ('${{ matrix.runtime }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }
          $prior = Get-ChildItem artifacts/prior -Filter '*.msix' -File -Recurse |
            Where-Object Name -Match $architecturePattern | Select-Object -First 1
          $current = Get-ChildItem artifacts/current -Filter '*.msix' -File -Recurse | Select-Object -First 1
          if ($null -eq $prior -or $null -eq $current) {
            throw "Could not resolve current and N-1 ${{ matrix.runtime }} MSIX packages."
          }
          "prior_path=$($prior.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "current_path=$($current.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prior_tag=$priorTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Certify install, launch, update, repair, rollback, and uninstall
        shell: pwsh
        env:
          MDC_SIGNING_CERT_PASSWORD: ${{ secrets.MDC_SIGNING_CERT_PASSWORD }}
        run: |
          pwsh ./build/scripts/install/certify-desktop-install-lifecycle.ps1 `
            -CurrentPackage '${{ steps.prior.outputs.current_path }}' `
            -PriorPackage '${{ steps.prior.outputs.prior_path }}' `
            -SigningCertificatePfx '${{ steps.signing.outputs.cert_path }}' `
            -SigningCertificatePassword $env:MDC_SIGNING_CERT_PASSWORD `
            -Architecture '${{ matrix.architecture }}' `
            -ReceiptPath artifacts/install-certification/${{ matrix.runtime }}/desktop-install-lifecycle.json

      - name: Upload clean-machine lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-install-certification-${{ matrix.runtime }}-${{ github.run_id }}
          path: artifacts/install-certification/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 90

  release:
    name: publish-desktop-installer-release
    needs: [build-msix, build-consumer-setup, certify-installed-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download packaged installer artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          pattern: meridian-desktop-installer-*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/release

      - name: Download consumer setup artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: meridian-consumer-setup-${{ github.run_id }}
          path: artifacts/release/consumer

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          files: |
            artifacts/release/**/*.msix
            artifacts/release/**/*.msixbundle
            artifacts/release/**/*.appinstaller
            artifacts/release/**/Meridian-Setup.exe
            artifacts/release/**/release-evidence.json
            artifacts/release/**/sbom.spdx.json
            artifacts/release/**/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
