name: IB API Smoke Build

on:
  pull_request:
    paths:
      - "src/Meridian.Infrastructure/Adapters/InteractiveBrokers/**"
      - "src/Meridian.Infrastructure/Meridian.Infrastructure.csproj"
      - "src/Meridian.IbApi.SmokeStub/**"
      - "tests/Meridian.Tests/Infrastructure/Providers/IB*.cs"
      - "tests/Meridian.Tests/Meridian.Tests.csproj"
      - "scripts/dev/build-ibapi-smoke.ps1"
      - "build/scripts/ci/validate-test-results.py"
      - "tests/scripts/test_ibapi_smoke_workflow.py"
      - "tests/scripts/test_validate_test_results.py"
      - ".github/workflows/ibapi-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "src/Meridian.Infrastructure/Adapters/InteractiveBrokers/**"
      - "src/Meridian.Infrastructure/Meridian.Infrastructure.csproj"
      - "src/Meridian.IbApi.SmokeStub/**"
      - "tests/Meridian.Tests/Infrastructure/Providers/IB*.cs"
      - "tests/Meridian.Tests/Meridian.Tests.csproj"
      - "scripts/dev/build-ibapi-smoke.ps1"
      - "build/scripts/ci/validate-test-results.py"
      - "tests/scripts/test_ibapi_smoke_workflow.py"
      - "tests/scripts/test_validate_test_results.py"
      - ".github/workflows/ibapi-smoke.yml"
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration.
        required: false
        type: choice
        default: Release
        options:
          - Release
          - Debug

permissions:
  contents: read

concurrency:
  group: ibapi-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  ibapi-smoke:
    name: IB API Adapter Smoke Build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Run IB API smoke build
        shell: pwsh
        run: >
          scripts/dev/build-ibapi-smoke.ps1
          -Configuration ${{ inputs.configuration || 'Release' }}

      - name: Run IB API runtime reconnect smoke tests
        shell: pwsh
        run: >
          dotnet test tests/Meridian.Tests/Meridian.Tests.csproj
          -c ${{ inputs.configuration || 'Release' }}
          -p:EnableWindowsTargeting=true
          -p:EnableIbApiSmoke=true
          -maxcpucount:1
          --filter "FullyQualifiedName~IBMarketDataClientRuntimeReconnectTests"
          --logger "trx;LogFileName=ibapi-runtime-reconnect.trx"
          --results-directory artifacts/test-results/ibapi-smoke

      - name: Require nonempty passing reconnect TRX evidence
        if: always()
        shell: pwsh
        run: >
          python build/scripts/ci/validate-test-results.py
          --results-dir artifacts/test-results/ibapi-smoke
          --require-trx-prefix ibapi-runtime-reconnect
          --output artifacts/test-results/ibapi-smoke/test-evidence.json

      - name: Upload IB API reconnect smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibapi-reconnect-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/test-results/ibapi-smoke/
          if-no-files-found: error
          retention-days: 14
