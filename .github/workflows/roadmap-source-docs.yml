name: Roadmap Source Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/roadmap/**'
      - 'tools/source_docs/**'
      - '.github/workflows/roadmap-source-docs.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Declared roadmap phase (PR0..PR9)'
        required: false
        type: string

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scope-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Enforce phase scope
        env:
          DISPATCH_PHASE: ${{ inputs.phase }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/roadmap/enforce_phase_scope.py \
            --dispatch-phase "$DISPATCH_PHASE" \
            --labels "$PR_LABELS" \
            --pr-body "$PR_BODY" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF"

  schema-and-render:
    runs-on: ubuntu-latest
    needs: scope-gate
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: python3 -m pip install -r tools/source_docs/requirements-render.txt
      - name: Validate source docs
        run: python3 tools/source_docs/validate_source_readmes.py
      - name: Render source docs
        run: python3 tools/source_docs/render_source_docs.py
      - name: Determinism parity check
        run: python3 tools/source_docs/check_source_determinism.py
      - name: Drift gate (generated output must be committed)
        run: |
          git diff -- docs/generated/source --exit-code
