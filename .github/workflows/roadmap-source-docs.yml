name: Roadmap Source Docs

on:
  workflow_dispatch:
  pull_request:
    # The roadmap phase scope gate was retired; PR body and label edits no longer
    # need to re-run this workflow.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/roadmap/**"
      - "docs/source/**"
      - "docs/status/**"
      - "docs/architecture/**"
      - "src/**/README.md"
      - "build/scripts/docs/**"
      - ".github/workflows/roadmap-source-docs.yml"
      - ".github/instructions/source-documentation.instructions.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches: [main]
    paths:
      - "docs/roadmap/**"
      - "docs/source/**"
      - "docs/status/**"
      - "docs/architecture/**"
      - "src/**/README.md"
      - "build/scripts/docs/**"
      - ".github/workflows/roadmap-source-docs.yml"
      - ".github/instructions/source-documentation.instructions.md"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read

concurrency:
  group: roadmap-source-docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  schema:
    # Draft pull requests skip this job; marking the PR ready for review runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install documentation parser dependencies
        run: python3 -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Validate roadmap registry
        run: python3 build/scripts/docs/validate-roadmap-registry.py --summary

      - name: Validate source READMEs
        run: python3 build/scripts/docs/validate-source-readmes.py --summary

      - name: Scan source TODOs
        run: python3 build/scripts/docs/scan-source-todos.py --summary

      # Documentation Automation owns required generation on every PR/main push.
      # Keep phase/schema validation above; standalone manual requests need the
      # same complete generation/freshness contract without another workflow.
      - name: Set up Node.js for manual generation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install diagram dependencies for manual generation
        if: github.event_name == 'workflow_dispatch'
        run: npm ci --no-fund --no-audit

      - name: Converge maintained documentation
        if: github.event_name == 'workflow_dispatch'
        run: python3 build/scripts/run-maintained-generation.py --docs-only --report artifacts/docs/generation.json

      - name: Check generated docs are current
        if: github.event_name == 'workflow_dispatch'
        run: python3 build/scripts/ci/check-generated-output.py

      - name: Check whitespace
        run: git diff --check

      - name: Upload manual documentation repair evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-documentation-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docs/
            artifacts/maintained-generation/
          if-no-files-found: ignore
          retention-days: 7
