name: Roadmap Source Docs

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase for enforce-phase-scope (PR0..PR9)"
        required: false
        default: "PR1"
  pull_request:
    # Phase is supplied in the PR body or labels. Metadata corrections need a new
    # event payload; rerunning an old workflow keeps its original phase metadata.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths:
      - "docs/roadmap/**"
      - "docs/source/**"
      - "docs/status/**"
      - "docs/architecture/**"
      - "src/**/README.md"
      - "build/scripts/docs/**"
      - ".github/workflows/roadmap-source-docs.yml"
      - ".github/instructions/source-documentation.instructions.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches: [main]
    paths:
      - "docs/roadmap/**"
      - "docs/source/**"
      - "docs/status/**"
      - "docs/architecture/**"
      - "src/**/README.md"
      - "build/scripts/docs/**"
      - ".github/workflows/roadmap-source-docs.yml"
      - ".github/instructions/source-documentation.instructions.md"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read

concurrency:
  group: roadmap-source-docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scope-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Checkout trusted phase gate script
        if: ${{ github.event_name != 'push' && github.actor != 'dependabot[bot]' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-base
          sparse-checkout: |
            tools/roadmap/enforce_phase_scope.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce phase scope
        if: ${{ github.event_name != 'push' && github.actor != 'dependabot[bot]' }}
        env:
          DISPATCH_PHASE: ${{ inputs.phase }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .trusted-base/tools/roadmap/enforce_phase_scope.py \
            --dispatch-phase "$DISPATCH_PHASE" \
            --labels "$PR_LABELS" \
            --pr-body "$PR_BODY" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF"

      - name: Skip phase scope on branch push
        if: ${{ github.event_name == 'push' }}
        run: echo "Branch push has no PR phase marker; running roadmap/source docs validation only."

      - name: Skip phase scope for Dependabot
        if: ${{ github.event_name != 'push' && github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot PRs carry no phase marker; running roadmap/source docs validation only."

  schema:
    runs-on: ubuntu-latest
    needs: scope-gate
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation parser dependencies
        run: python3 -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Validate roadmap registry
        run: python3 build/scripts/docs/validate-roadmap-registry.py --summary

      - name: Validate source READMEs
        run: python3 build/scripts/docs/validate-source-readmes.py --summary

      - name: Scan source TODOs
        run: python3 build/scripts/docs/scan-source-todos.py --summary

      # Documentation Automation owns required generation on every PR/main push.
      # Keep phase/schema validation above; standalone manual requests need the
      # same complete generation/freshness contract without another workflow.
      - name: Set up Node.js for manual generation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install diagram dependencies for manual generation
        if: github.event_name == 'workflow_dispatch'
        run: npm ci --no-fund --no-audit

      - name: Converge maintained documentation
        if: github.event_name == 'workflow_dispatch'
        run: python3 build/scripts/run-maintained-generation.py --docs-only --report artifacts/docs/generation.json

      - name: Check generated docs are current
        if: github.event_name == 'workflow_dispatch'
        run: python3 build/scripts/ci/check-generated-output.py

      - name: Check whitespace
        run: git diff --check

      - name: Upload manual documentation repair evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-documentation-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docs/
            artifacts/maintained-generation/
          if-no-files-found: ignore
          retention-days: 7
