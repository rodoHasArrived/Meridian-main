name: CI Operational Metrics

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: ci-metrics-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'daily' }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Select the previous complete UTC day
        id: window
        shell: python
        run: |
          from datetime import datetime, timedelta, timezone
          import os
          end = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"since={(end-timedelta(days=1)).isoformat()}\n")
              output.write(f"until={(end-timedelta(seconds=1)).isoformat()}\n")
      - name: Collect every run attempt and preserve completeness failures
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
        run: >-
          python build/scripts/ci/collect-actions.py --repo "$REPOSITORY"
          --branch "$DEFAULT_BRANCH" --since "$SINCE" --until "$UNTIL"
          --output artifacts/ci-metrics/runs.json
      - name: Report descriptive metrics without a fabricated comparison policy
        if: always() && steps.collect.outcome != 'skipped'
        run: >-
          python build/scripts/ci/ci-metrics.py --input artifacts/ci-metrics/runs.json
          --output artifacts/ci-metrics/metrics.json --markdown artifacts/ci-metrics/metrics.md
          > artifacts/ci-metrics/metrics.log
      - name: Collect structured repair outcomes
        if: always() && steps.collect.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python build/scripts/ci/summarize-repair-outcomes.py --repo "$REPOSITORY"
          --branch "$DEFAULT_BRANCH"
          --input artifacts/ci-metrics/runs.json --output artifacts/ci-metrics/repair.json
          --markdown artifacts/ci-metrics/repair.md
      - name: Publish report summary
        if: always()
        run: |
          if test -f artifacts/ci-metrics/metrics.md; then cat artifacts/ci-metrics/metrics.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f artifacts/ci-metrics/repair.md; then cat artifacts/ci-metrics/repair.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain raw evidence and reports including incomplete collection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-metrics/
          if-no-files-found: error
          retention-days: 30
      # A read-only token cannot read administration-only classic protection, and
      # Actions omits historical push.before. Those are reported as unavailable.
      # Actual run/check/workflow API or pagination failures still fail this job.
      - name: Keep unavailable policy explicit and fail collection faults
        if: always()
        run: >-
          python build/scripts/ci/summarize-repair-outcomes.py --check-collection
          --input artifacts/ci-metrics/runs.json
