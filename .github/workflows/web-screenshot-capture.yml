name: Web Screenshot Capture

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Output directory for captured screenshots.
        required: false
        default: "docs/screenshots/web"
      config:
        description: Path to the routes configuration file.
        required: false
        default: "scripts/dev/web-screenshot-routes.json"
      commit:
        description: Commit and push results to the repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: web-screenshot-capture-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  capture-web-screenshots:
    name: Capture Web Workstation Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package.json

      - name: Install dashboard dependencies
        run: npm install --prefix src/Meridian.Ui/dashboard --include=optional

      - name: Install Playwright browser
        run: npx --prefix src/Meridian.Ui/dashboard playwright install --with-deps chromium

      - name: Capture web screenshots
        continue-on-error: true
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          ROUTES_CONFIG: ${{ inputs.config }}
        run: |
          node scripts/dev/capture-web-screenshots.mjs \
            --output-dir "$OUTPUT_DIR" \
            --config "$ROUTES_CONFIG"

      - name: Log web screenshot capture status
        if: ${{ always() }}
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::warning::Web screenshot output directory '$OUTPUT_DIR' was not created."
            exit 0
          fi

          COUNT=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No web screenshots were captured under '$OUTPUT_DIR'."
          else
            echo "[INFO] Captured $COUNT web screenshot(s) in '$OUTPUT_DIR'."
          fi

      - name: Commit and push results
        if: ${{ always() && inputs.commit == true }}
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "$OUTPUT_DIR" ]; then
            git add -- "$OUTPUT_DIR"
          else
            echo "::warning::Output path '$OUTPUT_DIR' does not exist; nothing to stage."
          fi
          if git diff --cached --quiet; then
            echo "[INFO] No changes to commit."
          else
            git commit -m "chore: refresh web workstation screenshot catalog [skip ci]"
            max_push_attempts=3
            pushed=false
            for attempt in $(seq 1 "$max_push_attempts"); do
              git pull --rebase
              if git push; then
                pushed=true
                break
              fi

              if [ "$attempt" -lt "$max_push_attempts" ]; then
                echo "::warning::Push was rejected on attempt $attempt; retrying after refreshing from remote."
                sleep 2
              fi
            done

            if [ "$pushed" != true ]; then
              echo "::error::Unable to push screenshot updates after $max_push_attempts attempts."
              exit 1
            fi
          fi

      - name: Upload screenshot artifacts
        if: ${{ always() && inputs.commit != true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-screenshots-${{ github.run_number }}
          path: ${{ inputs.output_dir }}
          if-no-files-found: ignore
          retention-days: 14
