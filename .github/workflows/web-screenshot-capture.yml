name: Web Screenshot Capture

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Output directory for captured screenshots.
        required: false
        default: "docs/screenshots/web"
      config:
        description: Path to the routes configuration file.
        required: false
        default: "scripts/dev/web-screenshot-routes.json"
      create_pr:
        description: Open a catalog refresh pull request after capture and validation pass.
        type: boolean
        required: false
        default: true
  # A weekly refresh keeps the published catalog from silently going stale:
  # pull_request runs below only validate and never publish.
  schedule:
    - cron: "17 9 * * 1"
  # Dispatch always captures from the default branch (optionally publishing), so
  # it can only ever report on what has already merged. Every route that broke
  # in the 2026-08-26 run broke in a pull request that this workflow never saw.
  # The pull_request lane below renders the proposed commit instead, so a route
  # a change stops rendering fails on the change rather than after it.
  pull_request:
    paths:
      - "src/Meridian.Ui/dashboard/**"
      - "scripts/dev/capture-web-screenshots.mjs"
      - "scripts/dev/web-screenshot-routes.json"
      - "scripts/dev/web-screenshot-fixtures.json"
      - "scripts/dev/web-screenshot-scenarios.mjs"
      - "scripts/dev/capture-web-screenshots.test.mjs"
      - "scripts/dev/web-screenshot-scenarios.test.mjs"
      - "scripts/dev/validate-screenshot-captures.py"
      - "scripts/dev/summarize-web-screenshots.py"
      - "tests/scripts/test_refresh_screenshots_workflow.py"
      - "tests/scripts/test_validate_screenshot_captures.py"
      - "tests/scripts/test_summarize_web_screenshots.py"
      - ".github/workflows/web-screenshot-capture.yml"

permissions:
  contents: read

concurrency:
  # A dispatch always checks out the default branch and writes the fixed
  # automation/web-screenshot-capture branch, so every dispatch must share one
  # concurrency lane. Otherwise duplicate dispatches can queue and reopen a
  # screenshot PR from the same base after the first PR merges. Pull-request
  # validation publishes nothing, so each PR takes its own lane instead --
  # sharing the publish lane would let an ordinary PR cancel a refresh run.
  group: web-screenshot-capture-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

env:
  CI: true
  PLAYWRIGHT_INSTALL_ATTEMPTS: 2
  PLAYWRIGHT_INSTALL_TIMEOUT_SECONDS: 720
  CAPTURE_DIR: artifacts/web-screenshots/captures
  CAPTURE_WORKERS: 2

jobs:
  capture-web-screenshots:
    name: Capture Web Workstation Screenshots
    # Only dispatch or the weekly schedule may write the automation branch and open a refresh PR.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always capture and propose the refresh from the canonical default branch so a
          # dispatch from a feature branch cannot publish that branch's commits into the
          # automation/web-screenshot-capture PR alongside the screenshots.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate web output directory
        id: validate_output_dir
        env:
          REQUESTED_OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          set -euo pipefail
          BASE_DIR="docs/screenshots/web"
          requested="${REQUESTED_OUTPUT_DIR:-$BASE_DIR}"

          if [[ "$requested" = /* ]] || [[ "$requested" =~ ^[A-Za-z]:[\\/] ]]; then
            echo "::error::output_dir must be a repository-relative path under '$BASE_DIR'."
            exit 1
          fi

          export REQUESTED_OUTPUT_DIR="$requested"
          resolved="$(python - <<'PYTHON'
          import os
          from pathlib import Path

          repo_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          base_dir = (repo_root / "docs/screenshots/web").resolve()
          candidate = (repo_root / os.environ["REQUESTED_OUTPUT_DIR"]).resolve()

          try:
              candidate.relative_to(base_dir)
          except ValueError:
              raise SystemExit(f"::error::output_dir must stay within 'docs/screenshots/web'. Received '{os.environ['REQUESTED_OUTPUT_DIR']}'.")

          print(candidate.relative_to(repo_root).as_posix())
          PYTHON
          )"

          echo "safe_output_dir=$resolved" >> "$GITHUB_OUTPUT"

      - name: Validate routes config path
        id: validate_config
        env:
          REQUESTED_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_CONFIG:-scripts/dev/web-screenshot-routes.json}"
          export REQUESTED_CONFIG="$requested"
          resolved="$(python - <<'PYTHON'
          import os
          from pathlib import Path

          repo_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          base_dir = (repo_root / "scripts/dev").resolve()
          requested = os.environ["REQUESTED_CONFIG"]
          candidate = (repo_root / requested).resolve()

          try:
              candidate.relative_to(base_dir)
          except ValueError:
              raise SystemExit(f"::error::config must be a JSON file under 'scripts/dev'. Received '{requested}'.")
          if candidate.suffix != ".json" or not candidate.is_file():
              raise SystemExit(f"::error::config must name an existing JSON file under 'scripts/dev'. Received '{requested}'.")

          print(candidate.relative_to(repo_root).as_posix())
          PYTHON
          )"

          echo "safe_config=$resolved" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Install dashboard dependencies
        # Use a clean, lockfile-pinned install (matching ci.yml) so the capture
        # run is reproducible and cannot silently drift the dependency tree.
        run: npm ci --prefix src/Meridian.Ui/dashboard --include=optional --prefer-offline --no-fund --timing

      - name: Test screenshot harness
        run: node --test scripts/dev/capture-web-screenshots.test.mjs scripts/dev/web-screenshot-scenarios.test.mjs

      - name: Read installed Playwright version
        id: playwright_version
        run: |
          node -e 'console.log("version=" + require("./src/Meridian.Ui/dashboard/node_modules/playwright/package.json").version)' >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium-headless-shell-v1

      - name: Install Playwright system dependencies
        run: npx --prefix src/Meridian.Ui/dashboard playwright install-deps chromium

      - name: Install Playwright browser
        id: install_playwright
        # Shared bounded install (same browser and cache format in both jobs).
        uses: ./.github/actions/install-playwright-chromium
        with:
          attempts: ${{ env.PLAYWRIGHT_INSTALL_ATTEMPTS }}
          timeout-seconds: ${{ env.PLAYWRIGHT_INSTALL_TIMEOUT_SECONDS }}

      # Save a verified installation before route validation can fail the job.
      # The combined cache action saves only on success during post-job cleanup.
      - name: Save Playwright browsers
        if: ${{ steps.playwright_cache.outputs.cache-hit != 'true' && steps.install_playwright.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_cache.outputs.cache-primary-key }}

      - name: Capture web screenshots
        id: capture_web
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_DIR }}
          ROUTES_CONFIG: ${{ steps.validate_config.outputs.safe_config }}
        run: |
          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' -delete
          fi
          node scripts/dev/capture-web-screenshots.mjs \
            --output-dir "$OUTPUT_DIR" \
            --config "$ROUTES_CONFIG" \
            --workers "$CAPTURE_WORKERS"

      - name: Validate web screenshot captures
        id: validate_web
        if: ${{ steps.capture_web.outcome == 'success' }}
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_DIR }}
          ROUTES_CONFIG: ${{ steps.validate_config.outputs.safe_config }}
        run: >
          python scripts/dev/validate-screenshot-captures.py
          --surface web
          --output-dir "$OUTPUT_DIR"
          --web-routes "$ROUTES_CONFIG"
          --manifest artifacts/web-screenshots/manifest.json
          --require-fresh

      - name: Stage validated catalog refresh
        if: ${{ success() && (inputs.create_pr || github.event_name == 'schedule') && steps.validate_web.outcome == 'success' }}
        env:
          OUTPUT_DIR: ${{ steps.validate_output_dir.outputs.safe_output_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' -delete
          cp "$CAPTURE_DIR"/*.png "$OUTPUT_DIR/"

      - name: Open screenshot refresh pull request
        id: refresh_pr
        if: ${{ success() && (inputs.create_pr || github.event_name == 'schedule') && steps.validate_web.outcome == 'success' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          # A PR opened with the default GITHUB_TOKEN starts no other workflows,
          # so the required checks would never run on it. SCREENSHOT_PR_TOKEN
          # (a GitHub App or fine-grained token with contents and pull-requests
          # write) lets them run; without it the PR still opens, unchecked.
          token: ${{ secrets.SCREENSHOT_PR_TOKEN || github.token }}
          branch: automation/web-screenshot-capture
          base: ${{ github.event.repository.default_branch }}
          title: "chore: refresh web workstation screenshot catalog"
          commit-message: "chore: refresh web workstation screenshot catalog"
          body: |
            Automated refresh of the web workstation screenshot catalog captured by the
            Web Screenshot Capture workflow. Every configured capture and the freshness,
            route identity, and image-quality checks passed before staging this catalog.

            Capture evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Review the rendered routes before merging.
          add-paths: |
            ${{ steps.validate_output_dir.outputs.safe_output_dir }}/*.png
          delete-branch: true

      - name: Summarize web screenshot run
        if: ${{ always() }}
        env:
          CAPTURE_OUTCOME: ${{ steps.capture_web.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_web.outcome }}
          PUBLISH_OUTCOME: ${{ steps.refresh_pr.outcome }}
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
        run: >
          python scripts/dev/summarize-web-screenshots.py
          --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/web-screenshots/
          if-no-files-found: warn
          retention-days: 14

  validate-pull-request-screenshots:
    name: Validate Web Workstation Screenshots (pull request)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Validation only. This job renders the proposed commit and reports; it
    # writes no branch and opens no PR; write scopes belong to dispatch only.
    permissions:
      contents: read

    steps:
      - name: Check out pull request head
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own commit, not the merge ref. This job answers
          # "does this change still render", and the merge ref would fold in
          # base commits the author never proposed -- so a route broken on the
          # base would be reported against their change.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Install dashboard dependencies
        # Use a clean, lockfile-pinned install (matching ci.yml) so the capture
        # run is reproducible and cannot silently drift the dependency tree.
        run: npm ci --prefix src/Meridian.Ui/dashboard --include=optional --prefer-offline --no-fund --timing

      - name: Test screenshot harness
        run: node --test scripts/dev/capture-web-screenshots.test.mjs scripts/dev/web-screenshot-scenarios.test.mjs

      - name: Read installed Playwright version
        id: playwright_version
        run: |
          node -e 'console.log("version=" + require("./src/Meridian.Ui/dashboard/node_modules/playwright/package.json").version)' >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium-headless-shell-v1

      - name: Install Playwright system dependencies
        run: npx --prefix src/Meridian.Ui/dashboard playwright install-deps chromium

      - name: Install Playwright browser
        id: install_playwright
        # Shared bounded install (same browser and cache format in both jobs).
        uses: ./.github/actions/install-playwright-chromium
        with:
          attempts: ${{ env.PLAYWRIGHT_INSTALL_ATTEMPTS }}
          timeout-seconds: ${{ env.PLAYWRIGHT_INSTALL_TIMEOUT_SECONDS }}

      # Save a verified installation before route validation can fail the job.
      # The combined cache action saves only on success during post-job cleanup.
      - name: Save Playwright browsers
        if: ${{ steps.playwright_cache.outputs.cache-hit != 'true' && steps.install_playwright.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_cache.outputs.cache-primary-key }}

      - name: Capture web screenshots
        id: capture_web
        # The dispatch inputs do not exist on a pull_request event, so this lane
        # uses the catalog's own defaults. Nothing here is operator-supplied,
        # which is also why it needs no output-directory sanitisation.
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_DIR }}
          ROUTES_CONFIG: scripts/dev/web-screenshot-routes.json
        run: |
          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' -delete
          fi
          node scripts/dev/capture-web-screenshots.mjs \
            --output-dir "$OUTPUT_DIR" \
            --config "$ROUTES_CONFIG" \
            --workers "$CAPTURE_WORKERS"

      - name: Validate web screenshot captures
        id: validate_web
        if: ${{ steps.capture_web.outcome == 'success' }}
        env:
          OUTPUT_DIR: ${{ env.CAPTURE_DIR }}
          ROUTES_CONFIG: scripts/dev/web-screenshot-routes.json
        run: >
          python scripts/dev/validate-screenshot-captures.py
          --surface web
          --output-dir "$OUTPUT_DIR"
          --web-routes "$ROUTES_CONFIG"
          --manifest artifacts/web-screenshots/manifest.json
          --require-fresh

      - name: Summarize web screenshot run
        if: ${{ always() }}
        env:
          CAPTURE_OUTCOME: ${{ steps.capture_web.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate_web.outcome }}
          PUBLISH_OUTCOME: skipped
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
        run: >
          python scripts/dev/summarize-web-screenshots.py
          --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshots-pr${{ github.event.pull_request.number }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/web-screenshots/
          if-no-files-found: warn
          retention-days: 14
