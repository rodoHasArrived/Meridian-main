name: Web Screenshot Capture

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Output directory for captured screenshots.
        required: false
        default: "docs/screenshots/web"
      config:
        description: Path to the routes configuration file.
        required: false
        default: "scripts/dev/web-screenshot-routes.json"
      commit:
        description: Commit and push results to the repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: web-screenshot-capture-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  PLAYWRIGHT_INSTALL_TIMEOUT_SECONDS: 720

jobs:
  capture-web-screenshots:
    name: Capture Web Workstation Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package.json

      - name: Install dashboard dependencies
        run: npm install --prefix src/Meridian.Ui/dashboard --include=optional

      - name: Install Playwright browser
        run: |
          set -euo pipefail
          install_timeout_seconds="${PLAYWRIGHT_INSTALL_TIMEOUT_SECONDS:-720}"
          run_playwright_install() {
            set +e
            timeout "$install_timeout_seconds" npx --prefix src/Meridian.Ui/dashboard playwright install "$@"
            install_exit_code=$?
            set -e
            return "$install_exit_code"
          }

          if run_playwright_install --with-deps chromium; then
            echo "[INFO] Playwright browser and dependency install completed."
          else
            playwright_install_exit_code=$?
            if [ "$playwright_install_exit_code" -eq 124 ]; then
              echo "::warning::Playwright dependency install timed out after ${install_timeout_seconds}s; retrying browser-only install."
            else
              echo "::warning::Playwright dependency install failed with exit code ${playwright_install_exit_code}; retrying browser-only install."
            fi

            if run_playwright_install chromium; then
              echo "[INFO] Playwright browser-only install completed."
            else
              browser_only_install_exit_code=$?
              if [ "$browser_only_install_exit_code" -eq 124 ]; then
                echo "::error::Playwright browser-only install timed out after ${install_timeout_seconds}s."
              else
                echo "::error::Playwright browser-only install failed with exit code ${browser_only_install_exit_code}."
              fi
              exit "$browser_only_install_exit_code"
            fi
          fi

      - name: Capture web screenshots
        continue-on-error: true
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          ROUTES_CONFIG: ${{ inputs.config }}
        run: |
          if [ -d "$OUTPUT_DIR" ]; then
            find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' -delete
          fi
          node scripts/dev/capture-web-screenshots.mjs \
            --output-dir "$OUTPUT_DIR" \
            --config "$ROUTES_CONFIG"

      - name: Log web screenshot capture status
        if: ${{ always() }}
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::warning::Web screenshot output directory '$OUTPUT_DIR' was not created."
            exit 0
          fi

          COUNT=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No web screenshots were captured under '$OUTPUT_DIR'."
          else
            echo "[INFO] Captured $COUNT web screenshot(s) in '$OUTPUT_DIR'."
          fi

      - name: Detect screenshot updates
        if: ${{ always() && inputs.commit == true }}
        id: screenshot_changes
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::warning::Output path '$OUTPUT_DIR' does not exist; skipping pull request creation."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git status --porcelain -- "$OUTPUT_DIR" | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] No screenshot changes detected under '$OUTPUT_DIR'."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with screenshot updates
        if: ${{ always() && inputs.commit == true && steps.screenshot_changes.outputs.has_changes == 'true' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ${{ inputs.output_dir }}
          branch: automation/web-screenshot-capture
          base: ${{ github.event.repository.default_branch }}
          commit-message: "chore: refresh web workstation screenshot catalog [skip ci]"
          title: "chore: refresh web workstation screenshot catalog"
          body: "Automated screenshot refresh generated by workflow run ${{ github.run_id }}."

      - name: Upload screenshot artifacts
        if: ${{ always() && inputs.commit != true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-screenshots-${{ github.run_number }}
          path: ${{ inputs.output_dir }}
          if-no-files-found: ignore
          retention-days: 14
