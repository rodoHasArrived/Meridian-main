name: Web Screenshot Capture

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Output directory for captured screenshots.
        required: false
        default: "docs/screenshots/web"
      config:
        description: Path to the routes configuration file.
        required: false
        default: "scripts/dev/web-screenshot-routes.json"
      commit:
        description: Commit and push results to the repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: web-screenshot-capture-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  capture-web-screenshots:
    name: Capture Web Workstation Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix src/Meridian.Ui/dashboard

      - name: Install Playwright browser
        run: npx --prefix src/Meridian.Ui/dashboard playwright install --with-deps chromium

      - name: Capture web screenshots
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          ROUTES_CONFIG: ${{ inputs.config }}
        run: |
          node scripts/dev/capture-web-screenshots.mjs \
            --output-dir "$OUTPUT_DIR" \
            --config "$ROUTES_CONFIG"

      - name: Commit and push results
        if: ${{ inputs.commit == true }}
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "[INFO] No changes to commit."
          else
            git commit -m "chore: refresh web workstation screenshot catalog [skip ci]"
            git push
          fi

      - name: Upload screenshot artifacts
        if: ${{ inputs.commit != true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-screenshots-${{ github.run_number }}
          path: ${{ inputs.output_dir }}
          if-no-files-found: ignore
          retention-days: 14
