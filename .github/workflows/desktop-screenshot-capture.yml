name: Desktop Screenshot Capture

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Output directory for captured screenshots.
        required: false
        default: "docs/screenshots/desktop"
      commit:
        description: Commit and push results to the repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-screenshot-capture-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  capture-screenshots:
    name: Capture Desktop Screenshots
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: ${{ inputs.commit }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-wpf-
            ${{ runner.os }}-nuget-

      - name: Restore WPF project
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Capture desktop screenshots
        shell: pwsh
        run: >
          pwsh -File scripts/dev/capture-desktop-screenshots.ps1
          -OutputDir "${{ inputs.output_dir }}"

      - name: Commit and push results
        if: ${{ inputs.commit == true }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${{ inputs.output_dir }}"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "chore: refresh desktop screenshot catalog [skip ci]"
            git push
          } else {
            Write-Host "[INFO] No changes to commit."
          }

      - name: Upload screenshot artifacts
        if: ${{ inputs.commit != true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-screenshots-${{ github.run_number }}
          path: ${{ inputs.output_dir }}
          if-no-files-found: ignore
          retention-days: 14
