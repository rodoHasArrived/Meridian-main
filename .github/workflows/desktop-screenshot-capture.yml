name: Desktop Screenshot Capture

on:
  workflow_dispatch:
    inputs:
      output_dir:
        description: Output directory for captured screenshots.
        required: false
        default: "docs/screenshots/desktop"
      create_pr:
        description: Open a catalog refresh pull request after capture and validation pass.
        type: boolean
        required: false
        default: true
  # A weekly refresh keeps the published desktop catalog from silently going stale.
  schedule:
    - cron: "41 10 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # The workflow always checks out the default branch and opens a refresh PR on
  # a per-run automation/desktop-screenshot-capture-* branch, closing older
  # refresh PRs, so every dispatch must share one concurrency lane regardless of
  # the ref it was dispatched from. A per-ref group would let cross-branch
  # dispatches race and close each other's refresh PRs. Runs serialize (no cancellation) so an in-flight capture still finishes.
  group: desktop-screenshot-capture
  cancel-in-progress: false

env:
  CI: true
  WORKFLOW_OUTPUT_DIR: ${{ inputs.output_dir }}
  # Captures land here first; the tracked catalog changes only after validation passes.
  CAPTURE_DIR: artifacts/desktop-screenshot-capture/captures
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  capture-screenshots:
    name: Capture Desktop Screenshots
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always capture and propose the refresh from the canonical default branch so a
          # dispatch from a feature branch cannot publish that branch's commits into the
          # automation/desktop-screenshot-capture-* PR alongside the screenshots.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK and NuGet cache
        uses: ./.github/actions/setup-dotnet-nuget

      - name: Restore WPF project
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Validate desktop output directory
        id: validate_output_dir
        shell: pwsh
        run: |
          $baseDir = "docs/screenshots/desktop"
          $requested = $env:WORKFLOW_OUTPUT_DIR
          if ([string]::IsNullOrWhiteSpace($requested)) {
            $requested = $baseDir
          }

          if ([System.IO.Path]::IsPathRooted($requested)) {
            Write-Error "output_dir must be a repository-relative path under '$baseDir'."
            exit 1
          }

          $repoRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $baseFull = [System.IO.Path]::GetFullPath((Join-Path $repoRoot $baseDir))
          $candidateFull = [System.IO.Path]::GetFullPath((Join-Path $repoRoot $requested))

          $basePrefix = $baseFull.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $basePrefix = "$basePrefix$([System.IO.Path]::DirectorySeparatorChar)"
          if ($candidateFull -ne $baseFull -and -not $candidateFull.StartsWith($basePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "output_dir must stay within '$baseDir'. Received '$requested'."
            exit 1
          }

          $safeRelative = [System.IO.Path]::GetRelativePath($repoRoot, $candidateFull) -replace '\\', '/'
          "safe_output_dir=$safeRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Capture desktop screenshots
        id: capture_desktop
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:CAPTURE_DIR) {
            Remove-Item -LiteralPath $env:CAPTURE_DIR -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:CAPTURE_DIR | Out-Null
          scripts/dev/capture-desktop-screenshots.ps1 -OutputDir $env:CAPTURE_DIR

      - name: Validate desktop screenshot captures
        shell: pwsh
        run: >
          python scripts/dev/validate-screenshot-captures.py
          --surface desktop
          --output-dir "${{ env.CAPTURE_DIR }}"
          --desktop-workflows scripts/dev/desktop-workflows.json
          --desktop-workflow screenshot-catalog
          --require-fresh

      - name: Log desktop screenshot capture status
        if: ${{ always() }}
        shell: pwsh
        run: |
          $outputDir = $env:CAPTURE_DIR
          if (-not (Test-Path -LiteralPath $outputDir)) {
            Write-Warning "Desktop screenshot output directory '$outputDir' was not created."
            return
          }

          $captures = @(Get-ChildItem -LiteralPath $outputDir -Filter '*.png' -File -ErrorAction SilentlyContinue)
          if ($captures.Count -eq 0) {
            Write-Warning "No desktop screenshots were captured under '$outputDir'."
          } else {
            Write-Host "[INFO] Captured $($captures.Count) desktop screenshot(s) in '$outputDir'."
          }

      - name: Prepare complete screenshot artifact
        if: ${{ always() }}
        shell: pwsh
        run: |
          $artifactDir = "artifacts/desktop-screenshot-capture/all-screenshots"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $entries = @()

          function Copy-ScreenshotSet {
            param(
              [Parameter(Mandatory = $true)][string]$SourceRoot,
              [Parameter(Mandatory = $true)][string]$Bucket
            )

            if ([string]::IsNullOrWhiteSpace($SourceRoot) -or -not (Test-Path -LiteralPath $SourceRoot)) {
              Write-Host "[INFO] Screenshot source '$SourceRoot' was not found; skipping '$Bucket'."
              return
            }

            $resolvedSourceRoot = [System.IO.Path]::GetFullPath($SourceRoot)
            foreach ($capture in @(Get-ChildItem -LiteralPath $resolvedSourceRoot -Filter '*.png' -File -Recurse -ErrorAction SilentlyContinue)) {
              $relativePath = [System.IO.Path]::GetRelativePath($resolvedSourceRoot, $capture.FullName)
              $destination = Join-Path (Join-Path $artifactDir $Bucket) $relativePath
              $destinationParent = Split-Path -Parent $destination
              if (-not [string]::IsNullOrWhiteSpace($destinationParent)) {
                New-Item -ItemType Directory -Force -Path $destinationParent | Out-Null
              }

              Copy-Item -LiteralPath $capture.FullName -Destination $destination -Force
              $script:entries += [ordered]@{
                bucket = $Bucket
                source = $capture.FullName
                artifactPath = $destination
                bytes = $capture.Length
                lastWriteTimeUtc = $capture.LastWriteTimeUtc.ToString('O')
              }
            }
          }

          Copy-ScreenshotSet -SourceRoot $env:CAPTURE_DIR -Bucket "catalog"
          Copy-ScreenshotSet -SourceRoot "artifacts/desktop-workflows" -Bucket "workflow-runs"

          [ordered]@{
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString('O')
            screenshotCount = $entries.Count
            screenshots = $entries
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $artifactDir 'screenshot-artifact-manifest.json') -Encoding utf8

          Write-Host "[INFO] Prepared $($entries.Count) screenshot file(s) for the complete desktop screenshot artifact."

      # The complete archive already includes these catalog PNGs as well as
      # workflow captures and a manifest; retain one authoritative download.
      - name: Upload complete screenshot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-screenshots-complete-${{ github.run_number }}
          path: artifacts/desktop-screenshot-capture/all-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage validated catalog refresh
        if: ${{ success() && (inputs.create_pr || github.event_name == 'schedule') }}
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ steps.validate_output_dir.outputs.safe_output_dir }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          # Replace the whole catalog so renamed or removed screens drop out.
          Get-ChildItem -LiteralPath $env:OUTPUT_DIR -Filter '*.png' -File | Remove-Item -Force
          Copy-Item -Path (Join-Path $env:CAPTURE_DIR '*.png') -Destination $env:OUTPUT_DIR -Force

      - name: Open screenshot refresh pull request
        id: refresh_pr
        if: ${{ success() && (inputs.create_pr || github.event_name == 'schedule') }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          # A PR opened with the default GITHUB_TOKEN starts no other workflows,
          # so the required checks would never run on it. SCREENSHOT_PR_TOKEN
          # (a GitHub App or fine-grained token with contents and pull-requests
          # write) lets them run; without it the PR still opens, unchecked.
          token: ${{ secrets.SCREENSHOT_PR_TOKEN || github.token }}
          # Each run publishes on its own branch: create-pull-request rebuilds
          # its branch from the base, so a fixed branch needs a force-push, which
          # repository rules forbid. The next step closes older refresh PRs.
          branch: automation/desktop-screenshot-capture-${{ github.run_id }}-${{ github.run_attempt }}
          base: ${{ github.event.repository.default_branch }}
          title: "chore: refresh desktop workstation screenshot catalog"
          commit-message: "chore: refresh desktop workstation screenshot catalog"
          body: |
            Automated refresh of the desktop WPF screenshot catalog captured by the
            Desktop Screenshot Capture workflow. Every configured capture and the freshness
            checks passed before staging this catalog.

            Source commit: ${{ steps.checkout.outputs.commit }}
            Capture evidence: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Review the rendered screens before merging.
          add-paths: |
            ${{ steps.validate_output_dir.outputs.safe_output_dir }}/*.png
          delete-branch: true

      - name: Close superseded screenshot refresh PRs
        if: ${{ steps.refresh_pr.outputs.pull-request-number != '' }}
        uses: ./.github/actions/close-superseded-refresh-prs
        with:
          branch-prefix: automation/desktop-screenshot-capture
          keep-pr-number: ${{ steps.refresh_pr.outputs.pull-request-number }}
          token: ${{ secrets.SCREENSHOT_PR_TOKEN || github.token }}
