name: Meridian CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridian-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-quality-gate-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-quality-gate-
            ${{ runner.os }}-nuget-

      - name: Run Meridian verification
        run: bash scripts/ci.sh
