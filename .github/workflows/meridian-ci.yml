name: Meridian CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridian-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  verify-dotnet:
    name: verify-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-quality-gate-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-quality-gate-
            ${{ runner.os }}-nuget-

      - name: Run .NET lane
        run: bash scripts/ci.sh --lane verify-dotnet

      - name: Upload .NET lane artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-ci-dotnet-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/build-logs/
            artifacts/test-results/dotnet/
            artifacts/ci-summary/
          if-no-files-found: ignore
          retention-days: 14

  verify-browser:
    name: verify-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Run browser workstation lane
        run: bash scripts/ci.sh --lane verify-browser

      - name: Upload browser lane artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-ci-browser-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            src/Meridian.Ui/dashboard/dist/
            artifacts/ci-summary/
          if-no-files-found: ignore
          retention-days: 14

  verify-docs:
    name: verify-docs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      # `promtool check rules` proves the alert file parses; `promtool test rules` proves each
      # rule fires on the condition it claims. Only the second catches a rate() window that
      # goes quiet while the fault persists, which is the shape of every alert regression here.
      # The docker CLI is preinstalled on ubuntu-latest and `docker compose config` needs no
      # daemon. validate-monitoring-deployment.py fails closed if either tool is missing.
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: "3.1.0"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --wildcards '*/promtool' --strip-components=1
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool
          promtool --version

      - name: Run docs/source/AI lane
        run: bash scripts/ci.sh --lane verify-docs

      - name: Upload docs lane artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-ci-docs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            docs/status/docs-automation-summary.md
            docs/status/docs-automation-summary.json
            docs/status/todo-scan-results.json
            artifacts/ci-summary/
          if-no-files-found: ignore
          retention-days: 14

  verify-workflows:
    name: verify-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Run workflow hygiene lane
        run: bash scripts/ci.sh --lane verify-workflows

      - name: Upload workflow lane artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-ci-workflows-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/ci-summary/
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs:
      - verify-dotnet
      - verify-browser
      - verify-docs
      - verify-workflows
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate Meridian CI lanes
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            ["verify-dotnet"]="${{ needs.verify-dotnet.result }}"
            ["verify-browser"]="${{ needs.verify-browser.result }}"
            ["verify-docs"]="${{ needs.verify-docs.result }}"
            ["verify-workflows"]="${{ needs.verify-workflows.result }}"
          )

          failed=0
          {
            echo "### Meridian CI quality gate"
            echo ""
            echo "| Lane | Result |"
            echo "| --- | --- |"
            for lane in verify-dotnet verify-browser verify-docs verify-workflows; do
              result="${results[$lane]}"
              echo "| \`$lane\` | \`$result\` |"
              if [[ "$result" != "success" ]]; then
                failed=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more Meridian CI lanes failed. Inspect the lane job summaries and artifacts."
            exit 1
          fi

          echo "All Meridian CI lanes passed."
