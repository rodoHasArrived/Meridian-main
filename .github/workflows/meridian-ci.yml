name: Meridian CI

on:
  workflow_call:
    outputs:
      integration-artifact-id:
        value: ${{ jobs.integration-gate.outputs.artifact-id }}
      integration-artifact-name:
        value: ${{ jobs.integration-gate.outputs.artifact-name }}
      integration-receipt-sha256:
        value: ${{ jobs.integration-gate.outputs.receipt-sha256 }}
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-meridian-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  # A newer pull request or merge-queue run supersedes the older one. Pushes to main do not:
  # every merge's run finishes, so main is always verified, and GitHub keeps only the newest
  # pending run per group, so a burst of merges cannot queue unboundedly.
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event_name != 'push' }}

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  # One job per lane. Every job is a fresh wait for a hosted runner, and measured PR runs spent
  # far longer queued than executing, so each lane runs, checks its own roster and reports its
  # verdict in a single job instead of a builder -> shard -> verdict chain. The roster checks
  # are unchanged: they read this job's own summary as shard 1 of 1. To shard again, restore a
  # shard matrix and a downstream verdict job together (see .github/workflows/README.md).
  verify-dotnet:
    name: verify-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      dotnet-required: ${{ steps.changes.outputs.dotnet }}
    env:
      # Build shared projects once, then overlap two isolated test processes.
      # Local runs remain sequential unless explicitly configured.
      MERIDIAN_CI_TEST_MAX_PARALLEL: "2"
      MERIDIAN_CI_DOTNET_SHARD: 1/1
      npm_config_prefer_offline: "true"

    steps:
      # Each lane classifies the change itself so none queues behind a separate job.
      # integration-gate runs these two steps verbatim; a contract test keeps them identical,
      # so both reach the same decision for the same pull request.
      - name: Check out PR history for change detection
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          path: .ci-change-detection

      - name: Detect .NET changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            (cd .ci-change-detection &&
              python3 build/scripts/ci/detect-dotnet-changes.py \
                --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
            rm -rf .ci-change-detection
          else
            # Main, merge queues, manual and reusable release gates always run .NET.
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report docs-only skip
        if: steps.changes.outputs.dotnet != 'true'
        run: |
          echo "Docs-only PR: .NET lane intentionally skipped." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The host embeds the workstation bundle at MSBuild evaluation time. The lane builds and
      # validates it from the lockfile itself (ensure-workstation-assets.py), so .NET neither
      # waits for the browser verdict nor for a separate bundle job.
      - name: Set up Node.js
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        id: nuget
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/*.packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Run .NET lane
        if: steps.changes.outputs.dotnet == 'true'
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.nuget.outputs.cache-hit || 'false' }}
        run: bash scripts/ci.sh --lane verify-dotnet

      # The lane's exit code is not enough: this proves it ran the complete default roster
      # exactly once, for one commit, with no failing entry.
      - name: Require the complete roster
        if: always() && steps.changes.outputs.dotnet == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/dotnet-shards/shard-1
          if [[ -d artifacts/test-results/dotnet ]]; then
            cp -R artifacts/test-results/dotnet artifacts/dotnet-shards/shard-1/
          fi
          python build/scripts/ci/merge-dotnet-shard-summaries.py \
            --shards-dir artifacts/dotnet-shards \
            --expected-shards 1 \
            --json-output artifacts/test-results/dotnet/ci-dotnet-test-summary.json \
            --summary-output artifacts/test-results/dotnet/ci-dotnet-test-summary.md \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      # Release promotion requires this exact evidence name for the lane.
      - name: Upload .NET lane artifacts
        if: always() && steps.changes.outputs.dotnet == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-dotnet-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/build-logs/
            artifacts/dotnet-shards/
            artifacts/test-results/dotnet/
            artifacts/ci-summary/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  # The browser lane always runs: no change classification may skip it. Lint, the strict
  # typecheck and the production bundle run here with the complete test-file roster.
  verify-browser:
    name: verify-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Reuse cached tarballs; npm still fetches missing packages and enforces the lockfile.
      npm_config_prefer_offline: "true"
      MERIDIAN_CI_BROWSER_SHARD: 1/1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run browser workstation lane
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.node.outputs.cache-hit || 'false' }}
        run: bash scripts/ci.sh --lane verify-browser

      # The lane's exit code is not enough: this proves it ran every dashboard test file in
      # this checkout exactly once, for one commit, with no failure.
      - name: Require every dashboard test file
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-shards/shard-1/artifacts/test-results
          if [[ -d artifacts/test-results/browser ]]; then
            cp -R artifacts/test-results/browser artifacts/browser-shards/shard-1/artifacts/test-results/
          fi
          node src/Meridian.Ui/dashboard/scripts/merge-vitest-shards.mjs \
            --shards-dir artifacts/browser-shards \
            --expected-shards 1 \
            --output-dir artifacts/test-results/browser

      # Release promotion requires this exact evidence name for the lane.
      - name: Upload browser lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-browser-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            src/Meridian.Ui/wwwroot/workstation/
            artifacts/browser-shards/
            artifacts/test-results/browser/
            artifacts/build-logs/
            artifacts/ci-summary/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  # The docs and workflow lanes share one job: both are short and Python-only, and every job
  # is a separate wait for a hosted runner. The lanes still run as their own scripts/ci.sh
  # invocations, keep their own evidence artifacts, and report separately in quality-gate.
  # The workflow lane runs even when the docs lane fails.
  verify-docs-workflows:
    name: verify-docs-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      docs-result: ${{ steps.docs.outcome }}
      workflows-result: ${{ steps.workflows.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            build/scripts/docs/requirements.txt
            build/scripts/ci/requirements.txt

      # validate-agent-definitions.py parses agent frontmatter with PyYAML rather than a
      # hand-rolled subset parser. The CI requirements include the docs requirements.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/ci/requirements.txt

      - name: Set up maintained diagram toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # `promtool check rules` proves the alert file parses; `promtool test rules` proves each
      # rule fires on the condition it claims. Only the second catches a rate() window that
      # goes quiet while the fault persists, which is the shape of every alert regression here.
      # The docker CLI is preinstalled on ubuntu-latest and `docker compose config` needs no
      # daemon. validate-monitoring-deployment.py fails closed if either tool is missing.
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: "3.1.0"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "9a9d1e115d1745826b13aec3f1409780b9fcf1d4206746cb4faee46ca5add70c  /tmp/prometheus.tar.gz" | sha256sum --check
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --wildcards '*/promtool' --strip-components=1
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool
          promtool --version

      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run docs/source/AI lane
        id: docs
        run: bash scripts/ci.sh --lane verify-docs

      # Upload before the workflow lane: scripts/ci.sh clears artifacts/build-logs/*.log at the
      # start of each lane, and this artifact keeps only the docs lane's summary.
      - name: Upload docs lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-docs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            docs/status/docs-automation-summary.md
            docs/status/docs-automation-summary.json
            docs/status/todo-scan-results.json
            artifacts/ci-summary/verify-docs/
            artifacts/docs/
            artifacts/maintained-generation/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

      - name: Run workflow hygiene lane
        id: workflows
        if: ${{ !cancelled() }}
        run: bash scripts/ci.sh --lane verify-workflows

      - name: Upload workflow lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-workflows-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/build-logs/
            artifacts/ci-summary/verify-workflows/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs:
      - verify-dotnet
      - verify-browser
      - verify-docs-workflows
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate Meridian CI lanes
        env:
          DOTNET_LANE_DECISION: ${{ needs.verify-dotnet.outputs.dotnet-required }}
          DOTNET_RESULT: ${{ needs.verify-dotnet.result }}
          BROWSER_RESULT: ${{ needs.verify-browser.result }}
          DOCS_WORKFLOWS_JOB_RESULT: ${{ needs.verify-docs-workflows.result }}
          DOCS_RESULT: ${{ needs.verify-docs-workflows.outputs.docs-result }}
          WORKFLOWS_RESULT: ${{ needs.verify-docs-workflows.outputs.workflows-result }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            ["verify-dotnet"]="$DOTNET_RESULT"
            ["verify-browser"]="$BROWSER_RESULT"
            ["verify-docs"]="${DOCS_RESULT:-$DOCS_WORKFLOWS_JOB_RESULT}"
            ["verify-workflows"]="${WORKFLOWS_RESULT:-$DOCS_WORKFLOWS_JOB_RESULT}"
          )

          failed=0
          if [[ "$DOTNET_LANE_DECISION" != "true" && "$DOTNET_LANE_DECISION" != "false" ]]; then
            echo "verify-dotnet did not produce a valid .NET decision." >&2
            failed=1
          fi
          # The two lanes share a job. Its own result must also be success: a failed setup or
          # artifact upload fails the gate as it did when each lane was its own job, and a
          # cancelled or timed-out job leaves no step outcome to report.
          if [[ "$DOCS_WORKFLOWS_JOB_RESULT" != "success" ]]; then
            echo "verify-docs-workflows finished with ${DOCS_WORKFLOWS_JOB_RESULT:-<none>}." >&2
            failed=1
          fi
          {
            echo "### Meridian CI quality gate"
            echo ""
            echo "| Lane | Result |"
            echo "| --- | --- |"
            for lane in verify-dotnet verify-browser verify-docs verify-workflows; do
              result="${results[$lane]}"
              echo "| \`$lane\` | \`$result\` |"
              if [[ "$result" != "success" ]]; then
                failed=1
              fi
              if [[ "$lane" == "verify-dotnet" && "$result" == "success" && "$DOTNET_LANE_DECISION" == "false" ]]; then
                echo "Docs-only PR: .NET lane steps intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more Meridian CI lanes failed. Inspect the lane job summaries and artifacts."
            exit 1
          fi

          echo "All required Meridian CI lanes passed."

  # Runs the service-backed integration suites itself, through the composite action that
  # Production Certification also uses, so its result needs no further job and no runner wait.
  # It classifies the change with verify-dotnet's exact steps: a pull request that changes only
  # recognized documentation skips the suites; main, merge queues, manual runs and release
  # callers always run them.
  integration-gate:
    name: integration-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      dotnet-required: ${{ steps.changes.outputs.dotnet }}
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-name: ${{ steps.evidence.outputs.artifact-name }}
      receipt-sha256: ${{ steps.evidence.outputs.receipt-sha256 }}
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: meridian-certification
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      MERIDIAN_DISABLE_DOCKER_TESTS: "false"
      MERIDIAN_LEDGER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_ASSET_OPERATIONS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_DIRECT_LENDING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_ACCOUNTS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_STRUCTURE_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_REPORTING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SCOPED_ACCESS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SECURITY_MASTER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification

    steps:
      - name: Check out PR history for change detection
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          path: .ci-change-detection

      - name: Detect .NET changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            (cd .ci-change-detection &&
              python3 build/scripts/ci/detect-dotnet-changes.py \
                --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
            rm -rf .ci-change-detection
          else
            # Main, merge queues, manual and reusable release gates always run .NET.
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report docs-only skip
        if: steps.changes.outputs.dotnet != 'true'
        run: |
          echo "Docs-only PR: service-backed integrations intentionally skipped." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run service-backed integration tests and bind their evidence
        id: integrations
        if: steps.changes.outputs.dotnet == 'true'
        uses: ./.github/actions/service-backed-integrations
        with:
          artifact-name: meridian-ci-integrations
          retention-days: "14"
          postgres-container-id: ${{ job.services.postgres.id }}

      # The same rules as service-backed-integrations.yml's evidence-gate: a docs-only pull
      # request needs no evidence; otherwise the suites must have passed and produced a complete,
      # well-formed artifact identity for release callers to reuse.
      - name: Require verified integration evidence
        id: evidence
        if: always()
        env:
          DOTNET_REQUIRED: ${{ steps.changes.outputs.dotnet }}
          INTEGRATION_OUTCOME: ${{ steps.integrations.outcome }}
          INTEGRATION_OUTPUTS: ${{ toJSON(steps.integrations.outputs) }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          required = os.environ.get("DOTNET_REQUIRED", "")
          if required not in ("true", "false"):
              raise SystemExit("Change detection did not produce a valid .NET decision.")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if required == "false":
              with summary.open("a") as stream:
                  stream.write("### Meridian CI integration gate\n\nDocs-only PR: no integration evidence is required.\n")
              raise SystemExit(0)
          outcome = os.environ.get("INTEGRATION_OUTCOME", "")
          with summary.open("a") as stream:
              stream.write(f"### Meridian CI integration gate\n\nService-backed integrations: {outcome or 'not run'}\n")
          if outcome != "success":
              raise SystemExit("Service-backed integrations did not pass. Inspect this job's steps and evidence.")
          outputs = json.loads(os.environ.get("INTEGRATION_OUTPUTS") or "{}")
          patterns = {"artifact-id": r"[1-9][0-9]*", "artifact-name": r"[A-Za-z0-9][A-Za-z0-9_.-]{0,199}", "receipt-sha256": r"[0-9a-f]{64}"}
          if any(not re.fullmatch(pattern, outputs.get(key) or "") for key, pattern in patterns.items()):
              raise SystemExit("Successful integration run did not produce complete evidence outputs")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              for key in patterns:
                  stream.write(f"{key}={outputs[key]}\n")
          PY
