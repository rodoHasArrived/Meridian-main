name: Meridian CI

on:
  workflow_call:
    outputs:
      integration-artifact-id:
        value: ${{ jobs.integration-gate.outputs.artifact-id }}
      integration-artifact-name:
        value: ${{ jobs.integration-gate.outputs.artifact-name }}
      integration-receipt-sha256:
        value: ${{ jobs.integration-gate.outputs.receipt-sha256 }}
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-meridian-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.detect.outputs.dotnet }}
    steps:
      - name: Check out complete PR history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # Inspect the complete diff locally, including deletions and both sides
          # of renames. No PR-files API limit can silently omit changed code.
          fetch-depth: 0
          # The detector compares path names only, so history needs commits and trees but
          # no file contents beyond this revision. The .NET and integration lanes wait here.
          filter: blob:none

      - name: Detect .NET changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 build/scripts/ci/detect-dotnet-changes.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          else
            # Main, merge queues, manual and reusable release gates always run .NET.
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          fi

  # The host embeds the workstation bundle at MSBuild evaluation time, so the .NET shards
  # need the bundle but not the browser test verdict. Building it here lets .NET start
  # without waiting for the browser lane; quality-gate still requires both lanes.
  build-workstation:
    name: build-workstation
    outputs:
      workstation-artifact-id: ${{ steps.workstation.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_prefer_offline: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Lockfile install, contract generation, production build and bundle validation: the
      # same preparation a standalone verify-dotnet lane performs for itself.
      - name: Build and validate workstation assets
        run: python build/scripts/ensure-workstation-assets.py

      - name: Upload same-revision workstation assets
        id: workstation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workstation-${{ github.sha }}-${{ github.run_attempt }}
          path: src/Meridian.Ui/wwwroot/workstation/
          if-no-files-found: error
          retention-days: 14

  # One complete verify-dotnet lane per runner, each restricted to a deterministic slice of
  # the test roster. Every runner keeps the reviewed two test processes; only the number of
  # runners changes. The count is one while hosted runners are the constraint: a second
  # shard repeats the restore and build, which costs queue time when no runner is free. Two
  # reach the floor set by the longest single test process; raise the matrix, the K/N
  # suffixes, the outputs, the download and --expected-shards together. The verify-dotnet
  # job below is the lane's single verdict.
  dotnet-shards:
    name: dotnet-shard (${{ matrix.shard }}/1)
    needs: [changes, build-workstation]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A failing shard must not hide failures in the others.
      fail-fast: false
      matrix:
        shard: [1]
    outputs:
      artifact-id-1: ${{ steps.evidence.outputs.artifact-id-1 }}
    env:
      # Build shared projects once, then overlap two isolated test processes.
      # Local runs remain sequential unless explicitly configured.
      MERIDIAN_CI_TEST_MAX_PARALLEL: "2"
      MERIDIAN_CI_DOTNET_SHARD: ${{ matrix.shard }}/1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/*.packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      # Use the producer's immutable artifact ID, including when only failed
      # jobs are rerun and the successful bundle upload belongs to an earlier
      # attempt. No cross-run cache supplies runtime assets.
      - name: Download same-revision workstation assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-workstation.outputs.workstation-artifact-id }}
          path: src/Meridian.Ui/wwwroot/workstation

      - name: Run .NET lane
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.nuget.outputs.cache-hit || 'false' }}
        run: bash scripts/ci.sh --lane verify-dotnet

      - name: Upload .NET shard artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-dotnet-shard-${{ matrix.shard }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/build-logs/
            artifacts/test-results/dotnet/
            artifacts/ci-summary/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

      # Each matrix leg sets only its own output, so a rerun of one failed shard keeps the
      # immutable evidence IDs of the shards that already passed.
      - name: Record shard evidence identity
        id: evidence
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          SHARD: ${{ matrix.shard }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "artifact-id-${SHARD}=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

  verify-dotnet:
    name: verify-dotnet
    needs: [changes, dotnet-shards]
    # A failed or cancelled shard must still produce a failing verdict, never a skipped one.
    if: always() && needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # A shard that never uploaded leaves its ID empty. Its own artifact, if any, stays
      # downloadable; the roster check below then fails on the missing summary.
      - name: Download shard evidence
        if: needs.dotnet-shards.outputs.artifact-id-1 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.dotnet-shards.outputs.artifact-id-1 }}
          path: artifacts/dotnet-shards

      # The shards' own exit codes are not enough: this proves that together they ran the
      # complete default roster exactly once, for one commit, with no failing entry.
      - name: Require the complete roster across shards
        run: >-
          python build/scripts/ci/merge-dotnet-shard-summaries.py
          --shards-dir artifacts/dotnet-shards
          --expected-shards 1
          --json-output artifacts/test-results/dotnet/ci-dotnet-test-summary.json
          --summary-output artifacts/test-results/dotnet/ci-dotnet-test-summary.md
          --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Require every shard to succeed
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.dotnet-shards.result }}
        run: |
          set -euo pipefail
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "One or more .NET shards did not succeed: ${SHARDS_RESULT}." >&2
            exit 1
          fi

      - name: Upload .NET lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-dotnet-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/dotnet-shards/
            artifacts/test-results/dotnet/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  # The dashboard tests run as sequential batches, so each added runner shortens the lane.
  # The count is one while hosted runners are the constraint; see dotnet-shards for what to
  # raise together. Each shard is a complete verify-browser lane restricted to its share of
  # the test files; shard 1 also owns lint, the strict typecheck and the production bundle.
  # verify-browser is the verdict.
  browser-shards:
    name: browser-shard (${{ matrix.shard }}/1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A failing shard must not hide failures in the other.
      fail-fast: false
      matrix:
        shard: [1]
    outputs:
      artifact-id-1: ${{ steps.evidence.outputs.artifact-id-1 }}
    env:
      # Reuse cached tarballs; npm still fetches missing packages and enforces the lockfile.
      npm_config_prefer_offline: "true"
      MERIDIAN_CI_BROWSER_SHARD: ${{ matrix.shard }}/1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run browser workstation lane
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.node.outputs.cache-hit || 'false' }}
        run: bash scripts/ci.sh --lane verify-browser

      - name: Upload browser shard artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-browser-shard-${{ matrix.shard }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            src/Meridian.Ui/wwwroot/workstation/
            artifacts/test-results/browser/
            artifacts/build-logs/
            artifacts/ci-summary/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

      # Each matrix leg sets only its own output, so a rerun of one failed shard keeps the
      # immutable evidence ID of the shard that already passed.
      - name: Record shard evidence identity
        id: evidence
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          SHARD: ${{ matrix.shard }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: echo "artifact-id-${SHARD}=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

  verify-browser:
    name: verify-browser
    needs: [browser-shards]
    # A failed or cancelled shard must still produce a failing verdict, never a skipped one.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A shard that never uploaded leaves its ID empty. Its own artifact, if any, stays
      # downloadable; the file check below then fails on the missing summary.
      - name: Download shard evidence
        if: needs.browser-shards.outputs.artifact-id-1 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.browser-shards.outputs.artifact-id-1 }}
          path: artifacts/browser-shards

      # The shards' own exit codes are not enough: this proves that together they ran every
      # dashboard test file in this checkout exactly once, for one commit, with no failure.
      - name: Require every dashboard test file across shards
        run: >-
          node src/Meridian.Ui/dashboard/scripts/merge-vitest-shards.mjs
          --shards-dir artifacts/browser-shards
          --expected-shards 1
          --output-dir artifacts/test-results/browser

      - name: Require every shard to succeed
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.browser-shards.result }}
        run: |
          set -euo pipefail
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "One or more browser shards did not succeed: ${SHARDS_RESULT}." >&2
            exit 1
          fi

      - name: Upload browser lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-browser-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-shards/
            artifacts/test-results/browser/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  verify-docs:
    name: verify-docs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/scripts/docs/requirements.txt

      # validate-agent-definitions.py parses agent frontmatter with PyYAML rather than a
      # hand-rolled subset parser, so this lane needs the dependency installed.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Set up maintained diagram toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # `promtool check rules` proves the alert file parses; `promtool test rules` proves each
      # rule fires on the condition it claims. Only the second catches a rate() window that
      # goes quiet while the fault persists, which is the shape of every alert regression here.
      # The docker CLI is preinstalled on ubuntu-latest and `docker compose config` needs no
      # daemon. validate-monitoring-deployment.py fails closed if either tool is missing.
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: "3.1.0"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "9a9d1e115d1745826b13aec3f1409780b9fcf1d4206746cb4faee46ca5add70c  /tmp/prometheus.tar.gz" | sha256sum --check
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --wildcards '*/promtool' --strip-components=1
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool
          promtool --version

      - name: Run docs/source/AI lane
        run: bash scripts/ci.sh --lane verify-docs

      - name: Upload docs lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-docs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            docs/status/docs-automation-summary.md
            docs/status/docs-automation-summary.json
            docs/status/todo-scan-results.json
            artifacts/ci-summary/
            artifacts/docs/
            artifacts/maintained-generation/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  verify-workflows:
    name: verify-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            build/scripts/docs/requirements.txt
            build/scripts/ci/requirements.txt

      # validate-agent-definitions.py parses agent frontmatter with PyYAML rather than a
      # hand-rolled subset parser, so this lane needs the dependency installed.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/ci/requirements.txt

      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Run workflow hygiene lane
        run: bash scripts/ci.sh --lane verify-workflows

      - name: Upload workflow lane artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-ci-workflows-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/build-logs/
            artifacts/ci-summary/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 14

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify-dotnet
      - verify-browser
      - verify-docs
      - verify-workflows
    if: always()
    timeout-minutes: 5

    steps:
      - name: Evaluate Meridian CI lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOTNET_REQUIRED: ${{ needs.changes.outputs.dotnet }}
          DOTNET_RESULT: ${{ needs.verify-dotnet.result }}
          BROWSER_RESULT: ${{ needs.verify-browser.result }}
          DOCS_RESULT: ${{ needs.verify-docs.result }}
          WORKFLOWS_RESULT: ${{ needs.verify-workflows.result }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            ["changes"]="$CHANGES_RESULT"
            ["verify-dotnet"]="$DOTNET_RESULT"
            ["verify-browser"]="$BROWSER_RESULT"
            ["verify-docs"]="$DOCS_RESULT"
            ["verify-workflows"]="$WORKFLOWS_RESULT"
          )

          failed=0
          if [[ "$DOTNET_REQUIRED" != "true" && "$DOTNET_REQUIRED" != "false" ]]; then
            echo "Change detection did not produce a valid .NET decision." >&2
            failed=1
          fi
          {
            echo "### Meridian CI quality gate"
            echo ""
            echo "| Lane | Result |"
            echo "| --- | --- |"
            for lane in changes verify-dotnet verify-browser verify-docs verify-workflows; do
              result="${results[$lane]}"
              echo "| \`$lane\` | \`$result\` |"
              if [[ "$lane" == "verify-dotnet" && "$result" == "skipped" &&
                    "$CHANGES_RESULT" == "success" && "$DOTNET_REQUIRED" == "false" ]]; then
                echo "Docs-only PR: .NET lane intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
              elif [[ "$result" != "success" ]]; then
                failed=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more Meridian CI lanes failed. Inspect the lane job summaries and artifacts."
            exit 1
          fi

          echo "All required Meridian CI lanes passed."

  # Shares the .NET lane's change classification: a pull request that changes only
  # recognized documentation cannot alter these tests, so it does not spend their runner.
  # Main, merge queues, manual runs and release callers always classify as requiring them.
  service-backed-integrations:
    name: service-backed-integrations
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    uses: ./.github/workflows/service-backed-integrations.yml
    with:
      artifact-name: meridian-ci-integrations

  integration-gate:
    name: integration-gate
    runs-on: ubuntu-latest
    needs: [changes, service-backed-integrations]
    if: always()
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ needs.service-backed-integrations.outputs.artifact-id }}
      artifact-name: ${{ needs.service-backed-integrations.outputs.artifact-name }}
      receipt-sha256: ${{ needs.service-backed-integrations.outputs.receipt-sha256 }}
    steps:
      - name: Evaluate service-backed integration evidence
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOTNET_REQUIRED: ${{ needs.changes.outputs.dotnet }}
          INTEGRATION_RESULT: ${{ needs.service-backed-integrations.result }}
        run: |
          set -euo pipefail
          {
            echo "### Meridian CI integration gate"
            echo ""
            echo "Service-backed integrations: ${INTEGRATION_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INTEGRATION_RESULT" == "skipped" && "$CHANGES_RESULT" == "success" &&
                "$DOTNET_REQUIRED" == "false" ]]; then
            echo "Docs-only PR: service-backed integrations intentionally skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$INTEGRATION_RESULT" != "success" ]]; then
            echo "Service-backed integrations did not pass. Inspect the integration job and evidence."
            exit 1
          fi
