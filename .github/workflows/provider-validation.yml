name: Provider Validation

on:
  workflow_dispatch:
    inputs:
      date_stamp:
        description: >
          Date stamp for output directory (YYYY-MM-DD).
          Defaults to today (UTC) when left blank.
        required: false
        default: ""
      skip_wave1:
        description: Skip Wave 1 validation and only regenerate the DK1 packet and sign-off template.
        required: false
        type: boolean
        default: false
      candidate_kernel_version:
        description: Candidate kernel version label for degradation calibration (leave blank to skip calibration).
        required: false
        default: ""
      baseline_kernel_version:
        description: Baseline kernel version label for degradation calibration.
        required: false
        default: "default"
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: provider-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  run-validation:
    name: Wave 1 Provider Validation + DK1 Review Packet
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare provider validation review packet
        shell: pwsh
        env:
          DATE_STAMP: ${{ inputs.date_stamp }}
          SKIP_WAVE1: ${{ inputs.skip_wave1 }}
          CANDIDATE_KERNEL_VERSION: ${{ inputs.candidate_kernel_version }}
          BASELINE_KERNEL_VERSION: ${{ inputs.baseline_kernel_version }}
        run: |
          $bundleArgs = @{
            PrepareOperatorSignoff = $true
          }
          if ($env:DATE_STAMP -ne '') {
            $bundleArgs.DateStamp = $env:DATE_STAMP
          }
          if ($env:SKIP_WAVE1 -eq 'true') {
            $bundleArgs.SkipWave1 = $true
          }
          if ($env:CANDIDATE_KERNEL_VERSION -ne '') {
            $bundleArgs.CandidateKernelVersion = $env:CANDIDATE_KERNEL_VERSION
          }
          if ($env:BASELINE_KERNEL_VERSION -ne '' -and $env:BASELINE_KERNEL_VERSION -ne 'default') {
            $bundleArgs.BaselineKernelVersion = $env:BASELINE_KERNEL_VERSION
          }
          & scripts/dev/run-provider-validation-evidence-bundle.ps1 @bundleArgs

      - name: Upload provider validation artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provider-validation-evidence-${{ github.run_number }}
          path: artifacts/provider-validation/_automation/
          if-no-files-found: ignore
          retention-days: 30
