name: PostgreSQL Schema Control

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "src/Meridian.Storage/**/Migrations/**"
      - "src/Meridian.Storage/Migrations/**"
      - "src/Meridian.Storage/**/*MigrationRunner.cs"
      - "src/Meridian.Identity/**/Migrations/**"
      - "src/Meridian.Identity/**/*.cs"
      - "src/Meridian.Contracts/**"
      - "tools/schema_control/**"
      - "build/scripts/schema-control.py"
      - "tests/scripts/test_schema_control_*.py"
      - "database/**"
      - "docs/reference/database-schema.md"
      - "docs/generated/database/**"
      - ".github/workflows/schema-control.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate drift or refresh the tracked schema snapshot"
        required: true
        default: check
        type: choice
        options:
          - check
          - snapshot
      baseline_ref:
        description: "Explicit baseline commit SHA or Git ref (resolved once per run)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: schema-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://meridian:meridian@localhost:5432/meridian_schema_control
  PYTHONUNBUFFERED: "1"

jobs:
  schema-control:
    name: schema-control
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_schema_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_schema_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve schema control revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASELINE_REF="$PR_BASE_SHA"
          else
            BASELINE_REF="$MANUAL_BASELINE_REF"
          fi
          if [[ -z "$BASELINE_REF" ]]; then
            echo "An explicit schema-control baseline is required." >&2
            exit 1
          fi
          baseline_sha="$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")"
          candidate_sha="$(git rev-parse --verify "HEAD^{commit}")"
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          mkdir -p build/schema-control
          printf '{"format":"meridian.schema-control-revisions.v1","baseline_sha":"%s","candidate_sha":"%s"}\n' \
            "$baseline_sha" "$candidate_sha" > build/schema-control/revisions.json
          {
            echo "### Schema-control revisions"
            echo ""
            echo "- Baseline SHA: $baseline_sha"
            echo "- Candidate SHA (checked-out commit): $candidate_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install schema-control dependencies
        run: python -m pip install --requirement tools/schema_control/requirements.txt

      - name: Test schema-control tooling
        run: python -m unittest discover -s tests/scripts -p "test_schema_control*.py" -v

      - name: Verify schema control artifacts
        if: ${{ github.event_name == 'pull_request' || inputs.mode == 'check' }}
        env:
          BASELINE_SHA: ${{ steps.revisions.outputs.baseline_sha }}
        run: >-
          python build/scripts/schema-control.py verify
          --database-url "$DATABASE_URL"
          --base-ref "$BASELINE_SHA"
          --candidate-root build/schema-control/candidate

      - name: Refresh schema control snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot' }}
        env:
          BASELINE_SHA: ${{ steps.revisions.outputs.baseline_sha }}
        run: >-
          python build/scripts/schema-control.py snapshot
          --database-url "$DATABASE_URL"
          --base-ref "$BASELINE_SHA"
          --candidate-root build/schema-control/candidate

      - name: Append schema control summary
        if: always()
        shell: bash
        run: |
          summary_path="build/schema-control/candidate/reports/summary.md"
          if [[ -f "$summary_path" ]]; then
            cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Schema-control summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload schema control artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-control-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/schema-control/
          if-no-files-found: ignore
          retention-days: 14
