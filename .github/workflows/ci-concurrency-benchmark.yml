name: CI Concurrency Benchmark

on:
  workflow_dispatch:
    inputs:
      subject:
        description: Compare five paired runs without changing CI defaults.
        type: choice
        default: both
        options: [dotnet, browser, both]

permissions:
  contents: read

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [1, 2, 3, 4, 5]
        subject: ${{ fromJSON(inputs.subject == 'both' && '["dotnet","browser"]' || format('["{0}"]', inputs.subject)) }}
    env:
      CI: true
      MERIDIAN_DISABLE_DOCKER_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: matrix.subject == 'dotnet'
        with:
          global-json-file: global.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.subject == 'browser'
        with:
          node-version: "24"
      - name: Restore browser dependencies
        if: matrix.subject == 'browser'
        run: npm --prefix src/Meridian.Ui/dashboard ci
      - name: Restore .NET dependencies before either measured variant
        if: matrix.subject == 'dotnet'
        run: dotnet restore Meridian.sln /p:EnableWindowsTargeting=true
      - name: Measure paired test execution
        run: python build/scripts/ci/benchmark-ci.py --subject ${{ matrix.subject }} --pair ${{ matrix.pair }} --output artifacts/benchmark/${{ matrix.subject }}-${{ matrix.pair }}/pair.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-${{ matrix.subject }}-${{ matrix.pair }}-${{ github.run_attempt }}
          path: artifacts/benchmark/
          if-no-files-found: error
  evaluate:
    runs-on: ubuntu-latest
    needs: pairs
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: benchmark-*
          path: artifacts/benchmark
          merge-multiple: true
      - name: Apply measured adoption rule
        env:
          SUBJECT: ${{ inputs.subject }}
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('metrics', 'build/scripts/ci/ci-metrics.py')
          metrics = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(metrics)
          for subject in ('dotnet', 'browser') if os.environ['SUBJECT'] == 'both' else (os.environ['SUBJECT'],):
              pairs = [json.loads(p.read_text()) for p in Path('artifacts/benchmark').glob(f'{subject}-*/pair.json')]
              result = metrics.evaluate_pairs(pairs)
              Path(f'artifacts/benchmark/{subject}-decision.json').write_text(json.dumps(result, indent=2))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'### {subject}\n\n```json\n{json.dumps(result, indent=2)}\n```\n\nA human-reviewed change is required before adoption.\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-decisions-${{ github.run_attempt }}
          path: artifacts/benchmark/*-decision.json
          if-no-files-found: error
