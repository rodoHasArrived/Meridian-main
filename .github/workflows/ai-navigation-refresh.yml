name: AI Navigation Refresh

# Refresh the navigation's 14-day age gate and its compatible generated reports
# together. Generation never has a write token; the trusted writer only applies
# the reviewed output policy and advances the dedicated branch without force.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      retry_count:
        description: Internal bounded stale-revision retry counter
        type: choice
        options: ["0", "1"]
        default: "0"

permissions:
  contents: read

concurrency:
  group: ai-navigation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh AI navigation artifact
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Regenerate compatible maintenance outputs and check 14-day freshness
        run: python3 build/scripts/ci/maintenance_refresh.py generate --output "$RUNNER_TEMP/maintenance-refresh"

      - name: Retain reviewable maintenance patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-refresh/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Open generated maintenance pull request
    environment: generated-repair
    needs: refresh
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted publisher at pinned default revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install publisher dependencies before creating credentials
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Download patch from this exact run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-refresh

      - name: Require App configuration so repair commits trigger fresh CI
        env:
          APP_ID: ${{ vars.GENERATED_REPAIR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GENERATED_REPAIR_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure GENERATED_REPAIR_APP_ID and environment secret GENERATED_REPAIR_APP_PRIVATE_KEY in the default-branch-restricted generated-repair environment. The App requires Contents, Pull requests and Actions write access. The generated-maintenance artifact contains the patch for manual use."
            exit 1
          fi

      - name: Create narrowly scoped publication token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GENERATED_REPAIR_APP_ID }}
          private-key: ${{ secrets.GENERATED_REPAIR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: Publish validated patch without force pushes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          RETRY_COUNT: ${{ inputs.retry_count || '0' }}
        run: |
          python3 build/scripts/ci/maintenance_refresh.py publish \
            --artifact "$RUNNER_TEMP/maintenance-refresh" \
            --base-sha "$BASE_SHA" --base-branch "$BASE_BRANCH" --repository "$REPOSITORY" \
            --retry-count "$RETRY_COUNT"
