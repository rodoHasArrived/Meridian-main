name: Desktop Workflow Runner

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Desktop workflow to run.
        required: true
        type: choice
        default: debug-startup
        options:
          - debug-startup
          - screenshot-catalog
          - manual-overview
          - manual-data
          - manual-strategy-and-trading
          - manual-accounting

permissions:
  contents: read

concurrency:
  group: desktop-workflow-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  run-workflow:
    name: Run ${{ inputs.workflow }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Restore WPF project
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Run desktop workflow
        shell: pwsh
        run: >
          scripts/dev/run-desktop-workflow.ps1
          -Workflow ${{ inputs.workflow }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-workflow-run-${{ inputs.workflow }}-${{ github.run_number }}
          path: artifacts/desktop-workflows/
          if-no-files-found: ignore
          retention-days: 14
