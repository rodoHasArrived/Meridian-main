name: Desktop Workflow Runner

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Desktop workflow to run.
        required: true
        type: choice
        default: debug-startup
        options:
          - debug-startup
          - screenshot-catalog
          - manual-overview
          - manual-data
          - manual-strategy-and-trading
          - manual-accounting

permissions:
  contents: read

concurrency:
  group: desktop-workflow-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  run-workflow:
    name: Run ${{ inputs.workflow }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK and NuGet cache
        uses: ./.github/actions/setup-dotnet-nuget

      - name: Restore WPF project
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Run desktop workflow
        shell: pwsh
        run: >
          scripts/dev/run-desktop-workflow.ps1
          -Workflow ${{ inputs.workflow }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-workflow-run-${{ inputs.workflow }}-${{ github.run_number }}
          path: artifacts/desktop-workflows/
          if-no-files-found: ignore
          retention-days: 14
