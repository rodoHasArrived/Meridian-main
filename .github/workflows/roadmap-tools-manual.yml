name: Roadmap Tools (Manual)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - validate-roadmap-file
          - render
          - enforce-phase-scope
          - all
      roadmap_path:
        description: "Path to roadmap YAML (used by validate-roadmap-file and render)"
        required: false
        default: "docs/roadmap/data/roadmap-items.yml"
      render_output:
        description: "Output path for render (used by render)"
        required: false
        default: "artifacts/roadmap.normalized.yml"
      phase:
        description: "Phase for enforce-phase-scope (PR0..PR9)"
        required: false
        default: "PR0"
      base_ref:
        description: "Base ref for enforce-phase-scope diff"
        required: false
        default: "origin/main"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  dispatch-key:
    name: Identify duplicate dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      group: ${{ steps.key.outputs.group }}
    steps:
      - name: Hash the selected commit, ref and inputs
        id: key
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os

          # Hash exact values: Actions groups are case-insensitive and length-limited.
          selection = {
              "ref": os.environ["DISPATCH_REF"],
              "sha": os.environ["DISPATCH_SHA"],
              "inputs": json.loads(os.environ["DISPATCH_INPUTS"]),
          }
          payload = json.dumps(selection, sort_keys=True, separators=(",", ":")).encode("utf-8")
          digest = hashlib.sha256(payload).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"group={digest}", file=output)
          PY

  roadmap-tools:
    name: Run roadmap tools
    needs: dispatch-key
    # Finish active validation; duplicate selections retain only the latest pending job.
    # GitHub concurrency is not a FIFO queue. Different selections run independently.
    concurrency:
      group: roadmap-tools-manual-${{ needs.dispatch-key.outputs.group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install documentation parser dependencies
        run: python3 -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Validate fixture enums
        if: ${{ inputs.script == 'validate' || inputs.script == 'all' }}
        run: python3 tools/roadmap/validate_roadmap.py

      - name: Validate roadmap evidence file
        if: ${{ inputs.script == 'validate-roadmap-file' || inputs.script == 'all' }}
        env:
          ROADMAP_PATH: ${{ inputs.roadmap_path }}
        run: python3 tools/roadmap/validate_roadmap.py --roadmap "$ROADMAP_PATH"

      - name: Render roadmap docs (normalize)
        if: ${{ inputs.script == 'render' || inputs.script == 'all' }}
        env:
          ROADMAP_PATH: ${{ inputs.roadmap_path }}
          RENDER_OUTPUT: ${{ inputs.render_output }}
        run: |
          mkdir -p -- "$(dirname -- "$RENDER_OUTPUT")"
          python3 tools/roadmap/render_roadmap_docs.py \
            "$ROADMAP_PATH" \
            "$RENDER_OUTPUT"

      - name: Upload render output
        if: ${{ inputs.script == 'render' || inputs.script == 'all' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-normalized
          path: ${{ inputs.render_output }}
          if-no-files-found: warn

      - name: Enforce phase scope
        if: ${{ inputs.script == 'enforce-phase-scope' || inputs.script == 'all' }}
        env:
          DISPATCH_PHASE: ${{ inputs.phase }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          python3 tools/roadmap/enforce_phase_scope.py \
            --dispatch-phase "$DISPATCH_PHASE" \
            --base-ref "$BASE_REF" \
            --head-ref HEAD \
            --json
