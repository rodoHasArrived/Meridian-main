name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    # Run verify-full nightly at 02:00 UTC so coverage never silently degrades.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.25.1"

  verify-full:
    name: verify-full (coverage + scenario tests)
    # Run nightly on main or when manually triggered. Not on every PR to keep
    # the PR critical path fast.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Restore solution
        run: dotnet restore Meridian.sln /p:EnableWindowsTargeting=true

      - name: Run all tests with coverage (including scenario tests)
        run: |
          dotnet test Meridian.sln \
            --no-restore \
            -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/test-results/full \
            --settings tests/coverlet.runsettings \
            --logger "trx;LogFilePrefix=full" \
            --blame-hang \
            --blame-hang-timeout 10m \
            --filter "Category!=Integration&Category!=Performance" \
            /p:EnableWindowsTargeting=true

      - name: Write coverage summary to status doc
        if: always()
        run: python3 scripts/update_coverage_report.py --results-dir artifacts/test-results/full

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verify-full-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/full/
            docs/status/coverage-report.md
          if-no-files-found: ignore
          retention-days: 30
