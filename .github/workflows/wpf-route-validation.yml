name: WPF Route Validation

on:
  pull_request:
    paths:
      - "src/Meridian.Wpf/**"
      - "src/Meridian.Ui.Shared/**"
      - "tests/Meridian.Wpf.Tests/**"
      - ".github/workflows/wpf-route-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/Meridian.Wpf/**"
      - "src/Meridian.Ui.Shared/**"
      - "tests/Meridian.Wpf.Tests/**"
      - ".github/workflows/wpf-route-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpf-route-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  position-blotter-route:
    name: Position Blotter Route Validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-wpf-
            ${{ runner.os }}-nuget-

      - name: Run position blotter route validation
        shell: pwsh
        run: scripts/dev/validate-position-blotter-route.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: position-blotter-route-results-${{ github.run_number }}
          path: artifacts/wpf-validation/position-blotter-route/
          if-no-files-found: ignore
          retention-days: 14

  operator-inbox-route:
    name: Operator Inbox Route Validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-wpf-
            ${{ runner.os }}-nuget-

      - name: Run operator inbox route validation
        shell: pwsh
        run: scripts/dev/validate-operator-inbox-route.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: operator-inbox-route-results-${{ github.run_number }}
          path: artifacts/wpf-validation/operator-inbox-route/
          if-no-files-found: ignore
          retention-days: 14
