name: Maintenance

on:
  pull_request:
    paths:
      - ".github/**"
      - "build/scripts/**"
      - "scripts/**"
      - "docs/developer/**"
      - "docs/development/**"
      - "README.md"
      - ".gitignore"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "build/scripts/**"
      - "scripts/**"
      - "docs/developer/**"
      - "docs/development/**"
      - "README.md"
      - ".gitignore"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
  schedule:
    - cron: "20 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hygiene:
    name: Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Run Meridian workflow hygiene checks
        run: python3 build/scripts/ci/check-workflow-hygiene.py

      - name: Validate workflow syntax with actionlint
        uses: rhysd/actionlint@v1.7.12
