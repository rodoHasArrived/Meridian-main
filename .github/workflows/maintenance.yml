name: Maintenance

on:
  pull_request:
    paths:
      - ".github/**"
      - "build/scripts/**"
      - "scripts/**"
      - "docs/developer/**"
      - "docs/development/**"
      - "README.md"
      - ".gitignore"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - ".github/dependabot.yml"
      - "package.json"
      - "Makefile"
      - "make/*.mk"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "build/scripts/**"
      - "scripts/**"
      - "docs/developer/**"
      - "docs/development/**"
      - "README.md"
      - ".gitignore"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - ".github/dependabot.yml"
      - "package.json"
      - "Makefile"
      - "make/*.mk"
  schedule:
    - cron: "20 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hygiene:
    name: Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Run Meridian workflow hygiene checks
        run: python3 build/scripts/ci/check-workflow-hygiene.py

      - name: Verify tooling metadata integrity
        run: python3 build/scripts/validate-tooling-metadata.py

      - name: Validate workflow syntax with actionlint
        uses: rhysd/actionlint@v1.7.12

      - name: Validate AI contract drift
        run: |
          python3 build/scripts/docs/check-ai-contract-drift.py --canonical docs/ai/contract-policy.json --mirror docs/ai/copilot/contract-policy.mirror.json --mirror docs/ai/claude/contract-policy.mirror.json --routing-rules docs/ai/codex/prompt-route-rules.json --routing-host-doc docs/ai/codex/README.md --routing-host-doc docs/ai/assistant-workflow-contract.md

      - name: Validate AI navigation freshness
        run: |
          python3 build/scripts/docs/check-ai-navigation-freshness.py --navigation-json docs/ai/generated/repo-navigation.json --max-age-days 14
