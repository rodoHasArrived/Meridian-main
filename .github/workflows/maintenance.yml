name: Maintenance

on:
  pull_request:
    paths:
      - ".github/**"
      - "build/scripts/**"
      - "scripts/**"
      - "docs/developer/**"
      - "docs/development/**"
      - "README.md"
      - ".gitignore"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - ".github/dependabot.yml"
      - "package.json"
      - "Makefile"
      - "make/*.mk"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "build/scripts/**"
      - "scripts/**"
      - "docs/developer/**"
      - "docs/development/**"
      - "README.md"
      - ".gitignore"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - ".github/dependabot.yml"
      - "package.json"
      - "Makefile"
      - "make/*.mk"
  schedule:
    - cron: "20 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  workflow-hygiene:
    name: Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # PR/main coverage is owned by the always-on canonical Meridian CI lanes.
      - name: Run Meridian workflow hygiene checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 build/scripts/ci/check-workflow-hygiene.py

      - name: Verify tooling metadata integrity
        run: python3 build/scripts/validate-tooling-metadata.py

      - name: Validate workflow syntax with actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # PR/main coverage is owned by the always-on canonical Meridian CI lanes.
      - name: Validate AI contract drift
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 build/scripts/docs/check-ai-contract-drift.py --canonical docs/ai/contract-policy.json --mirror docs/ai/copilot/contract-policy.mirror.json --mirror docs/ai/claude/contract-policy.mirror.json --routing-rules docs/ai/codex/prompt-route-rules.json --routing-host-doc docs/ai/codex/README.md --routing-host-doc docs/ai/assistant-workflow-contract.md

      # PR/main coverage is owned by the always-on canonical Meridian CI lanes.
      - name: Validate AI navigation freshness
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 build/scripts/docs/check-ai-navigation-freshness.py --navigation-json docs/ai/generated/repo-navigation.json --max-age-days 14
