name: Service-backed Integrations

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Evidence artifact prefix supplied by the calling workflow.
        type: string
        default: service-backed-integrations
      retention-days:
        description: Days to retain the test, coverage and schema evidence.
        type: number
        default: 14
      reuse-artifact-id:
        description: Immutable evidence artifact ID from a successful caller dependency in this run.
        type: string
        default: ""
      reuse-artifact-name:
        type: string
        default: ""
      reuse-receipt-sha256:
        type: string
        default: ""
      reuse-result:
        description: Result of the dependency that produced the evidence.
        type: string
        default: ""
      skip-when-docs-only:
        description: >-
          Classify pull request changes in the integration job and skip its steps for a
          documentation-only change. Callers without this input always run the suite.
        type: boolean
        default: false
      caller-verifies-evidence:
        description: >-
          Skip the evidence-gate job because the caller's own gate job verifies the fresh
          job's result and evidence outputs below. Every job is a separate wait for a hosted
          runner; a caller that already gates the result saves one by verifying in place.
          Only valid for fresh runs: reuse inputs still need evidence-gate.
        type: boolean
        default: false
    outputs:
      dotnet-required:
        description: The integration job's own .NET change decision (true or false).
        value: ${{ jobs.deterministic-integrations.outputs.dotnet-required }}
      fresh-succeeded:
        description: >-
          "true" only when every step of the fresh integration job succeeded, for callers that
          verify evidence themselves (workflow_call outputs cannot expose a job's result).
        value: ${{ jobs.deterministic-integrations.outputs.succeeded }}
      fresh-artifact-id:
        value: ${{ jobs.deterministic-integrations.outputs.artifact-id }}
      fresh-artifact-name:
        value: ${{ jobs.deterministic-integrations.outputs.artifact-name }}
      fresh-receipt-sha256:
        value: ${{ jobs.deterministic-integrations.outputs.receipt-sha256 }}
      artifact-id:
        value: ${{ jobs.evidence-gate.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.evidence-gate.outputs.artifact-name }}
      receipt-sha256:
        value: ${{ jobs.evidence-gate.outputs.receipt-sha256 }}

# This workflow runs untrusted PR code with a read-only token and disposable service
# credentials. It does not accept production connections or inherit caller secrets.
permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  deterministic-integrations:
    # Any supplied reuse input selects verification; incomplete inputs must fail,
    # never silently fall back to tests or satisfy the gate with a skipped job.
    if: ${{ inputs.reuse-artifact-id == '' && inputs.reuse-artifact-name == '' && inputs.reuse-receipt-sha256 == '' && inputs.reuse-result == '' }}
    name: deterministic PostgreSQL integration and coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      dotnet-required: ${{ steps.changes.outputs.dotnet }}
      succeeded: ${{ steps.completed.outputs.succeeded }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.receipt.outputs.artifact-name }}
      receipt-sha256: ${{ steps.receipt.outputs.receipt-sha256 }}
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: meridian-certification
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        # Postgres is accepting connections ~3s after start, but a 10s probe interval
        # kept reporting it unready until the 4th poll, idling the runner for ~8s before
        # any step ran. Poll every 2s and keep the total tolerance window at 100s
        # (2s x 50) so a genuinely slow start still gets the same grace it had before.
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      MERIDIAN_DISABLE_DOCKER_TESTS: "false"
      MERIDIAN_LEDGER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_ASSET_OPERATIONS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_DIRECT_LENDING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_ACCOUNTS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_STRUCTURE_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_REPORTING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SCOPED_ACCESS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SECURITY_MASTER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification

    steps:
      # Meridian CI asks this job to classify the change itself rather than queue behind a
      # separate changes job. It uses the same detector as verify-dotnet, and integration-gate
      # fails if the two decisions differ. Every other caller always runs the suite.
      - name: Check out PR history for change detection
        if: inputs.skip-when-docs-only && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          path: .ci-change-detection

      - name: Detect .NET changes
        id: changes
        env:
          CLASSIFY: ${{ inputs.skip-when-docs-only && github.event_name == 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY" == "true" ]]; then
            (cd .ci-change-detection &&
              python3 build/scripts/ci/detect-dotnet-changes.py \
                --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
            rm -rf .ci-change-detection
          else
            # Main, merge queues, manual runs and release callers always run the suite.
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report docs-only skip
        if: steps.changes.outputs.dotnet != 'true'
        run: |
          echo "Docs-only PR: service-backed integrations intentionally skipped." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        id: dotnet
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Set up Python
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The restore below pulls the full Meridian.Tests dependency graph from nuget.org on
      # every run. Reuse the package cache across runs so a slow or rate-limited feed cannot
      # add minutes to the certification's critical path.
      - name: Cache NuGet packages
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/*.packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      # Each restore and test has an independent outcome. An earlier failure must not
      # hide the other projects; the job still fails if any command fails.
      - name: Restore Meridian integration project
        id: restore-meridian
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: dotnet restore tests/Meridian.Tests/Meridian.Tests.csproj

      - name: Restore Direct Lending integration project
        id: restore-direct-lending
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: dotnet restore tests/Meridian.DirectLending.Tests/Meridian.DirectLending.Tests.csproj

      - name: Restore Demo integration project
        id: restore-demo
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: dotnet restore tests/Meridian.Demo.Tests/Meridian.Demo.Tests.csproj

      # One xUnit class (AtomicTaxLotJournalStoreTests) runs serially for about a third of
      # this suite's test time. The suite therefore runs as the two complementary processes
      # declared in integration_evidence.MERIDIAN_PROCESSES: that class against its own
      # database, and every other test against the primary one. Build once so neither
      # process builds, and so both test exactly the same binaries.
      - name: Build Meridian integration project
        id: build-meridian
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: dotnet build tests/Meridian.Tests/Meridian.Tests.csproj -c Release --no-restore

      - name: Create the second integration database
        id: database-meridian
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=meridian-certification -u postgres "$POSTGRES_CONTAINER_ID" \
            createdb --username postgres meridian_tax_lot

      - name: Run Meridian service-backed integration tests
        id: test-meridian
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: >-
          python build/scripts/ci/run-meridian-integrations.py
          --results-dir artifacts/test-results/production-certification/meridian-integrations

      - name: Run Direct Lending service-backed integration tests
        id: test-direct-lending
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: |
          dotnet test tests/Meridian.DirectLending.Tests/Meridian.DirectLending.Tests.csproj \
            -c Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverlet.runsettings \
            --results-directory artifacts/test-results/production-certification/direct-lending-integrations \
            --logger "trx;LogFilePrefix=direct-lending-integrations" \
            --filter "Category=Integration"

      - name: Run Demo service-backed integration tests
        id: test-demo
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: |
          dotnet test tests/Meridian.Demo.Tests/Meridian.Demo.Tests.csproj \
            -c Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverlet.runsettings \
            --results-directory artifacts/test-results/production-certification/demo-integrations \
            --logger "trx;LogFilePrefix=demo-integrations" \
            --filter "Category=Integration&Category!=LiveProvider"

      - name: Reject missing, failed, skipped or empty deterministic test evidence
        if: always() && steps.changes.outputs.dotnet == 'true'
        run: >-
          python build/scripts/ci/validate-test-results.py
          --results-dir artifacts/test-results/production-certification
          --output artifacts/test-results/production-certification/skip-evidence.json
          --require-trx-prefix meridian-integrations
          --require-trx-prefix meridian-integrations-tax-lot-journal
          --require-trx-prefix meridian-integrations-remainder
          --require-trx-prefix direct-lending-integrations
          --require-trx-prefix demo-integrations

      # The runner image ships PostgreSQL 16 client tools and pg_dump refuses to dump the
      # newer postgres:17 service, so this job used to apt-install postgresql-client-17 from
      # apt.postgresql.org before anything else could run. That put a third-party host on the
      # critical path for ~17s per run, and when it stalled during run #28 the job burned its
      # whole budget and reported no cause. The service container already contains client
      # tools at exactly the server's major, so run them in there instead: no install, no
      # third-party fetch, and the major can never drift from the service image again.
      - name: Capture migrated database schema and ledger evidence
        if: always() && steps.changes.outputs.dotnet == 'true'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          evidence_dir=artifacts/test-results/production-certification
          mkdir -p "$evidence_dir"

          if [ -z "${POSTGRES_CONTAINER_ID:-}" ]; then
            echo "The postgres service container is gone; schema evidence cannot be captured." >&2
            exit 1
          fi

          # Connect over the container's local socket as the postgres OS user, with the
          # password supplied as well, so capture works whichever way the image's pg_hba.conf
          # authenticates local connections (trust today, peer or scram if that ever changes).
          pg_client() {
            docker exec -e PGPASSWORD=meridian-certification -u postgres "$POSTGRES_CONTAINER_ID" "$@"
          }

          # One set of evidence per database a test process used. The primary database
          # keeps its unprefixed file names.
          for database in meridian meridian_tax_lot; do
            prefix=""
            if [ "$database" != "meridian" ]; then prefix="${database}-"; fi
            pg_client pg_dump --username postgres --dbname "$database" \
              --schema-only --no-owner --no-privileges > "$evidence_dir/${prefix}database-schema.sql"
            pg_client psql --username postgres --dbname "$database" --csv \
              --command "SELECT table_schema, table_name FROM information_schema.tables WHERE table_type = 'BASE TABLE' AND table_schema NOT IN ('pg_catalog', 'information_schema') ORDER BY table_schema, table_name" \
              > "$evidence_dir/${prefix}database-table-inventory.csv"
            pg_client psql --username postgres --dbname "$database" --csv \
              --command "SELECT table_schema, table_name FROM information_schema.tables WHERE table_type = 'BASE TABLE' AND (table_name LIKE '%migration%' OR table_name LIKE '%schema%') ORDER BY table_schema, table_name" \
              > "$evidence_dir/${prefix}migration-ledger-inventory.csv"
          done

      - name: Bind successful integration evidence to this commit and run attempt
        id: receipt
        if: steps.changes.outputs.dotnet == 'true'
        env:
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: >-
          python build/scripts/ci/integration_evidence.py create
          --results-dir artifacts/test-results/production-certification
          --artifact-name "$EVIDENCE_ARTIFACT_NAME"

      - name: Upload deterministic integration evidence
        id: upload
        if: always() && steps.changes.outputs.dotnet == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/test-results/production-certification/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # No status function means GitHub's implicit success(): this runs, and the output is set,
      # only when every earlier step succeeded (including a docs-only run whose steps skipped).
      - name: Record successful completion
        id: completed
        run: echo "succeeded=true" >> "$GITHUB_OUTPUT"

  reuse-integrations:
    name: verify coordinated integration evidence
    if: ${{ inputs.reuse-artifact-id != '' || inputs.reuse-artifact-name != '' || inputs.reuse-receipt-sha256 != '' || inputs.reuse-result != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.receipt.outputs.artifact-name }}
      receipt-sha256: ${{ steps.receipt.outputs.receipt-sha256 }}
    steps:
      - name: Check out exact validation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require complete successful producer identity
        env:
          SOURCE_ARTIFACT_ID: ${{ inputs.reuse-artifact-id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.reuse-artifact-name }}
          SOURCE_RECEIPT_SHA256: ${{ inputs.reuse-receipt-sha256 }}
          SOURCE_RESULT: ${{ inputs.reuse-result }}
        run: |
          python - <<'PY'
          import os, re
          valid = (
              os.environ["SOURCE_RESULT"] == "success"
              and re.fullmatch(r"[1-9][0-9]*", os.environ["SOURCE_ARTIFACT_ID"])
              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,199}", os.environ["SOURCE_ARTIFACT_NAME"])
              and re.fullmatch(r"[0-9a-f]{64}", os.environ["SOURCE_RECEIPT_SHA256"])
          )
          if not valid:
              raise SystemExit("A successful producer and complete immutable artifact identity are required")
          PY
      - name: Download immutable evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.reuse-artifact-id }}
          path: artifacts/test-results/production-certification
          merge-multiple: true
      - name: Revalidate raw tests, coverage, schema and exact producer receipt
        id: receipt
        env:
          SOURCE_ARTIFACT_ID: ${{ inputs.reuse-artifact-id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.reuse-artifact-name }}
          SOURCE_RECEIPT_SHA256: ${{ inputs.reuse-receipt-sha256 }}
          SOURCE_RESULT: ${{ inputs.reuse-result }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: >-
          python build/scripts/ci/integration_evidence.py reuse
          --results-dir artifacts/test-results/production-certification
          --artifact-name "$EVIDENCE_ARTIFACT_NAME"
      - name: Retain verified certification evidence
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/test-results/production-certification/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  evidence-gate:
    name: require verified integration evidence
    needs: [deterministic-integrations, reuse-integrations]
    # A caller that opted into caller-verifies-evidence applies these same checks in its own
    # gate job (Meridian CI integration-gate). Reuse runs always keep this gate.
    if: >-
      always() && (!inputs.caller-verifies-evidence || inputs.reuse-artifact-id != ''
      || inputs.reuse-artifact-name != '' || inputs.reuse-receipt-sha256 != '' || inputs.reuse-result != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.result.outputs.artifact-id }}
      artifact-name: ${{ steps.result.outputs.artifact-name }}
      receipt-sha256: ${{ steps.result.outputs.receipt-sha256 }}
    steps:
      - name: Require exactly one successful evidence path
        id: result
        env:
          FRESH_RESULT: ${{ needs.deterministic-integrations.result }}
          REUSE_RESULT: ${{ needs.reuse-integrations.result }}
          FRESH_OUTPUTS: ${{ toJSON(needs.deterministic-integrations.outputs) }}
          REUSE_OUTPUTS: ${{ toJSON(needs.reuse-integrations.outputs) }}
          SKIP_WHEN_DOCS_ONLY: ${{ inputs.skip-when-docs-only }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          results = (os.environ["FRESH_RESULT"], os.environ["REUSE_RESULT"])
          if results not in (("success", "skipped"), ("skipped", "success")):
              raise SystemExit("Integration evidence is missing, failed, cancelled, or ambiguous: " + repr(results))
          outputs = json.loads(os.environ["FRESH_OUTPUTS" if results[0] == "success" else "REUSE_OUTPUTS"])
          # Only a caller that opted into classification can produce dotnet-required=false,
          # and only for a pull request that changes no .NET input. That run has no evidence
          # to bind; integration-gate checks the decision against verify-dotnet's.
          if (os.environ.get("SKIP_WHEN_DOCS_ONLY", "false") == "true" and results[0] == "success"
                  and outputs.get("dotnet-required") == "false"):
              print("Docs-only pull request: no integration evidence is required.")
              raise SystemExit(0)
          patterns = {"artifact-id": r"[1-9][0-9]*", "artifact-name": r"[A-Za-z0-9][A-Za-z0-9_.-]{0,199}", "receipt-sha256": r"[0-9a-f]{64}"}
          if any(not re.fullmatch(pattern, outputs.get(key, "")) for key, pattern in patterns.items()):
              raise SystemExit("Successful integration job did not produce complete evidence outputs")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              for key in patterns:
                  stream.write(f"{key}={outputs[key]}\n")
          PY
