name: Service-backed Integrations

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Evidence artifact prefix supplied by the calling workflow.
        type: string
        default: service-backed-integrations
      retention-days:
        description: Days to retain the test, coverage and schema evidence.
        type: number
        default: 14
      reuse-artifact-id:
        description: Immutable evidence artifact ID from a successful caller dependency in this run.
        type: string
        default: ""
      reuse-artifact-name:
        type: string
        default: ""
      reuse-receipt-sha256:
        type: string
        default: ""
      reuse-result:
        description: Result of the dependency that produced the evidence.
        type: string
        default: ""
      skip-when-docs-only:
        description: >-
          Classify pull request changes in the integration job and skip its steps for a
          documentation-only change. Callers without this input always run the suite.
        type: boolean
        default: false
    outputs:
      dotnet-required:
        description: The integration job's own .NET change decision (true or false).
        value: ${{ jobs.deterministic-integrations.outputs.dotnet-required }}
      artifact-id:
        value: ${{ jobs.evidence-gate.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.evidence-gate.outputs.artifact-name }}
      receipt-sha256:
        value: ${{ jobs.evidence-gate.outputs.receipt-sha256 }}

# This workflow runs untrusted PR code with a read-only token and disposable service
# credentials. It does not accept production connections or inherit caller secrets.
permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  deterministic-integrations:
    # Any supplied reuse input selects verification; incomplete inputs must fail,
    # never silently fall back to tests or satisfy the gate with a skipped job.
    if: ${{ inputs.reuse-artifact-id == '' && inputs.reuse-artifact-name == '' && inputs.reuse-receipt-sha256 == '' && inputs.reuse-result == '' }}
    name: deterministic PostgreSQL integration and coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      dotnet-required: ${{ steps.changes.outputs.dotnet }}
      artifact-id: ${{ steps.integrations.outputs.artifact-id }}
      artifact-name: ${{ steps.integrations.outputs.artifact-name }}
      receipt-sha256: ${{ steps.integrations.outputs.receipt-sha256 }}
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: meridian-certification
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        # Postgres is accepting connections ~3s after start, but a 10s probe interval
        # kept reporting it unready until the 4th poll, idling the runner for ~8s before
        # any step ran. Poll every 2s and keep the total tolerance window at 100s
        # (2s x 50) so a genuinely slow start still gets the same grace it had before.
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      MERIDIAN_DISABLE_DOCKER_TESTS: "false"
      MERIDIAN_LEDGER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_ASSET_OPERATIONS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_DIRECT_LENDING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_ACCOUNTS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_STRUCTURE_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_REPORTING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SCOPED_ACCESS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SECURITY_MASTER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification

    steps:
      # A caller may ask this job to classify the change itself; it uses the same detector as
      # Meridian CI's verify-dotnet. Every current caller (Production Certification) always runs
      # the suite.
      - name: Check out PR history for change detection
        if: inputs.skip-when-docs-only && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          path: .ci-change-detection

      - name: Detect .NET changes
        id: changes
        env:
          CLASSIFY: ${{ inputs.skip-when-docs-only && github.event_name == 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY" == "true" ]]; then
            (cd .ci-change-detection &&
              python3 build/scripts/ci/detect-dotnet-changes.py \
                --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
            rm -rf .ci-change-detection
          else
            # Main, merge queues, manual runs and release callers always run the suite.
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report docs-only skip
        if: steps.changes.outputs.dotnet != 'true'
        run: |
          echo "Docs-only PR: service-backed integrations intentionally skipped." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # The suites, TRX validation, schema capture, receipt and upload live in one composite
      # action so Meridian CI's integration-gate job runs exactly the same commands.
      - name: Run service-backed integration tests and bind their evidence
        id: integrations
        if: steps.changes.outputs.dotnet == 'true'
        uses: ./.github/actions/service-backed-integrations
        with:
          artifact-name: ${{ inputs.artifact-name }}
          retention-days: ${{ inputs.retention-days }}
          postgres-container-id: ${{ job.services.postgres.id }}

  reuse-integrations:
    name: verify coordinated integration evidence
    if: ${{ inputs.reuse-artifact-id != '' || inputs.reuse-artifact-name != '' || inputs.reuse-receipt-sha256 != '' || inputs.reuse-result != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.receipt.outputs.artifact-name }}
      receipt-sha256: ${{ steps.receipt.outputs.receipt-sha256 }}
    steps:
      - name: Check out exact validation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require complete successful producer identity
        env:
          SOURCE_ARTIFACT_ID: ${{ inputs.reuse-artifact-id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.reuse-artifact-name }}
          SOURCE_RECEIPT_SHA256: ${{ inputs.reuse-receipt-sha256 }}
          SOURCE_RESULT: ${{ inputs.reuse-result }}
        run: |
          python - <<'PY'
          import os, re
          valid = (
              os.environ["SOURCE_RESULT"] == "success"
              and re.fullmatch(r"[1-9][0-9]*", os.environ["SOURCE_ARTIFACT_ID"])
              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,199}", os.environ["SOURCE_ARTIFACT_NAME"])
              and re.fullmatch(r"[0-9a-f]{64}", os.environ["SOURCE_RECEIPT_SHA256"])
          )
          if not valid:
              raise SystemExit("A successful producer and complete immutable artifact identity are required")
          PY
      - name: Download immutable evidence from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.reuse-artifact-id }}
          path: artifacts/test-results/production-certification
          merge-multiple: true
      - name: Revalidate raw tests, coverage, schema and exact producer receipt
        id: receipt
        env:
          SOURCE_ARTIFACT_ID: ${{ inputs.reuse-artifact-id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.reuse-artifact-name }}
          SOURCE_RECEIPT_SHA256: ${{ inputs.reuse-receipt-sha256 }}
          SOURCE_RESULT: ${{ inputs.reuse-result }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: >-
          python build/scripts/ci/integration_evidence.py reuse
          --results-dir artifacts/test-results/production-certification
          --artifact-name "$EVIDENCE_ARTIFACT_NAME"
      - name: Retain verified certification evidence
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/test-results/production-certification/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  evidence-gate:
    name: require verified integration evidence
    needs: [deterministic-integrations, reuse-integrations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.result.outputs.artifact-id }}
      artifact-name: ${{ steps.result.outputs.artifact-name }}
      receipt-sha256: ${{ steps.result.outputs.receipt-sha256 }}
    steps:
      - name: Require exactly one successful evidence path
        id: result
        env:
          FRESH_RESULT: ${{ needs.deterministic-integrations.result }}
          REUSE_RESULT: ${{ needs.reuse-integrations.result }}
          FRESH_OUTPUTS: ${{ toJSON(needs.deterministic-integrations.outputs) }}
          REUSE_OUTPUTS: ${{ toJSON(needs.reuse-integrations.outputs) }}
          SKIP_WHEN_DOCS_ONLY: ${{ inputs.skip-when-docs-only }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          results = (os.environ["FRESH_RESULT"], os.environ["REUSE_RESULT"])
          if results not in (("success", "skipped"), ("skipped", "success")):
              raise SystemExit("Integration evidence is missing, failed, cancelled, or ambiguous: " + repr(results))
          outputs = json.loads(os.environ["FRESH_OUTPUTS" if results[0] == "success" else "REUSE_OUTPUTS"])
          # Only a caller that opted into classification can produce dotnet-required=false,
          # and only for a pull request that changes no .NET input. That run has no evidence
          # to bind; integration-gate checks the decision against verify-dotnet's.
          if (os.environ.get("SKIP_WHEN_DOCS_ONLY", "false") == "true" and results[0] == "success"
                  and outputs.get("dotnet-required") == "false"):
              print("Docs-only pull request: no integration evidence is required.")
              raise SystemExit(0)
          patterns = {"artifact-id": r"[1-9][0-9]*", "artifact-name": r"[A-Za-z0-9][A-Za-z0-9_.-]{0,199}", "receipt-sha256": r"[0-9a-f]{64}"}
          if any(not re.fullmatch(pattern, outputs.get(key, "")) for key, pattern in patterns.items()):
              raise SystemExit("Successful integration job did not produce complete evidence outputs")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              for key in patterns:
                  stream.write(f"{key}={outputs[key]}\n")
          PY
