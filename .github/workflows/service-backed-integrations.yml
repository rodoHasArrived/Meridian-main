name: Service-backed Integrations

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Evidence artifact prefix supplied by the calling workflow.
        type: string
        default: service-backed-integrations
      retention-days:
        description: Days to retain the test, coverage and schema evidence.
        type: number
        default: 14

# This workflow runs untrusted PR code with a read-only token and disposable service
# credentials. It does not accept production connections or inherit caller secrets.
permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  deterministic-integrations:
    name: deterministic PostgreSQL integration and coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: meridian-certification
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        # Postgres is accepting connections ~3s after start, but a 10s probe interval
        # kept reporting it unready until the 4th poll, idling the runner for ~8s before
        # any step ran. Poll every 2s and keep the total tolerance window at 100s
        # (2s x 50) so a genuinely slow start still gets the same grace it had before.
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      MERIDIAN_DISABLE_DOCKER_TESTS: "false"
      MERIDIAN_LEDGER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_ASSET_OPERATIONS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_DIRECT_LENDING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_ACCOUNTS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_FUND_STRUCTURE_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_REPORTING_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SCOPED_ACCESS_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification
      MERIDIAN_SECURITY_MASTER_CONNECTION_STRING: Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-certification

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        id: dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The restore below pulls the full Meridian.Tests dependency graph from nuget.org on
      # every run. Reuse the package cache across runs so a slow or rate-limited feed cannot
      # add minutes to the certification's critical path.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      # Each restore and test has an independent outcome. An earlier failure must not
      # hide the other project; the job still fails if any command fails.
      - name: Restore Meridian integration project
        id: restore-meridian
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: dotnet restore tests/Meridian.Tests/Meridian.Tests.csproj

      - name: Restore Direct Lending integration project
        id: restore-direct-lending
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: dotnet restore tests/Meridian.DirectLending.Tests/Meridian.DirectLending.Tests.csproj

      - name: Run Meridian service-backed integration tests
        id: test-meridian
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: |
          dotnet test tests/Meridian.Tests/Meridian.Tests.csproj \
            -c Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverlet.runsettings \
            --results-directory artifacts/test-results/production-certification \
            --logger "trx;LogFilePrefix=meridian-integrations" \
            --filter "Category=Integration&Category!=LiveProvider"

      - name: Run Direct Lending service-backed integration tests
        id: test-direct-lending
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: |
          dotnet test tests/Meridian.DirectLending.Tests/Meridian.DirectLending.Tests.csproj \
            -c Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverlet.runsettings \
            --results-directory artifacts/test-results/production-certification \
            --logger "trx;LogFilePrefix=direct-lending-integrations" \
            --filter "Category=Integration"

      - name: Reject missing, failed, skipped or empty deterministic test evidence
        if: always()
        run: >-
          python build/scripts/ci/validate-test-results.py
          --results-dir artifacts/test-results/production-certification
          --output artifacts/test-results/production-certification/skip-evidence.json
          --require-trx-prefix meridian-integrations
          --require-trx-prefix direct-lending-integrations

      # The runner image ships PostgreSQL 16 client tools and pg_dump refuses to dump the
      # newer postgres:17 service, so this job used to apt-install postgresql-client-17 from
      # apt.postgresql.org before anything else could run. That put a third-party host on the
      # critical path for ~17s per run, and when it stalled during run #28 the job burned its
      # whole budget and reported no cause. The service container already contains client
      # tools at exactly the server's major, so run them in there instead: no install, no
      # third-party fetch, and the major can never drift from the service image again.
      - name: Capture migrated database schema and ledger evidence
        if: always()
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          evidence_dir=artifacts/test-results/production-certification
          mkdir -p "$evidence_dir"

          if [ -z "${POSTGRES_CONTAINER_ID:-}" ]; then
            echo "The postgres service container is gone; schema evidence cannot be captured." >&2
            exit 1
          fi

          # Connect over the container's local socket as the postgres OS user, with the
          # password supplied as well, so capture works whichever way the image's pg_hba.conf
          # authenticates local connections (trust today, peer or scram if that ever changes).
          pg_client() {
            docker exec -e PGPASSWORD=meridian-certification -u postgres "$POSTGRES_CONTAINER_ID" "$@"
          }

          pg_client pg_dump --username postgres --dbname meridian \
            --schema-only --no-owner --no-privileges > "$evidence_dir/database-schema.sql"
          pg_client psql --username postgres --dbname meridian --csv \
            --command "SELECT table_schema, table_name FROM information_schema.tables WHERE table_type = 'BASE TABLE' AND table_schema NOT IN ('pg_catalog', 'information_schema') ORDER BY table_schema, table_name" \
            > "$evidence_dir/database-table-inventory.csv"
          pg_client psql --username postgres --dbname meridian --csv \
            --command "SELECT table_schema, table_name FROM information_schema.tables WHERE table_type = 'BASE TABLE' AND (table_name LIKE '%migration%' OR table_name LIKE '%schema%') ORDER BY table_schema, table_name" \
            > "$evidence_dir/migration-ledger-inventory.csv"

      - name: Upload deterministic integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/test-results/production-certification/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
