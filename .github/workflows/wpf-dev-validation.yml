name: WPF Dev Loop Validation

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build without running tests.
        required: false
        type: boolean
        default: false
      filter:
        description: >
          dotnet test --filter expression override.
          Leave blank to use the script's own default (FullyQualifiedName~DesktopWorkflowScriptTests).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: wpf-dev-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  wpf-dev-loop:
    name: WPF Dev Loop (DesktopWorkflowScriptTests)
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run WPF dev loop validation
        shell: pwsh
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
          TEST_FILTER: ${{ inputs.filter }}
        run: |
          $sliceArgs = @('--slice', 'dev-loop', '--results-dir', 'artifacts/wpf-validation/dev-loop')
          if ($env:BUILD_ONLY -eq 'true') { $sliceArgs += '--build-only' }
          if ($env:TEST_FILTER) { $sliceArgs += @('--filter', $env:TEST_FILTER) }
          python build/scripts/ci/run-windows-ci-tests.py @sliceArgs

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpf-dev-validation-${{ github.run_number }}
          path: artifacts/wpf-validation/dev-loop/
          if-no-files-found: ignore
          retention-days: 14
