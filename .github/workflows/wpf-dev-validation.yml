name: WPF Dev Loop Validation

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build without running tests.
        required: false
        type: boolean
        default: false
      filter:
        description: >
          dotnet test --filter expression override.
          Leave blank to use the script's own default (FullyQualifiedName~DesktopWorkflowScriptTests).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: wpf-dev-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  wpf-dev-loop:
    name: WPF Dev Loop (DesktopWorkflowScriptTests)
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK and NuGet cache
        id: nuget
        uses: ./.github/actions/setup-dotnet-nuget

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run WPF dev loop validation
        shell: pwsh
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.nuget.outputs.cache-hit || 'false' }}
          BUILD_ONLY: ${{ inputs.build_only }}
          TEST_FILTER: ${{ inputs.filter }}
        run: |
          $sliceArgs = @('--slice', 'dev-loop', '--results-dir', 'artifacts/wpf-validation/dev-loop')
          if ($env:BUILD_ONLY -eq 'true') { $sliceArgs += '--build-only' }
          if ($env:TEST_FILTER) { $sliceArgs += @('--filter', $env:TEST_FILTER) }
          python build/scripts/ci/run-windows-ci-tests.py @sliceArgs

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpf-dev-validation-${{ github.run_number }}
          path: artifacts/wpf-validation/dev-loop/
          if-no-files-found: ignore
          retention-days: 14
