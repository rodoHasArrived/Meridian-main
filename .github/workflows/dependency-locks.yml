name: Dependency Lock Candidates

on:
  pull_request:
    paths:
      - "**/*.props"
      - "**/*.targets"
      - "**/*.csproj"
      - "**/*.fsproj"
      - "**/*.sln"
      - "**/*.slnf"
      - "**/*.slnx"
      - "**/NuGet.Config"
      - "**/NuGet.config"
      - "**/nuget.config"
      - "**/packages.config"
      - "global.json"
      - "build/nuget-locks/**"
      - "build/scripts/ci/dependency-locks.py"
      - ".github/workflows/dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-locks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: NuGet lock candidate (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux-portable
          - os: windows-latest
            profile: windows-portable
          - os: windows-latest
            profile: win-x64
          - os: windows-latest
            profile: win-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Generate and verify an isolated native restore profile
        shell: bash
        env:
          LOCK_PROFILE: ${{ matrix.profile }}
        run: python build/scripts/ci/dependency-locks.py generate --profile "$LOCK_PROFILE" --output "artifacts/dependency-locks/$LOCK_PROFILE"
      - name: Retain candidate manifests and restore logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-locks-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dependency-locks/
          if-no-files-found: error
          retention-days: 30
