name: Generated Repair
# Target events request a fresh default-branch dispatch. Only dispatch metadata
# bound to its server-owned execution revision can authorize candidate publication.
run-name: "generated-repair-v2 pr=${{ github.event.pull_request.number || inputs.pr_number }} head=${{ github.event.pull_request.head.sha || inputs.head_sha }} base=${{ github.event.pull_request.base.sha || inputs.base_sha }} attempt=${{ inputs.attempt || '0' }} root=${{ inputs.root_sha || github.event.pull_request.head.sha || inputs.head_sha }} workflow_sha=${{ github.workflow_sha }} ref=${{ github.ref }}"

on:
  # Unlike pull_request, this starts even when generated files conflict. This
  # workflow never receives write permissions, environment secrets, or an App key.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request number"
        required: true
      head_sha:
        description: "Exact current pull request head SHA"
        required: true
      base_sha:
        description: "Exact current default branch SHA"
        required: true
      attempt:
        description: "Bounded retry attempt (0, 1, or 2)"
        default: "0"
        required: true
      root_sha:
        description: "Original request head SHA (defaults to head_sha)"
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: generated-repair-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Prepare generated repair patch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install trusted orchestration dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Pin request and fetch revisions
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # A public repository variable is only an optimization hint. Without
          # it, target runs still produce a downloadable artifact-only repair.
          TRUSTED_DISPATCH_CONFIGURED: ${{ vars.GENERATED_REPAIR_APP_ID != '' }}
        run: >-
          python -I build/scripts/ci/generated_repair.py prepare
          --run-id "$RUN_ID" --default-branch "$DEFAULT_BRANCH"
          --result "$RUNNER_TEMP/generated-repair-request.json"
      - name: Build trusted generation container
        if: steps.request.outputs.status == 'generate'
        # No checkout content enters the build context; the Dockerfile is from
        # the default branch. The image contains only OS, Git, Python, and Node.
        run: docker build --tag meridian-generated-repair - < build/scripts/ci/generated-repair.Dockerfile
      - name: Merge and regenerate in an isolated container
        if: steps.request.outputs.status == 'generate'
        env:
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
        # The container sees a fresh clone and an output directory only: no host
        # Actions runtime/cache tokens, App credentials, runner actions, or socket.
        # The trusted host validates regular exported files before upload.
        run: >-
          python -I build/scripts/ci/generated_repair_sandbox.py
          --head "$HEAD_SHA" --base "$BASE_SHA"
          --output-dir "$RUNNER_TEMP/generated-repair"
      - name: Upload attempt-bound repair candidate
        if: always() && steps.request.outputs.status == 'generate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/generated-repair/repair.patch
            ${{ runner.temp }}/generated-repair/generated.patch
            ${{ runner.temp }}/generated-repair/report.json
            ${{ runner.temp }}/generated-repair/generation-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload generation diagnostics
        if: always() && steps.request.outputs.status == 'generate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-repair-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/generated-repair/*.log
            ${{ runner.temp }}/generated-repair/logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain generation request outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-repair-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-repair-request.json
          if-no-files-found: warn
          retention-days: 7
