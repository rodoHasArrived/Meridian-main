name: Documentation Automation

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Force a full documentation and diagram refresh"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # Manual refresh only. Meridian CI verify-docs owns automatic documentation
  # validation, generation, dashboard regression checks and freshness.
  validate-docs:
    needs: regenerate-docs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful documentation validation and generation
        env:
          DOCS_RESULT: ${{ needs.regenerate-docs.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Documentation validation and generation: ${DOCS_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DOCS_RESULT" != "success" ]]; then
            echo "Documentation validation/generation did not pass: ${DOCS_RESULT}" >&2
            exit 1
          fi

  regenerate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/scripts/docs/requirements.txt

      # validate-agent-definitions.py parses agent frontmatter with PyYAML rather than a
      # hand-rolled subset parser, so this lane needs the dependency installed.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      # These checks are not in the maintained-generation core profile. Keep
      # their original commands here before generation. Examples, AI inventory,
      # strict handoff and contract drift are already required by that profile.
      - name: Run docs rules engine
        run: python3 build/scripts/docs/rules-engine.py --rules build/rules/doc-rules.yaml --summary

      - name: Check Codex memory
        run: |
          python build/scripts/docs/check-codex-memory.py --summary
          python build/scripts/docs/check-codex-memory.py --task .codex/memory/tasks/example.yml --receipt --summary
          python build/scripts/docs/check-codex-memory.py --goal .codex/memory/goals/example.yml --receipt --summary
          python -m unittest build.scripts.docs.tests.test_check_codex_memory

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install diagram dependencies
        run: npm ci --no-fund --no-audit

      # One catalog owns required producers and advisory UML rendering for this
      # workflow, scripts/ci.sh, and isolated repair. Its bounded passes account for
      # generated markdown consumed by health/structure reports.
      - name: Converge maintained documentation
        run: python3 build/scripts/run-maintained-generation.py --docs-only --report artifacts/docs/generation.json

      - name: Compare dashboard readiness deltas vs previous commit
        run: python3 build/scripts/ci/check-doc-health-delta.py

      - name: Check generated docs are current
        run: python3 build/scripts/ci/check-generated-output.py

      - name: Check whitespace
        run: git diff --check

      - name: Upload documentation repair evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docs/
            artifacts/maintained-generation/
          if-no-files-found: ignore
          retention-days: 7
