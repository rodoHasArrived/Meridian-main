name: Documentation Automation

on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "Force a full documentation and diagram refresh"
        required: false
        default: "false"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/scripts/docs/requirements.txt

      # validate-agent-definitions.py parses agent frontmatter with PyYAML rather than a
      # hand-rolled subset parser, so this lane needs the dependency installed.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Run docs rules engine
        run: python3 build/scripts/docs/rules-engine.py --rules build/rules/doc-rules.yaml --summary

      - name: Validate examples
        run: python3 build/scripts/docs/validate-examples.py --summary

      - name: Check AI inventory
        run: python3 build/scripts/docs/check-ai-inventory.py --summary

      - name: Check Codex memory
        run: |
          python build/scripts/docs/check-codex-memory.py --summary
          python build/scripts/docs/check-codex-memory.py --task .codex/memory/tasks/example.yml --receipt --summary
          python build/scripts/docs/check-codex-memory.py --goal .codex/memory/goals/example.yml --receipt --summary
          python -m unittest build.scripts.docs.tests.test_check_codex_memory

      - name: Check AI handoff
        run: python3 build/scripts/docs/check-ai-handoff.py

      - name: Check AI contract drift
        run: >
          python3 build/scripts/docs/check-ai-contract-drift.py
          --canonical docs/ai/contract-policy.json
          --mirror docs/ai/copilot/contract-policy.mirror.json
          --mirror docs/ai/claude/contract-policy.mirror.json
          --routing-rules docs/ai/codex/prompt-route-rules.json
          --routing-host-doc docs/ai/codex/README.md
          --routing-host-doc docs/ai/assistant-workflow-contract.md

  regenerate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/scripts/docs/requirements.txt

      # validate-agent-definitions.py parses agent frontmatter with PyYAML rather than a
      # hand-rolled subset parser, so this lane needs the dependency installed.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install diagram dependencies
        run: npm ci --no-fund --no-audit

      # One catalog owns required producers and advisory UML rendering for this
      # workflow, scripts/ci.sh, and isolated repair. Its bounded passes account for
      # generated markdown consumed by health/structure reports.
      - name: Converge maintained documentation
        run: python3 build/scripts/run-maintained-generation.py --docs-only --report artifacts/docs/generation.json

      - name: Compare dashboard readiness deltas vs previous commit
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          current_path = Path("docs/status/doc-health-dashboard.json")
          current = json.loads(current_path.read_text(encoding="utf-8")) if current_path.exists() else {}

          previous = ""
          try:
              previous = subprocess.run(
                  ["git", "show", "HEAD~1:docs/status/doc-health-dashboard.json"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          except subprocess.CalledProcessError:
              previous = ""

          baseline_available = bool(previous.strip())
          missing_previous = []
          previous_dashboard = {}

          if baseline_available:
              previous_dashboard = json.loads(previous)
          else:
              missing_previous.append("docs/status/doc-health-dashboard.json")

          def extract_score(payload):
              if isinstance(payload.get("healthScore"), (int, float)):
                  return float(payload["healthScore"])
              summary = payload.get("summary")
              if isinstance(summary, dict) and isinstance(summary.get("healthScore"), (int, float)):
                  return float(summary["healthScore"])
              return 0.0

          current_score = extract_score(current)
          previous_score = extract_score(previous_dashboard) if baseline_available else current_score
          delta = current_score - previous_score
          severe = baseline_available and (delta < -10.0)

          payload = {
              'baseline_available': baseline_available,
              'current_score': current_score,
              'previous_score': previous_score,
              'delta': delta,
              'missing_previous_files': missing_previous,
              'severe': severe,
          }

          artifact_dir = Path("artifacts/docs")
          artifact_dir.mkdir(parents=True, exist_ok=True)
          (artifact_dir / "dashboard-delta.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")

          if severe:
              raise SystemExit(
                  f"Severe dashboard readiness regression detected ({previous_score:.1f} -> {current_score:.1f})."
              )

          if not baseline_available:
              print("Baseline dashboard source was unavailable; severe regression gating was skipped")

          print(json.dumps(payload, indent=2))

      - name: Check generated docs are current
        run: python3 build/scripts/ci/check-generated-output.py

      - name: Check whitespace
        run: git diff --check

      - name: Upload documentation repair evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docs/
            artifacts/maintained-generation/
          if-no-files-found: ignore
          retention-days: 7
