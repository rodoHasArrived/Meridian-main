name: CodeQL

on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "34 9 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_VERSION: '10.0.x'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore runs before init: it produces no compiler invocations for CodeQL to
      # observe, so keeping it outside the traced window avoids tracing overhead.
      # Deliberately uncached: measured cold at 9s (run #7092), while caching
      # ~/.nuget/packages cost 21s to restore plus 24s to save (run #7091).
      - name: Restore C# solution
        if: matrix.language == 'csharp'
        run: dotnet restore Meridian.WebWorkstation.slnf /p:EnableWindowsTargeting=true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      # RunAnalyzers=false skips Roslyn diagnostic analyzers, which this job never
      # consumes; source generators still run, so CodeQL extracts the same
      # compilations. The build-warning gate stays in Meridian CI (ci.yml).
      - name: Build C# solution
        if: matrix.language == 'csharp'
        run: dotnet build Meridian.WebWorkstation.slnf -c Release --no-restore /p:EnableWindowsTargeting=true /p:UseAppHost=false /p:RunAnalyzers=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
          output: artifacts/codeql/${{ matrix.language }}

      - name: Retain CodeQL reports for release audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codeql/${{ matrix.language }}/*.sarif
          if-no-files-found: error
          retention-days: 90
