name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "34 9 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      # Shares the cache key used by Meridian CI, so CodeQL runs usually restore
      # from a cache that the CI lane has already warmed.
      - name: Cache NuGet packages
        if: matrix.language == 'csharp'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore runs before init: it produces no compiler invocations for CodeQL to
      # observe, so keeping it outside the traced window avoids tracing overhead.
      - name: Restore C# solution
        if: matrix.language == 'csharp'
        run: dotnet restore Meridian.WebWorkstation.slnf /p:EnableWindowsTargeting=true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      # RunAnalyzers=false skips Roslyn diagnostic analyzers, which this job never
      # consumes; source generators still run, so CodeQL extracts the same
      # compilations. The build-warning gate stays in Meridian CI (ci.yml).
      - name: Build C# solution
        if: matrix.language == 'csharp'
        run: dotnet build Meridian.WebWorkstation.slnf -c Release --no-restore /p:EnableWindowsTargeting=true /p:UseAppHost=false /p:RunAnalyzers=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
