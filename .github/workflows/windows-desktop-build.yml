name: Windows Desktop Build

on:
  pull_request:
    paths:
      - "src/Meridian.Wpf/**"
      - "tests/Meridian.Wpf.Tests/**"
      - "src/Meridian.Application/**"
      - "src/Meridian.Audit/**"
      - "src/Meridian.Backtesting/**"
      - "src/Meridian.Backtesting.Sdk/**"
      - "src/Meridian.Ui.Shared/**"
      - "src/Meridian.Ui.Services/**"
      - "src/Meridian.Contracts/**"
      - "src/Meridian.Core/**"
      - "src/Meridian.DataIntegration/**"
      - "src/Meridian.Entities/**"
      - "src/Meridian.Execution/**"
      - "src/Meridian.FSharp/**"
      - "src/Meridian.FSharp.Ledger/**"
      - "src/Meridian.FinancialOperations/**"
      - "src/Meridian.Identity/**"
      - "src/Meridian.Infrastructure/**"
      - "src/Meridian.Instruments/**"
      - "src/Meridian.Platform/**"
      - "src/Meridian.PortfolioRecords/**"
      - "src/Meridian.QuantScript/**"
      - "src/Meridian.ReferenceData/**"
      - "src/Meridian.Reporting/**"
      - "src/Meridian.Storage/**"
      - "src/Meridian.Strategies/**"
      - "src/Meridian.Workflow/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "scripts/dev/validate-wpf-dev.ps1"
      - "scripts/dev/SharedBuild.ps1"
      - ".github/workflows/windows-desktop-build.yml"
  push:
    branches:
      - main
    paths:
      - "src/Meridian.Wpf/**"
      - "tests/Meridian.Wpf.Tests/**"
      - "src/Meridian.Application/**"
      - "src/Meridian.Audit/**"
      - "src/Meridian.Backtesting/**"
      - "src/Meridian.Backtesting.Sdk/**"
      - "src/Meridian.Ui.Shared/**"
      - "src/Meridian.Ui.Services/**"
      - "src/Meridian.Contracts/**"
      - "src/Meridian.Core/**"
      - "src/Meridian.DataIntegration/**"
      - "src/Meridian.Entities/**"
      - "src/Meridian.Execution/**"
      - "src/Meridian.FSharp/**"
      - "src/Meridian.FSharp.Ledger/**"
      - "src/Meridian.FinancialOperations/**"
      - "src/Meridian.Identity/**"
      - "src/Meridian.Infrastructure/**"
      - "src/Meridian.Instruments/**"
      - "src/Meridian.Platform/**"
      - "src/Meridian.PortfolioRecords/**"
      - "src/Meridian.QuantScript/**"
      - "src/Meridian.ReferenceData/**"
      - "src/Meridian.Reporting/**"
      - "src/Meridian.Storage/**"
      - "src/Meridian.Strategies/**"
      - "src/Meridian.Workflow/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "scripts/dev/validate-wpf-dev.ps1"
      - "scripts/dev/SharedBuild.ps1"
      - ".github/workflows/windows-desktop-build.yml"
  workflow_dispatch:
    inputs:
      run_smoke_publish:
        description: Run desktop smoke publish after WPF validation.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  desktop:
    name: verify-desktop (build/test WPF)
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-wpf-
            ${{ runner.os }}-nuget-

      - name: Run isolated WPF validation
        shell: pwsh
        run: |
          pwsh ./scripts/dev/validate-wpf-dev.ps1 `
            -Restore `
            -Filter "Category!=Integration&FullyQualifiedName!~Integration" `
            -OutputRoot "artifacts/wpf-validation/windows-desktop-build"

      - name: Decide desktop smoke publish
        id: desktop-smoke
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MANUAL_SMOKE: ${{ inputs.run_smoke_publish }}
        run: |
          $runSmoke = $false
          if ($env:EVENT_NAME -eq 'push') {
            $runSmoke = $true
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:MANUAL_SMOKE -eq 'true') {
            $runSmoke = $true
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            $hasMergeParents = $false
            git rev-parse --verify "HEAD^1" *> $null
            if ($LASTEXITCODE -eq 0) {
              git rev-parse --verify "HEAD^2" *> $null
              $hasMergeParents = $LASTEXITCODE -eq 0
            }

            if ($hasMergeParents) {
              $changed = @(git diff --name-only "HEAD^1" "HEAD^2")
            } else {
              git fetch origin $env:BASE_REF --depth=100
              $changed = @(git diff --name-only "origin/$env:BASE_REF...HEAD")
            }
            $publishPatterns = @(
              '^src/Meridian\.Wpf/',
              '^build/scripts/(publish|install)/',
              '^Directory\.Build\.(props|targets)$',
              '^Directory\.Packages\.props$',
              '^global\.json$',
              '^\.github/workflows/windows-desktop-build\.yml$'
            )
            foreach ($path in $changed) {
              foreach ($pattern in $publishPatterns) {
                if ($path -match $pattern) {
                  $runSmoke = $true
                  break
                }
              }
              if ($runSmoke) { break }
            }
          }
          "run=$($runSmoke.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Desktop smoke publish: $runSmoke" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Restore WPF publish graph
        if: steps.desktop-smoke.outputs.run == 'true'
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          -r win-x64
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Smoke publish WPF app
        if: steps.desktop-smoke.outputs.run == 'true'
        shell: pwsh
        run: >
          dotnet publish src/Meridian.Wpf/Meridian.Wpf.csproj
          -c Release
          -r win-x64
          --no-restore
          --self-contained false
          -o artifacts/publish/desktop-smoke
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true
          /p:WindowsPackageType=None
          /p:PublishReadyToRun=false

      - name: Confirm desktop executable
        if: steps.desktop-smoke.outputs.run == 'true'
        shell: pwsh
        run: |
          $exe = "artifacts/publish/desktop-smoke/Meridian.Desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected desktop executable not found: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload WPF validation artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-desktop-validation-${{ github.run_number }}
          path: artifacts/wpf-validation/windows-desktop-build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload desktop smoke publish artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-desktop-smoke-${{ github.run_number }}
          path: artifacts/publish/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 14
