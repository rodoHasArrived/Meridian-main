name: Windows Desktop Build

on:
  pull_request:
    paths:
      - "**/Directory.Build.props"
      - "**/Directory.Build.targets"
      - "**/Directory.Packages.props"
      - "**/packages.lock.json"
      - ".github/workflows/windows-desktop-build.yml"
      - ".github/workflows/wpf-dev-validation.yml"
      - ".github/workflows/wpf-route-validation.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "Meridian.sln"
      - "NuGet.Config"
      - "build/ci/windows-test-slices.json"
      - "build/scripts/ci/**"
      - "build/scripts/install/**"
      - "build/scripts/publish/**"
      - "global.json"
      - "scripts/dev/SharedBuild.ps1"
      - "scripts/dev/desktop-workflows.json"
      - "scripts/dev/validate-operator-inbox-route.ps1"
      - "scripts/dev/validate-position-blotter-route.ps1"
      - "scripts/dev/validate-wpf-dev.ps1"
      - "src/Meridian.Application/**"
      - "src/Meridian.Audit/**"
      - "src/Meridian.Backtesting.Sdk/**"
      - "src/Meridian.Backtesting/**"
      - "src/Meridian.Contracts/**"
      - "src/Meridian.Core/**"
      - "src/Meridian.DataIntegration/**"
      - "src/Meridian.Entities/**"
      - "src/Meridian.Execution/**"
      - "src/Meridian.FSharp.Ledger/**"
      - "src/Meridian.FSharp/**"
      - "src/Meridian.FinancialOperations/**"
      - "src/Meridian.Identity/**"
      - "src/Meridian.Infrastructure/**"
      - "src/Meridian.Instruments/**"
      - "src/Meridian.LifecycleSupervisor/**"
      - "src/Meridian.Platform/**"
      - "src/Meridian.PortfolioRecords/**"
      - "src/Meridian.QuantScript/**"
      - "src/Meridian.ReferenceData/**"
      - "src/Meridian.Reporting/**"
      - "src/Meridian.Setup/**"
      - "src/Meridian.Storage/**"
      - "src/Meridian.Strategies/**"
      - "src/Meridian.Ui.Services/**"
      - "src/Meridian.Ui.Shared/**"
      - "src/Meridian.Workflow/**"
      - "src/Meridian.Wpf/**"
      - "tests/Meridian.LifecycleSupervisor.Tests/**"
      - "tests/Meridian.Setup.Tests/**"
      - "tests/Meridian.TestSupport/**"
      - "tests/Meridian.Wpf.Tests/**"
  push:
    branches: [main]
    paths:
      - "**/Directory.Build.props"
      - "**/Directory.Build.targets"
      - "**/Directory.Packages.props"
      - "**/packages.lock.json"
      - ".github/workflows/windows-desktop-build.yml"
      - ".github/workflows/wpf-dev-validation.yml"
      - ".github/workflows/wpf-route-validation.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "Meridian.sln"
      - "NuGet.Config"
      - "build/ci/windows-test-slices.json"
      - "build/scripts/ci/**"
      - "build/scripts/install/**"
      - "build/scripts/publish/**"
      - "global.json"
      - "scripts/dev/SharedBuild.ps1"
      - "scripts/dev/desktop-workflows.json"
      - "scripts/dev/validate-operator-inbox-route.ps1"
      - "scripts/dev/validate-position-blotter-route.ps1"
      - "scripts/dev/validate-wpf-dev.ps1"
      - "src/Meridian.Application/**"
      - "src/Meridian.Audit/**"
      - "src/Meridian.Backtesting.Sdk/**"
      - "src/Meridian.Backtesting/**"
      - "src/Meridian.Contracts/**"
      - "src/Meridian.Core/**"
      - "src/Meridian.DataIntegration/**"
      - "src/Meridian.Entities/**"
      - "src/Meridian.Execution/**"
      - "src/Meridian.FSharp.Ledger/**"
      - "src/Meridian.FSharp/**"
      - "src/Meridian.FinancialOperations/**"
      - "src/Meridian.Identity/**"
      - "src/Meridian.Infrastructure/**"
      - "src/Meridian.Instruments/**"
      - "src/Meridian.LifecycleSupervisor/**"
      - "src/Meridian.Platform/**"
      - "src/Meridian.PortfolioRecords/**"
      - "src/Meridian.QuantScript/**"
      - "src/Meridian.ReferenceData/**"
      - "src/Meridian.Reporting/**"
      - "src/Meridian.Setup/**"
      - "src/Meridian.Storage/**"
      - "src/Meridian.Strategies/**"
      - "src/Meridian.Ui.Services/**"
      - "src/Meridian.Ui.Shared/**"
      - "src/Meridian.Workflow/**"
      - "src/Meridian.Wpf/**"
      - "tests/Meridian.LifecycleSupervisor.Tests/**"
      - "tests/Meridian.Setup.Tests/**"
      - "tests/Meridian.TestSupport/**"
      - "tests/Meridian.Wpf.Tests/**"
  workflow_dispatch:
    inputs:
      run_smoke_publish:
        description: Run desktop smoke publish after WPF validation.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  MERIDIAN_DISABLE_DOCKER_TESTS: "true"

jobs:
  desktop:
    name: verify-desktop (build/test WPF)
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        id: nuget
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run isolated Windows validation
        env:
          MERIDIAN_DEPENDENCY_CACHE_HIT: ${{ steps.nuget.outputs.cache-hit || 'false' }}
        run: python build/scripts/ci/run-windows-ci-tests.py --results-dir artifacts/wpf-validation/windows-desktop-build

      - name: Decide desktop smoke publish
        id: desktop-smoke
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MANUAL_SMOKE: ${{ inputs.run_smoke_publish }}
        run: |
          $runSmoke = $false
          if ($env:EVENT_NAME -eq 'push') {
            $runSmoke = $true
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:MANUAL_SMOKE -eq 'true') {
            $runSmoke = $true
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            $hasMergeParents = $false
            git rev-parse --verify "HEAD^1" *> $null
            if ($LASTEXITCODE -eq 0) {
              git rev-parse --verify "HEAD^2" *> $null
              $hasMergeParents = $LASTEXITCODE -eq 0
            }

            if ($hasMergeParents) {
              $changed = @(git diff --name-only "HEAD^1" "HEAD^2")
            } else {
              git fetch origin $env:BASE_REF --depth=100
              $changed = @(git diff --name-only "origin/$env:BASE_REF...HEAD")
            }
            $publishPatterns = @(
              '^src/Meridian\.Wpf/',
              '^build/scripts/(publish|install)/',
              '^Directory\.Build\.(props|targets)$',
              '^Directory\.Packages\.props$',
              '^global\.json$',
              '^\.github/workflows/windows-desktop-build\.yml$'
            )
            foreach ($path in $changed) {
              foreach ($pattern in $publishPatterns) {
                if ($path -match $pattern) {
                  $runSmoke = $true
                  break
                }
              }
              if ($runSmoke) { break }
            }
          }
          "run=$($runSmoke.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Desktop smoke publish: $runSmoke" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Restore WPF publish graph
        if: steps.desktop-smoke.outputs.run == 'true'
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          -r win-x64
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Smoke publish WPF app
        if: steps.desktop-smoke.outputs.run == 'true'
        shell: pwsh
        run: >
          dotnet publish src/Meridian.Wpf/Meridian.Wpf.csproj
          -c Release
          -r win-x64
          --no-restore
          --self-contained false
          -o artifacts/publish/desktop-smoke
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true
          /p:WindowsPackageType=None
          /p:PublishReadyToRun=false

      - name: Confirm desktop executable
        if: steps.desktop-smoke.outputs.run == 'true'
        shell: pwsh
        run: |
          $exe = "artifacts/publish/desktop-smoke/Meridian.Desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected desktop executable not found: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload WPF validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-validation-${{ github.run_number }}
          path: artifacts/wpf-validation/windows-desktop-build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload desktop smoke publish artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-smoke-${{ github.run_number }}
          path: artifacts/publish/desktop-smoke/
          if-no-files-found: ignore
          retention-days: 14
