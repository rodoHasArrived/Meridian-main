name: Publish Smoke

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to publish.
        required: true
        type: choice
        default: collector
        options:
          - collector
          - desktop
          - web-workstation
      runtime:
        description: Windows runtime identifier.
        required: true
        type: choice
        default: win-x64
        options:
          - win-x64
          - win-arm64
      version:
        description: Version stamped into the publish output.
        required: true
        default: 1.0.0-smoke

permissions:
  contents: read

concurrency:
  group: publish-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  # Bind the free-text version input to an environment variable so it is never
  # interpolated directly into a pwsh run block (avoids shell/script injection).
  VERSION: ${{ inputs.version }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  publish:
    name: verify-release (publish ${{ inputs.project }} ${{ inputs.runtime }})
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      # publish.ps1 builds the gitignored workstation bundle when it is absent from a
      # clean checkout, so the publish job needs the repo's Node toolchain.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-publish-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-publish-
            ${{ runner.os }}-nuget-

      - name: Run publish script
        shell: pwsh
        run: |
          pwsh ./build/scripts/publish/publish.ps1 `
            -Platform '${{ inputs.runtime }}' `
            -Project '${{ inputs.project }}' `
            -Version "$env:VERSION" `
            -Configuration Release `
            -OutputDir artifacts/publish/publish-smoke `
            -OutputRetentionDays 0 `
            -OutputRetainLatest 0

      - name: Prepare published WebWorkstation artifact for installed startup
        if: inputs.project == 'web-workstation' && inputs.runtime == 'win-x64'
        shell: pwsh
        run: |
          $artifactHost = Resolve-Path 'artifacts/publish/publish-smoke/win-x64/web-workstation'
          $installSmokeHost = 'artifacts/publish/web-workstation/win-x64'
          New-Item -ItemType Directory -Path $installSmokeHost -Force | Out-Null
          Copy-Item -Path (Join-Path $artifactHost '*') -Destination $installSmokeHost -Recurse -Force
          dotnet publish src/Meridian.LifecycleSupervisor/Meridian.LifecycleSupervisor.csproj `
            -c Release -r win-x64 -o $installSmokeHost --self-contained true `
            -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:PublishTrimmed=false

          # Runner PostgreSQL directories are major-only names like '17', which
          # [version] refuses to parse; sort on the leading integer instead.
          $postgres = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+' } |
            Sort-Object { [int]($_.Name -replace '^(\d+).*$', '$1') } -Descending | Select-Object -First 1
          if ($null -eq $postgres) { throw 'GitHub Windows runner has no PostgreSQL runtime for installed startup smoke.' }
          $payload = 'artifacts/postgresql-payload/win-x64'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item -Path (Join-Path $postgres.FullName '*') -Destination $payload -Recurse -Force
          Copy-Item -LiteralPath $payload -Destination (Join-Path $installSmokeHost 'database') -Recurse -Force

      - name: Start the published WebWorkstation artifact with required authentication
        if: inputs.project == 'web-workstation' && inputs.runtime == 'win-x64'
        shell: pwsh
        run: |
          pwsh ./build/scripts/install/smoke-web-workstation-install.ps1 `
            -RuntimeIdentifier win-x64 `
            -PostgreSqlPayloadRoot artifacts/postgresql-payload `
            -OutputRoot artifacts/publish/publish-smoke/installed-startup `
            -SkipHostPublish `
            -SkipDashboardBuild `
            -SkipNpmInstall

      - name: Generate release evidence manifest
        shell: pwsh
        run: |
          python build/scripts/ci/generate-release-evidence-manifest.py `
            --project '${{ inputs.project }}' `
            --runtime '${{ inputs.runtime }}' `
            --version "$env:VERSION" `
            --artifact-root artifacts/publish/publish-smoke `
            --output artifacts/publish/publish-smoke/release-evidence.json `
            --workflow-run-id '${{ github.run_id }}' `
            --validation-lane publish-smoke

      # always(): a failed smoke must still ship its install.log and receipts,
      # or the failure cannot be diagnosed from the run page.
      - name: Upload publish artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meridian-${{ inputs.project }}-${{ inputs.runtime }}-${{ github.run_number }}
          path: artifacts/publish/publish-smoke/
          if-no-files-found: warn
          retention-days: 14
