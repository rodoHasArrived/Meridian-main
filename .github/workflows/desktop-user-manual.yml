name: Desktop User Manual

on:
  workflow_dispatch:
    inputs:
      output_path:
        description: Output path for the generated manual markdown.
        required: false
        default: "artifacts/desktop-manuals/desktop-user-manual.md"
      screenshot_root:
        description: Root directory for manual screenshots.
        required: false
        default: "artifacts/desktop-manuals/screenshots"
      commit:
        description: Commit and push results to the repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-user-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  generate-manual:
    name: Generate Desktop User Manual
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-wpf-
            ${{ runner.os }}-nuget-

      - name: Restore WPF project
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Generate desktop user manual
        shell: pwsh
        run: >
          scripts/dev/generate-desktop-user-manual.ps1
          -OutputPath "${{ inputs.output_path }}"
          -ScreenshotRoot "${{ inputs.screenshot_root }}"

      - name: Commit and push results
        if: ${{ inputs.commit == true }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${{ inputs.output_path }}" "${{ inputs.screenshot_root }}"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "chore: refresh desktop user manual [skip ci]"
            git push
          } else {
            Write-Host "[INFO] No changes to commit."
          }

      - name: Upload manual artifacts
        if: ${{ inputs.commit != true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-user-manual-${{ github.run_number }}
          path: |
            ${{ inputs.output_path }}
            ${{ inputs.screenshot_root }}
          if-no-files-found: ignore
          retention-days: 14
