name: Desktop User Manual

on:
  workflow_dispatch:
    inputs:
      output_path:
        description: Output path for the generated manual markdown.
        required: false
        default: "artifacts/desktop-manuals/desktop-user-manual.md"
      screenshot_root:
        description: Root directory for manual screenshots.
        required: false
        default: "artifacts/desktop-manuals/screenshots"

permissions:
  contents: read

concurrency:
  group: desktop-user-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  WORKFLOW_OUTPUT_PATH: ${{ inputs.output_path }}
  WORKFLOW_SCREENSHOT_ROOT: ${{ inputs.screenshot_root }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  generate-manual:
    name: Generate Desktop User Manual
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-wpf-${{ hashFiles('**/*.csproj', '**/*.fsproj', 'Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-wpf-
            ${{ runner.os }}-nuget-

      - name: Restore WPF project
        shell: pwsh
        run: >
          dotnet restore src/Meridian.Wpf/Meridian.Wpf.csproj
          /p:EnableWindowsTargeting=true
          /p:EnableFullWpfBuild=true

      - name: Generate desktop user manual
        shell: pwsh
        run: |
          $outputPath = $env:WORKFLOW_OUTPUT_PATH
          $screenshotRoot = $env:WORKFLOW_SCREENSHOT_ROOT
          foreach ($path in @($outputPath, $screenshotRoot)) {
            if ([string]::IsNullOrWhiteSpace($path) -or $path -match '[";`|&<>]' -or [System.IO.Path]::IsPathRooted($path) -or $path.Contains("..")) {
              throw "Invalid path input. Use repository-relative paths without shell metacharacters."
            }
          }
          scripts/dev/generate-desktop-user-manual.ps1 -OutputPath $outputPath -ScreenshotRoot $screenshotRoot

      - name: Upload manual artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-user-manual-${{ github.run_number }}
          path: |
            ${{ inputs.output_path }}
            ${{ inputs.screenshot_root }}
          if-no-files-found: ignore
          retention-days: 14
