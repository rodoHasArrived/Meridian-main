name: Generated Repair Publisher

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Generated Repair]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize repeated deliveries of one run, not unrelated PRs. GitHub only
# retains one pending job per concurrency group; the ref checks protect races.
concurrency:
  group: generated-repair-publisher-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_run'
    name: Validate and publish generated repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure this environment to allow the default branch only. Keep the App
    # key here, not as a repository secret accessible to PR-authored workflows.
    environment: generated-repair
    steps:
      - name: Check out trusted publisher only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install trusted parser dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Verify run provenance, merge, and permitted generated bytes
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Candidate files are decoded as data into an isolated Git index. The
        # publisher never installs dependencies or invokes scripts from the PR.
        run: >-
          python -I build/scripts/ci/generated_repair.py inspect
          --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"
          --default-branch "$DEFAULT_BRANCH"
          --result "$RUNNER_TEMP/generated-repair-result.json"
      - name: Create repository-scoped repair token
        if: >-
          (steps.inspect.outputs.status == 'ready' || steps.inspect.outputs.status == 'retry')
          && vars.GENERATED_REPAIR_APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GENERATED_REPAIR_APP_ID }}
          private-key: ${{ secrets.GENERATED_REPAIR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: write
      - name: Recheck refs and fast-forward the PR or request fresh generation
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python -I build/scripts/ci/generated_repair.py publish
          --default-branch "$DEFAULT_BRANCH"
          --result "$RUNNER_TEMP/generated-repair-result.json"
      - name: Explain artifact-only rollout
        if: >-
          vars.GENERATED_REPAIR_APP_ID == ''
          && (steps.inspect.outputs.status == 'ready' || steps.inspect.outputs.status == 'retry')
        run: |
          echo 'Automatic publishing is not configured. Download repair.patch from the Generated Repair run. Configure the generated-repair environment and App credentials to enable branch repair and bounded stale-ref retries.' >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: github.event_name != 'workflow_run' && vars.GENERATED_REPAIR_APP_ID != ''
    name: Refresh stale open PR branches after main advances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: generated-repair
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create dispatch-only repository token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GENERATED_REPAIR_APP_ID }}
          private-key: ${{ secrets.GENERATED_REPAIR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read
      - name: Dispatch at most ten new head/base pairs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python -I build/scripts/ci/generated_repair.py refresh
          --default-branch "$DEFAULT_BRANCH"
          --result "$RUNNER_TEMP/generated-repair-refresh.json"
