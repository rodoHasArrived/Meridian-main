name: Production Certification

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-production-certification-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  deterministic-integrations:
    name: deterministic PostgreSQL integration and coverage evidence
    uses: ./.github/workflows/service-backed-integrations.yml
    with:
      artifact-name: production-certification
      retention-days: 90

  dependency-evidence:
    name: NuGet and npm dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Reuse cached tarballs; npm still fetches missing packages and enforces the lockfile.
      npm_config_prefer_offline: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Meridian.Ui/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v1-

      - name: Restore packages
        run: dotnet restore Meridian.sln /p:EnableWindowsTargeting=true

      # Both dependency gates are scored, then asserted together at the end of the job. Without
      # continue-on-error a red NuGet scan aborts the job before npm runs, so a single run reports
      # one ecosystem's advisories, hides the other's, and uploads a partial evidence artifact
      # under a name that claims to cover both.
      - name: Fail on vulnerable NuGet dependencies
        id: nuget_gate
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/security -Force | Out-Null
          dotnet list Meridian.sln package --vulnerable --include-transitive 2>&1 |
            Tee-Object -FilePath artifacts/security/nuget-vulnerabilities.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path artifacts/security/nuget-vulnerabilities.txt -Pattern '^\s*>\s') {
            throw "Vulnerable NuGet packages were reported."
          }

      # `npm audit` exits non-zero whenever any advisory exists, including advisories the
      # security register has formally risk-accepted (docs/security/known-vulnerabilities.md).
      # The gate decision belongs to validate-npm-audit.py, which fails closed on every
      # high/critical advisory that lacks an unexpired acceptance entry — and on a missing
      # or error-shaped audit report, so `|| true` cannot hide a failed scan.
      - name: Fail on unaccepted high-severity npm advisories
        id: npm_gate
        continue-on-error: true
        working-directory: src/Meridian.Ui/dashboard
        run: |
          npm ci
          mkdir -p ../../../artifacts/security
          npm audit --json > ../../../artifacts/security/npm-audit.json || true
          python ../../../build/scripts/ci/validate-npm-audit.py \
            --audit-json ../../../artifacts/security/npm-audit.json \
            --accepted ../../../build/config/security/npm-audit-accepted-advisories.json \
            --fail-level high \
            --output ../../../artifacts/security/npm-audit-gate.json

      # The job's real verdict. Both gates above always run so the evidence artifact is complete;
      # this step is what turns either failure into a red job.
      - name: Assert both dependency gates passed
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ steps.nuget_gate.outcome }}' -ne 'success') { $failed += 'NuGet (dotnet list package --vulnerable)' }
          if ('${{ steps.npm_gate.outcome }}' -ne 'success') { $failed += 'npm (validate-npm-audit.py)' }
          if ($failed.Count -gt 0) {
            throw "Dependency evidence failed for: $($failed -join '; '). See the step logs and the uploaded artifacts/security/ evidence."
          }
          Write-Host "Both dependency gates passed."

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-dependency-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 90

  recovery-drill:
    name: encrypted backup and clean restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: meridian-recovery
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        # Poll every 2s rather than every 10s so the drill starts as soon as Postgres accepts
        # connections. Total tolerance stays at 100s (2s x 50), unchanged from before.
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      MDC_RECOVERY_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PGPASSWORD: meridian-recovery

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # The runner image ships PostgreSQL 16 client tools; pg_dump refuses to dump the
      # newer postgres:17 service, so the drill's backup stage fails at preflight.
      - name: Install PostgreSQL 17 client tools to match the service major
        # postgresql.org and apt.postgresql.org are third-party hosts, and none of these calls
        # was bounded. When apt.postgresql.org stalled during run #28 the step hung for 35
        # minutes, the job was cancelled, and the certification reported no cause at all. Bound
        # every network call and retry the whole install: a transient outage now costs seconds,
        # and a sustained one fails inside the step timeout naming the host that is unreachable.
        timeout-minutes: 12
        run: |
          set -euo pipefail

          install_client_tools() {
            curl -fsSL --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc |
              sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
            echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
              sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
            sudo apt-get install --yes --no-install-recommends \
              -o Acquire::http::Timeout=30 -o Acquire::Retries=3 postgresql-client-17
          }

          for attempt in 1 2 3; do
            if install_client_tools; then
              echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "postgresql-client-17 install attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 15))
          done

          echo "Could not install postgresql-client-17 from apt.postgresql.org after 3 attempts." >&2
          exit 1

      - name: Seed source and clean recovery targets
        run: |
          psql --host localhost --username postgres --dbname meridian --command "CREATE TABLE recovery_probe(id integer PRIMARY KEY, value text NOT NULL); INSERT INTO recovery_probe VALUES (1, 'expected');"
          createdb --host localhost --username postgres meridian_restore
          mkdir -p artifacts/recovery/source-data/credentials artifacts/recovery/restore-data
          printf 'encrypted-vault-probe' > artifacts/recovery/source-data/credentials/provider-vault.dat

      - name: Execute encrypted backup and restore drill
        shell: pwsh
        run: |
          pwsh ./build/scripts/recovery/invoke-production-recovery.ps1 `
            -Mode Drill `
            -ConnectionString 'Host=localhost;Port=5432;Database=meridian;Username=postgres;Password=meridian-recovery' `
            -DataRoot artifacts/recovery/source-data `
            -BackupRoot artifacts/recovery/backups `
            -RestoreConnectionString 'Host=localhost;Port=5432;Database=meridian_restore;Username=postgres;Password=meridian-recovery' `
            -RestoreDataRoot artifacts/recovery/restore-data `
            -AllowDatabaseOverwrite `
            -MaximumRpoSeconds 600 `
            -MaximumRtoSeconds 600 `
            -ReceiptPath artifacts/recovery/recovery-drill-receipt.json

      - name: Verify restored business and file state
        run: |
          test "$(psql --host localhost --username postgres --dbname meridian_restore --tuples-only --no-align --command "SELECT value FROM recovery_probe WHERE id = 1")" = "expected"
          test "$(cat artifacts/recovery/restore-data/credentials/provider-vault.dat)" = "encrypted-vault-probe"

      - name: Upload dated recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-recovery-drill-${{ github.run_id }}
          path: artifacts/recovery/
          if-no-files-found: error
          retention-days: 90

  documentation-evidence:
    name: same-commit documentation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/scripts/docs/requirements.txt

      # The core docs profile includes validate-agent-definitions.py, whose frontmatter parser
      # requires PyYAML. Keep this lane aligned with the canonical docs validation jobs.
      - name: Install docs script dependencies
        run: python -m pip install --requirement build/scripts/docs/requirements.txt

      - name: Run deterministic documentation automation
        run: >-
          python build/scripts/docs/run-docs-automation.py
          --profile core
          --json-output artifacts/docs/production-certification.json
          --summary-output artifacts/docs/production-certification.md

      - name: Reject generated documentation drift
        run: git diff --exit-code

      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-documentation-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/docs/
          if-no-files-found: error
          retention-days: 90
