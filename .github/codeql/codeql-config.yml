name: "Meridian CodeQL configuration"

# The query suite is deliberately left unset, so the default suite keeps running
# exactly as it does today. This file changes which results are reported, nothing
# else.
#
# Add exclusions here only with the same standard of evidence used below: a query
# that cannot distinguish a fixed defect from an unfixed one on this codebase, plus
# a named compensating control. Silencing a query that still carries signal is not
# in scope.
#
# That second requirement is not decoration. An earlier revision of this file also
# excluded `cs/cleartext-storage-of-sensitive-information`, which fires here as a
# name heuristic on the return value of
# `ExecutionOrderMetadataPolicy.RemoveBrokerAccountAndOverrideKeys` — the method that
# *removes* broker-account and override keys — and reports the ticker, the client
# order id, an `OrderSide` and a decimal quantity as sensitive storage. The false
# positives were real, but no compensating control existed for that query, so the
# exclusion would also have silenced a genuine cleartext credential or token write
# anywhere else in the repository. Those alerts are dismissed individually in code
# scanning instead, which keeps the query live. Filtering a query with no backing
# control trades a specific, verified annoyance for an unbounded blind spot.
query-filters:
  # cs/log-forging — excluded because the query counts log sites reached by user
  # input, not unsanitized ones, and does not model this repository's sanitizer.
  #
  # `ExecutionLogText.ForLog` (src/Meridian.Execution.Sdk/ExecutionLogText.cs)
  # replaces control characters and the U+2028/U+2029 separators and truncates
  # over-long values, so a caller-supplied symbol or client order id cannot end a
  # log line and forge the next one. The query does not recognise it, so every
  # sanitized call site is still reported — and because the arguments sit on their
  # own lines, one fixed call site produces several alerts.
  #
  # Measured on PR #2554 while fixing exactly this class of defect:
  #   6 → 10 → 17 → 31 alerts, rising at each step, on a strictly decreasing
  #   number of unsanitized log sites. At 31 the alerts on one file would bury the
  #   next genuine finding, which is the risk this exclusion addresses.
  #
  # Compensating control: `src/Meridian.Execution/README.md` states the convention
  # as an invariant of the whole module — caller-supplied order text goes through
  # `ExecutionLogText.ForLog` before reaching a logger, and a raw value in a new
  # log call is a defect rather than a style choice. The invariant is mechanically
  # checkable, and checked: `build/scripts/check-execution-log-sanitization.py`
  # fails on any caller-supplied value reaching a logger unsanitized.
  #
  # The invariant holds across `src/Meridian.Execution/` as a whole, not just the
  # OMS. An earlier draft of this exclusion claimed coverage the code did not have:
  # both paper gateways, the brokerage adapter, and the Security Master gate still
  # logged the symbol and client order id raw — 15 call sites — so the exclusion
  # would have hidden live defects rather than only future ones. Those were fixed
  # before this filter was relied upon. Anything added to this module has to hold
  # the same line, or this exclusion stops being honest.
  #
  # Revisit if CodeQL gains sanitizer modelling for this pattern, or if log
  # forging is reported anywhere outside the execution path the invariant covers.
  - exclude:
      id: cs/log-forging
